  <style>
    /* ==========================================================================
       3D CARTOON TOY-BLOCK DESIGN SYSTEM & IPAD TOUCH OPTIMIZATIONS
       ========================================================================== */
    :root {
      --bg-sky: #38bdf8;
      --bg-indigo: #6366f1;
      --stage-cream: #fffbeb;
      --stage-border: #fde68a;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #38bdf8 0%, #60a5fa 45%, #6366f1 100%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Mandatory Tactile 3D Toy-Block Buttons */
    .btn-3d {
      border-bottom-width: 8px;
      border-radius: 18px;
      transition: transform 0.09s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-bottom-width 0.09s ease,
                  background-color 0.2s ease,
                  box-shadow 0.2s ease;
      touch-action: manipulation;
      cursor: pointer;
      position: relative;
    }

    .btn-3d:active:not(:disabled) {
      transform: translateY(4px);
      border-bottom-width: 4px;
    }

    .btn-3d:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    /* 3D Button Color Variants */
    .btn-coral {
      background: linear-gradient(180deg, #fb7185 0%, #f43f5e 100%);
      border-color: #be123c;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(244, 63, 94, 0.3);
    }

    .btn-emerald {
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      border-color: #047857;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-amber {
      background: linear-gradient(180deg, #fde047 0%, #facc15 100%);
      border-color: #ca8a04;
      color: #713f12;
      box-shadow: 0 6px 14px rgba(250, 204, 21, 0.35);
    }

    .btn-sky {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border-color: #0369a1;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-purple {
      background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 100%);
      border-color: #5b21b6;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(124, 58, 237, 0.3);
    }

    .btn-cream {
      background: linear-gradient(180deg, #ffffff 0%, #fef3c7 100%);
      border-color: #f59e0b;
      color: #1e293b;
      box-shadow: 0 6px 14px rgba(245, 158, 11, 0.18);
    }

    .btn-cream-blue {
      background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%);
      border-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 6px 14px rgba(56, 189, 248, 0.22);
    }

    /* Correct Answer Glowing Emerald State */
    .btn-correct-glow {
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%) !important;
      border-color: #047857 !important;
      color: #ffffff !important;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.75), 0 8px 16px rgba(4, 120, 87, 0.35) !important;
      animation: bounceCelebrate 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Selected Active State (e.g., Line Matching) */
    .btn-selected-ring {
      background: linear-gradient(180deg, #fef08a 0%, #fde047 100%) !important;
      border-color: #eab308 !important;
      box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.55), 0 8px 16px rgba(202, 138, 4, 0.3) !important;
      transform: translateY(-2px);
    }

    /* Gentle Horizontal Shake for Wrong Answer */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-10px); }
      36% { transform: translateX(10px); }
      54% { transform: translateX(-8px); }
      72% { transform: translateX(8px); }
      90% { transform: translateX(-4px); }
    }

    .animate-shake {
      animation: shake 0.48s ease-in-out;
      border-color: #ef4444 !important;
      background: linear-gradient(180deg, #fee2e2 0%, #fecaca 100%) !important;
    }

    @keyframes bounceCelebrate {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      70% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .animate-float {
      animation: floatSlow 3.4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(250, 204, 21, 0.5); }
      50% { box-shadow: 0 0 24px rgba(250, 204, 21, 0.95); }
    }

    .glow-gold {
      animation: pulseGlow 2s infinite;
    }

    /* Game Stage Card */
    .stage-card {
      background: radial-gradient(circle at top center, #fffef7 0%, #fffbeb 65%, #fef3c7 100%);
      border: 5px solid #fde68a;
      border-bottom-width: 12px;
      border-radius: 32px;
      box-shadow: 0 20px 45px rgba(30, 27, 75, 0.28);
    }

    /* Decorative Picture Frame */
    .cartoon-frame {
      background: linear-gradient(145deg, #d97706, #92400e);
      padding: 10px;
      border-radius: 26px;
      box-shadow: 0 12px 24px rgba(120, 53, 15, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.4);
    }

    .cartoon-frame-inner {
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
      border-radius: 18px;
      overflow: hidden;
    }

    /* Confetti / Star Burst Particle */
    .star-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 26px;
      animation: starFly 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes starFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.35) rotate(240deg);
      }
    }
  </style>
</head>

    /* ========================================================================
       3. GEMINI BRITISH ENGLISH VOICE ENGINE + INSTANT SPEECHSYNTHESIS FALLBACK
       ======================================================================== */
    const ttsCache = new Map();
    const ttsInFlight = new Map();
    let activeAudioElement = null;
    let webAudioCtx = null;

    /**
     * Converts Base64 string to ArrayBuffer for PCM16 -> WAV wrapping
     */
    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    /**
     * Wraps raw signed PCM16 audio data into a playable WAV Blob
     */
    function pcmToWav(pcm16Array, sampleRate) {
      const numChannels = 1;
      const byteRate = sampleRate * numChannels * 2;
      const blockAlign = numChannels * 2;
      const dataSize = pcm16Array.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(offset, str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16Array.length; i++, offset += 2) {
        view.setInt16(offset, pcm16Array[i], true);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    /**
     * Fetches & caches British English RP audio from Gemini TTS API (gemini-2.5-flash-preview-tts)
     */
    async function fetchAndCacheGeminiTTS(text) {
      if (ttsCache.has(text)) return ttsCache.get(text);
      if (ttsInFlight.has(text)) return ttsInFlight.get(text);

      const promise = (async () => {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{
            parts: [{
              text: `Speak clearly, warmly, and naturally in a standard British English (RP) accent for a young child learning English: "${text}"`
            }]
          }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: "Aoede" }
              }
            }
          },
          model: "gemini-2.5-flash-preview-tts"
        };

        let delay = 1000;
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error('TTS HTTP ' + response.status);
            const result = await response.json();
            const part = result?.candidates?.[0]?.content?.parts?.[0];
            const audioData = part?.inlineData?.data;
            const mimeType = part?.inlineData?.mimeType;

            if (audioData && mimeType && mimeType.startsWith("audio/")) {
              const rateMatch = mimeType.match(/rate=(\d+)/);
              const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
              const pcmBuffer = base64ToArrayBuffer(audioData);
              const pcm16 = new Int16Array(pcmBuffer);
              const wavBlob = pcmToWav(pcm16, sampleRate);
              const audioUrl = URL.createObjectURL(wavBlob);
              ttsCache.set(text, audioUrl);
              return audioUrl;
            }
            break;
          } catch (err) {
            if (attempt < 2) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
            }
          }
        }
        return null;
      })();

      ttsInFlight.set(text, promise);
      const res = await promise;
      ttsInFlight.delete(text);
      return res;
    }

    /**
     * Plays British English via Web Speech API (en-GB) as instant fallback
     */
    function speakWithWebSpeechUK(text, rate = 1.0) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      utterance.rate = rate;
      utterance.pitch = 1.08;

      const voices = window.speechSynthesis.getVoices();
      const ukVoice = voices.find(v =>
        v.lang === 'en-GB' && (v.name.includes('Serena') || v.name.includes('Kate') || v.name.includes('Daniel') || v.name.includes('Google UK'))
      ) || voices.find(v => v.lang && v.lang.toLowerCase().includes('gb'));

      if (ukVoice) {
        utterance.voice = ukVoice;
      }
      window.speechSynthesis.speak(utterance);
    }

    /**
     * Master British English Speaker Engine:
     * 1. Stops any currently playing audio cleanly.
     * 2. Plays cached Gemini British English WAV if ready; otherwise triggers Gemini TTS caching
     *    in background while speaking immediately via en-GB SpeechSynthesis so there is zero lag.
     */
    function speakBritish(text, rate = 1.0) {
      stopAllAudio();

      if (ttsCache.has(text)) {
        const url = ttsCache.get(text);
        const audio = new Audio(url);
        audio.playbackRate = rate;
        activeAudioElement = audio;
        audio.play().catch(() => speakWithWebSpeechUK(text, rate));
      } else {
        // Immediate response for iPad touch responsiveness + warm Gemini TTS cache for replays
        speakWithWebSpeechUK(text, rate);
        fetchAndCacheGeminiTTS(text);
      }
    }

    /**
     * Pre-warms Gemini British TTS cache for core vocabulary silently on first interaction
     */
    let prewarmed = false;
    function prewarmCoreBritishTTS() {
      if (prewarmed) return;
      prewarmed = true;
      const corePhrases = ['father', 'mother', 'sister', 'brother', 'sun', 'sea', 'fish'];
      corePhrases.forEach((phrase, idx) => {
        setTimeout(() => fetchAndCacheGeminiTTS(phrase), idx * 450);
      });
    }

    /**
     * Stops all HTML5 Audio and SpeechSynthesis immediately
     */
    function stopAllAudio() {
      if (activeAudioElement) {
        try {
          activeAudioElement.pause();
          activeAudioElement.currentTime = 0;
        } catch (e) {}
        activeAudioElement = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    /**
     * iPad Safari Dual Audio-Kill Lock for Home Button
     */
    function handleHomeButtonClick() {
      stopAllAudio();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setTimeout(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        goHome();
      }, 80);
    }

    /**
     * Cheerful Web Audio Chime & Gentle Boop Sound Effects (No external MP3 URLs)
     */
    function playSoundEffect(type = 'correct') {
      try {
        if (!webAudioCtx) {
          webAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (webAudioCtx.state === 'suspended') {
          webAudioCtx.resume();
        }
        const now = webAudioCtx.currentTime;
        const osc = webAudioCtx.createOscillator();
        const gain = webAudioCtx.createGain();
        osc.connect(gain);
        gain.connect(webAudioCtx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
          osc.frequency.setValueAtTime(1046.5, now + 0.28); // C6
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.56);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.linearRampToValueAtTime(210, now + 0.25);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.32);
        }
      } catch (e) {}
    }

          if (!response.ok) throw new Error('Image HTTP ' + response.status);
          const result = await response.json();
          const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
          if (base64Data) {
            return `data:image/png;base64,${base64Data}`;
          }
        } catch (err) {
          if (attempt < 2) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
          }
        }
      }
      return null;
    }

    async function generateGeminiAvatars() {
      if (appState.isGeneratingAvatars) return;
      appState.isGeneratingAvatars = true;
      const btn = document.getElementById('btn-ai-avatars');
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block">✨</span> <span>魔法變身中...</span>`;
      showToast('🎨 Gemini 魔法師正在為玲玲繪製全新 3D 卡通家庭頭像，請稍等幾秒...', '🪄');

      const prompts = {
        father: 'a kind young father wearing stylish glasses and a blue polo shirt',
        mother: 'a gentle smiling mother with shoulder-length hair wearing a lavender sweater',
        sister: 'a cheerful 6-year-old girl with cute twin pigtails wearing a pink dress',
        brother: 'a playful 4-year-old little boy with curly hair wearing a bright green t-shirt'
      };

      try {
        const entries = Object.entries(prompts);
        const results = await Promise.all(
          entries.map(async ([key, prompt]) => {
            const url = await generateSingleGeminiAvatar(prompt);
            return [key, url];
          })
        );

        let successCount = 0;
        results.forEach(([key, url]) => {
          if (url) {
            appState.customAvatars[key] = url;
            successCount++;
          }
        });

        if (successCount > 0) {
          playSoundEffect('correct');

        appState.isGeneratingAvatars = false;
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    }

    function spawnStarBurst(targetEl) {
      if (!targetEl) return;
      const rect = targetEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const emojis = ['⭐', '✨', '🌟', '💖'];

      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'star-particle';
        p.textContent = emojis[i % emojis.length];
        const angle = (Math.PI * 2 * i) / 8;
        const dist = 55 + Math.random() * 45;
        p.style.left = `${cx - 12}px`;
        p.style.top = `${cy - 12}px`;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist - 20}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 920);
      }
    }

      const mapEl = document.getElementById('progress-map');
      const labelEl = document.getElementById('header-level-label');

      if (appState.currentStep === 0) {
        labelEl.textContent = '預習大廳';
      } else if (appState.currentStep >= 1 && appState.currentStep <= 5) {
        labelEl.textContent = LEVEL_META[appState.currentStep - 1].title;
      } else {
        labelEl.textContent = '🏆 全部通關！';
      }

      let html = '';
      for (let i = 1; i <= 5; i++) {
        const isDone = appState.completedLevels.has(i);
        const isCurrent = appState.currentStep === i;
        let nodeClass = 'w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-xs sm:text-sm font-black transition-all ';
        if (isDone) {
          nodeClass += 'bg-amber-400 text-amber-950 border-2 border-yellow-200 shadow-md scale-105';
        } else if (isCurrent) {
          nodeClass += 'bg-sky-400 text-white border-2 border-white ring-2 ring-amber-300 scale-110';
        } else {
          nodeClass += 'bg-indigo-900/80 text-indigo-300 border border-indigo-500/50';
        }

        html += `
          <button onclick="jumpToLevel(${i})" title="跳至第 ${i} 關" class="${nodeClass}">
            ${isDone ? '⭐' : i}

        `;

          html += `<div class="w-2.5 sm:w-4 h-1 rounded-full ${isDone ? 'bg-amber-400' : 'bg-indigo-700'}"></div>`;
        }
      }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

      const board = document.getElementById('l2-board');

      const boardRect = board.getBoundingClientRect();
      let pathsHTML = '';

      appState.l2.matched.forEach(id => {
        const leftEl = document.getElementById(`l2-left-${id}`);
        const rightEl = document.getElementById(`l2-right-${id}`);
        if (!leftEl || !rightEl) return;

        const lRect = leftEl.getBoundingClientRect();
        const rRect = rightEl.getBoundingClientRect();

        const x1 = lRect.right - boardRect.left - 4;
        const y1 = lRect.top + lRect.height / 2 - boardRect.top;
        const x2 = rRect.left - boardRect.left + 4;
        const y2 = rRect.top + rRect.height / 2 - boardRect.top;
        const cx = (x1 + x2) / 2;

        pathsHTML += `
          <path d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}"
            fill="none" stroke="#047857" stroke-width="10" stroke-linecap="round" opacity="0.35" />
          <path d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}"
            fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
          <circle cx="${x1}" cy="${y1}" r="7" fill="#fde047" stroke="#047857" stroke-width="3" />
          <circle cx="${x2}" cy="${y2}" r="7" fill="#fde047" stroke="#047857" stroke-width="3" />
        `;

      svg.innerHTML = pathsHTML;

                  class="btn-3d btn-sky px-4 py-2 text-sm sm:text-base font-black flex items-center gap-1.5">
                  <span>🔊</span><span>聽句子示範</span>
                </button>
              </div>

              <!-- Family Member Selector Pills -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 w-full max-w-xl mt-1">
                ${FAMILY_MEMBERS.map(m => `
                  <button onclick="selectLoveMember('${m.id}')"
                    class="btn-3d ${selectedLoveMember === m.id ? 'btn-selected-ring' : 'btn-cream'} py-2 px-3 flex items-center justify-center gap-2 font-black text-base">
                    ${getPortraitHTML(m.id, 'w-9 h-9')}
                    <span>${m.word}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Help at Home Prompt (Page 33) -->
            <div class="bg-amber-100/90 border-4 border-amber-300 rounded-3xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <span class="text-4xl">🧹</span>
                <div>
                  <h3 class="text-base sm:text-lg font-black text-amber-950">Help at home: Can you do it? (Page 33)</h3>
                  <p class="text-xs sm:text-sm text-amber-900 font-medium">
                    家長小任務：問問玲玲「你喺屋企會幫手做啲咩？（例如抹枱、執玩具）」並鼓勵佢講出 <span class="font-bold">"I love my ..."</span>！
                  </p>
                </div>
              </div>
              <button onclick="speakBritish('How do you help at home? Can you do it?', 0.95)"
                class="btn-3d btn-amber px-3.5 py-2 text-xs sm:text-sm font-black shrink-0 flex items-center gap-1">
                <span>🔊</span><span>讀出問題</span>
              </button>
            </div>

            <!-- Parent Sign-off Button -->
            <button onclick="completeLevel5Speaking(this)"
              class="btn-3d btn-emerald w-full max-w-lg mx-auto py-4 px-6 text-xl sm:text-2xl font-black flex items-center justify-center gap-2.5 shadow-xl">
              <span>🌟</span>
              <span>媽媽認證：口語過關！</span>
            </button>
          </div>
        `;
      }
    }

    function handleL5TileTap(tileId) {
      const { spellingWords, spellIndex, scrambledTiles, chosenTiles } = appState.l5;
      const targetWord = spellingWords[spellIndex];
      const tile = scrambledTiles.find(t => t.id === tileId);
      if (!tile || tile.used) return;

      tile.used = true;
      chosenTiles.push(tile);

      if (chosenTiles.length === targetWord.length) {
        appState.stats[5].attempts++;
        const attemptWord = chosenTiles.map(t => t.ch).join('');
        if (attemptWord === targetWord) {
          playSoundEffect('correct');
          const slotsRow = document.getElementById('l5-slots-row');
          spawnStarBurst(slotsRow);
          speakBritish(`Well done! ${targetWord}!`, 1.0);
          renderCurrentView();

          setTimeout(() => {
            if (appState.l5.spellIndex + 1 < appState.l5.spellingWords.length) {
              appState.l5.spellIndex++;
              const nextWord = appState.l5.spellingWords[appState.l5.spellIndex];
              appState.l5.scrambledTiles = createScrambledTiles(nextWord);
              appState.l5.chosenTiles = [];
              renderCurrentView();
              setTimeout(() => speakBritish(nextWord, 0.9), 250);
            } else {
              appState.l5.spellingDone = true;
              renderCurrentView();
              setTimeout(() => speakBritish('I love my mother!', 0.95), 280);
            }
          }, 1200);
          return;
        } else {
          // Wrong spelling order -> gentle shake & reset
          appState.stats[5].mistakes.push({
            prompt: `拼寫單字 "${targetWord}"`,
            chosen: `拼成 "${attemptWord}"`
          });
          playSoundEffect('wrong');
          speakBritish('Almost! Let us try spelling again.', 1.0);
          renderCurrentView();
          const slotsRow = document.getElementById('l5-slots-row');
          if (slotsRow) {
            slotsRow.classList.add('animate-shake');
          }
          setTimeout(() => {
            resetL5CurrentWord();
          }, 650);
          return;
        }
      }

      renderCurrentView();
    }

    function handleL5SlotUndo(slotIdx) {
      const { chosenTiles } = appState.l5;
      if (slotIdx >= chosenTiles.length) return;
      const removed = chosenTiles.splice(slotIdx, 1)[0];
      if (removed) removed.used = false;
      renderCurrentView();
    }

    function resetL5CurrentWord() {
      appState.l5.scrambledTiles.forEach(t => (t.used = false));
      appState.l5.chosenTiles = [];
      renderCurrentView();
    }

    function selectLoveMember(memberId) {
      appState.l5.selectedLoveMember = memberId;
      speakBritish(`I love my ${memberId}!`, 0.95);
      renderCurrentView();
    }

    function completeLevel5Speaking(btnEl) {
      appState.l5.speakingChecked = true;
      appState.completedLevels.add(5);
      appState.stats[5].completed = true;
      playSoundEffect('correct');
      spawnStarBurst(btnEl);
      speakBritish('Congratulations Lingling! You are a superstar!', 1.0);

      setTimeout(() => {
        appState.currentStep = 6;
        renderCurrentView();
      }, 1150);
    }

    /* ========================================================================
       13. FINAL CELEBRATION & PARENT MISTAKE DIAGNOSTIC REPORT
       ======================================================================== */
    function renderCelebrationAndReport(stage) {
      const completedCount = appState.completedLevels.size;
      let totalMistakes = 0;
      const allMistakeItems = [];

      for (let lvl = 1; lvl <= 5; lvl++) {
        const st = appState.stats[lvl];
        totalMistakes += st.mistakes.length;
        st.mistakes.forEach(m => {
          allMistakeItems.push({ level: LEVEL_META[lvl - 1].short, ...m });
        });
      }

      // Generate smart parent recommendation based on mistake patterns
      let parentAdvice = '玲玲對 Unit 8 的四個家庭成員單字及 Phonics /s/ 掌握非常紮實！建議日常在家繼續用 "Is this your ...?" 和 "I love my ..." 進行親子對話遊戲。';
      if (totalMistakes > 0) {
        const hasTherConfusion = allMistakeItems.some(m =>
          m.prompt.includes('father') || m.prompt.includes('mother') || m.prompt.includes('brother')
        );
        const hasPhonicsConfusion = allMistakeItems.some(m => m.prompt.includes('Phonics'));
        if (hasTherConfusion && hasPhonicsConfusion) {
          parentAdvice = '玲玲在字尾同為 "-ther" 的單字（father / mother / brother）以及 Phonics /s/ 字首辨音上出現過小猶豫，建議多用「慢速跟讀 🐢」強調字首音（f- / m- / br- / s-）。';
        } else if (hasTherConfusion) {
          parentAdvice = 'father、mother、brother 字尾同樣是 "-ther"，小朋友初學時容易混淆字首。建議指著字首字母 f、m、br 引導她先看開頭再發音。';
        } else if (hasPhonicsConfusion) {
          parentAdvice = '建議多帶玲玲在日常生活中尋找 /s/ 音開頭的物品（如 sun、sea、sister、spoon），強化字母 s 的聲音敏感度。';
        }
      }

      stage.innerHTML = `
        <div class="flex flex-col gap-5">
          <!-- Trophy Celebration Banner -->
          <div class="bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-200 border-4 border-amber-400 rounded-3xl p-5 text-center relative overflow-hidden shadow-md">
            <div class="text-5xl sm:text-6xl mb-2 animate-bounce">🏆</div>
            <h1 class="text-2xl sm:text-4xl font-black text-amber-950">恭喜玲玲！勇奪 Unit 8 魔法小博士獎盃！</h1>
            <p class="text-sm sm:text-base font-bold text-amber-800 mt-1">
              已完成關卡：<span class="text-emerald-700 text-lg font-black">${completedCount} / 5 關</span> •
              獲得星星：<span class="text-amber-600 text-lg font-black">${completedCount * 3} ⭐</span>
            </p>
          </div>

          <!-- Parent Diagnostic Report Card -->
          <div class="bg-white border-4 border-sky-200 rounded-3xl p-4 sm:p-6 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-100 pb-3 mb-4">
              <h2 class="text-lg sm:text-xl font-black text-slate-800 flex items-center gap-2">
                <span>📋 家長錯題與理解力分析報告</span>
              </h2>
              <span class="px-3 py-1 rounded-full text-xs sm:text-sm font-black ${totalMistakes === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                ${totalMistakes === 0 ? '💯 零失誤一次通關！' : `共記錄 ${totalMistakes} 次重試練習`}
              </span>
            </div>

            <!-- Per-Level Summary Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-5 gap-2.5 mb-4">
              ${LEVEL_META.map(lvl => {
                const st = appState.stats[lvl.num];
                const errCount = st.mistakes.length;
                return `
                  <div class="rounded-2xl p-3 border-2 ${st.completed ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'} flex flex-col justify-between">
                    <div class="text-xs font-black text-slate-500">第 ${lvl.num} 關</div>
                    <div class="text-sm font-black text-slate-800 my-0.5">${lvl.short}</div>
                    <div class="text-xs font-bold ${st.completed ? (errCount === 0 ? 'text-emerald-600' : 'text-amber-600') : 'text-slate-400'}">
                      ${st.completed ? (errCount === 0 ? '⭐ 一次全對' : `🔄 重試 ${errCount} 次`) : '尚未完成'}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Detailed Mistake Log (If any) -->
            ${allMistakeItems.length > 0 ? `
              <div class="mb-4">
                <h3 class="text-sm font-black text-rose-700 mb-2">🔍 需要多加留意的題目紀錄：</h3>
                <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                  ${allMistakeItems.map((item, idx) => `
                    <div class="text-xs sm:text-sm bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 flex flex-wrap items-center justify-between gap-2">
                      <span class="font-bold text-slate-700">${idx + 1}. [${item.level}] ${item.prompt}</span>
                      <span class="text-rose-600 font-bold">當時誤選：${item.chosen}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Practical Home Practice Suggestion -->
            <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3.5 text-xs sm:text-sm text-sky-950 leading-relaxed">
              <span class="font-black text-sky-700">💡 Anna 伴讀建議：</span>${parentAdvice}
            </div>
          </div>

          <!-- Action Buttons: Replay or Return to Preview Hub -->
          <div class="flex flex-wrap items-center justify-center gap-4">
            <button onclick="resetAllAndReplay()"
              class="btn-3d btn-emerald px-6 py-3.5 text-lg font-black flex items-center gap-2">
              <span>🔄</span><span>重新挑戰全部 5 關</span>
            </button>
            <button onclick="handleHomeButtonClick()"
              class="btn-3d btn-sky px-6 py-3.5 text-lg font-black flex items-center gap-2">
              <span>🏠</span><span>返回預習大廳</span>
            </button>
          </div>
        </div>
      `;
    }

    function resetAllAndReplay() {
      appState.completedLevels.clear();
      for (let i = 1; i <= 5; i++) {
        appState.stats[i] = { attempts: 0, mistakes: [], completed: false };
      }
      initLevel1();
    }

    /* ========================================================================
       14. BOOTSTRAP ON WINDOW LOAD
       ======================================================================== */
    window.addEventListener('load', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
      renderCurrentView();
    });
  </script>
</body>
</html>
