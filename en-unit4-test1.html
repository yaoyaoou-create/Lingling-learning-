<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unit 4: I can do it! - Test 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* iPad 防雙擊放大與死鎖鐵律 */
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        body { display: block !important; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            min-height: 100vh;
        }
        .stage-card {
            background: linear-gradient(to bottom, #fffdf8, #ffe5b4);
            border-radius: 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 -5px 15px rgba(255,200,100,0.3);
            border: 4px solid #fff;
        }
        
        /* 3D 按鈕設計 */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 8px 0px #cf921d, 0 12px 10px rgba(0,0,0,0.2);
            border: 3px solid white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-3d:active, .btn-3d.pressed {
            transform: translateY(8px);
            box-shadow: 0 0px 0px #cf921d, 0 2px 3px rgba(0,0,0,0.2);
        }
        .btn-blue { background-color: #4facfe; box-shadow: 0 8px 0px #2a7cbd; }
        .btn-blue:active { box-shadow: 0 0px 0px #2a7cbd; }
        .btn-green { background-color: #52c234; box-shadow: 0 8px 0px #32851b; }
        .btn-green:active { box-shadow: 0 0px 0px #32851b; }
        .btn-purple { background-color: #9d50bb; box-shadow: 0 8px 0px #61277a; }
        .btn-purple:active { box-shadow: 0 0px 0px #61277a; }
        .btn-pink { background-color: #ec4899; box-shadow: 0 8px 0px #be185d; }
        .btn-pink:active { box-shadow: 0 0px 0px #be185d; }

        .word-slot {
            border: 4px dashed #ccc;
            min-width: 60px;
            height: 70px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.5);
        }
        .hidden-element { display: none !important; }

        /* 動畫 */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim { animation: pop 0.5s ease-out forwards; }
        
        /* 發音大喇叭特效 */
        .audio-btn {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center">

    <!-- 頂部導航 -->
    <div class="w-full max-w-4xl flex justify-between items-center mb-6">
        <button onclick="goHome()" class="bg-white text-gray-800 px-4 py-2 rounded-full font-bold shadow-md active:bg-gray-200 flex items-center gap-2">
            🏠 <span>返回主頁</span>
        </button>
        <div class="bg-yellow-400 text-yellow-900 px-6 py-2 rounded-full font-bold shadow-md text-lg">
            ✨ Unit 4 關卡地圖 ✨
        </div>
        <div class="text-white font-bold text-xl drop-shadow-md">
            Level <span id="level-indicator">0</span>/5
        </div>
    </div>

    <!-- 主舞台 -->
    <div class="stage-card w-full max-w-4xl p-6 md:p-10 relative overflow-hidden flex flex-col text-center" id="main-stage">
        
        <!-- Anna 老師常駐橫幅 -->
        <div class="bg-yellow-100 p-4 rounded-2xl flex items-center gap-4 shadow-sm mb-6 cursor-pointer active:scale-95 border-2 border-yellow-300 mx-auto w-full max-w-2xl" onclick="replayInstruction()">
            <div class="text-5xl">🧚‍♀️</div>
            <div id="anna-text" class="text-xl font-bold text-yellow-800 text-left flex-1 font-tc">
                歡迎嚟到 Unit 4 第一關測試！
            </div>
            <div class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-full text-lg font-bold shadow-sm">
                📢 重聽
            </div>
        </div>

        <!-- Step 0: 預習大廳 -->
        <div id="level-0" class="w-full">
            <h1 class="text-4xl md:text-5xl font-bold text-blue-800 mb-6 pop-anim">準備好未呀？</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8 max-w-3xl mx-auto">
                <button onclick="playSingleMp3('en-run.mp3')" class="btn-3d btn-blue rounded-2xl p-6 flex flex-col items-center justify-center text-white">
                    <span class="text-6xl mb-2">🏃</span><span class="text-3xl font-bold">run</span>
                </button>
                <button onclick="playSingleMp3('en-jump.mp3')" class="btn-3d btn-green rounded-2xl p-6 flex flex-col items-center justify-center text-white">
                    <span class="text-6xl mb-2">🦘</span><span class="text-3xl font-bold">jump</span>
                </button>
                <button onclick="playSingleMp3('en-draw.mp3')" class="btn-3d btn-purple rounded-2xl p-6 flex flex-col items-center justify-center text-white">
                    <span class="text-6xl mb-2">🎨</span><span class="text-3xl font-bold">draw</span>
                </button>
                <button onclick="playSingleMp3('en-sing.mp3')" class="btn-3d btn-pink rounded-2xl p-6 flex flex-col items-center justify-center text-white">
                    <span class="text-6xl mb-2">🎤</span><span class="text-3xl font-bold">sing</span>
                </button>
            </div>
            <button onclick="startLevel(1)" class="btn-3d bg-yellow-400 text-yellow-900 text-3xl font-bold py-4 px-12 rounded-full mt-4 pop-anim mx-auto flex">
                開始挑戰 🚀
            </button>
        </div>

        <!-- Level 1: 聽音選字 (重點抽考 draw) -->
        <div id="level-1" class="w-full hidden-element">
            <div class="mb-6 flex justify-center">
                <!-- 修復：大耳仔變為可點擊播放嘅發音按鈕 -->
                <button onclick="playSingleMp3('en-draw.mp3')" class="btn-3d bg-yellow-100 text-8xl p-6 rounded-full border-4 border-yellow-400 audio-btn">👂</button>
            </div>
            <div class="grid grid-cols-2 gap-6 max-w-lg mx-auto mt-4">
                <button onclick="checkAnswer(1, 'run')" class="btn-3d bg-white text-gray-800 text-4xl font-bold py-8 rounded-2xl">run</button>
                <button onclick="checkAnswer(1, 'draw')" class="btn-3d bg-white text-gray-800 text-4xl font-bold py-8 rounded-2xl">draw</button>
                <button onclick="checkAnswer(1, 'sing')" class="btn-3d bg-white text-gray-800 text-4xl font-bold py-8 rounded-2xl">sing</button>
                <button onclick="checkAnswer(1, 'jump')" class="btn-3d bg-white text-gray-800 text-4xl font-bold py-8 rounded-2xl">jump</button>
            </div>
        </div>

        <!-- Level 2: SVG/圖文配對 -->
        <div id="level-2" class="w-full hidden-element">
            <div class="bg-white rounded-3xl p-10 shadow-inner mb-8 inline-block border-4 border-dashed border-gray-300 cursor-pointer active:scale-95" onclick="playSingleMp3('en-jump.mp3')">
                <span class="text-9xl">🦘</span>
            </div>
            <div class="flex gap-6 justify-center max-w-3xl mx-auto flex-wrap">
                <button onclick="checkAnswer(2, 'draw')" class="btn-3d bg-blue-500 text-white text-4xl font-bold py-6 px-10 rounded-2xl">draw</button>
                <button onclick="checkAnswer(2, 'jump')" class="btn-3d bg-green-500 text-white text-4xl font-bold py-6 px-10 rounded-2xl">jump</button>
                <button onclick="checkAnswer(2, 'run')" class="btn-3d bg-purple-500 text-white text-4xl font-bold py-6 px-10 rounded-2xl">run</button>
            </div>
        </div>

        <!-- Level 3: Tickles 陷阱問答 -->
        <div id="level-3" class="w-full hidden-element">
            <div class="text-9xl mb-6 cursor-pointer audio-btn inline-block rounded-full bg-white p-4" onclick="playSingleMp3('en-how-old.mp3')">🐱</div>
            <div class="flex flex-col md:flex-row gap-8 justify-center mt-8">
                <button onclick="checkAnswer(3, 'yes')" class="btn-3d bg-red-400 text-white text-3xl font-bold py-8 px-12 rounded-2xl gap-4">
                    <span class="text-5xl">❌</span> Yes
                </button>
                <button onclick="checkAnswer(3, 'no')" class="btn-3d bg-green-500 text-white text-3xl font-bold py-8 px-12 rounded-2xl gap-4">
                    <span class="text-5xl">✅</span> No
                </button>
            </div>
        </div>

        <!-- Level 4: Phonics /m/ 捉迷藏 -->
        <div id="level-4" class="w-full hidden-element">
            <div class="grid grid-cols-2 gap-6 max-w-lg mx-auto mt-6" id="m-words-container">
                <button onclick="selectMWord(this, 'en-mouth.mp3', true)" class="btn-3d bg-white text-gray-800 text-3xl font-bold py-6 rounded-xl">mouth</button>
                <button onclick="selectMWord(this, 'en-hand.mp3', false)" class="btn-3d bg-white text-gray-800 text-3xl font-bold py-6 rounded-xl">hand</button>
                <button onclick="selectMWord(this, 'en-meat.mp3', true)" class="btn-3d bg-white text-gray-800 text-3xl font-bold py-6 rounded-xl">meat</button>
                <button onclick="selectMWord(this, 'en-milk.mp3', true)" class="btn-3d bg-white text-gray-800 text-3xl font-bold py-6 rounded-xl">milk</button>
            </div>
            <div id="m-progress" class="mt-8 text-3xl font-bold text-blue-600">已搵到: 0/3</div>
        </div>

        <!-- Level 5: 拼字與口語打卡 -->
        <div id="level-5" class="w-full hidden-element">
            <div class="flex gap-3 justify-center mb-10 mt-6" id="spelling-slots">
                <div class="word-slot" data-expected="d"></div>
                <div class="word-slot" data-expected="r"></div>
                <div class="word-slot" data-expected="a"></div>
                <div class="word-slot" data-expected="w"></div>
            </div>

            <div class="flex gap-4 justify-center flex-wrap" id="letter-bank">
                <!-- 由 JS 生成字母 -->
            </div>
            
            <div id="speak-task" class="hidden-element mt-10 bg-white p-8 rounded-3xl border-4 border-yellow-300 shadow-lg">
                <!-- 連續播放兩句 MP3 -->
                <div class="text-7xl mb-4 cursor-pointer audio-btn inline-block rounded-full bg-blue-50 p-6" onclick="playHybridQueue([{type:'mp3', file:'en-i-can-draw.mp3'}, {type:'mp3', file:'en-four.mp3'}])">🗣️</div>
                <p class="text-5xl font-bold text-blue-600 mb-6 font-tc">
                    "I can draw!"<br><span class="text-3xl text-gray-500 mt-2 block">I am four years old.</span>
                </p>
                <button onclick="finishTest()" class="btn-3d btn-green text-white text-3xl font-bold py-6 px-12 rounded-full mt-4 pop-anim">
                    讀完啦！過關 🏆
                </button>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="w-full hidden-element pt-8">
            <div class="text-9xl mb-6 pop-anim">🏆</div>
            <h1 class="text-5xl font-bold text-yellow-600 mb-6 font-tc pop-anim" style="text-shadow: 2px 2px 0px #fff;">恭喜過關！</h1>
            
            <div class="bg-white p-6 rounded-2xl shadow-md text-left mb-8 max-w-md mx-auto border-l-8 border-green-500">
                <h3 class="font-bold text-2xl mb-2 font-tc">📋 老師回饋：</h3>
                <p class="text-gray-600 text-xl font-tc">玲玲好叻女！成功克服咗易忘字 <strong>draw</strong>，Phonics /m/ 亦分辨得好清楚！</p>
            </div>

            <button onclick="copyCode()" id="copyBtn" class="btn-3d bg-gray-800 text-white text-2xl font-bold py-4 px-8 rounded-full mb-4 mx-auto flex">
                📋 一鍵複製進度暗號
            </button>
        </div>

        <!-- 回饋覆蓋層 -->
        <div id="feedback-overlay" class="absolute inset-0 bg-white/95 flex flex-col items-center justify-center hidden-element z-50 rounded-2xl">
            <div id="feedback-icon" class="text-9xl mb-6 pop-anim">🌟</div>
            <div id="feedback-text" class="text-5xl font-bold text-green-500 pop-anim font-tc">好嘢！答啱啦！</div>
        </div>

    </div>

    <script>
        // ==========================================
        // 植入 Day 4 完美雙軌引擎 (保證防靜音、防撞聲)
        // ==========================================
        window.utterancePool = [];
        let audioQueueId = 0;
        let activeAudioElement = null;
        let audioCtx = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(()=>{});
            }
        }

        function stopAllAudio() {
            audioQueueId++;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (activeAudioElement) {
                try {
                    activeAudioElement.onended = null;
                    activeAudioElement.onerror = null;
                    activeAudioElement.pause();
                    activeAudioElement.currentTime = 0;
                } catch (e) {}
                activeAudioElement = null;
            }
        }

        // 播放單一 MP3，預設放大 2.2 倍，並加入 crossOrigin 破解 iPad 靜音
        function playSingleMp3(file, startTime = 0, boostGain = 2.2, onDone) {
            ensureAudioContext();
            stopAllAudio(); // 確保每次只播一把聲
            
            const audio = new Audio('audio/' + file);
            audio.crossOrigin = 'anonymous'; // 💡 破解靜音核心！
            activeAudioElement = audio;

            if (audioCtx) {
                try {
                    const source = audioCtx.createMediaElementSource(audio);
                    const gainNode = audioCtx.createGain();
                    gainNode.gain.value = boostGain;
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                } catch (e) { audio.volume = 1.0; }
            }

            let finished = false;
            const finish = () => { if(!finished){ finished = true; if(onDone) onDone(); }};
            audio.onended = finish; 
            audio.onerror = finish;

            const startPlayback = () => {
                if (startTime > 0) try { audio.currentTime = startTime; } catch(e){}
                audio.play().catch(finish);
            };

            if (startTime > 0) {
                audio.addEventListener('loadedmetadata', startPlayback, {once:true});
                audio.load();
            } else {
                startPlayback();
            }
        }

        // 雙軌排隊引擎 (支援 TTS 與 MP3 混播)
        function playHybridQueue(steps) {
            stopAllAudio();
            if (!steps || !steps.length) return;
            const myQueueId = audioQueueId;
            let idx = 0;

            function nextStep() {
                if (myQueueId !== audioQueueId || idx >= steps.length) return;
                const step = steps[idx++];

                if (step.type === 'zh') {
                    if (!('speechSynthesis' in window) || !step.text) { nextStep(); return; }
                    const u = new SpeechSynthesisUtterance(step.text);
                    window.utterancePool.push(u);
                    u.lang = 'zh-HK'; u.pitch = 1.05; u.rate = 0.92; u.volume = 0.68;
                    let advanced = false;
                    const done = () => { if(!advanced && myQueueId === audioQueueId) { advanced = true; setTimeout(()=>nextStep(), 150); }};
                    u.onend = done; u.onerror = done;
                    setTimeout(() => { if (myQueueId === audioQueueId) window.speechSynthesis.speak(u); }, 50);
                }
                else if (step.type === 'mp3') {
                    playSingleMp3(step.file, step.startTime || 0, step.boost || 2.2, () => {
                        if (myQueueId === audioQueueId) setTimeout(()=>nextStep(), 150);
                    });
                }
            }
            nextStep();
        }

        // ==========================================
        // 關卡邏輯
        // ==========================================
        let currentLevel = 0;
        const levelInstructions = {
            0: { text: "歡迎嚟到 Unit 4 第一關測試！先撳下啲積木聽下發音熱身，準備好就開始挑戰啦！", file: null },
            1: { text: "第一關：留心聽下個英文發音，邊個字先係啱㗎呢？", file: "en-draw.mp3" },
            2: { text: "第二關：睇下幅圖隻袋鼠做緊咩動作，揀啱嘅英文字啦！", file: null },
            3: { text: "第三關：Tickles 問你幾多歲，聽下佢講得啱唔啱，揀 Yes 定 No 啦！", file: "en-how-old.mp3" },
            4: { text: "第四關：Phonics 聲音捉迷藏！邊個字係 m 發音開頭㗎呢？幫我捉晒佢哋出嚟啦！", file: "en-m-sound.mp3" },
            5: { text: "第五關：聽下呢個字點讀，再順序撳下面嘅字母積木砌返個字出嚟啦！", file: "en-draw.mp3" }
        };

        function replayInstruction() {
            ensureAudioContext(); 
            const inst = levelInstructions[currentLevel];
            document.getElementById('anna-text').innerText = inst.text;
            
            const queue = [{ type: 'zh', text: inst.text }];
            if (inst.file) {
                queue.push({ type: 'mp3', file: inst.file });
            }
            playHybridQueue(queue);
        }

        function showFeedback(isCorrect, callback) {
            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            
            overlay.classList.remove('hidden-element');
            if (isCorrect) {
                icon.textContent = '🌟';
                text.textContent = '好嘢！答啱啦！';
                text.className = 'text-5xl font-bold text-green-500 pop-anim font-tc';
                playHybridQueue([{ type: 'zh', text: '好嘢！答啱啦！' }]);
            } else {
                icon.textContent = '🤔';
                text.textContent = '哎呀，試多次啦！';
                text.className = 'text-5xl font-bold text-red-500 pop-anim font-tc';
                playHybridQueue([{ type: 'zh', text: '哎呀，試多次啦！' }]);
            }
            
            setTimeout(() => {
                overlay.classList.add('hidden-element');
                if (isCorrect && callback) callback();
            }, 1800);
        }

        function startLevel(lvl) {
            ensureAudioContext();
            document.getElementById(`level-${currentLevel}`).classList.add('hidden-element');
            currentLevel = lvl;
            document.getElementById(`level-${currentLevel}`).classList.remove('hidden-element');
            document.getElementById('level-indicator').innerText = lvl;
            
            replayInstruction();
            if (lvl === 5) setupSpelling();
        }

        function checkAnswer(lvl, selected) {
            let correct = false;
            if (lvl === 1 && selected === 'draw') correct = true;
            if (lvl === 2 && selected === 'jump') correct = true;
            if (lvl === 3 && selected === 'no') correct = true;
            
            showFeedback(correct, () => startLevel(lvl + 1));
        }

        // Level 4 Logic
        let mWordsFound = 0;
        function selectMWord(btn, file, isCorrect) {
            if (btn.classList.contains('opacity-50')) return; 
            
            if (isCorrect) {
                playSingleMp3(file);
                btn.classList.remove('bg-white', 'text-gray-800');
                btn.classList.add('bg-green-400', 'text-white', 'opacity-50');
                mWordsFound++;
                document.getElementById('m-progress').innerText = `已搵到: ${mWordsFound}/3`;
                
                if (mWordsFound === 3) {
                    setTimeout(() => showFeedback(true, () => startLevel(5)), 1500);
                }
            } else {
                showFeedback(false);
            }
        }

        // Level 5 Logic (Spelling)
        const letters = ['r', 'w', 'a', 'd']; 
        let currentSlot = 0;
        
        function setupSpelling() {
            const bank = document.getElementById('letter-bank');
            bank.innerHTML = '';
            letters.forEach(l => {
                const btn = document.createElement('button');
                btn.className = 'btn-3d bg-pink-500 text-white text-4xl font-bold py-6 px-8 rounded-xl letter-block uppercase';
                btn.innerText = l;
                btn.onclick = () => placeLetter(btn, l);
                bank.appendChild(btn);
            });
        }

        function placeLetter(btn, letter) {
            const slots = document.querySelectorAll('.word-slot');
            if (currentSlot >= slots.length) return;
            
            const expected = slots[currentSlot].dataset.expected;
            
            if (letter === expected) {
                // 播單字母發音 (例如 en-d.mp3)
                playSingleMp3(`en-${letter}.mp3`);
                slots[currentSlot].innerText = letter.toUpperCase();
                slots[currentSlot].classList.add('bg-green-200', 'border-green-500', 'text-green-700');
                btn.classList.add('hidden-element');
                currentSlot++;
                
                if (currentSlot === slots.length) {
                    setTimeout(() => {
                        document.getElementById('letter-bank').classList.add('hidden-element');
                        document.getElementById('speak-task').classList.remove('hidden-element');
                        
                        // 拼完字，Anna 提示大聲讀，然後自動播 I can draw 同 I am four years old
                        playHybridQueue([
                            { type: 'zh', text: '好叻呀！而家大聲讀一次俾媽媽聽啦！' },
                            { type: 'mp3', file: 'en-i-can-draw.mp3' },
                            { type: 'mp3', file: 'en-four.mp3' }
                        ]);
                    }, 1000);
                }
            } else {
                showFeedback(false);
            }
        }

        function finishTest() {
            stopAllAudio();
            document.getElementById('level-5').classList.add('hidden-element');
            document.getElementById('result-screen').classList.remove('hidden-element');
            
            document.getElementById('anna-text').innerText = "恭喜玲玲完成挑戰！";
            playHybridQueue([{ type: 'zh', text: "恭喜玲玲，全部答啱晒，你真係好叻呀！" }]);
        }

        function copyCode() {
            const code = "[Unit 4 Test 1 已完成，重點抽查 draw 與 m 順利通過]";
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✅ 已複製！請貼俾 AI";
                btn.classList.replace('bg-gray-800', 'bg-green-600');
            });
        }
        
        function goHome() {
            stopAllAudio();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
