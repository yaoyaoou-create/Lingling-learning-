<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K2 英文 AI 導師課堂 - Unit 4: I can do it (P.17-20)</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Comic Sans MS', 'Chalkboard SE', "PingFang HK", sans-serif; }
    body { margin: 0; padding: 8px; background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 740px; background: #fff; border-radius: 24px; border: 4px solid #38bdf8; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15); padding: 12px 16px; position: relative; }

    /* 頂部導航（iPad 一屏緊湊高度） */
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #bae6fd; padding-bottom: 8px; margin-bottom: 8px; gap: 6px; flex-wrap: wrap; }
    .nav-btn { text-decoration: none; background: #f0f9ff; border: 2px solid #38bdf8; color: #0369a1; padding: 5px 10px; border-radius: 14px; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
    .mom-btn { background: #fdf2f8; border: 2px solid #f472b6; color: #be185d; padding: 5px 10px; border-radius: 14px; font-weight: 800; font-size: 0.85rem; cursor: pointer; }

    /* 四大階段切換列 */
    .stage-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .tab-btn { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 6px 4px; font-weight: 800; font-size: 0.8rem; color: #475569; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #0284c7; color: white; border-color: #0369a1; box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3); }

    /* AI 導師對話橫幅 */
    .tutor-banner { background: #fffbeb; border: 2px solid #fcd34d; border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .tutor-avatar { font-size: 2rem; flex-shrink: 0; }
    .tutor-speech { flex: 1; text-align: left; font-size: 0.92rem; font-weight: 800; color: #78350f; line-height: 1.35; }
    .replay-btn { background: #f59e0b; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }

    /* 主舞台（嚴格控制高度，確保 iPad 橫向一屏看完） */
    .stage-box { background: #f0f9ff; border: 2px dashed #7dd3fc; border-radius: 18px; padding: 10px 12px; min-height: 255px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

    /* 階段 1：動作與安全閃卡 */
    .action-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
    .action-card { background: white; border: 3px solid #38bdf8; border-radius: 16px; padding: 8px 4px; cursor: pointer; transition: transform 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .action-card:active { transform: scale(0.95); background: #e0f2fe; }
    .action-emoji { font-size: 2.1rem; margin-bottom: 2px; }
    .action-en { font-size: 1.2rem; font-weight: 900; color: #0369a1; }
    .action-zh { font-size: 0.8rem; font-weight: 800; color: #64748b; }

    /* 階段 2：句式積木與 Tickles 年齡問答 */
    .sub-pills { display: flex; gap: 8px; margin-bottom: 8px; }
    .pill-btn { background: white; border: 2px solid #38bdf8; color: #0369a1; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; }
    .pill-btn.active { background: #0284c7; color: white; }
    .sentence-bubble { background: #ffedd5; border: 3px solid #f97316; border-radius: 20px; padding: 10px 18px; font-size: 1.5rem; font-weight: 900; color: #334155; margin: 8px 0; cursor: pointer; }
    .pink-word { color: #db2777; padding: 2px 6px; border-radius: 10px; border: 2px dashed transparent; }
    .pink-word.circled { border: 3px solid #16a34a; background: #dcfce7; }
    .oracy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .oracy-card { background: white; border: 3px solid #fbbf24; border-radius: 16px; padding: 10px; cursor: pointer; }

    /* 階段 3：Phonics m 與聽音貼貼紙 */
    .phonics-top { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-bottom: 8px; }
    .big-m { background: #fee2e2; border: 3px solid #ef4444; color: #dc2626; font-size: 2.6rem; font-weight: 900; width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .m-word-card { background: white; border: 3px solid #fca5a5; border-radius: 14px; padding: 6px 12px; cursor: pointer; font-size: 1.25rem; font-weight: 900; color: #1e293b; }
    .red-m { color: #dc2626; padding: 0 3px; border-radius: 50%; }
    .red-m.circled { border: 3px solid #16a34a; background: #dcfce7; }
    .stick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .stick-card { background: white; border: 3px solid #94a3b8; border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .sticker-spot { width: 44px; height: 44px; border: 2px dashed #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: #f8fafc; }

    /* 階段 4：自適應闖關 */
    .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 6px; }
    .quiz-btn { background: white; border: 3px solid #0284c7; border-radius: 16px; padding: 10px; font-size: 1.15rem; font-weight: 900; color: #0369a1; cursor: pointer; }
    .hint-box { background: #ecfdf5; border: 2px solid #34d399; color: #065f46; border-radius: 14px; padding: 6px 10px; font-size: 0.88rem; font-weight: 800; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="nav-btn">🏠 返回學習大門</a>
    <span style="font-weight:900; color:#0369a1; font-size:0.95rem;">👩‍🏫 Unit 4: I can do it (P.17–20) AI 導師課堂</span>
    <button class="mom-btn" onclick="showMomReport()">👩 媽媽查看進度</button>
  </div>

  <div class="stage-tabs">
    <button class="tab-btn active" id="tab-1" onclick="switchStage(1)">1. 動作小超人<br><small>(P.17-18)</small></button>
    <button class="tab-btn" id="tab-2" onclick="switchStage(2)">2. 句式與問答<br><small>(P.18-19)</small></button>
    <button class="tab-btn" id="tab-3" onclick="switchStage(3)">3. 字母 m 拼讀<br><small>(P.20)</small></button>
    <button class="tab-btn" id="tab-4" onclick="switchStage(4)">4. 動態小挑戰<br><small>(自適應)</small></button>
  </div>

  <div class="tutor-banner">
    <div class="tutor-avatar">👩‍🏫</div>
    <div class="tutor-speech" id="tutor-text">Hello 小寶貝！撳一下下面嘅圖卡，先聽慢速英文發音，再跟老師一齊做動作啦！</div>
    <button class="replay-btn" onclick="replayInstruction()" title="重聽一次">🔊</button>
  </div>

  <div class="stage-box" id="stage-content"></div>
</div>

<script>
const actionWords = [
  { id: 'run', en: 'run', sent: 'I can run.', zh: '跑', emoji: '🏃‍♂️', tip: '睇下揹書包嘅哥哥跑得好快！請跟老師讀：run，I can run！' },
  { id: 'jump', en: 'jump', sent: 'I can jump.', zh: '跳', emoji: '🤸', tip: '好似小白兔 rabbit 咁雙手張開跳起！請跟老師讀：jump，I can jump！' },
  { id: 'draw', en: 'draw', sent: 'I can draw.', zh: '畫畫', emoji: '🖍️', tip: '拎起妳最鍾意嘅顏色筆畫畫！請跟老師讀：draw，I can draw！' },
  { id: 'sing', en: 'sing', sent: 'I can sing.', zh: '唱歌', emoji: '🎤', tip: '拎住咪高峰開開心心唱歌！請跟老師讀：sing，I can sing！' },
  { id: 'body', en: 'I can do it!', sent: 'Look after your body. I can do it!', zh: '保護身體(P.17)', emoji: '🚴‍♀️', tip: '第17頁：踩單車同溜冰都要戴好安全帽保護身體喔！跟老師講：I can do it！' }
];

const adaptiveQuiz = [
  { enPrompt: 'I can jump.', qZh: '聽一聽英文：邊一個動作係「I can jump.」呀？', answer: 'jump', options: [
    { val: 'jump', label: '🤸 jump (跳)' }, { val: 'run', label: '🏃‍♂️ run (跑)' },
    { val: 'draw', label: '🖍️ draw (畫畫)' }, { val: 'sing', label: '🎤 sing (唱歌)' }
  ], hint: '溫柔提示：jump 係好似小白兔咁雙手張開「跳起」喔！再試下啦！' },
  { enPrompt: 'I can draw.', qZh: '聽一聽英文：邊一個動作係拎住顏色筆「I can draw.」呀？', answer: 'draw', options: [
    { val: 'draw', label: '🖍️ draw (畫畫)' }, { val: 'sing', label: '🎤 sing (唱歌)' },
    { val: 'run', label: '🏃‍♂️ run (跑)' }, { val: 'jump', label: '🤸 jump (跳)' }
  ], hint: '溫柔提示：draw 係拎住顏色筆畫靚靚圖畫（畫畫）呀！' },
  { enPrompt: 'I can sing.', qZh: '聽一聽英文：邊個係拎住咪高峰唱歌「I can sing.」呀？', answer: 'sing', options: [
    { val: 'sing', label: '🎤 sing (唱歌)' }, { val: 'jump', label: '🤸 jump (跳)' },
    { val: 'draw', label: '🖍️ draw (畫畫)' }, { val: 'run', label: '🏃‍♂️ run (跑)' }
  ], hint: '溫柔提示：中文兒歌都有講「一個嘴巴會唱歌」，唱歌係 sing 喔！' },
  { enPrompt: 'How old are you?', qZh: '小貓咪 Tickles 問妳：「How old are you?」妳今年 4 歲要點樣答呀？', answer: 'four', options: [
    { val: 'four', label: '🖐️ I am four years old. (4歲)' },
    { val: 'three', label: '👌 I am three years old. (3歲)' },
    { val: 'cat', label: '🐱 I am a cat.' },
    { val: 'happy', label: '😊 I am angry.' }
  ], hint: '溫柔提示：數下生日蛋糕有 4 支蠟燭（four），舉起 4 隻手指仔揀 I am four years old 啦！' },
  { enPrompt: 'milk', qZh: '自然拼讀：邊個單字係用閉埋嘴唇嘅「m (/m/)」聲音開頭㗎？', answer: 'milk', options: [
    { val: 'milk', label: '🥛 milk (牛奶)' }, { val: 'hand', label: '✋ hand (小手)' },
    { val: 'dog', label: '🐶 dog (小狗)' }, { val: 'pen', label: '🖊️ pen (原子筆)' }
  ], hint: '溫柔提示：飲牛奶嗰陣嘴仔閉埋發出 /m/ - milk 嘅聲音，同 mouth、meat 一樣係 m 開頭㗎！' }
];

let lastEn = '';
let lastZh = '';
let stage2Mode = 'sentence';
let curAction = 'jump';
let wordCircled = false;
let mCircled = { mouth: false, meat: false };
let milkStuck = false;
let curQ = 0;

let wrongCounts = JSON.parse(localStorage.getItem('lingling_en_u4_errors') || '{}');
let learnedLog = JSON.parse(localStorage.getItem('lingling_en_u4_learned') || '{"vocab":0, "oracy":0, "phonics":0, "quizPass":0}');

function saveProgress() {
  localStorage.setItem('lingling_en_u4_errors', JSON.stringify(wrongCounts));
  localStorage.setItem('lingling_en_u4_learned', JSON.stringify(learnedLog));
}

function speakBilingual(enText, zhText) {
  lastEn = enText;
  lastZh = zhText;
  document.getElementById('tutor-text').innerText = (enText ? `🔊 "${enText}" — ` : '') + zhText;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  if (enText) {
    const uEn = new SpeechSynthesisUtterance(enText);
    uEn.lang = 'en-GB';
    uEn.rate = 0.6;
    window.speechSynthesis.speak(uEn);
  }
  if (zhText) {
    const uZh = new SpeechSynthesisUtterance(zhText);
    uZh.lang = 'zh-HK';
    uZh.rate = 0.78;
    window.speechSynthesis.speak(uZh);
  }
}

function replayInstruction() {
  speakBilingual(lastEn, lastZh);
}

function switchStage(n) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === n));
  if (n === 1) renderStage1();
  if (n === 2) renderStage2();
  if (n === 3) renderStage3();
  if (n === 4) renderStage4();
}

// 階段 1：P.17-18 動作小超人
function renderStage1() {
  speakBilingual('I can do it!', '請用手指撳下面嘅動作卡，先聽慢速英文，再跟老師一齊做動作同讀出嚟啦！');
  let html = '<div class="action-grid">';
  actionWords.forEach(item => {
    html += `
      <div class="action-card" onclick="playActionCard('${item.id}')">
        <div class="action-emoji">${item.emoji}</div>
        <div class="action-en">${item.en}</div>
        <div class="action-zh">${item.zh}</div>
      </div>
    `;
  });
  html += '</div>';
  document.getElementById('stage-content').innerHTML = html;
}

function playActionCard(id) {
  const item = actionWords.find(a => a.id === id);
  learnedLog.vocab = (learnedLog.vocab || 0) + 1;
  saveProgress();
  speakBilingual(`${item.en}. ${item.sent}`, item.tip);
}

// 階段 2：P.18 句式積木 & P.19 Tickles 年齡口語對答
function renderStage2() {
  let pills = `
    <div class="sub-pills">
      <button class="pill-btn ${stage2Mode==='sentence'?'active':''}" onclick="setStage2Mode('sentence')">📖 P.18 句式積木 (I can ...)</button>
      <button class="pill-btn ${stage2Mode==='oracy'?'active':''}" onclick="setStage2Mode('oracy')">🐱 P.19 小貓問年齡 (How old are you?)</button>
    </div>
  `;

  if (stage2Mode === 'sentence') {
    const acts = ['run', 'jump', 'draw', 'sing'];
    speakBilingual(`I can ${curAction}.`, '先揀一個動作拼成句子，再用手指篤一下句子入面粉紅色嘅動作單字圈住佢啦！');
    document.getElementById('stage-content').innerHTML = pills + `
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        ${acts.map(a => `<button class="pill-btn ${curAction===a?'active':''}" onclick="pickActionWord('${a}')">${a}</button>`).join('')}
      </div>
      <div class="sentence-bubble" onclick="circlePinkWord()">
        I can <span class="pink-word ${wordCircled?'circled':''}">${curAction}</span>. 🔊
      </div>
      <div style="font-size:0.85rem; color:#0369a1; font-weight:800;">👆 用手指撳粉紅色嘅「${curAction}」圈出熟字並跟讀！</div>
    `;
  } else {
    speakBilingual('How old are you?', '小貓咪 Tickles 問妳幾多歲呀？請舉起手指仔，撳下面嘅生日蛋糕回答啦！');
    document.getElementById('stage-content').innerHTML = pills + `
      <div class="oracy-grid">
        <div class="oracy-card" onclick="practiceOracy(4)">
          <div style="font-size:2rem;">🎂🕯️🕯️🕯️🕯️ 🖐️(4)</div>
          <div style="font-size:1.15rem; font-weight:900; color:#b45309; margin:4px 0;">I am <span style="color:#db2777;">four</span> years old.</div>
          <div style="font-size:0.82rem; font-weight:800; color:#78350f;">舉起 4 隻手指仔跟讀 (4歲)</div>
        </div>
        <div class="oracy-card" onclick="practiceOracy(3)">
          <div style="font-size:2rem;">🎂🕯️🕯️🕯️ 👌(3)</div>
          <div style="font-size:1.15rem; font-weight:900; color:#0369a1; margin:4px 0;">I am <span style="color:#db2777;">three</span> years old.</div>
          <div style="font-size:0.82rem; font-weight:800; color:#475569;">課本圖 2：舉起 3 隻手指仔 (3歲)</div>
        </div>
      </div>
    `;
  }
}

function setStage2Mode(m) {
  stage2Mode = m;
  renderStage2();
}

function pickActionWord(a) {
  curAction = a;
  wordCircled = false;
  renderStage2();
}

function circlePinkWord() {
  wordCircled = true;
  learnedLog.oracy = (learnedLog.oracy || 0) + 1;
  saveProgress();
  renderStage2();
  speakBilingual(`I can ${curAction}. ${curAction}!`, `好叻女呀！成功圈出動作字 ${curAction}！`);
}

function practiceOracy(age) {
  learnedLog.oracy = (learnedLog.oracy || 0) + 1;
  saveProgress();
  if (age === 4) {
    speakBilingual('How old are you? I am four years old.', '好棒呀！記得一邊舉起 4 隻手指仔，一邊大聲講 I am four years old 喔！');
  } else {
    speakBilingual('How old are you? I am three years old.', '呢個係課本入面 3 歲嘅小妹妹：I am three years old！');
  }
}

// 階段 3：P.20 Phonics 字母 m 與貼貼紙
function renderStage3() {
  speakBilingual('m. mouth. meat.', '呢個係紅色字母 m！先撳上面圈出紅色嘅 m，再喺下面搵下邊幅圖係 m 開頭並貼上星星貼紙啦！');
  document.getElementById('stage-content').innerHTML = `
    <div class="phonics-top">
      <div class="big-m" onclick="speakBilingual('m. mmm.', '閉埋上下嘴唇，好似食到好味蛋糕咁發出 mmm 嘅聲音！')">m</div>
      <div class="m-word-card" onclick="circleLetterM('mouth')">
        👄 <span class="red-m ${mCircled.mouth?'circled':''}">m</span>outh <small style="color:#64748b;">(嘴巴)</small>
      </div>
      <div class="m-word-card" onclick="circleLetterM('meat')">
        🥩 <span class="red-m ${mCircled.meat?'circled':''}">m</span>eat <small style="color:#64748b;">(肉)</small>
      </div>
    </div>
    <div style="font-size:0.88rem; font-weight:900; color:#0369a1; margin-bottom:6px;">👇 P.20 貼紙題：Which word starts with the <span style="color:#dc2626;">m</span> sound? Listen. Stick.</div>
    <div class="stick-grid">
      <div class="stick-card" onclick="checkSticker(true)">
        <div style="text-align:left;">
          <div style="font-size:1.8rem;">🥛</div>
          <div style="font-size:1.1rem; font-weight:900; color:#0369a1;">1. milk (牛奶)</div>
        </div>
        <div class="sticker-spot">${milkStuck ? '⭐' : ''}</div>
      </div>
      <div class="stick-card" onclick="checkSticker(false)">
        <div style="text-align:left;">
          <div style="font-size:1.8rem;">✋</div>
          <div style="font-size:1.1rem; font-weight:900; color:#475569;">2. hand (小手)</div>
        </div>
        <div class="sticker-spot"></div>
      </div>
    </div>
  `;
}

function circleLetterM(word) {
  mCircled[word] = true;
  learnedLog.phonics = (learnedLog.phonics || 0) + 1;
  saveProgress();
  renderStage3();
  if (word === 'mouth') {
    speakBilingual('mouth.', '搵到紅色嘅 m 啦！mouth 即係我哋唱歌同食嘢嘅嘴巴！');
  } else {
    speakBilingual('meat.', '好眼力呀！meat 即係中文課本《均衡飲食》入面學過嘅「肉」字！');
  }
}

function checkSticker(isMilk) {
  if (isMilk) {
    milkStuck = true;
    learnedLog.phonics = (learnedLog.phonics || 0) + 1;
    saveProgress();
    renderStage3();
    speakBilingual('milk! Correct!', '貼啱貼紙啦！牛奶 milk 最前面都係閉埋嘴唇嘅 m 聲開頭㗎！');
  } else {
    wrongCounts['m-sound (milk)'] = (wrongCounts['m-sound (milk)'] || 0) + 1;
    saveProgress();
    speakBilingual('hand.', '溫柔提示：小手 hand 係張開嘴仔呵氣嘅 /h/ 聲；隔離第 1 幅圖嘅牛奶 milk 先至係閉埋嘴唇嘅 m 聲開頭喔，試下貼喺牛奶嗰度啦！');
  }
}

// 階段 4：自適應闖關
function renderStage4() {
  const qObj = adaptiveQuiz[curQ % adaptiveQuiz.length];
  speakBilingual(qObj.enPrompt, qObj.qZh);
  let optsHtml = qObj.options.map(o => `
    <button class="quiz-btn" onclick="checkQuiz('${o.val}')">${o.label}</button>
  `).join('');

  document.getElementById('stage-content').innerHTML = `
    <div style="font-size:1.05rem; font-weight:900; color:#0369a1;">第 ${(curQ % adaptiveQuiz.length) + 1} 關（Unit 4 動態小挑戰）</div>
    <div class="quiz-grid">${optsHtml}</div>
    <div class="hint-box" id="gentle-hint"></div>
  `;
}

function checkQuiz(selected) {
  const qObj = adaptiveQuiz[curQ % adaptiveQuiz.length];
  const hintBox = document.getElementById('gentle-hint');
  if (selected === qObj.answer) {
    learnedLog.quizPass = (learnedLog.quizPass || 0) + 1;
    saveProgress();
    speakBilingual('Good job! I can do it!', '答啱啦！小寶貝真係好叻女！我哋去下一關啦！');
    setTimeout(() => {
      curQ++;
      renderStage4();
    }, 1800);
  } else {
    wrongCounts[qObj.answer] = (wrongCounts[qObj.answer] || 0) + 1;
    saveProgress();
    hintBox.style.display = 'block';
    hintBox.innerText = '💡 ' + qObj.hint;
    speakBilingual(qObj.enPrompt, qObj.hint);
  }
}

// 媽媽 1 分鐘進度報告
function showMomReport() {
  const errKeys = Object.keys(wrongCounts);
  let errHtml = errKeys.length === 0
    ? '<span style="color:#16a34a; font-weight:800;">目前全部一次答對，發音與辨識非常棒！</span>'
    : errKeys.map(k => `• <b>${k}</b>（觸發溫和提示 ${wrongCounts[k]} 次，建議日常多跟她玩這個動作）`).join('<br>');

  document.getElementById('stage-content').innerHTML = `
    <div style="text-align:left; width:100%; background:white; padding:10px 14px; border-radius:16px; border:2px solid #f472b6;">
      <h3 style="margin:0 0 6px 0; color:#be185d; font-size:1.05rem;">📊 媽媽 1 分鐘激勵報告（英文 Unit 4: P.17–20）</h3>
      <p style="margin:3px 0; font-size:0.9rem;">🏃‍♀️ <b>動作單字點讀次數：</b> ${learnedLog.vocab || 0} 次</p>
      <p style="margin:3px 0; font-size:0.9rem;">🐱 <b>句式圈字與年齡問答：</b> ${learnedLog.oracy || 0} 次</p>
      <p style="margin:3px 0; font-size:0.9rem;">🔤 <b>字母 m 圈字與貼紙完成：</b> ${learnedLog.phonics || 0} 次</p>
      <p style="margin:3px 0; font-size:0.9rem;">🏆 <b>動態挑戰通關題數：</b> ${learnedLog.quizPass || 0} 題</p>
      <hr style="border:none; border-top:1px dashed #cbd5e1; margin:6px 0;">
      <p style="margin:3px 0; font-size:0.88rem;"><b>📌 AI 導師弱項追蹤：</b><br>${errHtml}</p>
      <p style="margin:6px 0 0 0; font-size:0.88rem; color:#0369a1; font-weight:800;">💖 今日媽媽 1 分鐘行動：問她一句 "How old are you?" 看她比出 4 隻手指，並陪她在課本 P.17 和 P.20 貼上實體貼紙！</p>
    </div>
  `;
  speakBilingual('', '呢個係給媽媽睇嘅一分鐘進度報告，紀錄咗玲玲喺 Unit 4 嘅學習表現喔！');
}

window.onload = () => switchStage(1);
</script>
