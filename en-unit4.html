<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit 4: I can do it | 玲玲學習樂園</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
      background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 100%);
      min-height: 100vh;
      color: #0F172A;
    }
    /* 頂部導航 */
    .top-nav {
      background: rgba(255, 255, 255, 0.9);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
      position: sticky; top: 0; z-index: 100;
    }
    .btn-home {
      background: #F59E0B; color: #FFF; text-decoration: none; font-weight: 900;
      padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 0 #B45309;
    }
    .btn-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #B45309; }
    .nav-title { font-size: 19px; font-weight: 900; color: #0284C7; }

    /* 單元標題區 */
    .header-section { text-align: center; padding: 24px 16px 12px; }
    .unit-title { font-size: 28px; font-weight: 900; color: #1E3A8A; margin: 0 0 8px; }
    .unit-subtitle { font-size: 16px; font-weight: 800; color: #475569; margin: 0; }

    /* 卡片網格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 16px 20px 40px;
      max-width: 800px;
      margin: 0 auto;
    }

    .day-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      transition: transform 0.1s;
    }

    .day-card.unlocked {
      border: 4px solid #7DD3FC;
      box-shadow: 0 8px 0 #38BDF8;
      cursor: pointer;
    }
    .day-card.unlocked:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #38BDF8;
    }

    .day-card.locked {
      background: #F1F5F9;
      border: 4px solid #CBD5E1;
      box-shadow: 0 8px 0 #94A3B8;
      opacity: 0.7;
      pointer-events: none;
    }

    .day-icon { font-size: 40px; margin-bottom: 8px; }
    .day-num { font-size: 18px; font-weight: 900; color: #1E3A8A; margin-bottom: 4px; }
    .day-sub { font-size: 13px; font-weight: 800; color: #64748B; }

    .test-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 100%);
      border: 4px solid #D97706;
      box-shadow: 0 8px 0 #B45309;
      flex-direction: row;
      justify-content: center;
      gap: 16px;
      padding: 20px;
    }
    .test-card.locked {
      background: #F1F5F9; border-color: #CBD5E1; box-shadow: 0 8px 0 #94A3B8;
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="btn-home">🏠 大門主頁</a>
  <div class="nav-title">Unit 4</div>
</nav>

<div class="header-section">
  <h1 class="unit-title">Unit 4: I can do it!</h1>
  <p class="unit-subtitle">玲玲嘅英文大本營 🇬🇧</p>
</div>

<div class="grid-container">
  <!-- 每日微課堂 -->
  <a href="en-unit4-day1.html" class="day-card unlocked">
    <span class="day-icon">🏃</span>
    <span class="day-num">Day 1</span>
    <span class="day-sub">run, jump</span>
  </a>

  <a href="en-unit4-day2.html" class="day-card unlocked">
    <span class="day-icon">🎨</span>
    <span class="day-num">Day 2</span>
    <span class="day-sub">draw, sing (盲聽)</span>
  </a>

  <a href="en-unit4-day3.html" class="day-card unlocked">
    <span class="day-icon">💬</span>
    <span class="day-num">Day 3</span>
    <span class="day-sub">jump, run (零壓力)</span>
  </a>

  <a href="en-unit4-day4.html?v=1" class="day-card unlocked">
    <span class="day-icon">👄</span>
    <span class="day-num">Day 4</span>
    <span class="day-sub">P.20 Phonics m</span>
  </a>

  <a href="en-unit4-day5.html?v=1" class="day-card unlocked">
    <span class="day-icon">🎯</span>
    <span class="day-num">Day 5</span>
    <span class="day-sub">Unit 4 大結局 (溫習)</span>
  </a>

  <!-- 未解鎖關卡 (單行排列方便管理) -->
  <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 6</span><span class="day-sub">即將解鎖</span></div>
  <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 7</span><span class="day-sub">即將解鎖</span></div>
  <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 8</span><span class="day-sub">即將解鎖</span></div>
  <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 9</span><span class="day-sub">即將解鎖</span></div>
  <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 10</span><span class="day-sub">即將解鎖</span></div>

  <!-- 闖關測驗預留 -->
  <div class="day-card test-card locked">
    <span class="day-icon" style="margin:0;">🏆</span>
    <div style="text-align:left;">
      <div class="day-num" style="color:#78350F;">Unit 4 Test 1</div>
      <div class="day-sub" style="color:#92400E;">魔法闖關大挑戰 (🔒 未解鎖)</div>
    </div>
  </div>
</div>

</body>
</html>
