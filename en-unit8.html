<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Unit 8: Love at Home 每日課堂</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
    }

    body {
      padding: 18px 16px;
      background: linear-gradient(135deg, #E0F2FE 0%, #F0F9FF 100%);
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hub-container {
      width: 100%;
      max-width: 820px;
      background: #FFFFFF;
      border: 5px solid #38BDF8;
      border-bottom-width: 10px;
      border-color: #38BDF8 #38BDF8 #0284C7 #38BDF8;
      border-radius: 36px;
      padding: 22px 24px;
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.18);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-title {
      font-size: clamp(1.15rem, 2.4vw, 1.45rem);
      font-weight: 900;
      color: #0369A1;
      margin: 0;
      text-align: center;
    }

    .anna-tip {
      background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
      border: 3px solid #93C5FD;
      border-bottom-width: 6px;
      border-bottom-color: #3B82F6;
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: clamp(0.92rem, 1.9vw, 1.05rem);
      font-weight: 800;
      color: #1E3A8A;
      line-height: 1.4;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .day-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
      border-radius: 22px;
      text-decoration: none;
      border: 3px solid;
      border-bottom-width: 7px;
      transition: transform 0.1s ease, border-bottom-width 0.1s ease;
      text-align: center;
    }

    .day-card:active {
      transform: translateY(4px);
      border-bottom-width: 3px;
    }

    .day-card.unlocked {
      background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
      border-color: #38BDF8;
      border-bottom-color: #0284C7;
      color: #0369A1;
    }

    .day-card.locked {
      background: #F8FAFC;
      border: 3px dashed #CBD5E1;
      border-bottom-width: 5px;
      color: #94A3B8;
      pointer-events: none;
    }

    .day-icon {
      font-size: 1.85rem;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .day-num {
      font-size: 1.15rem;
      font-weight: 900;
    }

    .day-sub {
      font-size: 0.78rem;
      font-weight: 800;
      margin-top: 2px;
      line-height: 1.25;
    }

    @media (max-width: 600px) {
      .days-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="hub-container animate-bounce-in">
    <div class="top-nav">
      <button type="button" class="btn-3d nav-btn-pink" style="padding: 8px 16px; font-size: 0.95rem;" onclick="goHome()">🏠 返回學習大門</button>
      <h1 class="page-title">🏡 Unit 8: Love at Home 每日課堂</h1>
      <button type="button" class="btn-3d nav-btn-blue" style="padding: 8px 14px; font-size: 0.9rem;" onclick="goHome()">✨ 樂園首頁</button>
    </div>

    <div class="anna-tip">
      <span style="font-size: 2rem; flex-shrink: 0;">🦉</span>
      <span>Hello Lingling! 今日由 Anna 老師同你一齊玩 <b>Unit 8 Day 1</b> 英文微課堂（寵物字形特訓與句型鞏固），快啲撳下面藍色卡片開始啦！</span>
    </div>

    <div class="days-grid">
      <!-- 已解鎖課堂（一行式） -->
      <a href="en-unit8-day1.html?v=1" class="day-card unlocked"><span class="day-icon">🐾</span><span class="day-num">Day 1</span><span class="day-sub">寵物字形與句型</span></a>

      <!-- 下方全部壓縮為「一行式」方便未來 1 秒選取替換 -->
      <a href="en-unit8-day2.html?v=3" class="day-card unlocked"><span class="day-icon">🐶</span><span class="day-num">Day 2</span><span class="day-sub">Tickles 口語對答</span></a>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 3</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 4</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 5</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 6</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 7</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 8</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 9</span><span class="day-sub">Coming Soon</span></div>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 10</span><span class="day-sub">Graduation</span></div>
    </div>
  </div>

  <script>
    function silenceSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.pause();
        window.speechSynthesis.cancel();
      }
    }

    function goHome() {
      silenceSpeech();
      setTimeout(() => {
        window.location.href = "index.html?v=8";
      }, 60);
    }

    window.addEventListener("pagehide", silenceSpeech);
    window.addEventListener("beforeunload", silenceSpeech);
  </script>
</body>
</html>
