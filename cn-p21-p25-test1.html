<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文闖關：我要謝謝你 Test 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D 奶油色主舞台 */
        .stage-card {
            background: linear-gradient(to bottom, #fffcf9, #ffecd2);
            border-radius: 24px;
            border: 4px solid #f8cfa1;
            box-shadow: 0 12px 0 #d9a066, 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        /* 3D 積木按鈕共用基礎 */
        .btn-3d {
            transition: all 0.1s;
            border-radius: 16px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            border: 2px solid rgba(0,0,0,0.1);
        }
        .btn-3d:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 transparent !important;
        }

        /* 色彩變體 */
        .btn-blue { background-color: #60a5fa; color: white; box-shadow: 0 8px 0 #2563eb; }
        .btn-green { background-color: #4ade80; color: white; box-shadow: 0 8px 0 #16a34a; }
        .btn-yellow { background-color: #facc15; color: #854d0e; box-shadow: 0 8px 0 #ca8a04; }
        .btn-red { background-color: #f87171; color: white; box-shadow: 0 8px 0 #dc2626; }
        .btn-purple { background-color: #c084fc; color: white; box-shadow: 0 8px 0 #9333ea; }
        .btn-white { background-color: #ffffff; color: #374151; box-shadow: 0 8px 0 #d1d5db; }

        /* 動畫特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-3deg); }
            40%, 80% { transform: translateX(8px) rotate(3deg); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes greenGlow {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
        .correct-glow { animation: greenGlow 0.6s ease-out; background-color: #4ade80 !important; color: white !important;}
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- 頂部導航列 (完美復刻截圖 UI) -->
    <nav class="max-w-5xl mx-auto flex justify-between items-center mb-6 bg-white/95 backdrop-blur-sm p-3 rounded-2xl shadow-sm border-2 border-gray-100">
        <!-- 左側返回大廳主頁 -->
        <a href="index.html" onclick="window.speechSynthesis.cancel()" class="bg-gray-100 text-gray-700 font-bold py-2 px-4 rounded-xl border-2 border-gray-200 active:bg-gray-200 flex items-center gap-2">
            🏠 返回
        </a>

        <!-- 中間進度列 (Breadcrumb) -->
        <div id="breadcrumb" class="flex flex-wrap items-center justify-center gap-1 md:gap-3 text-sm md:text-base font-bold text-gray-400">
            <!-- 由 JS 動態生成 -->
        </div>

        <!-- 右側按鈕群 -->
        <div class="flex gap-2">
            <div class="bg-green-100 text-green-700 border-2 border-green-300 font-bold py-2 px-3 rounded-xl items-center gap-1 hidden md:flex">
                🇭🇰 廣東話
            </div>
            <button onclick="window.location.reload()" class="bg-orange-500 text-white font-bold py-2 px-4 rounded-xl shadow-[0_4px_0_#c2410c] active:translate-y-1 active:shadow-none transition-all">
                首頁
            </button>
        </div>
    </nav>

    <!-- 遊戲主舞台 -->
    <div id="game-container" class="max-w-5xl mx-auto stage-card relative overflow-hidden p-6 md:p-10">
        <!-- 畫面動態生成於此 -->
    </div>

    <!-- 音效庫 -->
    <audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>

<script>
    // ==========================================
    // 1. 核心字庫與錯誤追蹤
    // ==========================================
    const ALL_LEARNED_WORDS = [
        '我','你','爸','媽','哥','姐','朋','友','生','人','家','庭',
        '眼','耳','口','鼻','手','抱','親','唱','歌','看','玩','吃','開','出','來',
        '米','飯','牛','奶','肉','蛋','菜','豆','水','果','香','甜','椰','紅','蘿','蔔','洋','蔥','馬','鈴','薯','麵','包','白','條','蔬','食','物',
        '一','二','三','四','大','小','多','少','上','下','中','不','的','也',
        '學','校','室','課','書','圖','畫','愛','好','樂'
    ];

    let errorLog = {}; 
    let currentLevelIndex = 0;
    
    function recordError(word) {
        if (!errorLog[word]) errorLog[word] = 0;
        errorLog[word]++;
    }

    // ==========================================
    // 2. iPad 廣東話語音引擎
    // ==========================================
    window.utterancePool = [];
    function speak(text, callback) {
        window.speechSynthesis.cancel(); 
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        msg.rate = 0.85; 
        msg.pitch = 1.1;
        
        if (callback) {
            msg.onend = callback;
            msg.onerror = callback;
        }
        window.speechSynthesis.speak(msg);
    }

    function playSound(type) {
        const snd = document.getElementById(`snd-${type}`);
        if(snd) { snd.currentTime = 0; snd.play(); }
    }

    function getRandomWords(count, excludeWords = []) {
        let pool = ALL_LEARNED_WORDS.filter(w => !excludeWords.includes(w));
        let result = [];
        for (let i = 0; i < count; i++) {
            if (pool.length === 0) break;
            let idx = Math.floor(Math.random() * pool.length);
            result.push(pool[idx]);
            pool.splice(idx, 1);
        }
        return result;
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    // ==========================================
    // 3. 關卡數據與橫向導航列
    // ==========================================
    const LEVELS = [
        { type: 'lobby', title: '🏰 課前預習魔法卡' },
        { type: 'flashcard', title: '🥚 Level 1: 魔法蛋閃卡 (大聲讀)', words: ['蜜糖', '翠綠', '新鮮', '蔬菜', '蛋糕', '食物', '豆', '肉', '均衡'] },
        { type: 'listen', title: '👂 Level 2: 聽音選字 (無圖片)', questions: [{ target: '蜜', deco: ['糖','家','菜'] }, { target: '綠', deco: ['紅','白','香'] }, { target: '鮮', deco: ['魚','羊','肉'] }, { target: '菜', deco: ['果','豆','蛋'] }, { target: '飯', deco: ['麵','包','米'] }] },
        { type: 'train', title: '🚂 Level 3: 詞語小火車', pairs: [ ['蜜','糖'], ['翠','綠'], ['新','鮮'], ['蔬','菜'], ['蛋','糕'], ['食','物'], ['白','飯'] ] },
        { type: 'hunt', title: '🔍 Level 4: 語境尋寶大陣列', questions: [{ hint: '小蜜蜂採花釀出甜甜的什麼？', targets: ['蜜','糖'] }, { hint: '我們每天都要多吃翠綠的什麼？', targets: ['蔬','菜'] }, { hint: '《均衡飲食》兒歌說：什麼牛奶肉和蛋，一日三餐要均衡。', targets: ['米','飯'] }, { hint: '紅蘿蔔和椰菜，都是什麼類的食物？', targets: ['蔬','菜'] }] },
        { type: 'sentence', title: '🧱 Level 5: 句式積木重組', sentences: [['翠綠的', '蔬菜', '。'], ['甜甜的', '蜜糖', '。'], ['紅蘿蔔', '是', '蔬菜類', '的食物。'], ['麵條', '是', '五穀類', '的食物。'], ['少吃零食', '多吃菜', '。']] }
    ];

    const BREADCRUMB_STEPS = [
        { idx: 1, name: '1.閃卡' },
        { idx: 2, name: '2.聽音' },
        { idx: 3, name: '3.火車' },
        { idx: 4, name: '4.尋寶' },
        { idx: 5, name: '5.句式' },
        { idx: 6, name: '結算' }
    ];

    function updateBreadcrumb(currentIdx) {
        const bc = document.getElementById('breadcrumb');
        if (!bc) return;
        let html = '';
        BREADCRUMB_STEPS.forEach((step, i) => {
            let isCurrent = (currentIdx === step.idx) || (currentIdx >= 6 && step.idx === 6);
            let colorClass = isCurrent ? 'text-orange-500 scale-110 transition-transform' : 'text-gray-400 hover:text-gray-600 cursor-pointer';
            
            html += `<span onclick="renderLevel(${step.idx < 6 ? step.idx : 99})" class="transition-colors ${colorClass}">${step.name}</span>`;
            
            if (i < BREADCRUMB_STEPS.length - 1) {
                html += `<span class="text-orange-300">➔</span>`;
            }
        });
        bc.innerHTML = html;
    }

    // ==========================================
    // 4. 關卡渲染邏輯
    // ==========================================
    const container = document.getElementById('game-container');

    window.renderLevel = function(index) {
        window.speechSynthesis.cancel(); 
        currentLevelIndex = index;
        
        if (index >= LEVELS.length) {
            renderResult();
            return;
        }

        updateBreadcrumb(index);
        container.innerHTML = '';
        
        const level = LEVELS[index];
        const header = `<h2 class="text-2xl md:text-3xl font-bold text-center text-orange-800 mb-6">${level.title}</h2>`;
        
        let content = '';
        if (level.type === 'lobby') content = renderLobby();
        else if (level.type === 'flashcard') content = renderFlashcard(level);
        else if (level.type === 'listen') content = renderListen(level);
        else if (level.type === 'train') content = renderTrain(level);
        else if (level.type === 'hunt') content = renderHunt(level);
        else if (level.type === 'sentence') content = renderSentence(level);

        container.innerHTML = header + content;
        speak(level.title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, ''));
    }

    // --- Level 0: 預習大廳 ---
    function renderLobby() {
        const words = [
            {w: '蛋糕', p: '香香的'}, {w: '蔬菜', p: '翠綠的'}, 
            {w: '蜜糖', p: '甜甜的 (左邊有「舌」, 下面有「虫」)'}, 
            {w: '食物', p: '新鮮的'}, {w: '豆', p: ''}, {w: '肉', p: ''}
        ];
        let html = `<div class="grid grid-cols-2 md:grid-cols-3 gap-4 pb-8">`;
        words.forEach(obj => {
            html += `<div onclick="speak('${obj.w}')" class="btn-3d btn-white p-6 flex flex-col items-center justify-center pop-in">
                        <span class="text-4xl text-purple-700 mb-2">${obj.w}</span>
                        <span class="text-sm text-gray-500">${obj.p}</span>
                     </div>`;
        });
        html += `</div>
                 <div class="text-center">
                    <button onclick="renderLevel(1)" class="btn-3d btn-green text-2xl px-12 py-4">開始闖關 🚀</button>
                 </div>`;
        return html;
    }

    // --- Level 1: 閃卡 ---
    let fcIndex = 0;
    function renderFlashcard(level) {
        fcIndex = 0;
        setTimeout(() => showFlashcard(level.words), 100);
        return `<div id="fc-area" class="flex flex-col items-center justify-center min-h-[300px]"></div>`;
    }
    function showFlashcard(words) {
        if (fcIndex >= words.length) return renderLevel(currentLevelIndex + 1);
        const w = words[fcIndex];
        const area = document.getElementById('fc-area');
        area.innerHTML = `
            <div class="w-64 h-64 bg-white border-4 border-yellow-400 rounded-3xl flex items-center justify-center shadow-xl pop-in mb-8">
                <span class="text-7xl font-bold text-gray-800">${w}</span>
            </div>
            <div class="flex gap-4">
                <button onclick="recordError('${w}'); nextFc(false, '${words.join(',')}')" class="btn-3d btn-yellow px-6 py-3 text-xl">需要提示 💡</button>
                <button onclick="nextFc(true, '${words.join(',')}')" class="btn-3d btn-green px-6 py-3 text-xl">1次答對 🌟</button>
            </div>
        `;
    }
    function nextFc(correct, wordsStr) {
        if(correct) playSound('correct');
        fcIndex++;
        showFlashcard(wordsStr.split(','));
    }

    // --- Level 2: 聽音選字 ---
    let l2Index = 0;
    function renderListen(level) {
        l2Index = 0;
        setTimeout(() => buildListenUI(level.questions), 100);
        return `<div id="l2-area" class="flex flex-col items-center min-h-[300px]"></div>`;
    }
    function buildListenUI(qs) {
        if (l2Index >= qs.length) return renderLevel(currentLevelIndex + 1);
        const q = qs[l2Index];
        let options = shuffle([q.target, ...q.deco]);
        
        let html = `
            <button onclick="speak('${q.target}')" class="btn-3d btn-blue w-24 h-24 rounded-full flex items-center justify-center mb-8 pop-in">
                <span class="text-5xl">🔊</span>
            </button>
            <div class="grid grid-cols-2 gap-6 w-full max-w-md" id="l2-options">
        `;
        options.forEach(opt => {
            html += `<button onclick="checkL2('${opt}', '${q.target}', this)" class="btn-3d btn-white h-24 text-5xl font-bold text-gray-700">${opt}</button>`;
        });
        html += `</div>`;
        document.getElementById('l2-area').innerHTML = html;
        speak(`請找出，${q.target}`);
    }
    window.checkL2 = function(selected, target, btn) {
        if(selected === target) {
            playSound('correct');
            btn.classList.add('correct-glow');
            setTimeout(() => { l2Index++; buildListenUI(LEVELS[currentLevelIndex].questions); }, 800);
        } else {
            playSound('wrong');
            btn.classList.add('shake', 'btn-red');
            recordError(target); 
            setTimeout(() => { btn.classList.remove('shake', 'btn-red'); }, 500);
        }
    }

    // --- Level 3: 雙字火車 ---
    let l3Index = 0;
    function renderTrain(level) {
        l3Index = 0;
        setTimeout(() => buildTrainUI(level.pairs), 100);
        return `<div id="l3-area" class="flex flex-col items-center min-h-[300px]"></div>`;
    }
    function buildTrainUI(pairs) {
        if (l3Index >= pairs.length) return renderLevel(currentLevelIndex + 1);
        const pair = pairs[l3Index];
        const word1 = pair[0];
        const word2 = pair[1];
        
        let distractors = getRandomWords(3, [word1, word2]);
        let options = shuffle([word2, ...distractors]);

        let html = `
            <div class="flex items-center gap-2 mb-10 pop-in">
                <div class="text-6xl">🧚‍♀️</div>
                <div class="bg-red-500 text-white w-24 h-24 flex items-center justify-center text-5xl rounded-l-3xl border-4 border-red-700 shadow-[0_8px_0_#991b1b]">
                    ${word1}
                </div>
                <div class="bg-gray-200 border-4 border-dashed border-gray-400 w-24 h-24 rounded-r-3xl flex items-center justify-center text-3xl text-gray-400">
                    ?
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full" id="l3-options">
        `;
        options.forEach(opt => {
            html += `<button onclick="checkL3('${opt}', '${word2}', '${word1}', this)" class="btn-3d btn-white h-20 text-4xl border-4 border-blue-200">${opt}</button>`;
        });
        html += `</div>`;
        document.getElementById('l3-area').innerHTML = html;
        speak(`請將火車組合，${word1}，什麼？`);
    }
    window.checkL3 = function(selected, target, word1, btn) {
        if(selected === target) {
            playSound('correct');
            btn.classList.add('correct-glow');
            speak(`${word1}${target}！好嘢！`);
            setTimeout(() => { l3Index++; buildTrainUI(LEVELS[currentLevelIndex].pairs); }, 1200);
        } else {
            playSound('wrong');
            btn.classList.add('shake', 'bg-red-200');
            recordError(word1+target); 
            setTimeout(() => { btn.classList.remove('shake', 'bg-red-200'); }, 500);
        }
    }

    // --- Level 4: 語境尋寶 (4x4) ---
    let l4Index = 0;
    let l4Found = 0;
    function renderHunt(level) {
        l4Index = 0;
        setTimeout(() => buildHuntUI(level.questions), 100);
        return `<div id="l4-area" class="flex flex-col items-center min-h-[350px]"></div>`;
    }
    function buildHuntUI(qs) {
        if (l4Index >= qs.length) return renderLevel(currentLevelIndex + 1);
        const q = qs[l4Index];
        l4Found = 0;
        
        let distractors = getRandomWords(14, q.targets);
        let options = shuffle([...q.targets, ...distractors]);

        let html = `
            <div class="bg-blue-100 p-4 rounded-xl border-2 border-blue-300 mb-6 w-full text-center">
                <p class="text-xl md:text-2xl text-blue-800 font-bold mb-2">${q.hint}</p>
                <button onclick="speak('${q.hint}')" class="btn-3d btn-blue px-4 py-1 text-sm md:text-base">🔊 聽提示</button>
            </div>
            <div class="grid grid-cols-4 gap-3 w-full max-w-md mx-auto" id="l4-grid">
        `;
        options.forEach((opt, idx) => {
            let isTarget = q.targets.includes(opt);
            html += `<button id="l4-btn-${idx}" onclick="checkL4('${opt}', ${isTarget}, this, '${q.targets.join('')}')" class="btn-3d btn-white h-16 md:h-20 text-3xl font-bold">${opt}</button>`;
        });
        html += `</div>`;
        document.getElementById('l4-area').innerHTML = html;
        speak(q.hint);
    }
    window.checkL4 = function(selected, isTarget, btn, targetStr) {
        if(btn.classList.contains('correct-glow')) return;
        if(isTarget) {
            playSound('correct');
            btn.classList.add('correct-glow');
            l4Found++;
            if(l4Found >= 2) {
                setTimeout(() => { l4Index++; buildHuntUI(LEVELS[currentLevelIndex].questions); }, 1000);
            }
        } else {
            playSound('wrong');
            btn.classList.add('shake', 'bg-red-200');
            recordError("尋寶:"+targetStr); 
            setTimeout(() => { btn.classList.remove('shake', 'bg-red-200'); }, 500);
        }
    }

    // --- Level 5: 句式積木 ---
    let l5Index = 0;
    let l5Blocks = [];
    let l5Ans = [];
    function renderSentence(level) {
        l5Index = 0;
        setTimeout(() => buildSentenceUI(level.sentences), 100);
        return `<div id="l5-area" class="flex flex-col items-center min-h-[350px]"></div>`;
    }
    function buildSentenceUI(sentences) {
        if (l5Index >= sentences.length) return renderLevel(currentLevelIndex + 1);
        const targetArr = sentences[l5Index];
        l5Blocks = shuffle([...targetArr]);
        l5Ans = [];
        drawSentenceUI(targetArr);
        speak("請將積木排成正確嘅句子。");
    }
    function drawSentenceUI(targetArr) {
        const area = document.getElementById('l5-area');
        
        let ansHtml = `<div class="flex flex-wrap gap-2 mb-10 min-h-[60px] p-4 bg-gray-100 rounded-2xl w-full border-4 border-dashed border-gray-300 items-center justify-center">`;
        if(l5Ans.length === 0) ansHtml += `<span class="text-gray-400">點擊下方積木組合...</span>`;
        l5Ans.forEach((txt, idx) => {
            ansHtml += `<div onclick="l5Remove(${idx})" class="bg-green-100 border-2 border-green-500 px-4 py-2 text-2xl font-bold rounded-lg cursor-pointer">${txt}</div>`;
        });
        ansHtml += `</div>`;

        let srcHtml = `<div class="flex flex-wrap gap-3 justify-center w-full">`;
        l5Blocks.forEach((txt, idx) => {
            srcHtml += `<button onclick="l5Add(${idx})" class="btn-3d btn-yellow px-4 py-3 text-2xl">${txt}</button>`;
        });
        srcHtml += `</div>`;

        let btnHtml = ``;
        if(l5Blocks.length === 0) {
            if(l5Ans.join('') === targetArr.join('')) {
                playSound('correct');
                btnHtml = `<div class="mt-8 text-center pop-in">
                            <p class="text-green-600 font-bold text-xl mb-4">🌟 排啱啦！請大聲朗讀：</p>
                            <button onclick="nextL5()" class="btn-3d btn-green px-8 py-3 text-xl">朗讀打卡 ✅</button>
                           </div>`;
            } else {
                playSound('wrong');
                recordError("句式:"+targetArr.join(''));
                btnHtml = `<div class="mt-8 text-center pop-in">
                            <p class="text-red-500 font-bold text-xl mb-4">哎呀，次序錯咗哦~</p>
                            <button onclick="l5Reset()" class="btn-3d btn-red px-8 py-3 text-xl">重頭排過 🔄</button>
                           </div>`;
            }
        }

        area.innerHTML = ansHtml + srcHtml + btnHtml;
    }
    window.l5Add = function(idx) {
        l5Ans.push(l5Blocks[idx]);
        l5Blocks.splice(idx, 1);
        drawSentenceUI(LEVELS[currentLevelIndex].sentences[l5Index]);
    }
    window.l5Remove = function(idx) {
        l5Blocks.push(l5Ans[idx]);
        l5Ans.splice(idx, 1);
        drawSentenceUI(LEVELS[currentLevelIndex].sentences[l5Index]);
    }
    window.l5Reset = function() {
        const targetArr = LEVELS[currentLevelIndex].sentences[l5Index];
        l5Blocks = shuffle([...targetArr]);
        l5Ans = [];
        drawSentenceUI(targetArr);
    }
    window.nextL5 = function() {
        l5Index++;
        buildSentenceUI(LEVELS[currentLevelIndex].sentences);
    }

    // ==========================================
    // 5. 結算與暗號生成
    // ==========================================
    function renderResult() {
        updateBreadcrumb(6); // 高亮結算
        playSound('correct'); 
        
        let errorListHtml = '';
        let errorKeys = Object.keys(errorLog);
        
        if (errorKeys.length === 0) {
            errorListHtml = `<p class="text-green-600 font-bold text-2xl my-4">完美過關！零錯誤！🎉</p>`;
        } else {
            errorListHtml = `<div class="bg-red-50 border-2 border-red-200 rounded-xl p-4 my-4 text-left max-w-sm mx-auto">
                                <p class="text-red-600 font-bold mb-2 text-lg">🔍 家長錯題診斷 (需提示字詞)：</p>
                                <ul class="list-disc pl-5 text-gray-700 text-lg">`;
            errorKeys.forEach(k => {
                errorListHtml += `<li>${k} (錯誤: ${errorLog[k]} 次)</li>`;
            });
            errorListHtml += `  </ul>
                             </div>`;
        }

        let reportCode = `【中文盲測回報】P.21-25 Test 1 | 錯誤字詞: ${errorKeys.length === 0 ? '無' : errorKeys.join(', ')}`;

        container.innerHTML = `
            <div class="text-center pop-in py-8">
                <div class="text-8xl mb-4">🏆</div>
                <h2 class="text-4xl font-bold text-orange-600 mb-6">闖關成功！</h2>
                ${errorListHtml}
                <button onclick="copyReport('${reportCode}')" class="btn-3d btn-blue text-xl px-8 py-4 mt-4 w-full md:w-auto flex items-center justify-center mx-auto">
                    📋 一鍵複製測驗暗號
                </button>
                <p class="text-gray-500 text-sm mt-4">複製後請貼上對話框，交由 AI 老師更新進度。</p>
            </div>
        `;
    }

    window.copyReport = function(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ 暗號複製成功！請貼回畀 AI 老師。');
        });
    }

    // 初始化啟動
    renderLevel(0);

</script>
</body>
</html>
