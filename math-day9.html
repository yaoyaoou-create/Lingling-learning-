<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🍕 數學探索島・第 9 日：披薩分享日</title>
  <style>
    /* =========================================
       iPad Safari 終極防護引擎 & 基礎設定
       ========================================= */
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: "PingFang HK", "Hiragino Sans GB", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 55%, #fed7aa 100%);
      color: #7c2d12;
      overflow-x: hidden;
    }

    /* 背景披薩店裝飾 */
    .pizza-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-icon {
      position: absolute;
      font-size: 4.2rem;
      opacity: 0.22;
      animation: floatGentle 6s ease-in-out infinite alternate;
    }
    @keyframes floatGentle {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-14px) rotate(6deg); }
    }

    /* 主容器 */
    .app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 14px 18px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 頂部導航列與進度圓點 */
    .top-nav {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 6px 0 #fb923c, 0 10px 20px rgba(234, 88, 12, 0.14);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-btn {
      text-decoration: none;
      background: #fef08a;
      color: #854d0e;
      font-weight: 800;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 16px;
      border-bottom: 4px solid #eab308;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .home-btn:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }

    .theme-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #c2410c;
      letter-spacing: 0.5px;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffedd5;
      border: 3px solid #fdba74;
      color: #9a3412;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .step-dot.active {
      background: #facc15;
      border-color: #ca8a04;
      color: #713f12;
      transform: scale(1.18);
    }
    .step-dot.done {
      background: #22c55e;
      border-color: #15803d;
      color: #ffffff;
    }

    /* Anna 老師語音橫幅 */
    .teacher-banner {
      background: #ffffff;
      border-radius: 26px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 3px solid #fb923c;
      box-shadow: 0 7px 0 #ea580c;
    }

    .teacher-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .teacher-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fde047, #f97316);
      border: 4px solid #ffffff;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0;
    }

    .question-text {
      font-size: 1.32rem;
      font-weight: 800;
      color: #7c2d12;
      line-height: 1.45;
    }

    .speak-btn {
      background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      border-bottom: 5px solid #9a3412;
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.25);
    }
    .speak-btn:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    /* 題目視覺主舞台 */
    .stage-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 30px;
      padding: 24px 20px;
      min-height: 255px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 9px 0 #fdba74, 0 14px 28px rgba(194, 65, 12, 0.14);
      position: relative;
    }

    .stage-badge {
      background: #ffedd5;
      color: #9a3412;
      font-size: 0.98rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid #fed7aa;
    }

    /* 數字順序卡片 (Q1, Q2 帶小番茄數量提示; Q3 外賣車) */
    .sequence-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .seq-card {
      min-width: 88px;
      padding: 12px 10px;
      border-radius: 22px;
      background: #fff7ed;
      border: 4px solid #fb923c;
      box-shadow: 0 5px 0 #ea580c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .seq-card.mystery {
      background: #fffbeb;
      border: 4px dashed #f59e0b;
      box-shadow: 0 5px 0 #d97706;
      animation: pulseMystery 1.4s infinite ease-in-out;
    }
    .seq-num {
      font-size: 2.3rem;
      font-weight: 900;
      color: #c2410c;
      line-height: 1.1;
    }
    .seq-dots-hint {
      font-size: 1.05rem;
      line-height: 1.25;
      max-width: 72px;
      text-align: center;
      letter-spacing: 1px;
    }
    .seq-vehicle {
      font-size: 1.6rem;
    }

    @keyframes pulseMystery {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    /* 互動點數實物卡片 (Q4, Q5, Q8) */
    .math-equation-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .group-box {
      background: #fffbeb;
      border: 4px solid #facc15;
      border-radius: 24px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.45), 0 6px 0 #eab308;
    }

    .group-items {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .group-label {
      font-size: 1.15rem;
      font-weight: 900;
      color: #9a3412;
      background: #ffffff;
      padding: 3px 14px;
      border-radius: 999px;
      border: 2px solid #fed7aa;
    }

    .math-symbol {
      font-size: 2.7rem;
      font-weight: 900;
      color: #ea580c;
    }

    .countable-item {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #ffffff;
      border: 3px solid #fdba74;
      box-shadow: 0 5px 0 #fb923c;
      font-size: 2.8rem;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .countable-item.counted {
      background: #fef9c3;
      border-color: #eab308;
      box-shadow: 0 5px 0 #ca8a04;
      transform: scale(1.08);
    }
    .count-tag {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ea580c;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .tap-tip {
      font-size: 0.98rem;
      font-weight: 800;
      color: #c2410c;
      background: #ffedd5;
      padding: 6px 16px;
      border-radius: 999px;
    }

    /* 規律分組框 (Q6) */
    .pattern-group-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(254, 215, 170, 0.45);
      border: 3px dashed #ea580c;
      border-radius: 22px;
      padding: 10px;
    }
    .pattern-item {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: #ffffff;
      border: 3px solid #fdba74;
      box-shadow: 0 4px 0 #fb923c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .pattern-item.mystery {
      background: #fffbeb;
      border: 4px dashed #f59e0b;
      box-shadow: 0 4px 0 #d97706;
      animation: pulseMystery 1.4s infinite ease-in-out;
    }

    /* 前後方位排隊 (Q7) */
    .queue-stage {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      padding: 26px 20px 18px 96px;
      border-bottom: 8px solid #ea580c;
      position: relative;
      width: 100%;
    }
    .queue-door {
      position: absolute;
      left: 8px;
      bottom: 12px;
      font-size: 3.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .door-label {
      background: #facc15;
      color: #713f12;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 10px;
      border: 2px solid #ca8a04;
      margin-bottom: -4px;
    }
    .queue-character {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .char-emoji {
      font-size: 3.8rem;
      background: #ffffff;
      border-radius: 22px;
      border: 4px solid #fb923c;
      box-shadow: 0 4px 0 #ea580c;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .char-label {
      background: #ffedd5;
      color: #9a3412;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid #fdba74;
    }

    /* 動態減法 (Q8: 5-2) */
    .subtraction-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 8px;
    }
    .pizza-slice-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 22px;
      background: #fff7ed;
      border: 4px solid #fb923c;
      box-shadow: 0 6px 0 #ea580c;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .pizza-slice-card.counted {
      background: #fef9c3;
      border-color: #eab308;
      box-shadow: 0 6px 0 #ca8a04;
      transform: scale(1.06);
    }
    .pizza-slice-card .emoji-big {
      font-size: 2.9rem;
    }
    .pizza-slice-card .status-pill {
      font-size: 0.88rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ea580c;
      color: #ffffff;
    }
    .pizza-slice-card.eaten {
      background: #f8fafc;
      border: 4px dashed #94a3b8;
      box-shadow: none;
      opacity: 0.4;
      transform: translateY(-6px) rotate(6deg);
      cursor: default;
    }
    .pizza-slice-card.eaten .status-pill {
      background: #64748b;
    }

    /* 溫柔提示框 (絕無 ❌ 符號) */
    .gentle-hint-box {
      display: none;
      width: 100%;
      background: #fffbeb;
      border: 3px solid #fbbf24;
      border-radius: 22px;
      padding: 14px 18px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 5px 0 #fcd34d;
      animation: popIn 0.25s ease;
    }
    .gentle-hint-box.visible {
      display: flex;
    }
    .hint-icon {
      font-size: 2rem;
      flex-shrink: 0;
    }
    .hint-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #92400e;
      line-height: 1.4;
    }

    /* 選項按鈕區 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid #fb923c;
      border-bottom: 8px solid #ea580c;
      border-radius: 26px;
      padding: 18px 12px;
      font-size: 2.1rem;
      font-weight: 900;
      color: #7c2d12;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 16px rgba(234, 88, 12, 0.14);
      transition: transform 0.1s, background 0.15s;
    }
    .option-btn:active {
      transform: translateY(5px);
      border-bottom-width: 3px;
    }
    .option-sub {
      font-size: 1.05rem;
      font-weight: 800;
      color: #9a3412;
    }

    /* 防呆搖晃動畫 */
    .wrong-shake {
      animation: shakeGentle 0.42s ease;
      background: #fef3c7 !important;
      border-color: #f59e0b !important;
      border-bottom-color: #d97706 !important;
    }
    @keyframes shakeGentle {
      0%, 100% { transform: translateX(0); }
      22% { transform: translateX(-8px); }
      45% { transform: translateX(8px); }
      68% { transform: translateX(-5px); }
      85% { transform: translateX(5px); }
    }

    /* 答對發光狀態 */
    .correct-pop {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      border-bottom-color: #15803d !important;
      color: #14532d !important;
      transform: scale(1.04);
    }

    /* 下一題按鈕 */
    .next-action-wrap {
      display: none;
      justify-content: center;
      margin-top: 4px;
    }
    .next-action-wrap.visible {
      display: flex;
    }
    .next-btn {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      border-bottom: 7px solid #15803d;
      border-radius: 26px;
      padding: 16px 38px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(22, 163, 74, 0.3);
      animation: popIn 0.25s ease;
    }
    .next-btn:active {
      transform: translateY(5px);
      border-bottom-width: 2px;
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 開場歡迎遮罩 (解鎖 iPad Safari 語音) */
    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(124, 45, 18, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .start-modal {
      background: #ffffff;
      border-radius: 34px;
      padding: 32px 26px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 5px solid #fb923c;
      box-shadow: 0 12px 0 #ea580c;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .start-modal h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #c2410c;
    }
    .start-modal p {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #431407;
      line-height: 1.5;
    }
    .start-btn {
      background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
      color: #713f12;
      border: none;
      border-bottom: 7px solid #ca8a04;
      border-radius: 26px;
      padding: 16px 36px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
    }
    .start-btn:active {
      transform: translateY(5px);
      border-bottom-width: 2px;
    }

    /* 結算報告畫面 */
    .summary-card {
      display: none;
      background: #ffffff;
      border-radius: 32px;
      padding: 26px 22px;
      border: 4px solid #facc15;
      box-shadow: 0 10px 0 #eab308;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .summary-card.visible {
      display: flex;
    }

    .trophy-header {
      text-align: center;
    }
    .trophy-header .trophy-icon {
      font-size: 4rem;
    }
    .trophy-header h2 {
      margin: 6px 0 4px;
      font-size: 1.75rem;
      color: #c2410c;
    }
    .trophy-header p {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #57534e;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 18px;
      overflow: hidden;
      font-size: 1rem;
    }
    .report-table th {
      background: #ea580c;
      color: #ffffff;
      padding: 12px 10px;
      font-weight: 800;
      text-align: center;
    }
    .report-table td {
      padding: 11px 10px;
      border-bottom: 2px solid #ffedd5;
      text-align: center;
      font-weight: 700;
      color: #1e293b;
    }
    .report-table tr:nth-child(even) td {
      background: #fff7ed;
    }

    .copy-box {
      width: 100%;
      background: #fff7ed;
      border: 3px dashed #fb923c;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .secret-code-preview {
      width: 100%;
      background: #ffffff;
      border: 2px solid #fdba74;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #9a3412;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
    }

    .copy-btn {
      background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      border-bottom: 6px solid #9a3412;
      border-radius: 22px;
      padding: 15px 26px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      max-width: 440px;
    }
    .copy-btn:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    .copy-toast {
      display: none;
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #14532d;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 10px 16px;
      border-radius: 16px;
      text-align: center;
    }
    .copy-toast.visible {
      display: block;
    }

    @media (max-width: 600px) {
      .seq-card { min-width: 64px; padding: 8px 6px; }
      .seq-num { font-size: 1.8rem; }
      .countable-item { width: 62px; height: 62px; font-size: 2.2rem; }
      .pattern-item { width: 54px; height: 54px; font-size: 2rem; }
      .queue-stage { padding-left: 74px; gap: 10px; }
      .char-emoji { width: 66px; height: 66px; font-size: 2.8rem; }
      .question-text { font-size: 1.15rem; }
      .option-btn { font-size: 1.75rem; padding: 14px 8px; }
    }
  </style>
</head>
<body>

  <!-- 背景裝飾 -->
  <div class="pizza-bg">
    <div class="bg-icon" style="top: 8%; left: 4%;">🍕</div>
    <div class="bg-icon" style="top: 14%; right: 6%; animation-delay: 1.2s;">🍅</div>
    <div class="bg-icon" style="bottom: 10%; left: 6%; animation-delay: 2s;">🧀</div>
    <div class="bg-icon" style="bottom: 8%; right: 5%; animation-delay: 0.7s;">🍄</div>
  </div>

  <!-- 開場遮罩 -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-modal">
      <div style="font-size: 4.2rem;">🍕🍅🛵</div>
      <h1>數學探索島・第 9 日</h1>
      <p>歡迎嚟到《披薩分享日》！<br>準備好做小廚師，同 Anna 老師一齊數披薩、整大餐未呀？</p>
      <button class="start-btn" id="startBtn">🍕 披薩店開門啦！</button>
    </div>
  </div>

  <div class="app-wrapper">
    <!-- 頂部導航列 -->
    <header class="top-nav">

    /* =========================================
       2. iPad Safari 安全廣東話語音引擎 (Anti-GC)
       ========================================= */
    window.utterancePool = [];
    let selectedCantoneseVoice = null;

    function loadCantoneseVoice() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      selectedCantoneseVoice =
        voices.find(v => v.lang === "zh-HK" && (v.name.includes("Sin") || v.name.includes("Female") || v.name.includes("善怡"))) ||
        voices.find(v => v.lang === "zh-HK") ||
        voices.find(v => v.lang.toLowerCase().includes("hk")) ||
        null;
    }

    if ("speechSynthesis" in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakCantonese(text) {
      if (!("speechSynthesis" in window)) return;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-HK";
          u.rate = 0.72;
          u.pitch = 1.08;
          if (selectedCantoneseVoice) u.voice = selectedCantoneseVoice;
          window.utterancePool.push(u);
          if (window.utterancePool.length > 12) window.utterancePool.shift();
          window.speechSynthesis.speak(u);
        } catch (err) {
          console.warn("語音略過:", err);
        }
      }, 40);
    }

    function playTone(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === "tap") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.09);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === "correct") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.11);
          osc.frequency.setValueAtTime(783.99, now + 0.22);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        } else if (type === "gentle") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.linearRampToValueAtTime(290, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    function renderStepDots() {
      stepDotsEl.innerHTML = "";
      quizData.forEach((q, idx) => {
        const dot = document.createElement("div");
        dot.className = "step-dot";
        if (idx < currentIndex) dot.classList.add("done");
        if (idx === currentIndex && !document.getElementById("summaryCard").classList.contains("visible")) {
          dot.classList.add("active");
        }
        dot.textContent = idx < currentIndex ? "✓" : (idx + 1);
        stepDotsEl.appendChild(dot);
      });
    }

    /* 建立可點擊數數的實物卡片 */
    function createCountableItem(emoji) {
      const item = document.createElement("div");
      item.className = "countable-item";
      item.textContent = emoji;

      item.addEventListener("click", () => {
        playTone("tap");
        if (item.dataset.counted === "1") {
          item.dataset.counted = "0";
          item.classList.remove("counted");
          const oldTag = item.querySelector(".count-tag");
          if (oldTag) oldTag.remove();
          recalculateCountTags();
        } else {
          tapCountCounter++;
          item.dataset.counted = "1";
          item.classList.add("counted");
          const tag = document.createElement("span");
          tag.className = "count-tag";
          tag.textContent = tapCountCounter;
          item.appendChild(tag);
          speakCantonese(String(tapCountCounter));
        }
      });

      return item;
    }

    function recalculateCountTags() {
      const countedItems = visualStageEl.querySelectorAll('[data-counted="1"]');
      tapCountCounter = countedItems.length;
      countedItems.forEach((el, i) => {
        const tag = el.querySelector(".count-tag");
        if (tag) tag.textContent = i + 1;
      });
    }

      } else if (q.type === "addition-boxes") {
        const eqWrap = document.createElement("div");

        const leftBox = document.createElement("div");
        leftBox.className = "group-box";

        leftBox.appendChild(leftLbl);

        const plusSign = document.createElement("div");

          rightItems.appendChild(createCountableItem(q.rightEmoji));
        }
        const rightLbl = document.createElement("div");
        rightLbl.className = "group-label";
        rightLbl.textContent = q.rightLabel;
        rightBox.appendChild(rightItems);
        rightBox.appendChild(rightLbl);

        const eqSign = document.createElement("div");
        eqSign.className = "math-symbol";
        eqSign.textContent = "＝ ❓";

        eqWrap.appendChild(leftBox);
        eqWrap.appendChild(plusSign);
        eqWrap.appendChild(rightBox);
        eqWrap.appendChild(eqSign);
        visualStageEl.appendChild(eqWrap);

        const tip = document.createElement("div");
        tip.className = "tap-tip";
        tip.textContent = "👆 用手指逐粒點一點，跟住讀出數字數數！";
        visualStageEl.appendChild(tip);

      } else if (q.type === "pattern-grouped") {
        const row = document.createElement("div");
        row.className = "sequence-row";
        q.groups.forEach(group => {
          const groupBox = document.createElement("div");
          groupBox.className = "pattern-group-box";
          group.forEach(item => {
            const el = document.createElement("div");
            el.className = "pattern-item" + (item === "❓" ? " mystery" : "");
            el.textContent = item;
            groupBox.appendChild(el);
          });
          row.appendChild(groupBox);
        });
        visualStageEl.appendChild(row);

      } else if (q.type === "queue") {
        const stage = document.createElement("div");
        stage.className = "queue-stage";

        const door = document.createElement("div");
        door.className = "queue-door";
        door.innerHTML = `<div class="door-label">披薩店</div>🏪`;
        stage.appendChild(door);

        q.chars.forEach(c => {
          const charEl = document.createElement("div");
          charEl.className = "queue-character";
          charEl.innerHTML = `<div class="char-emoji">${c.emoji}</div><div class="char-label">${c.label}</div>`;
          stage.appendChild(charEl);
        });
        visualStageEl.appendChild(stage);

      } else if (q.type === "subtraction-pizza") {
        const subZone = document.createElement("div");
        subZone.className = "subtraction-zone";
        const stayCount = q.totalCount - q.awayCount;

        for (let i = 0; i < q.totalCount; i++) {
          const isEaten = i >= stayCount;
          const card = document.createElement("div");
          card.className = "pizza-slice-card" + (isEaten ? " eaten" : "");

          const emo = document.createElement("div");
          emo.className = "emoji-big";
          emo.textContent = "🍕";

          const pill = document.createElement("div");
          pill.className = "status-pill";
          pill.textContent = isEaten ? "食咗 😋" : "仲喺度 ✨";

          card.appendChild(emo);
          card.appendChild(pill);

          if (!isEaten) {
            card.addEventListener("click", () => {
              playTone("tap");
              if (card.dataset.counted === "1") {
                card.dataset.counted = "0";
                card.classList.remove("counted");
                const oldTag = card.querySelector(".count-tag");
                if (oldTag) oldTag.remove();
                recalculateCountTags();
              } else {
                tapCountCounter++;
                card.dataset.counted = "1";
                card.classList.add("counted");
                const tag = document.createElement("span");
                tag.className = "count-tag";
                tag.textContent = tapCountCounter;
                card.appendChild(tag);
                speakCantonese(String(tapCountCounter));
              }
            });
          }
          subZone.appendChild(card);
        }

        visualStageEl.appendChild(subZone);

        const tip = document.createElement("div");
        tip.className = "tap-tip";
        tip.textContent = "👆 點一點仲發光嘅披薩，數吓剩低幾多塊！";
        visualStageEl.appendChild(tip);
      }

      /* 渲染選項按鈕 */
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${opt.main}</span><span class="option-sub">${opt.sub}</span>`;

        btn.addEventListener("click", () => {
          handleOptionClick(btn, opt, q);
        });
        optionsGridEl.appendChild(btn);
      });

      questionStartTime = Date.now();
      speakCantonese(q.questionSpeech);
    }

    /* 同步無死鎖答題判定 */
    function handleOptionClick(btn, opt, q) {
      if (questionSolved) return;

      if (opt.isCorrect) {
        questionSolved = true;
        const elapsedSec = Math.max(1, Math.round((Date.now() - questionStartTime) / 1000));

        btn.classList.add("correct-pop");
        playTone("correct");
        gentleHintBoxEl.classList.remove("visible");

        resultsLog.push({
          id: q.id,
          reportLabel: q.reportLabel,
          seconds: elapsedSec,
          needsHint: currentNeedsHint
        });

        nextBtnEl.textContent = (currentIndex === quizData.length - 1) ? "🏆 睇今日成績！" : "➡️ 去下一關整披薩！";
        nextActionWrapEl.classList.add("visible");
        speakCantonese(q.praiseSpeech);
      } else {
        currentNeedsHint = true;
        playTone("gentle");

        btn.classList.remove("wrong-shake");
        void btn.offsetWidth;
        btn.classList.add("wrong-shake");

        gentleHintTextEl.textContent = q.hintDisplay;
        gentleHintBoxEl.classList.add("visible");
        speakCantonese(q.hintSpeech);
      }
    }

    function showSummaryReport() {
      document.getElementById("quizSection").style.display = "none";
      document.getElementById("summaryCard").classList.add("visible");

      stepDotsEl.innerHTML = "";
      quizData.forEach(() => {
        const dot = document.createElement("div");
        dot.className = "step-dot done";
        dot.textContent = "✓";
        stepDotsEl.appendChild(dot);
      });

      const tbody = document.getElementById("reportTableBody");
      tbody.innerHTML = "";
      const codeParts = ["【數學測驗回報】Day 9 (披薩分享日)"];

      resultsLog.forEach(item => {
        const tr = document.createElement("tr");
        const statusText = item.needsHint ? "💡 需提示" : "✅ 1次答對";
        tr.innerHTML = `
          <td>${item.reportLabel}</td>
          <td>${statusText}</td>
          <td>${item.seconds}s</td>
        `;
        tbody.appendChild(tr);

        const suffix = item.needsHint ? "(需提示)" : "";
        codeParts.push(`${item.reportLabel}: ${item.seconds}s${suffix}`);
      });

      document.getElementById("secretCodePreview").textContent = codeParts.join(" | ");
      speakCantonese("哇！玲玲好叻女呀，披薩分享日全部過關啦！請媽媽撳下面粒掣，將成績暗號傳送俾 Anna 老師啦！");
    }

    /* 一鍵複製進度暗號 */
    document.getElementById("copyReportBtn").addEventListener("click", () => {
      const codeText = document.getElementById("secretCodePreview").textContent;
      const toast = document.getElementById("copyToast");

      function onCopySuccess() {
        playTone("correct");
        toast.classList.add("visible");
        document.getElementById("copyReportBtn").textContent = "✅ 已複製好進度暗號！";
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codeText).then(onCopySuccess).catch(() => {
          fallbackCopy(codeText, onCopySuccess);
        });
      } else {
        fallbackCopy(codeText, onCopySuccess);
      }
    });

    function fallbackCopy(text, callback) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
        callback();
      } catch (e) {}
      document.body.removeChild(ta);
    }

    /* 事件綁定 */
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("startOverlay").style.display = "none";
      playTone("tap");
      renderQuestion(0);
    });

    document.getElementById("replayBtn").addEventListener("click", () => {
      const q = quizData[currentIndex];
      if (q) speakCantonese(q.questionSpeech);
    });

    nextBtnEl.addEventListener("click", () => {
      playTone("tap");
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        showSummaryReport();
      }
    });

    renderStepDots();
  </script>
</body>
</html>
