<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🦖 數學探索島・第 8 日：恐龍探險島</title>
  <style>
    /* =========================================
       iPad Safari 終極防護引擎 & 基礎設定
       ========================================= */
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: "PingFang HK", "Hiragino Sans GB", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #fefce8 0%, #fef08a 55%, #fde047 100%);
      color: #422006;
      overflow-x: hidden;
    }

    /* 背景恐龍島裝飾 */
    .dino-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .volcano {
      position: absolute;
      bottom: -20px;
      right: -30px;
      font-size: 8rem;
      opacity: 0.3;
    }
    .jungle-leaf {
      position: absolute;
      font-size: 4rem;
      opacity: 0.4;
      animation: sway 5s ease-in-out infinite alternate;
    }
    @keyframes sway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    /* 主容器 */
    .app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 14px 18px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 頂部導航列 */
    .top-nav {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 6px 0 #ca8a04, 0 10px 20px rgba(161, 98, 7, 0.12);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-btn {
      text-decoration: none;
      background: #4ade80;
      color: #064e3b;
      font-weight: 800;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 16px;
      border-bottom: 4px solid #16a34a;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .home-btn:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }

    .theme-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #713f12;
      letter-spacing: 0.5px;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fef9c3;
      border: 3px solid #fde047;
      color: #854d0e;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .step-dot.active {
      background: #fbbf24;
      border-color: #d97706;
      color: #713f12;
      transform: scale(1.18);
    }
    .step-dot.done {
      background: #eab308;
      border-color: #ca8a04;
      color: #ffffff;
    }

    /* Anna 老師語音橫幅 */
    .teacher-banner {
      background: #ffffff;
      border-radius: 26px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 3px solid #facc15;
      box-shadow: 0 7px 0 #eab308;
    }

    .teacher-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .teacher-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fde047, #f59e0b);
      border: 4px solid #ffffff;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0;
    }

    .question-text {
      font-size: 1.32rem;
      font-weight: 800;
      color: #422006;
      line-height: 1.45;
    }

    .speak-btn {
      background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
      color: #713f12;
      border: none;
      border-bottom: 5px solid #ca8a04;
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(202, 138, 4, 0.25);
    }
    .speak-btn:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
    }

    /* 題目視覺主舞台 */
    .stage-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 30px;
      padding: 24px 20px;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 9px 0 #fde047, 0 14px 28px rgba(202, 138, 4, 0.14);
      position: relative;
    }

    .stage-badge {
      background: #fef9c3;
      color: #854d0e;
      font-size: 0.98rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid #fef08a;
    }

    /* 超直觀排隊 (Q1, Q2) */
    .queue-stage {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      padding: 30px 20px 20px;
      border-bottom: 8px solid #a16207;
      position: relative;
      width: 100%;
    }
    .queue-water {
      position: absolute;
      left: 0;
      bottom: 10px;
      font-size: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gate-label {
      background: #38bdf8;
      color: #0c4a6e;
      font-size: 1rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 12px;
      border: 2px solid #0284c7;
      margin-bottom: -5px;
      z-index: 2;
    }
    .queue-character {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .char-emoji {
      font-size: 4rem;
      background: #ffffff;
      border-radius: 20px;
      border: 4px solid #facc15;
      box-shadow: 0 4px 0 #eab308;
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .char-label {
      background: #fef9c3;
      color: #854d0e;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid #fde047;
    }
    .leader-crown {
      position: absolute;
      top: -30px;
      font-size: 2.5rem;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 恐龍蛋與腳印順序 (Q3, Q4) */
    .sequence-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .sequence-item {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #a3e635;
      box-shadow: 0 5px 0 #65a30d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 900;
      color: #3f6212;
      position: relative;
    }
    .seq-emoji {
      font-size: 1.5rem;
      margin-bottom: -5px;
      opacity: 0.8;
    }
    .item-mystery {
      background: #fffbeb;
      border-color: #f59e0b;
      box-shadow: 0 5px 0 #d97706;
      color: #d97706;
      animation: pulseMystery 1.4s infinite ease-in-out;
    }

    /* 規律分組框 (Q6 降低難度用) */
    .pattern-group-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(254, 240, 138, 0.4);
      border: 3px dashed #eab308;
      border-radius: 20px;
      padding: 8px;
    }
    .pattern-item {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      background: #ffffff;
      border: 3px solid #cbd5e1;
      box-shadow: 0 4px 0 #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .pattern-item.mystery {
      background: #fffbeb;
      border-color: #f59e0b;
      box-shadow: 0 4px 0 #d97706;
      animation: pulseMystery 1.4s infinite ease-in-out;
    }

    /* 實物加減法分格 (Q7, Q8) */
    .math-boxes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .math-group-box {
      background: #f0fdf4;
      border: 4px solid #4ade80;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 0 #22c55e;
    }
    .math-group-box.glow-box {
      background: #fefce8;
      border-color: #facc15;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.55), 0 6px 0 #eab308;
    }
    .dino-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 180px;
    }
    .countable-dino {
      font-size: 3rem;
      transition: transform 0.1s;
    }
    .countable-dino:active {
      transform: scale(0.9);
    }
    .math-symbol {
      font-size: 3.5rem;
      font-weight: 900;
      color: #a16207;
    }
    .away-dino {
      opacity: 0.3;
      filter: grayscale(100%);
      text-decoration: line-through;
    }

    /* 溫柔提示框 */
    .gentle-hint-box {
      display: none;
      width: 100%;
      background: #fffbeb;
      border: 3px solid #fbbf24;
      border-radius: 22px;
      padding: 14px 18px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 5px 0 #fcd34d;
      animation: popIn 0.25s ease;
    }
    .gentle-hint-box.visible {
      display: flex;
    }
    .hint-icon {
      font-size: 2rem;
      flex-shrink: 0;
    }
    .hint-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #92400e;
      line-height: 1.4;
    }

    /* 選項按鈕區 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid #facc15;
      border-bottom: 8px solid #ca8a04;
      border-radius: 26px;
      padding: 18px 12px;
      font-size: 2.2rem;
      font-weight: 900;
      color: #713f12;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 16px rgba(202, 138, 4, 0.14);
      transition: transform 0.1s, background 0.15s;
    }
    .option-btn:active {
      transform: translateY(5px);
      border-bottom-width: 3px;
    }
    .option-sub {
      font-size: 1.05rem;
      font-weight: 800;
      color: #854d0e;
    }

    /* 防呆搖晃動畫 */
    .wrong-shake {
      animation: shakeGentle 0.42s ease;
      background: #fef3c7 !important;
      border-color: #f59e0b !important;
      border-bottom-color: #d97706 !important;
    }
    @keyframes shakeGentle {
      0%, 100% { transform: translateX(0); }
      22% { transform: translateX(-8px); }
      45% { transform: translateX(8px); }
      68% { transform: translateX(-5px); }
      85% { transform: translateX(5px); }
    }

    /* 答對發光狀態 */
    .correct-pop {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      border-bottom-color: #15803d !important;
      color: #14532d !important;
      transform: scale(1.04);
    }

    /* 下一題按鈕 */
    .next-action-wrap {
      display: none;
      justify-content: center;
      margin-top: 4px;
    }
    .next-action-wrap.visible {
      display: flex;
    }
    .next-btn {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      border-bottom: 7px solid #15803d;
      border-radius: 26px;
      padding: 16px 38px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(22, 163, 74, 0.3);
      animation: popIn 0.25s ease;
    }
    .next-btn:active {
      transform: translateY(5px);
      border-bottom-width: 2px;
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 開場歡迎遮罩 */
    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(66, 32, 6, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .start-modal {
      background: #ffffff;
      border-radius: 34px;
      padding: 32px 26px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 5px solid #facc15;
      box-shadow: 0 12px 0 #ca8a04;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .start-modal h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #713f12;
    }
    .start-modal p {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #422006;
      line-height: 1.5;
    }
    .start-btn {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      border-bottom: 7px solid #15803d;
      border-radius: 26px;
      padding: 16px 36px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
    }
    .start-btn:active {
      transform: translateY(5px);
      border-bottom-width: 2px;
    }

    /* 結算報告畫面 */
    .summary-card {
      display: none;
      background: #ffffff;
      border-radius: 32px;
      padding: 26px 22px;
      border: 4px solid #facc15;
      box-shadow: 0 10px 0 #eab308;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .summary-card.visible {
      display: flex;
    }

    .trophy-header {
      text-align: center;
    }
    .trophy-header .trophy-icon {
      font-size: 4rem;
    }
    .trophy-header h2 {
      margin: 6px 0 4px;
      font-size: 1.75rem;
      color: #713f12;
    }
    .trophy-header p {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #57534e;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 18px;
      overflow: hidden;
      font-size: 1rem;
    }
    .report-table th {
      background: #eab308;
      color: #ffffff;
      padding: 12px 10px;
      font-weight: 800;
      text-align: center;
    }
    .report-table td {
      padding: 11px 10px;
      border-bottom: 2px solid #fef9c3;
      text-align: center;
      font-weight: 700;
      color: #1e293b;
    }
    .report-table tr:nth-child(even) td {
      background: #fffbeb;
    }

    .copy-box {
      width: 100%;
      background: #fefce8;
      border: 3px dashed #facc15;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .secret-code-preview {
      width: 100%;
      background: #ffffff;
      border: 2px solid #fde047;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #713f12;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
    }

    .copy-btn {
      background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
      color: #713f12;
      border: none;
      border-bottom: 6px solid #ca8a04;
      border-radius: 22px;
      padding: 15px 26px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      max-width: 440px;
    }
    .copy-btn:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    .copy-toast {
      display: none;
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #14532d;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 10px 16px;
      border-radius: 16px;
      text-align: center;
    }
    .copy-toast.visible {
      display: block;
    }

    @media (max-width: 600px) {
      .queue-water { font-size: 3rem; }
      .char-emoji { width: 70px; height: 70px; font-size: 3rem; }
      .sequence-item { width: 60px; height: 60px; font-size: 1.8rem; }
      .pattern-item { width: 55px; height: 55px; font-size: 2rem; }
      .question-text { font-size: 1.15rem; }
      .option-btn { font-size: 1.8rem; padding: 14px 8px; }
      .math-symbol { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <!-- 背景裝飾 -->
  <div class="dino-bg">
    <div class="jungle-leaf" style="top: 10px; left: -10px;">🌿</div>
    <div class="jungle-leaf" style="top: 50px; right: -10px; animation-delay: 1s;">🍃</div>
    <div class="volcano">🌋</div>
  </div>

  <!-- 開場遮罩 -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-modal">
      <div style="font-size: 4.2rem;">🦖🦕🌋</div>
      <h1>數學探索島・第 8 日</h1>
      <p>歡迎嚟到《恐龍探險島》！<br>準備好同 Anna 老師一齊去搵恐龍蛋未呀？</p>
      <button class="start-btn" id="startBtn">🦖 探險開始！</button>
    </div>
  </div>

  <div class="app-wrapper">
    <!-- 頂部導航列 -->
    <header class="top-nav">
      <div class="nav-left">
        <a href="index.html" class="home-btn">🏠 返回樂園</a>
        <div class="theme-title">🦖 第 8 日：恐龍探險島</div>
      </div>
      <div class="step-dots" id="stepDots"></div>
    </header>

    <!-- 測驗區 -->
    <main id="quizSection" style="display: flex; flex-direction: column; gap: 14px;">
      <section class="teacher-banner">
        <div class="teacher-info">
          <div class="teacher-avatar">👩‍🏫</div>
          <div class="question-text" id="questionText">準備出發啦！</div>
        </div>
        <button class="speak-btn" id="replayBtn">🔊 再聽一次</button>
      </section>

      <section class="stage-card">
        <div class="stage-badge" id="stageBadge">第 1 關</div>
        <div id="visualStage" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;"></div>
      </section>

      <div class="gentle-hint-box" id="gentleHintBox">
        <div class="hint-icon">💡</div>
        <div class="hint-text" id="gentleHintText"></div>
      </div>

      <section class="options-grid" id="optionsGrid"></section>

      <div class="next-action-wrap" id="nextActionWrap">
        <button class="next-btn" id="nextBtn">➡️ 去下一個探險區！</button>
      </div>
    </main>

    <!-- 結算區 -->
    <section class="summary-card" id="summaryCard">
      <div class="trophy-header">
        <div class="trophy-icon">🏆</div>
        <h2>恭喜玲玲完成恐龍島探險！</h2>
        <p>你幫恐龍排好隊，搵返恐龍蛋，仲計啱晒加減數，真係好叻呀！</p>
      </div>

      <table class="report-table">
        <thead>
          <tr>
            <th>關卡題型</th>
            <th>表現狀態</th>
            <th>思考時間</th>
          </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
      </table>

      <div class="copy-box">
        <div style="font-weight: 800; color: #713f12; font-size: 1.05rem;">
          👇 請媽媽撳下面粒掣，將今日成績暗號貼返俾 Anna 老師：
        </div>
        <div class="secret-code-preview" id="secretCodePreview"></div>
        <button class="copy-btn" id="copyReportBtn">📋 一鍵複製進度暗號俾 Anna 老師</button>
        <div class="copy-toast" id="copyToast">✅ 已經複製好進度暗號啦！請貼返俾 AI 更新總庫。</div>

    /* =========================================
       2. iPad Safari 安全廣東話語音引擎

    window.utterancePool = [];
    let selectedCantoneseVoice = null;

    function loadCantoneseVoice() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      selectedCantoneseVoice =
        voices.find(v => v.lang === "zh-HK" && (v.name.includes("Sin") || v.name.includes("Female") || v.name.includes("善怡"))) ||
        voices.find(v => v.lang === "zh-HK") ||
        voices.find(v => v.lang.toLowerCase().includes("hk")) ||
        null;
    }

    if ("speechSynthesis" in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakCantonese(text) {
      if (!("speechSynthesis" in window)) return;
      try { window.speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-HK";
          u.rate = 0.72;
          u.pitch = 1.08;
          if (selectedCantoneseVoice) u.voice = selectedCantoneseVoice;
          window.utterancePool.push(u);
          if (window.utterancePool.length > 12) window.utterancePool.shift();
          window.speechSynthesis.speak(u);
        } catch (err) { console.warn("語音略過:", err); }
      }, 40);
    }

    function playTone(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === "tap") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.09);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === "correct") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.11);
          osc.frequency.setValueAtTime(783.99, now + 0.22);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        } else if (type === "gentle") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.linearRampToValueAtTime(290, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

        box.innerHTML = html;
        container.appendChild(box);
        visualStageEl.appendChild(container);
      }

      /* 渲染選項 */
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span>${opt.main}</span><span class="option-sub">${opt.sub}</span>`;

        btn.addEventListener("click", () => {
          if (questionSolved) return;

          if (opt.isCorrect) {
            questionSolved = true;
            const elapsedSec = Math.max(1, Math.round((Date.now() - questionStartTime) / 1000));
            btn.classList.add("correct-pop");
            playTone("correct");
            gentleHintBoxEl.classList.remove("visible");

            resultsLog.push({ id: q.id, reportLabel: q.reportLabel, seconds: elapsedSec, needsHint: currentNeedsHint });

            nextBtnEl.textContent = (currentIndex === quizData.length - 1) ? "🏆 睇成績啦！" : "➡️ 繼續探險！";
            nextActionWrapEl.classList.add("visible");
            speakCantonese(q.praiseSpeech);
          } else {
            currentNeedsHint = true;
            playTone("gentle");
            btn.classList.remove("wrong-shake");
            void btn.offsetWidth;
            btn.classList.add("wrong-shake");
            gentleHintTextEl.textContent = q.hintDisplay;
            gentleHintBoxEl.classList.add("visible");
            speakCantonese(q.hintSpeech);
          }
        });
        optionsGridEl.appendChild(btn);

        document.getElementById("copyReportBtn").textContent = "✅ 已複製好進度暗號！";
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else { fallbackCopy(text, done); }
    });

    function fallbackCopy(text, callback) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); callback(); } catch (e) {}
      document.body.removeChild(ta);
    }

    /* 事件綁定 */
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("startOverlay").style.display = "none";
      playTone("tap");
      renderQuestion(0);
    });

    document.getElementById("replayBtn").addEventListener("click", () => {
      const q = quizData[currentIndex];
      if (q) speakCantonese(q.questionSpeech);
    });

    nextBtnEl.addEventListener("click", () => {
      playTone("tap");
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else { showSummaryReport(); }
    });

    renderStepDots();
  </script>
</body>
</html>
