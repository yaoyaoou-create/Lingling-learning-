<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文課 P.21-25 Day 3: 食物與句子</title>
    <style>
        :root {
            --bg-color: linear-gradient(135deg, #FFEAA7 0%, #F9CA24 100%);
            --btn-main: linear-gradient(135deg, #F39C12, #D35400);
            --btn-main-shadow: #A04000;
            --btn-green: linear-gradient(135deg, #6EE7B7, #10B981);
            --btn-green-shadow: #047857;
            --btn-red: linear-gradient(135deg, #FDA4AF, #F43F5E);
            --btn-red-shadow: #BE123C;
            --btn-yellow: linear-gradient(135deg, #FDE047, #EAB308);
            --btn-yellow-shadow: #A16207;
            --text-dark: #2C3E50;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 4px solid white;
        }

        .btn-3d {
            background: var(--btn-main);
            border: none; border-radius: 18px;
            border-bottom: 8px solid var(--btn-main-shadow);
            color: white; font-size: 18px; font-weight: 900;
            padding: 12px 24px; cursor: pointer;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-3d:active { transform: translateY(4px); border-bottom-width: 4px; }

        .progress-dots { display: flex; gap: 8px; }
        .dot { width: 16px; height: 16px; background: #FFE0B2; border-radius: 50%; }
        .dot.active { background: #E67E22; box-shadow: 0 0 8px #D35400; }

        .game-container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }

        /* 視覺展示區 */
        .visual-area {
            background: white; border-radius: 30px; padding: 30px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 6px solid #FFF; text-align: center;
            min-height: 180px; width: 90%; max-width: 800px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 60px; position: relative; margin-bottom: 25px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounceIn {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .focus-text { font-size: 40px; font-weight: 900; color: #D35400; margin-top: 15px; }

        .speaker-btn {
            position: absolute; top: -20px; left: -20px;
            background: var(--btn-red); border: none; border-bottom: 6px solid var(--btn-red-shadow);
            border-radius: 50%; width: 70px; height: 70px; font-size: 30px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
            display: flex; align-items: center; justify-content: center; transition: all 0.1s;
        }
        .speaker-btn:active { transform: translateY(3px); border-bottom-width: 3px; }

        /* 互動選項區 */
        .interaction-area { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; max-width: 800px; }
        
        /* 句子插槽 (Slots) */
        .slots-container {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            margin-bottom: 20px; width: 100%; min-height: 60px;
        }
        .slot-box {
            background: #FDFEFE; border: 4px dashed #F39C12;
            border-radius: 16px; padding: 10px 20px;
            font-size: 28px; font-weight: bold; color: #E67E22;
            min-width: 80px; text-align: center;
        }
        .slot-box.filled { background: var(--btn-yellow); border: 4px solid var(--btn-yellow-shadow); color: #9A7D0A; border-style: solid; }

        /* 文字積木按鈕 */
        .word-block {
            background: white; border: 4px solid #FAD7A1; border-bottom: 8px solid #F5B041;
            border-radius: 20px; padding: 15px 30px; font-size: 28px; font-weight: bold; color: #D35400;
            cursor: pointer; transition: all 0.1s;
        }
        .word-block:active { transform: translateY(4px); border-bottom-width: 4px; }
        .word-block.used { opacity: 0; pointer-events: none; }
        
        /* 尋寶字元 */
        .char-hunt {
            display: inline-block; padding: 5px 10px; margin: 5px;
            background: #FDEBD0; border: 3px solid #F8C471; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .char-hunt:active { transform: scale(0.9); }
        .char-hunt.found { background: #58D68D; color: white; border-color: #239B56; pointer-events: none; animation: pop 0.4s ease-out; }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .wrong-shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-3deg); }
            75% { transform: translateX(8px) rotate(3deg); }
        }

        /* 畫面 */
        #start-screen, #end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200;
        }
        #end-screen { display: none; }
        .anna-avatar { font-size: 100px; margin-bottom: 20px; animation: float 2s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <!-- 啟動畫面 -->
    <div id="start-screen">
        <div class="anna-avatar">👩‍🏫</div>
        <h1 style="color:#D35400; text-shadow: 2px 2px white; text-align:center;">中文課 Day 3: 食物與句子</h1>
        <p style="color:#935116; font-weight:bold; font-size: 18px;">Anna 老師中英文微課堂</p>
        <button class="btn-3d" style="font-size: 24px; padding: 15px 40px; margin-top: 20px;" onclick="startGame()">▶️ 點擊開始上課</button>
    </div>

    <!-- 頂部列 -->
    <header>
        <button class="btn-3d" style="background:#E67E22; border-bottom-color:#BA4A00;" onclick="goHome()">🏠 返回</button>
        <div class="progress-dots" id="dots"></div>
    </header>

    <!-- 主遊戲區 -->
    <div class="game-container">
        <div class="visual-area" id="visual-board">
            <button class="speaker-btn" onclick="playVoicePrompt()">🧚‍♀️🔊</button>
            <div id="visual-emoji"></div>
            <div id="visual-text" class="focus-text"></div>
            <div class="slots-container" id="slots-area" style="display:none; margin-top:20px;"></div>
        </div>
        <div class="interaction-area" id="interaction-board"></div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen">
        <div class="anna-avatar">🌟</div>
        <h1 style="color:#27AE60; text-shadow: 2px 2px white; text-align:center;">太棒了玲玲！</h1>
        <div style="background:white; padding:20px; border-radius:20px; text-align:center; box-shadow:0 10px 20px rgba(0,0,0,0.1); width:80%;">
            <h3 style="color:#E67E22; margin:0 0 10px 0;">👩‍👧 媽媽 1 分鐘激勵時間</h3>
            <p style="color:#475569; font-weight:bold; margin:0; line-height:1.5;">
                今晚食飯嘅時候，夾一條菜俾玲玲，引導佢親口講出：<br>
                <span style="color:#27AE60; font-size:24px;">「這是翠綠的蔬菜。」</span>
            </p>
        </div>
        <button class="btn-3d" style="margin-top:30px;" onclick="goHome()">🏠 銷案並返回</button>
    </div>

<script>
    const lessonData = [
        {
            type: "warmup",
            visual: "👂👀",
            text: "聽音選字溫習",
            voice: "玲玲，邊個係『翠綠的蔬菜』？",
            options: ["🥬 翠綠的蔬菜", "🍯 甜甜的蜜糖"],
            correct: 0
        },
        {
            type: "teach",
            visual: "🍰",
            text: "這是香香的蛋糕",
            voice: "跟我讀，這是，香香的蛋糕。",
            actionText: "Next ➡️"
        },
        {
            type: "build",
            visual: "🍰 句子積木",
            text: "",
            voice: "試下自己拼出：香香的蛋糕。",
            target: ["香香的", "蛋糕"],
            shuffled: ["蛋糕", "翠綠的", "香香的"]
        },
        {
            type: "teach",
            visual: "🥬",
            text: "這是翠綠的蔬菜",
            voice: "跟我讀，這是，翠綠的蔬菜。",
            actionText: "Next ➡️"
        },
        {
            type: "circle",
            visual: "兒歌尋寶",
            text: "米飯牛奶肉和蛋", // 要拆成單字
            voice: "喺呢句歌詞入面，撳一下搵出『肉』同埋『蛋』字！",
            targetChars: ["肉", "蛋"]
        }
    ];

    let currentStage = 0;
    let selectedWords = [];
    let foundChars = 0;

    const dotsContainer = document.getElementById('dots');
    lessonData.forEach(() => {
        let dot = document.createElement('div');
        dot.className = 'dot';
        dotsContainer.appendChild(dot);
    });

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        let initUtter = new SpeechSynthesisUtterance("");
        initUtter.volume = 0; window.speechSynthesis.speak(initUtter);
        loadStage();
    }

    // 針對中文課，調用中/粵語活潑女聲
    function speakText(text) {
        window.speechSynthesis.cancel();
        let utter = new SpeechSynthesisUtterance(text);
        let voices = window.speechSynthesis.getVoices();
        
        // 優先尋找粵語 (zh-HK) 或 國語 (zh-TW/CN) 女聲
        let zhVoice = voices.find(v => v.lang.includes('zh-HK')) || 
                      voices.find(v => v.lang.includes('zh-TW')) || 
                      voices.find(v => v.lang.includes('zh'));
                      
        if(zhVoice) utter.voice = zhVoice;
        utter.pitch = 1.3; // 保持調皮可愛的聲線
        utter.rate = 0.85; 
        window.speechSynthesis.speak(utter);
    }

    function playVoicePrompt() {
        speakText(lessonData[currentStage].voice);
    }

    function loadStage() {
        if(currentStage >= lessonData.length) {
            document.getElementById('end-screen').style.display = 'flex';
            speakText("玲玲太叻啦！你已經完成今日嘅任務！");
            return;
        }

        const data = lessonData[currentStage];
        document.getElementById('visual-emoji').innerHTML = data.visual;
        document.getElementById('visual-text').innerHTML = data.text;
        
        const slotsArea = document.getElementById('slots-area');
        const interaction = document.getElementById('interaction-board');
        
        document.querySelectorAll('.dot').forEach((d, idx) => {
            if (idx === currentStage) d.classList.add('active');
            else d.classList.remove('active');
        });

        slotsArea.style.display = 'none';
        slotsArea.innerHTML = '';
        interaction.innerHTML = '';
        selectedWords = [];
        foundChars = 0;

        // 進場彈跳動畫重新觸發
        const visualBoard = document.getElementById('visual-board');
        visualBoard.style.animation = 'none';
        visualBoard.offsetHeight; /* trigger reflow */
        visualBoard.style.animation = 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

        if (data.type === "warmup") {
            data.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'word-block';
                btn.innerText = opt;
                btn.onclick = () => handleWarmup(idx, data.correct, btn);
                interaction.appendChild(btn);
            });

        } else if (data.type === "teach") {
            let btn = document.createElement('button');
            btn.className = 'btn-3d';
            btn.style.background = 'var(--btn-green)';
            btn.style.borderBottomColor = 'var(--btn-green-shadow)';
            btn.style.fontSize = '24px';
            btn.innerText = data.actionText;
            btn.onclick = () => { currentStage++; loadStage(); };
            interaction.appendChild(btn);

        } else if (data.type === "build") {
            slotsArea.style.display = 'flex';
            data.target.forEach(() => {
                let slot = document.createElement('div');
                slot.className = 'slot-box';
                slot.innerText = '？';
                slotsArea.appendChild(slot);
            });
            data.shuffled.forEach((word) => {
                let block = document.createElement('div');
                block.className = 'word-block';
                block.innerText = word;
                block.onclick = () => handleBlockClick(word, block, data);
                interaction.appendChild(block);
            });

        } else if (data.type === "circle") {
            // 將句子拆成單獨的可點擊字元
            const textContainer = document.getElementById('visual-text');
            textContainer.innerHTML = '';
            let chars = data.text.split('');
            chars.forEach(char => {
                let span = document.createElement('span');
                span.className = 'char-hunt';
                span.innerText = char;
                span.onclick = () => handleCharClick(char, span, data.targetChars);
                textContainer.appendChild(span);
            });
        }

        setTimeout(playVoicePrompt, 300);
    }

    function handleWarmup(selected, correct, btn) {
        if(selected === correct) {
            btn.style.background = 'var(--btn-green)';
            btn.style.color = 'white';
            speakText("啱喇！真叻！");
            setTimeout(() => { currentStage++; loadStage(); }, 1200);
        } else {
            btn.classList.add('wrong-shake');
            speakText("再試下聽清楚？");
            setTimeout(() => btn.classList.remove('wrong-shake'), 600);
        }
    }

    function handleBlockClick(word, blockElement, data) {
        if(blockElement.classList.contains('used')) return;
        selectedWords.push(word);
        blockElement.classList.add('used');
        
        const slots = document.getElementById('slots-area').children;
        slots[selectedWords.length - 1].innerText = word;
        slots[selectedWords.length - 1].classList.add('filled');

        if(selectedWords.length === data.target.length) {
            if(selectedWords.join("") === data.target.join("")) {
                speakText("拼得啱呀！香香的蛋糕！");
                document.getElementById('slots-area').classList.add('correct');
                setTimeout(() => { currentStage++; loadStage(); }, 1500);
            } else {
                speakText("哎呀，順序好似唔啱，再試一次！");
                document.getElementById('visual-board').classList.add('wrong-shake');
                setTimeout(() => {
                    document.getElementById('visual-board').classList.remove('wrong-shake');
                    loadStage(); 
                }, 1200);
            }
        }
    }

    function handleCharClick(char, spanElement, targetChars) {
        if(spanElement.classList.contains('found')) return;

        if(targetChars.includes(char)) {
            spanElement.classList.add('found');
            speakText("搵到喇！呢個係" + char + "字！");
            foundChars++;
            
            if(foundChars === targetChars.length) {
                setTimeout(() => {
                    speakText("全部搵齊晒，太棒啦！");
                    setTimeout(() => { currentStage++; loadStage(); }, 1500);
                }, 1000);
            }
        } else {
            spanElement.classList.add('wrong-shake');
            setTimeout(() => spanElement.classList.remove('wrong-shake'), 500);
        }
    }

    function goHome() {
        window.speechSynthesis.pause();
        window.speechSynthesis.cancel();
        setTimeout(() => { window.location.href = 'index.html'; }, 300);
    }
    window.addEventListener('beforeunload', goHome);
</script>
</body>
</html>
