<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🍐 Unit 9 Day 3｜Phonics p 沉浸專場</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <script src="voice-engine.js?v=1"></script>
  <script src="report-hub.js?v=3"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: "PingFang HK", "Noto Sans TC", "Rounded Mplus 1c", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(160deg, #dbeafe 0%, #e0f2fe 50%, #ecfdf5 100%);
      color: #1e293b;
    }

    body {
      display: block !important;
    }

    .app-shell {
      height: 100dvh;
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 深藍頂部導航列（防手機/iPad 切字 ＋ 圓點隨按即跳） */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 8px 12px;
      box-shadow: 0 4px 0 #172554, 0 8px 18px rgba(30, 58, 138, 0.22);
      flex-shrink: 0;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.35);
      font-weight: 900;
      font-size: clamp(13px, 2vw, 15px);
      padding: 6px 12px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-back:active { transform: translateY(2px); }

    .lesson-title {
      font-weight: 900;
      font-size: clamp(14px, 2.2vw, 19px);
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .step-dot {
      width: clamp(28px, 4vw, 35px);
      height: clamp(28px, 4vw, 35px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(13px, 1.9vw, 16px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .step-dot:active { transform: scale(0.92); }
    .step-dot.active {
      background: #facc15;
      border-color: #fef08a;
      color: #713f12;
      box-shadow: 0 3px 0 #ca8a04;
      transform: scale(1.1);
    }
    .step-dot.done {
      background: #22c55e;
      border-color: #bbf7d0;
      color: #ffffff;
      box-shadow: 0 3px 0 #15803d;
    }

    /* Anna 老師黃色常駐橫幅 */
    .teacher-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%);
      border: 3px solid #f59e0b;
      border-radius: 18px;
      padding: 8px 14px;
      box-shadow: 0 4px 0 #d97706;
      flex-shrink: 0;
      cursor: pointer;
    }

    .teacher-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .anna-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .teacher-msg {
      font-size: clamp(14px, 2.2vw, 19px);
      font-weight: 900;
      color: #78350f;
      line-height: 1.3;
    }

    .btn-replay {
      border: none;
      background: #f59e0b;
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(13px, 2vw, 16px);
      padding: 9px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 0 #b45309;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-replay:active { transform: translateY(3px); box-shadow: 0 1px 0 #b45309; }
    .btn-replay.hidden { display: none; }

    /* 主互動舞台（iPad 單屏不捲動） */
    .stage-card {
      flex: 1;
      min-height: 0;
      background: #ffffff;
      border-radius: 24px;
      padding: 12px 16px;
      box-shadow: 0 6px 0 #bfdbfe, 0 12px 26px rgba(37, 99, 235, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .stage-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #166534;
      border: 2px solid #86efac;
      font-weight: 900;
      font-size: clamp(13px, 2vw, 17px);
      padding: 5px 15px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* 第一幕：沉浸認知大圖卡（呼吸光暈、無中文按鈕） */
    .phonics-grid {
      width: 100%;
      max-width: 780px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(10px, 2vw, 18px);
      margin: auto 0;
    }

    .immersion-card {
      border: 4px solid #86efac;
      background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
      border-radius: 22px;
      padding: clamp(12px, 2.2vh, 22px) 12px;
      box-shadow: 0 6px 0 #4ade80;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      animation: breatheGlow 2.6s ease-in-out infinite;
      transition: transform 0.14s ease, border-color 0.15s ease;
    }
    .immersion-card:active { transform: translateY(4px) scale(0.97); }
    .immersion-card.tapped {
      border-color: #16a34a;
      background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
      box-shadow: 0 6px 0 #16a34a;
    }
    .immersion-card.playing {
      transform: scale(1.04);
      border-color: #f59e0b;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.28), 0 6px 0 #d97706;
    }

    .p-hero-letter {
      width: clamp(56px, 9.5vh, 84px);
      height: clamp(56px, 9.5vh, 84px);
      border-radius: 50%;
      background: linear-gradient(135deg, #84cc16 0%, #22c55e 100%);
      color: #ffffff;
      font-size: clamp(38px, 6.5vh, 58px);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #15803d;
      line-height: 1;
    }

    .card-emoji {
      font-size: clamp(46px, 8vh, 72px);
      line-height: 1;
    }

    .card-en-word {
      font-size: clamp(24px, 3.8vw, 36px);
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: 1px;
    }
    .card-en-word .first-p {
      color: #16a34a;
      font-size: 1.12em;
    }

    /* 第二幕：3 拍節奏鼓 */
    .rhythm-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rhythm-tab {
      border: 3px solid #93c5fd;
      background: #eff6ff;
      color: #1e40af;
      font-weight: 900;
      font-size: clamp(15px, 2.2vw, 19px);
      padding: 8px 16px;
      border-radius: 14px;
      box-shadow: 0 4px 0 #60a5fa;
      cursor: pointer;
    }
    .rhythm-tab.active {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 4px 0 #1e3a8a;
    }

    .drum-row {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2.2vw, 20px);
      margin: auto 0;
    }

    .drum-pad {
      aspect-ratio: 1 / 0.95;
      max-height: 210px;
      border-radius: 26px;
      border: 4px solid #fbbf24;
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
      box-shadow: 0 8px 0 #d97706;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .drum-pad.word-drum {
      border-color: #4ade80;
      background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
      box-shadow: 0 8px 0 #16a34a;
    }
    .drum-pad.beat-lit {
      transform: translateY(-6px) scale(1.07);
      background: linear-gradient(180deg, #fde047 0%, #facc15 100%);
      border-color: #ea580c;
      box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.35), 0 8px 0 #c2410c;
    }

    .drum-big {
      font-size: clamp(40px, 7.5vh, 66px);
      font-weight: 900;
      color: #b45309;
      line-height: 1;
    }
    .drum-sub {
      font-size: clamp(18px, 2.8vw, 26px);
      font-weight: 900;
      color: #166534;
    }

    /* 第三幕：開口跟讀（兩粒純事實打卡掣） */
    .speak-stage-card {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, #f8fafc 0%, #f0f9ff 100%);
      border: 4px solid #7dd3fc;
      border-radius: 26px;
      padding: clamp(14px, 2.6vh, 24px) 18px;
      box-shadow: 0 6px 0 #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: auto 0;
    }

    .speak-demo-btn {
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(16px, 2.4vw, 21px);
      padding: 10px 24px;
      border-radius: 999px;
      box-shadow: 0 4px 0 #0369a1;
      cursor: pointer;
    }
    .speak-demo-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0369a1; }

    .fact-btns-row {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .btn-fact-self {
      border: 3px solid #16a34a;
      background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(18px, 2.8vw, 24px);
      padding: 15px 12px;
      border-radius: 18px;
      box-shadow: 0 6px 0 #15803d;
      cursor: pointer;
    }
    .btn-fact-self:active { transform: translateY(4px); box-shadow: 0 2px 0 #15803d; }

    .btn-fact-follow {
      border: 3px solid #0284c7;
      background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(18px, 2.8vw, 24px);
      padding: 15px 12px;
      border-radius: 18px;
      box-shadow: 0 6px 0 #0369a1;
      cursor: pointer;
    }
    .btn-fact-follow:active { transform: translateY(4px); box-shadow: 0 2px 0 #0369a1; }

    /* 第四幕：聽音餵怪獸（零劇透純圖卡） */
    .monster-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .monster-avatar {
      font-size: clamp(64px, 12vh, 96px);
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .monster-avatar.chomp {
      animation: monsterChomp 0.45s ease;
    }

    .monster-speech {
      min-height: 30px;
      font-size: clamp(16px, 2.4vw, 22px);
      font-weight: 900;
      color: #166534;
      text-align: center;
    }

    .monster-choices {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2.2vw, 20px);
      margin: auto 0;
    }

    .food-card {
      border: 4px solid #93c5fd;
      background: linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
      border-radius: 22px;
      padding: clamp(16px, 3vh, 28px) 10px;
      box-shadow: 0 6px 0 #60a5fa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }
    .food-card:active { transform: translateY(4px); }
    .food-card .food-emoji {
      font-size: clamp(54px, 9.5vh, 84px);
      line-height: 1;
    }
    .food-card .reveal-word {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 900;
      color: #15803d;
      min-height: 30px;
    }
    .food-card.fly-eat {
      transform: translateY(-70px) scale(0.45);
      opacity: 0;
      border-color: #22c55e;
      background: #dcfce7;
    }
    .food-card.wrong-wiggle {
      border-color: #f59e0b;
      background: #fffbeb;
      animation: shake 0.36s ease;
    }

    /* 底部按鈕區 */
    .footer-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn-primary {
      border: none;
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(16px, 2.4vw, 21px);
      padding: 12px 26px;
      border-radius: 16px;
      box-shadow: 0 5px 0 #15803d;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d; }

    .btn-secondary {
      border: 2px solid #60a5fa;
      background: #eff6ff;
      color: #1e40af;
      font-weight: 900;
      font-size: clamp(14px, 2vw, 18px);
      padding: 10px 18px;
      border-radius: 14px;
      box-shadow: 0 4px 0 #60a5fa;
      cursor: pointer;
    }
    .btn-secondary:active { transform: translateY(2px); }

    /* 結算畫面 */
    .summary-box {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: auto 0;
    }

    .summary-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-pill {
      background: #f0f9ff;
      border: 2px solid #7dd3fc;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      font-weight: 900;
      font-size: clamp(14px, 2vw, 17px);
      color: #0369a1;
    }

    .sync-badge {
      background: #dcfce7;
      border: 2px solid #86efac;
      color: #166534;
      font-weight: 900;
      font-size: clamp(13px, 1.9vw, 16px);
      padding: 6px 14px;
      border-radius: 999px;
    }

    /* iPad Safari 首次點擊解鎖頁 */
    .start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(224, 242, 254, 0.96);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .start-overlay.hidden { display: none; }

    .start-card {
      background: #ffffff;
      border: 4px solid #4ade80;
      border-radius: 28px;
      padding: 28px 30px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 0 #16a34a, 0 18px 36px rgba(22, 163, 74, 0.16);
    }
    .start-card h1 {
      margin: 10px 0 6px;
      font-size: clamp(24px, 4vw, 32px);
      color: #1e3a8a;
    }
    .start-card p {
      margin: 0 0 20px;
      font-size: clamp(15px, 2.2vw, 19px);
      font-weight: 700;
      color: #475569;
      line-height: 1.5;
    }

    /* 煙花特效層 */
    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 900;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      font-size: 28px;
      animation: burstPop 0.95s ease-out forwards;
    }

    @keyframes breatheGlow {
      0%, 100% { box-shadow: 0 6px 0 #4ade80, 0 0 0 0 rgba(74, 222, 128, 0.25); }
      50% { box-shadow: 0 6px 0 #4ade80, 0 0 0 8px rgba(74, 222, 128, 0.12); }
    }

    @keyframes monsterChomp {
      0% { transform: scale(1); }
      35% { transform: scale(1.24) rotate(-6deg); }
      65% { transform: scale(0.92) rotate(6deg); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @keyframes burstPop {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(180deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="confettiLayer" class="confetti-layer"></div>

  <!-- iPad Safari 單一播放器同步解鎖遮罩 -->
  <div id="startOverlay" class="start-overlay">
    <div class="start-card">
      <div style="font-size: 64px; line-height: 1;">🍐🎃🥔</div>
      <h1>Unit 9 Day 3<br>Phonics p 沉浸專場</h1>
      <p>今日一齊玩 <strong>p</strong> 爆破音！聽純正英文、打 3 拍節奏鼓、大聲讀出嚟，仲有餵肚餓小怪獸呀！</p>
      <button class="btn-primary" style="width:100%; font-size:22px; padding:16px;" onclick="startLesson()">
        🔊 開始上堂！
      </button>
    </div>
  </div>

  <div class="app-shell">
    <!-- 深藍導航列與隨按跳關圓點 -->
    <header class="top-bar">
      <a href="en-unit9.html?v=1" class="btn-back" onclick="stopAll()">🏠 返回</a>
      <div class="lesson-title">🍐 Unit 9 Day 3 · Phonics p</div>
      <nav class="step-dots" aria-label="關卡進度">
        <button class="step-dot active" id="dot-1" onclick="jumpToStage(1)" title="第 1 幕：沉浸認知">1</button>
        <button class="step-dot" id="dot-2" onclick="jumpToStage(2)" title="第 2 幕：節奏律動">2</button>
        <button class="step-dot" id="dot-3" onclick="jumpToStage(3)" title="第 3 幕：開口打卡">3</button>
        <button class="step-dot" id="dot-4" onclick="jumpToStage(4)" title="第 4 幕：聽音餵怪獸">4</button>
      </nav>
    </header>

    <!-- Anna 老師黃色常駐橫幅 -->
    <section class="teacher-bar" onclick="replayBannerGuide()">
      <div class="teacher-left">
        <div class="anna-avatar">👩‍🏫</div>
        <div class="teacher-msg" id="teacherMsg">點擊發光大圖卡，聽下字母 p 同三個生字點讀呀！</div>
      </div>
      <button class="btn-replay" id="replayBtn" onclick="event.stopPropagation(); replayActionAudio();">🔊 再聽多次</button>
    </section>

    <!-- 主互動舞台 -->
    <main class="stage-card" id="stageCard"></main>
  </div>

  <script>
    // ====== 1. 課堂數據（課本 P.44 Phonics p 真字庫） ======
    const P_WORDS = [
      { key: "pear", word: "pear", emoji: "🍐", mp3: "en-pear.mp3" },
      { key: "pumpkin", word: "pumpkin", emoji: "🎃", mp3: "en-pumpkin.mp3" },
      { key: "potato", word: "potato", emoji: "🥔", mp3: "en-potato.mp3" }
    ];

    const IMMERSION_CARDS = [
      { id: "p", isLetter: true, label: "p", mp3: "en-p-sound.mp3" },
      { id: "pear", isLetter: false, label: "pear", emoji: "🍐", mp3: "en-pear.mp3" },
      { id: "pumpkin", isLetter: false, label: "pumpkin", emoji: "🎃", mp3: "en-pumpkin.mp3" },
      { id: "potato", isLetter: false, label: "potato", emoji: "🥔", mp3: "en-potato.mp3" }
    ];

    // 第 4 幕：聽音餵怪獸（6 題純圖卡零劇透）
    const MONSTER_QUESTIONS = [
      {
        id: "m1",
        dim: "PHO",
        skill_id: "EN-PHO-1",
        level: "L1",
        mode: "sound",
        mp3: "en-p-sound.mp3",
        target: "pear",

    // ====== 2. 狀態與防漏計時管理 ======
    let currentStage = 1;

    let activeTimers = [];

    function clearTimers() {
      activeTimers.forEach(t => clearTimeout(t));
      activeTimers = [];
    }

    function scheduleTimer(fn, ms) {
      const id = setTimeout(fn, ms);
      activeTimers.push(id);
      return id;
    }

    function stopAll() {
      clearTimers();
      if (window.LinglingVoice && typeof window.LinglingVoice.stop === "function") {
        window.LinglingVoice.stop();
      }
    }

    function playZhSafe(text, onEnd) {
      if (window.LinglingVoice && typeof window.LinglingVoice.playZh === "function") {
        window.LinglingVoice.playZh(text, onEnd);
      } else if (onEnd) {
        onEnd();
      }
    }

    function playMp3Safe(file, onEnd) {
      if (window.LinglingVoice && typeof window.LinglingVoice.playMp3 === "function") {
        window.LinglingVoice.playMp3(file, onEnd);
      } else if (onEnd) {
        onEnd();
      }
    }

    function playHybridSafe(zhText, mp3File, onEnd) {
      if (window.LinglingVoice && typeof window.LinglingVoice.playHybrid === "function") {
        window.LinglingVoice.playHybrid(zhText, mp3File, onEnd);
      } else if (onEnd) {
        onEnd();
      }
    }

    function playQueueSafe(queue, onEnd) {
      if (window.LinglingVoice && typeof window.LinglingVoice.playQueue === "function") {
        window.LinglingVoice.playQueue(queue, onEnd);
      } else if (onEnd) {
        onEnd();
      }
    }

    function burstFireworks() {
      const layer = document.getElementById("confettiLayer");
      if (!layer) return;
      const icons = ["✨", "🎉", "⭐", "🌟", "🎊", "💚"];
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.45;
      for (let i = 0; i < 16; i++) {
        const el = document.createElement("div");
        el.className = "confetti-piece";
        el.textContent = icons[i % icons.length];
        el.style.left = cx + "px";
        el.style.top = cy + "px";
        const angle = (Math.PI * 2 * i) / 16 + (Math.random() * 0.3 - 0.15);
        const dist = 90 + Math.random() * 140;
        el.style.setProperty("--dx", Math.round(Math.cos(angle) * dist) + "px");
        el.style.setProperty("--dy", Math.round(Math.sin(angle) * dist) + "px");
        layer.appendChild(el);
        scheduleTimer(() => el.remove(), 980);
      }
    }

    function updateStepDots() {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById("dot-" + i);
        if (!dot) continue;
        dot.classList.remove("active", "done");
        if (i === currentStage) {
          dot.classList.add("active");
        } else if (stageDone[i]) {
          dot.classList.add("done");
        }
      }
    }

      else if (stageNum === 3) {
        speakWordIdx = 0;

      } else if (stageNum === 4) {
        monsterIdx = 0;
        renderStage4();

    // ====== 4. 第二幕：3 拍節奏鼓（ppp - ppp - word） ======

        playZhSafe(currentBannerZh, () => {

    function selectRhythmWord(idx) {
      stopAll();
      rhythmWordIdx = idx;
      renderStage2();
    }

    function lightDrum(idx) {
      for (let i = 0; i < 3; i++) {
        const d = document.getElementById("drum-" + i);
        if (d) d.classList.toggle("beat-lit", i === idx);
      }
    }

    function hitSingleDrum(idx, mp3) {
      stopAll();
      lightDrum(idx);
      playMp3Safe(mp3, () => lightDrum(-1));
    }

    function playFullRhythmBeat() {
      stopAll();
      const cur = P_WORDS[rhythmWordIdx];
      rhythmPlayed.add(cur.key);

      lightDrum(0);
      playMp3Safe("en-p-sound.mp3", () => {
        if (currentStage !== 2) return;
        scheduleTimer(() => {
          lightDrum(1);
          playMp3Safe("en-p-sound.mp3", () => {
            if (currentStage !== 2) return;
            scheduleTimer(() => {
              lightDrum(2);
              playMp3Safe(cur.mp3, () => {
                scheduleTimer(() => lightDrum(-1), 260);
              });
            }, 180);
          });
        }, 180);
      });
    }

    function nextRhythmOrStage() {
      if (rhythmWordIdx < P_WORDS.length - 1) {
        rhythmWordIdx++;
        renderStage2();
      } else {
        stageDone[2] = true;
        updateStepDots();
        jumpToStage(3);
      }

    // ====== 5. 第三幕：開口打卡（兩粒純事實按鈕，兩粒同樣即刻放煙花） ======

    function recordSpeaking(isSelf) {
      if (speakLocked) return;
      speakLocked = true;
      stopAll();

      const cur = P_WORDS[speakWordIdx];
      const elapsed = Math.max(1, Math.round((Date.now() - speakItemStartMs) / 1000));
      speakingRecords[cur.key] = { self: isSelf, sec: elapsed };

      // 兩粒按鈕同樣即刻放煙花與正面讚美

      const praise = isSelf

    function feedMonster(choiceIdx) {
      if (monsterLocked) return;
      const q = MONSTER_QUESTIONS[monsterIdx];
      const chosen = q.choices[choiceIdx];
      const card = document.getElementById("mcard-" + choiceIdx);
      const wordEl = document.getElementById("mword-" + choiceIdx);
      const monsterEl = document.getElementById("monsterAvatar");
      const speechEl = document.getElementById("monsterSpeech");

      if (!monsterRecords[q.id]) {
        monsterRecords[q.id] = {
          dim: q.dim,
          skill_id: q.skill_id,
          level: q.level,
          hadError: false,
          sec: 1,
          target: q.target
        };
      }

      if (chosen.key === q.target) {
        monsterLocked = true;
        stopAll();
        monsterRecords[q.id].sec = Math.max(1, Math.round((Date.now() - monsterItemStartMs) / 1000));

        if (wordEl) wordEl.textContent = q.target + "!";
        if (monsterEl) {
          monsterEl.classList.remove("chomp");
          void monsterEl.offsetWidth;
          monsterEl.classList.add("chomp");
        }
        if (speechEl) {
          speechEl.style.color = "#15803d";
          speechEl.textContent = `🎉 Yum! ${chosen.emoji} ${q.target}!`;
        }

        burstFireworks();
        scheduleTimer(() => {
          if (card) card.classList.add("fly-eat");
        }, 280);

        playQueueSafe([
          { type: "mp3", file: q.targetMp3 },
          { type: "zh", text: "好叻呀！小怪獸食得好開心呀！" }
        ]);

        scheduleTimer(() => {
          if (monsterIdx < MONSTER_QUESTIONS.length - 1) {
            monsterIdx++;
            renderStage4();
          } else {
            stageDone[4] = true;
            updateStepDots();
            renderSummary();
          }
        }, 2100);
      } else {
        monsterRecords[q.id].hadError = true;
        errorWordsSet.add(q.target);
        if (card) {
          card.classList.add("wrong-wiggle");
          scheduleTimer(() => card.classList.remove("wrong-wiggle"), 420);
        }
        if (speechEl) {
          speechEl.style.color = "#b45309";
          speechEl.textContent = "💭 試吓隔離嗰張圖卡啦！";
        }
        // 答錯僅溫和提示並重播原音，絕不劇透、絕不覆蓋 currentReplayMp3
        stopAll();
        playHybridSafe("試吓隔離嗰張圖卡啦！", q.mp3);
      }
    }

    // ====== 7. 結算畫面與香港 K2 英文儀表板自動同步 ======
    function buildSkillStats() {
      const grouped = {};

      function pushStat(dim, skill_id, level, isOk, sec) {
        if (!grouped[skill_id]) {
          grouped[skill_id] = { dim, skill_id, level, total: 0, correct: 0, secSum: 0 };
        }
        grouped[skill_id].total += 1;
        if (isOk) grouped[skill_id].correct += 1;
        grouped[skill_id].secSum += sec;
      }

      // 第 3 幕獨立開口 EN-SPK-1
      P_WORDS.forEach(w => {
        const rec = speakingRecords[w.key];
        if (rec) {
          pushStat("SPK", "EN-SPK-1", "L1", rec.self, rec.sec);
        }
      });

      // 第 4 幕聽音餵怪獸 EN-PHO-1 & EN-PHO-2
      MONSTER_QUESTIONS.forEach(q => {
        const rec = monsterRecords[q.id];
        if (rec) {
          pushStat(rec.dim, rec.skill_id, rec.level, !rec.hadError, rec.sec);
        }
      });

      return Object.values(grouped).map(item => ({
        dim: item.dim,
        skill_id: item.skill_id,
        level: item.level,
        total: item.total,
        correct: item.correct,
        avg_sec: Number((item.secSum / Math.max(1, item.total)).toFixed(1))
      }));
    }

    function renderSummary() {
      stopAll();
      currentStage = 5;
      updateStepDots();
      burstFireworks();

      const totalSec = Math.max(1, Math.round((Date.now() - lessonStartMs) / 1000));
      const selfSpeakCount = P_WORDS.filter(w => speakingRecords[w.key] && speakingRecords[w.key].self).length;
      const monsterFirstTry = MONSTER_QUESTIONS.filter(q => monsterRecords[q.id] && !monsterRecords[q.id].hadError).length;
      const errorWords = Array.from(errorWordsSet);
      const skillStats = buildSkillStats();

      finalReportText =
        `【英文AI課堂｜Unit 9 Day 3 完成戰報】Phonics 字母 p 沉浸專場（ppp - pear / pumpkin / potato ＋ 3拍節奏鼓 ＋ 聽音餵怪獸）全部完成！` +
        `開口打卡：自己讀到 ${selfSpeakCount}/${P_WORDS.length}｜` +
        `聽音餵怪獸 ${monsterFirstTry}/${MONSTER_QUESTIONS.length} 一次答對！` +
        `${errorWords.length > 0 ? "｜曾試錯詞彙：" + errorWords.join(", ") : ""}` +
        `｜總用時：${totalSec}秒。`;

      if (!reportSent && window.LinglingReport && typeof window.LinglingReport.save === "function") {
        reportSent = true;
        window.LinglingReport.save("英文AI課堂", "Unit 9 Day 3", finalReportText, {
          term: "K2-T1",
          skill_stats: skillStats,
          error_words: errorWords
        });
      }

      document.getElementById("teacherMsg").textContent = "🏆 恭喜玲玲完成 Unit 9 Day 3 Phonics p 沉浸專場！";
      document.getElementById("replayBtn").classList.add("hidden");

      const stage = document.getElementById("stageCard");
      stage.innerHTML = `
        <div class="summary-box">
          <div style="font-size: clamp(46px, 8vh, 66px); line-height: 1;">🏆🍐🎃🥔</div>
          <div class="sync-badge">☁️ 戰報已自動同步至家長戰報箱與成長儀表板</div>
          <div class="summary-grid">
            <div class="stat-pill">🔤 本堂 Phonics：p（pear / pumpkin / potato）</div>
            <div class="stat-pill">🎤 開口打卡：自己讀到 ${selfSpeakCount} / ${P_WORDS.length}</div>
            <div class="stat-pill">👾 聽音餵怪獸：${monsterFirstTry} / ${MONSTER_QUESTIONS.length} 一次答對</div>
            <div class="stat-pill">⏱️ 總學習用時：${totalSec} 秒</div>
          </div>
        </div>
        <div class="footer-actions">
          <button class="btn-secondary" id="copyBtn" onclick="copyReport()">📋 一鍵複製進度暗號</button>
          <a href="en-unit9.html?v=1" class="btn-primary" onclick="stopAll()">🏠 返回 Unit 9</a>
        </div>
      `;

      playZhSafe("嘩！玲玲今日好叻呀！Phonics 字母 p 專場全部完成喇！俾個大拇指自己！", () => {
        playMp3Safe("en-pear.mp3");
      });
    }

    function copyReport() {
      const btn = document.getElementById("copyBtn");
      const doneUI = () => {
        if (btn) {
          btn.textContent = "✅ 已複製進度暗號！";
          scheduleTimer(() => { btn.textContent = "📋 一鍵複製進度暗號"; }, 2200);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(finalReportText).then(doneUI).catch(fallback);
      } else {
        fallback();
      }

      function fallback() {
        const ta = document.createElement("textarea");
        ta.value = finalReportText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        doneUI();
      }
    }
  </script>
