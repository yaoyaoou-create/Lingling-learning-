<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit 9 Day 3 - An Ice Cream Birthday (上集) | 玲玲學習樂園</title>
  <link rel="stylesheet" href="theme.css" />
  <script src="report-hub.js?v=2"></script>
  <style>
    /* iPad 終極防護與單屏沉浸排版 */
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      display: block !important;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Rounded Mplus 1c", sans-serif;
      background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 55%, #7DD3FC 100%);
      color: #0F172A;
      overflow-x: hidden;
    }

    #fireworksCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* 頂部極簡 3D 導航列 */
    .top-nav {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.16);
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 3px solid #38BDF8;
    }

    .btn-home {
      border: none;
      background: #F59E0B;
      color: #FFF;
      font-weight: 900;
      font-size: 15px;
      padding: 8px 15px;
      border-radius: 18px;
      box-shadow: 0 4px 0 #B45309;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.12s;
    }
    .btn-home:active { transform: translateY(3px) scale(0.96); box-shadow: 0 1px 0 #B45309; }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .step-pill {
      border: 2px solid transparent;
      background: #E0F2FE;
      color: #0284C7;
      font-weight: 900;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .step-pill.active {
      background: #FACC15;
      color: #713F12;
      border-color: #FDE047;
      box-shadow: 0 3px 0 #CA8A04;
      transform: scale(1.04);
    }
    .step-pill.done {
      background: #34D399;
      color: #064E3B;
    }

    /* 🍦 雪糕筒進度條 */
    .cone-tracker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF1F2;
      border: 2.5px solid #FDA4AF;
      border-radius: 20px;
      padding: 5px 12px;
      box-shadow: 0 3px 0 #FB7185;
    }
    .scoop-slot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px dashed #FDA4AF;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .scoop-slot.filled {
      border-style: solid;
      transform: scale(1.12);
      animation: scoopDrop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .scoop-slot.s1.filled { background: #F9A8D4; border-color: #DB2777; }
    .scoop-slot.s2.filled { background: #FDE047; border-color: #CA8A04; }
    .scoop-slot.s3.filled { background: #93C5FD; border-color: #2563EB; }
    @keyframes scoopDrop {
      0% { transform: translateY(-22px) scale(0.5); opacity: 0; }
      100% { transform: translateY(0) scale(1.12); opacity: 1; }
    }
    .cone-label {
      font-size: 13px;
      font-weight: 900;
      color: #BE185D;
    }

    /* 主容器：專為 iPad 單屏不滾動優化 */
    .app-shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 10px 14px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* 緊湊型 Anna 老師引導橫幅 */
    .teacher-bar {
      width: 100%;
      max-width: 780px;
      background: #FFFBEB;
      border: 3px solid #F59E0B;
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 5px 0 #FCD34D;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .teacher-bar:active { transform: scale(0.98); }

    .teacher-face {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #FEF08A;
      border: 2.5px solid #F59E0B;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .teacher-text {
      flex: 1;
      font-size: 16px;
      font-weight: 800;
      color: #1E293B;
      line-height: 1.35;
    }
    .teacher-replay {
      background: #FEF3C7;
      color: #B45309;
      border: 2px solid #FCD34D;
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* 繪本主舞台 */
    .book-stage {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* 課本原圖定位容器（座標 100% 鎖定原圖比例，並自動裁走底部水印） */
    .page-wrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
      border-radius: 26px;
      box-shadow: 0 14px 34px rgba(2, 132, 199, 0.25), 0 0 0 5px #FFFFFF;
      background: #FFFFFF;
      overflow: hidden;
    }

    .img-stage {
      position: relative;
      display: inline-block;
      line-height: 0;
      /* 精準裁走最底 6.5% 拍攝水印，同時保持百分比座標對準原圖 */
      clip-path: inset(0 0 6.5% 0 round 22px);
      -webkit-clip-path: inset(0 0 6.5% 0 round 22px);
      margin-bottom: -6.5%;
    }

    .story-img {
      display: block;
      max-height: calc(100vh - 235px);
      max-width: min(92vw, 660px);
      width: auto;
      height: auto;
      border-radius: 22px;
      pointer-events: none;
    }

    /* 3D 浮動大喇叭（右上角） */
    .float-speaker {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 4px solid #FFFFFF;
      background: linear-gradient(180deg, #38BDF8 0%, #0284C7 100%);
      color: #FFFFFF;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #0369A1, 0 10px 20px rgba(2, 132, 199, 0.35);
      cursor: pointer;
      z-index: 30;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .float-speaker:active {
      transform: scale(0.9) translateY(4px);
      box-shadow: 0 2px 0 #0369A1;
    }
    .float-speaker.playing {
      background: linear-gradient(180deg, #F472B6 0%, #DB2777 100%);
      box-shadow: 0 6px 0 #9D174D, 0 0 0 8px rgba(244, 114, 182, 0.35);
      animation: speakerPulse 1.1s infinite ease-in-out;
    }
    @keyframes speakerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 課本原圖點讀熱區（柔和呼吸光點） */
    .hotspot {
      position: absolute;
      border-radius: 999px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hotspot:active { transform: scale(1.12); }

    /* 點讀模式下的可愛光圈提示 */
    .hotspot.explore-dot {
      border: 3px dashed rgba(255, 255, 255, 0.92);
      background: rgba(250, 204, 21, 0.18);
      box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.65);
      animation: softBreath 2.2s infinite;
    }
    .hotspot.explore-dot.visited {
      border-color: #4ADE80;
      background: rgba(74, 222, 128, 0.18);
      animation: none;
    }
    .hotspot-badge {
      background: rgba(255, 255, 255, 0.94);
      border: 2.5px solid #F59E0B;
      color: #B45309;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.2;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }
    .hotspot.visited .hotspot-badge {
      border-color: #10B981;
      color: #047857;
    }

    /* 實景尋寶模式：完全隱形無文字劇透熱區 */
    .hotspot.ispy-zone {
      border: 3px solid transparent;
      background: transparent;
      border-radius: 22px;
    }
    .hotspot.ispy-zone.found-ok {
      border-color: #22C55E;
      background: rgba(34, 197, 94, 0.25);
      box-shadow: 0 0 24px rgba(34, 197, 94, 0.8);
      animation: popFound 0.45s ease;
    }
    .hotspot.ispy-zone.wrong-tap {
      border-color: #F59E0B;
      background: rgba(251, 191, 36, 0.25);
      animation: gentleWiggle 0.35s ease;
    }

    @keyframes softBreath {
      0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.65); }
      50% { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0); }
    }
    @keyframes popFound {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes gentleWiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* 配音劇場：精準疊喺課本「I like eggs.」對話氣泡上嘅金光框 */
    .pat-bubble-glow {
      position: absolute;
      left: 7%;
      top: 24.5%;
      width: 42%;
      height: 14.5%;
      border-radius: 999px;
      border: 5px solid #FACC15;
      background: rgba(254, 240, 138, 0.22);
      box-shadow: 0 0 28px rgba(250, 204, 21, 0.95), inset 0 0 14px rgba(255, 255, 255, 0.65);
      z-index: 25;
      cursor: pointer;
      display: none;
      animation: goldPulse 1.1s infinite ease-in-out;
    }
    .pat-bubble-glow.active { display: block; }
    @keyframes goldPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(250, 204, 21, 0.85); }
      50% { transform: scale(1.06); box-shadow: 0 0 36px rgba(250, 204, 21, 1); }
    }

    /* 配音停頓時彈出嘅浮動演戲提示條（疊喺圖底邊內側，不撐開高度） */
    .theater-overlay-bar {
      position: absolute;
      left: 50%;
      bottom: 8.5%;
      transform: translateX(-50%);
      width: 92%;
      background: rgba(255, 255, 255, 0.96);
      border: 3.5px solid #EC4899;
      border-radius: 22px;
      padding: 10px 14px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(190, 24, 93, 0.35);
      z-index: 35;
      line-height: 1.3;
    }
    .theater-overlay-bar.active { display: flex; animation: slideUpPop 0.28s ease; }
    @keyframes slideUpPop {
      0% { transform: translate(-50%, 16px) scale(0.95); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }
    .theater-cue-text {
      font-size: 16px;
      font-weight: 900;
      color: #BE185D;
      text-align: center;
    }

    /* 底部 3D 控制列 */
    .bottom-dock {
      width: 100%;
      max-width: 780px;
      background: rgba(255, 255, 255, 0.94);
      border: 3px solid #FFFFFF;
      border-radius: 24px;
      padding: 10px 14px;
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.14);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .speed-group {
      display: inline-flex;
      background: #E0F2FE;
      padding: 4px;
      border-radius: 16px;
      gap: 4px;
    }
    .speed-btn {
      border: none;
      background: transparent;
      color: #0369A1;
      font-size: 14px;
      font-weight: 900;
      padding: 7px 11px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .speed-btn.active {
      background: #FFFFFF;
      color: #0284C7;
      box-shadow: 0 3px 0 #7DD3FC;
    }

    /* 家長微調停頓秒數小膠囊 */
    .tweak-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F1F5F9;
      border: 2px solid #CBD5E1;
      border-radius: 14px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
      color: #475569;
    }
    .tweak-btn {
      border: none;
      background: #FFFFFF;
      color: #0F172A;
      font-weight: 900;
      font-size: 13px;
      padding: 3px 7px;
      border-radius: 8px;
      box-shadow: 0 2px 0 #CBD5E1;
      cursor: pointer;
    }
    .tweak-btn:active { transform: translateY(2px); box-shadow: none; }

    /* 3D 積木按鈕 */
    .btn-3d {
      border: none;
      border-radius: 18px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-3d:active { transform: translateY(3px) scale(0.96); }
    .btn-green { background: #10B981; color: #FFF; box-shadow: 0 5px 0 #047857; }
    .btn-green:active { box-shadow: 0 2px 0 #047857; }
    .btn-pink { background: #EC4899; color: #FFF; box-shadow: 0 5px 0 #BE185D; }
    .btn-pink:active { box-shadow: 0 2px 0 #BE185D; }
    .btn-purple { background: #8B5CF6; color: #FFF; box-shadow: 0 5px 0 #6D28D9; }
    .btn-purple:active { box-shadow: 0 2px 0 #6D28D9; }
    .btn-amber { background: #F59E0B; color: #FFF; box-shadow: 0 5px 0 #B45309; }
    .btn-amber:active { box-shadow: 0 2px 0 #B45309; }
    .btn-blue { background: #0284C7; color: #FFF; box-shadow: 0 5px 0 #0369A1; }
    .btn-blue:active { box-shadow: 0 2px 0 #0369A1; }

    /* 結算大派對卡片 */
    .party-card {
      width: 100%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid #FFFFFF;
      border-radius: 34px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(2, 132, 199, 0.2);
    }
    .big-cone-svg {
      width: 140px;
      height: 165px;
      margin: 0 auto 8px;
    }
    .sync-badge {
      display: inline-block;
      background: #ECFDF5;
      border: 2px solid #34D399;
      color: #065F46;
      font-size: 15px;
      font-weight: 900;
      padding: 7px 16px;
      border-radius: 999px;
      margin: 8px 0 12px;
    }
    .secret-box {
      background: #F1F5F9;
      border: 3px dashed #64748B;
      border-radius: 18px;
      padding: 14px;
      margin: 12px auto;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      text-align: left;
      line-height: 1.5;
      user-select: text;
      -webkit-user-select: text;
    }

    /* 飛星小動畫 */
    .star-burst {
      position: fixed;
      font-size: 34px;
      pointer-events: none;
      z-index: 9998;
      animation: starFly 0.75s ease-out forwards;
    }
    @keyframes starFly {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      60% { transform: translate(-50%, -95px) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -130px) scale(0.9); opacity: 0; }
    }

    @media (max-width: 640px) {
      .story-img { max-height: calc(100vh - 260px); }
      .step-pill { padding: 5px 8px; font-size: 12px; }
      .teacher-text { font-size: 14px; }
      .float-speaker { width: 52px; height: 52px; font-size: 24px; }
      .bottom-dock { justify-content: center; }
    }
  </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<!-- 頂部極簡導航列 ＋ 雪糕球進度條 -->
<nav class="top-nav">
  <button class="btn-home" onclick="safeGoHome()">🏠 返回</button>
  <div class="nav-center" id="stepNav">
    <button class="step-pill active" onclick="goStep(0)">1. 圖1點讀</button>
    <button class="step-pill" onclick="goStep(1)">2. 圖2點讀</button>
    <button class="step-pill" onclick="goStep(2)">3. 扮演Pat</button>
    <button class="step-pill" onclick="goStep(3)">4. 實景尋寶</button>
  </div>
  <div class="cone-tracker" title="儲齊 3 球雪糕解鎖派對">
    <div class="scoop-slot s1" id="scoop1"></div>
    <div class="scoop-slot s2" id="scoop2"></div>
    <div class="scoop-slot s3" id="scoop3"></div>
    <span class="cone-label" id="scoopCount">🍦 0/3</span>
  </div>
</nav>

<main class="app-shell">
  <!-- Anna 老師緊湊引導橫幅 -->
  <div class="teacher-bar" onclick="replayGuide()">
    <div class="teacher-face" aria-hidden="true">
      <svg viewBox="0 0 80 80" width="36" height="36">
        <circle cx="40" cy="40" r="36" fill="#FDE68A"/>
        <path d="M18 38 C18 18, 62 18, 62 38 L64 56 C64 60, 56 60, 56 54 L56 42 L24 42 L24 54 C24 60, 16 60, 16 56 Z" fill="#78350F"/>
        <circle cx="40" cy="42" r="18" fill="#FED7AA"/>
        <path d="M22 36 Q40 22 58 36" fill="#78350F"/>
        <circle cx="34" cy="41" r="2.5" fill="#1E293B"/>
        <circle cx="46" cy="41" r="2.5" fill="#1E293B"/>
        <path d="M35 48 Q40 53 45 48" stroke="#DC2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="teacher-text" id="teacherText">歡迎嚟到繪本《An Ice Cream Birthday》上集！儲齊 3 球雪糕就可以開派對喇！</div>
    <div class="teacher-replay">🔊 重聽</div>
  </div>

  <!-- 繪本互動主舞台 -->
  <section class="book-stage" id="bookStage"></section>
</main>

<script>
  // =========================================================================
  // 1. 狀態與雪糕球獎勵系統
  // =========================================================================
  let currentStep = 0; // 0: 圖1點讀, 1: 圖2點讀, 2: 全屏自動停頓配音, 3: 原圖實景尋寶, 4: 3球雪糕大派對
  let scoops = { s1: false, s2: false, s3: false };
  let exploredDots = {};
  let storyRate = 0.8;
  let reportSent = false;

  // 配音劇場自動停頓秒數（支援家長 ±0.5s 微調並自動記憶）
  let patPauseTime = parseFloat(localStorage.getItem('u9_d3_pause_t') || '3.2');
  let theaterState = 'idle'; // idle | playing_pre | paused_for_pat | playing_post | done
  let theaterWatchTimer = null;

  // 實景尋寶（I Spy）狀態 — 嚴格零劇透純聽力
  const ISPY_QUESTIONS = [
    { target: 'eggs', audio: 'en-eggs.mp3', guide: '留心聽英文，喺餐枱幅圖入面搵出嚟篤一篤佢！' },
    { target: 'bread', audio: 'en-bread.mp3', guide: '好叻呀！再聽清楚英文，喺幅圖入面搵出嚟篤一篤佢！' }
  ];
  let ispyIdx = 0;
  let ispySolved = false;
  let ispyWrong = null;

  // 圖片大小楷自動容錯（支援 image/ 與 Image/）
  function handleImgError(imgEl, filename) {
    const tries = parseInt(imgEl.dataset.try || '0', 10);
    if (tries === 0) {
      imgEl.dataset.try = '1';
      imgEl.src = 'Image/' + filename;
    } else if (tries === 1) {
      imgEl.dataset.try = '2';
      imgEl.src = 'images/' + filename;
    }
  }

  // iPad Safari 專屬雙重斷音返回鎖
  function safeGoHome() {
    stopAllAudio();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    setTimeout(() => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      window.location.href = 'en-unit9.html';
    }, 120);
  }

  // =========================================================================
  // 2. 中英雙軌 (Hybrid Voice) + Web Audio 放大 + 方案 B 繪本播放器
  // =========================================================================
  window.utterancePool = [];
  let audioQueueId = 0;
  let activeWordAudio = null;
  let storyAudio = null;
  let storyFileNow = null;
  let storyPlaying = false;
  let audioCtx = null;

  function ensureAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function clearTheaterWatcher() {
    if (theaterWatchTimer) {
      clearInterval(theaterWatchTimer);
      theaterWatchTimer = null;
    }
  }

  function stopStoryOnly() {
    clearTheaterWatcher();
    if (storyAudio) {
      try {
        storyAudio.onended = null;
        storyAudio.onerror = null;
        storyAudio.pause();
        storyAudio.currentTime = 0;
      } catch (e) {}
    }
    storyPlaying = false;
    updateSpeakerUI();
  }

  function stopAllAudio() {
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeWordAudio) {
      try {
        activeWordAudio.onended = null;
        activeWordAudio.onerror = null;
        activeWordAudio.pause();
        activeWordAudio.currentTime = 0;
      } catch (e) {}
      activeWordAudio = null;
    }
    stopStoryOnly();
  }

  function playMp3File(file, boost = 2.2, onDone) {
    ensureAudioCtx();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    activeWordAudio = audio;

    if (audioCtx) {
      try {
        const src = audioCtx.createMediaElementSource(audio);
        const gain = audioCtx.createGain();
        gain.gain.value = boost;
        src.connect(gain);
        gain.connect(audioCtx.destination);
      } catch (e) {
        audio.volume = 1.0;
      }
    } else {
      audio.volume = 1.0;
    }

    let doneCalled = false;
    const finish = () => {
      if (!doneCalled) {
        doneCalled = true;
        if (onDone) onDone();
      }
    };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
  }

  function playHybridQueue(steps) {
    stopAllAudio();
    if (!steps || !steps.length) return;
    const qid = audioQueueId;
    let i = 0;

    function next() {
      if (qid !== audioQueueId || i >= steps.length) return;
      const step = steps[i++];

      if (step.type === 'zh') {
        if (!('speechSynthesis' in window) || !step.text) { next(); return; }
        const u = new SpeechSynthesisUtterance(step.text);
        window.utterancePool.push(u);
        u.lang = 'zh-HK';
        u.pitch = 1.05;
        u.rate = 0.94;
        u.volume = 0.68;
        let adv = false;
        const done = () => {
          if (!adv && qid === audioQueueId) {
            adv = true;
            setTimeout(next, 140);
          }
        };
        u.onend = done;
        u.onerror = done;
        setTimeout(() => { if (qid === audioQueueId) window.speechSynthesis.speak(u); }, 40);
      } else if (step.type === 'mp3') {
        playMp3File(step.file, step.boost || 2.2, () => {
          if (qid === audioQueueId) setTimeout(next, 140);
        });
      }
    }
    next();
  }

  function createStoryElement(file) {
    ensureAudioCtx();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    audio.playbackRate = storyRate;
    if (audioCtx) {
      try {
        const src = audioCtx.createMediaElementSource(audio);
        const gain = audioCtx.createGain();
        gain.gain.value = 1.85;
        src.connect(gain);
        gain.connect(audioCtx.destination);
      } catch (e) {
        audio.volume = 1.0;
      }
    } else {
      audio.volume = 1.0;
    }
    return audio;
  }

  // 模式 1（圖 1 / 圖 2 點讀）：點擊浮動大喇叭播/停原聲故事
  function togglePageStory(file, onFinishCallback) {
    // 停止其他語音
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeWordAudio) {
      try { activeWordAudio.pause(); activeWordAudio.currentTime = 0; } catch (e) {}
      activeWordAudio = null;
    }

    if (storyAudio && storyFileNow === file) {
      if (storyPlaying) {
        storyAudio.pause();
        storyPlaying = false;
        updateSpeakerUI();
      } else {
        storyAudio.playbackRate = storyRate;
        storyPlaying = true;
        updateSpeakerUI();
        storyAudio.play().catch(() => { storyPlaying = false; updateSpeakerUI(); });
      }
      return;
    }

    stopStoryOnly();
    storyFileNow = file;
    storyAudio = createStoryElement(file);
    storyAudio.onended = () => {
      storyPlaying = false;
      storyAudio.currentTime = 0;
      updateSpeakerUI();
      if (onFinishCallback) onFinishCallback();
    };
    storyAudio.onerror = () => {
      storyPlaying = false;
      updateSpeakerUI();
    };
    storyPlaying = true;
    updateSpeakerUI();
    storyAudio.play().catch(() => { storyPlaying = false; updateSpeakerUI(); });
  }

  function setRate(r) {
    storyRate = r;
    if (storyAudio) storyAudio.playbackRate = r;
    document.querySelectorAll('.speed-btn').forEach(b => {
      b.classList.toggle('active', parseFloat(b.dataset.rate) === r);
    });
  }

  function updateSpeakerUI() {
    const sp = document.getElementById('floatSpeakerBtn');
    if (!sp) return;
    sp.classList.toggle('playing', storyPlaying);
    sp.textContent = storyPlaying ? '⏸️' : '🔊';
  }

  // 3. 模式 2：全屏自動停頓配音劇場邏輯（圖 2 扮演 Pat）

  function adjustPauseTime(delta) {
    patPauseTime = Math.max(0.5, Math.min(12, Math.round((patPauseTime + delta) * 10) / 10));
    localStorage.setItem('u9_d3_pause_t', String(patPauseTime));
    const el = document.getElementById('pauseTimeVal');
    if (el) el.textContent = patPauseTime.toFixed(1) + 's';
  }

  function startAutoPauseTheater() {
    stopAllAudio();
    theaterState = 'playing_pre';
    updateTheaterUI();

    storyFileNow = 'en-u9-story2.mp3';
    storyAudio = createStoryElement('en-u9-story2.mp3');
    storyAudio.currentTime = 0;
    storyPlaying = true;
    updateSpeakerUI();

    storyAudio.onended = () => {
      clearTheaterWatcher();
      storyPlaying = false;
      theaterState = 'done';
      updateSpeakerUI();
      updateTheaterUI();
      awardScoop('s2', '🎉 玲玲演 Pat 演得超棒！獲得第 2 球雪糕！');
    };

    storyAudio.play().catch(() => {
      storyPlaying = false;
      updateSpeakerUI();
    });

    // 精準監測停頓時間點，自動留白並點亮「I like eggs.」對話氣泡
    clearTheaterWatcher();
    theaterWatchTimer = setInterval(() => {
      if (theaterState === 'playing_pre' && storyAudio && storyAudio.currentTime >= patPauseTime) {
        triggerPatPause();
      }
    }, 80);
  }

  function triggerPatPause() {
    clearTheaterWatcher();
    if (storyAudio && !storyAudio.paused) {
      storyAudio.pause();
    }
    storyPlaying = false;
    theaterState = 'paused_for_pat';
    updateSpeakerUI();
    updateTheaterUI();
  }

    if (theaterState !== 'paused_for_pat') return;
    launchFireworks();
    theaterState = 'playing_post';
    updateTheaterUI();

    // 播完鼓勵煙花短暫停頓後，自動接續原聲故事
    setTimeout(() => {
      if (currentStep !== 2 || !storyAudio) return;
      storyAudio.playbackRate = storyRate;
      storyPlaying = true;
      updateSpeakerUI();
      storyAudio.play().catch(() => {
        storyPlaying = false;
        theaterState = 'done';
        updateTheaterUI();
        awardScoop('s2', '🎉 玲玲演得好叻女！獲得第 2 球雪糕！');

            <line x1="68" y1="148" x2="92" y2="148" stroke="#D97706" stroke-width="3"/>
            <circle cx="58" cy="94" r="28" fill="#F9A8D4" stroke="#DB2777" stroke-width="4"/>
            <circle cx="102" cy="94" r="28" fill="#FDE047" stroke="#CA8A04" stroke-width="4"/>
            <circle cx="80" cy="60" r="30" fill="#93C5FD" stroke="#2563EB" stroke-width="4"/>
            <circle cx="80" cy="24" r="10" fill="#EF4444" stroke="#B91C1C" stroke-width="3"/>
          </svg>
          <h1 style="margin:4px 0; color:#DB2777; font-size:28px;">🍦 儲齊 3 球雪糕！大成功！</h1>
          <div class="sync-badge">☁️ 戰報已自動同步至家長戰報箱</div>
          <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
            <button class="btn-3d btn-green" id="copyBtn" onclick="copySecret()">📋 一鍵複製暗號（備用）</button>
            <button class="btn-3d btn-amber" onclick="safeGoHome()">🏠 返回單元目錄</button>
          </div>
          <div class="secret-box" id="secretText">${secretCode}</div>
        </div>
      `;
    }
  }

  // =========================================================================
  // 6. 熱區與尋寶互動處理
  // =========================================================================
  function tapStory1Hotspot(evt, id, emoji, zhText) {
    exploredDots[id] = true;
    popStar(evt, emoji);
    playHybridQueue([{ type: 'zh', text: zhText }]);
    renderBookStage(false);
  }

  function tapStory2Food(evt, id, mp3File, emoji) {
    exploredDots[id] = true;
    popStar(evt, emoji);
    playHybridQueue([{ type: 'mp3', file: mp3File, boost: 2.2 }]);
    checkStep1Scoop();
    renderBookStage(false);
  }

  function tapStory2Ice(evt) {
    exploredDots.s2_ice = true;
    popStar(evt, '🍦');
    playHybridQueue([{ type: 'zh', text: 'Pat 心入面一直好想食粉紅雪糕呀！' }]);
    checkStep1Scoop();
    renderBookStage(false);
  }

  function checkStep1Scoop() {
    if (exploredDots.s2_eggs && exploredDots.s2_bread) {
      setTimeout(() => {
        awardScoop('s1', '搵晒餐枱上面嘅食物喇！獲得第 1 球士多啤梨雪糕！');
      }, 950);
    }
  }

  function pickIspy(evt, picked) {
    if (ispySolved) return;
    const q = ISPY_QUESTIONS[ispyIdx];
    if (picked === q.target) {
      ispySolved = true;
      ispyWrong = null;
      popStar(evt, '🌟');
      launchFireworks();
      renderBookStage(false);
      playHybridQueue([
        { type: 'mp3', file: q.audio, boost: 2.2 },
        { type: 'zh', text: '搵到喇！好叻女！' }
      ]);
    } else {
      ispyWrong = picked;
      renderBookStage(false);
      playHybridQueue([{ type: 'zh', text: '試吓篤隔離嗰樣食物啦！' }]);
    }
  }

  function nextIspy() {
    if (ispyIdx < ISPY_QUESTIONS.length - 1) {
      ispyIdx++;
      ispySolved = false;
      ispyWrong = null;
      renderBookStage(true);
    } else {
      awardScoop('s3', '');
      goStep(4);
    }
  }

  function copySecret() {
    const text = document.getElementById('secretText').innerText;
    const btn = document.getElementById('copyBtn');
    const done = () => {
      btn.textContent = '✅ 已複製暗號！';
      playHybridQueue([{ type: 'zh', text: '已複製暗號！' }]);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); cb();
  }

  // =========================================================================
  // 7. 煙花特效引擎
  // =========================================================================
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animOn = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7'];
    for (let b = 0; b < 3; b++) {
      const cx = canvas.width * (0.25 + Math.random() * 0.5);
      const cy = canvas.height * (0.18 + Math.random() * 0.32);
      for (let i = 0; i < 28; i++) {
        const a = (Math.PI * 2 * i) / 28;
        const s = 2.2 + Math.random() * 4.2;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 4 + Math.random() * 4
        });
      }
    }
    if (!animOn) {
      animOn = true;
      requestAnimationFrame(tickFireworks);
    }
  }

  function tickFireworks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.alpha -= 0.02;
      if (p.alpha <= 0) particles.splice(i, 1);
      else {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) requestAnimationFrame(tickFireworks);
    else animOn = false;
  }

  renderBookStage(false);
</script>
