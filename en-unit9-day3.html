<script>
  // =========================================================================
  // 1. 中英雙軌 (Hybrid Voice) 排隊防撞聲 + 方案 B 故事播放器引擎
  // =========================================================================
  window.utterancePool = [];
  let audioQueueId = 0;
  let activeAudioElement = null;
  let audioCtx = null;

  // 方案 B 繪本原聲專屬控制器
  let storyAudio = null;
  let storyFileCurrent = null;
  let storyIsPlaying = false;
  let storySpeed = 0.8; // 預設 0.8x 慢速，方便 4.5 歲聽清

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function stopStoryAudio() {
    if (storyAudio) {
      try {
        storyAudio.pause();
        storyAudio.currentTime = 0;
      } catch (e) {}
    }
    storyIsPlaying = false;
    updateStoryPlayButtonUI();
  }

  function stopAllAudio() {
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeAudioElement) {
      try {
        activeAudioElement.onended = null;
        activeAudioElement.onerror = null;
        activeAudioElement.pause();
        activeAudioElement.currentTime = 0;
      } catch (e) {}
      activeAudioElement = null;
    }
    stopStoryAudio();
  }

  function playSingleMp3(file, boostGain = 2.2, onDone) {
    ensureAudioContext();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    activeAudioElement = audio;

    if (audioCtx) {
      try {
        const source = audioCtx.createMediaElementSource(audio);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = boostGain;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      } catch (e) {
        audio.volume = 1.0;
      }
    } else {
      audio.volume = 1.0;
    }

    let finished = false;
    const finish = () => {
      if (!finished) {
        finished = true;
        if (onDone) onDone();
      }
    };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
  }

  function playHybridQueue(steps) {
    stopAllAudio();
    if (!steps || !steps.length) return;
    const myQueueId = audioQueueId;
    let idx = 0;

    function nextStep() {
      if (myQueueId !== audioQueueId || idx >= steps.length) return;
      const step = steps[idx++];

      if (step.type === 'zh') {
        if (!('speechSynthesis' in window) || !step.text) {
          nextStep();
          return;
        }
        const u = new SpeechSynthesisUtterance(step.text);
        window.utterancePool.push(u);
        u.lang = 'zh-HK';
        u.pitch = 1.05;
        u.rate = 0.92;
        u.volume = 0.68;
        let advanced = false;
        const done = () => {
          if (!advanced && myQueueId === audioQueueId) {
            advanced = true;
            setTimeout(() => nextStep(), 150);
          }
        };
        u.onend = done;
        u.onerror = done;
        setTimeout(() => {
          if (myQueueId === audioQueueId) window.speechSynthesis.speak(u);
        }, 50);
      } else if (step.type === 'mp3') {
        playSingleMp3(step.file, step.boost || 2.2, () => {
          if (myQueueId === audioQueueId) setTimeout(() => nextStep(), 150);
        });
      }
    }
    nextStep();
  }

  // 方案 B：支援暫停／繼續與 0.8x / 1.0x 變速嘅故事原聲播放器
  function toggleStoryPlay(file) {
    // 停止其他排隊語音（但不重置目前 storyAudio 進度）
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeAudioElement) {
      try { activeAudioElement.pause(); activeAudioElement.currentTime = 0; } catch (e) {}
      activeAudioElement = null;
    }

    ensureAudioContext();

    if (storyAudio && storyFileCurrent === file) {
      if (storyIsPlaying) {
        storyAudio.pause();
        storyIsPlaying = false;
        updateStoryPlayButtonUI();
      } else {
        storyAudio.playbackRate = storySpeed;
        storyIsPlaying = true;
        updateStoryPlayButtonUI();
        storyAudio.play().catch(() => {
          storyIsPlaying = false;
          updateStoryPlayButtonUI();
        });
      }
      return;
    }

    // 載入新故事音檔
    stopStoryAudio();
    storyFileCurrent = file;
    storyAudio = new Audio('audio/' + file);
    storyAudio.crossOrigin = 'anonymous';
    storyAudio.playbackRate = storySpeed;

    if (audioCtx) {
      try {
        const src = audioCtx.createMediaElementSource(storyAudio);
        const gain = audioCtx.createGain();
        gain.gain.value = 2.0;
        src.connect(gain);
        gain.connect(audioCtx.destination);
      } catch (e) {
        storyAudio.volume = 1.0;
      }
    } else {
      storyAudio.volume = 1.0;
    }

    storyAudio.onended = () => {
      storyIsPlaying = false;
      storyAudio.currentTime = 0;
      updateStoryPlayButtonUI();
    };
    storyAudio.onerror = () => {
      storyIsPlaying = false;
      updateStoryPlayButtonUI();
    };

    storyIsPlaying = true;
    updateStoryPlayButtonUI();
    storyAudio.play().catch(() => {
      storyIsPlaying = false;
      updateStoryPlayButtonUI();
    });
  }

  function replayStoryFromStart(file) {
    stopStoryAudio();
    storyFileCurrent = null;
    toggleStoryPlay(file);
  }

  function setStorySpeed(rate) {
    storySpeed = rate;
    if (storyAudio) storyAudio.playbackRate = rate;
    document.querySelectorAll('.speed-btn').forEach(btn => {

            <div class="quiz-card ${quizSolved && cid === q.correctId ? 'correct' : ''} ${!quizSolved && quizWrongPicked === cid ? 'wrong-try' : ''}" onclick="pickQuiz('${cid}')">
              <div style="width: 135px; height: 135px; margin: 0 auto;">${ILLUSTRATIONS[cid]}</div>
            </div>
          `).join('')}
        </div>

        ${quizSolved
          ? `<div class="gentle-hint-banner success">🎉 玲玲好叻呀！一聽就揀啱！</div>
             <div class="btn-row"><button class="btn-3d btn-green" onclick="stopAllAudio(); if(subIndex < ACT4_QUIZ.length - 1){ subIndex++; quizSolved=false; quizWrongPicked=null; renderStage(true); } else jumpToAct(4);">${subIndex < ACT4_QUIZ.length - 1 ? '下一題 ➡️' : '領取獎盃 🏆'}</button></div>`
          : (quizWrongPicked ? `<div class="gentle-hint-banner">💛 試吓隔離嗰張圖卡啦！</div>` : '')
        }
      `;
    }

    // --- Summary: 結算 ＋ 自動戰報同步 ＋ 備用暗號 ---
    else if (currentAct === 4) {
      setGuide("恭喜玲玲完成 Unit 9 Day 3 繪本故事上集！你演 Pat 演得超可愛！", shouldSpeak);
      if (shouldSpeak) {
        launchFireworks();
        setTimeout(launchFireworks, 800);
      }

      const secretCode = `【玲玲英文課堂進度暗號】單元：Unit 9 Day 3 (en-unit9-day3.html)｜學習內容：繪本故事《An Ice Cream Birthday》上集 圖 1–2 (方案 B 原聲慢速＋Pat 配音演繹 Yum! I like eggs, but... ＋ 零劇透盲聽)｜完成狀態：✅ 全課順利完成｜請 Anna 老師更新雲端英文總庫，並準備 Unit 9 Day 4 繪本故事下集！`;

      // 全自動雲端戰報同步
      if (window.LinglingReport && !reportSent) {
        reportSent = true;
        window.LinglingReport.save('英文AI課堂', 'Unit 9 Day 3', secretCode);
      }

      container.innerHTML = `
        <div style="font-size: 72px;">🏆</div>
        <h1 style="color: #0284C7; margin: 8px 0;">繪本故事上集大成功！</h1>
        <div class="sync-badge">☁️ 戰報已自動同步至家長戰報箱</div>
        <div class="btn-row" style="margin-top: 12px;">
          <button class="btn-3d btn-green" id="copySecretBtn" onclick="copyProgressSecret()">📋 一鍵複製進度暗號（備用）</button>
        </div>
        <div class="secret-code-box" id="secretCodeText">${secretCode}</div>
        <div class="btn-row">
          <a href="en-unit9.html" class="btn-3d btn-amber" style="text-decoration:none;">🏠 返回單元目錄</a>
        </div>
      `;
    }
  }

  // ==========================================
  // 5. 互動邏輯
  // ==========================================
  function playWarmupAudio(wordId) {
    const el = document.getElementById('meaningCard');
    if (el) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
    playHybridQueue([getWordAudioStep(wordId)]);
  }

  function pickQuiz(picked) {
    if (quizSolved) return;
    const q = ACT4_QUIZ[subIndex];
    if (picked === q.correctId) {
      quizSolved = true;
      quizWrongPicked = null;
      renderStage(false);
      launchFireworks();
      playHybridQueue([getWordAudioStep(q.audioId), { type: 'zh', text: '答啱喇！' }]);
    } else {
      quizWrongPicked = picked;
      renderStage(false);
      playHybridQueue([{ type: 'zh', text: '試吓隔離嗰張圖卡啦！' }]);
    }
  }

  function copyProgressSecret() {
    const text = document.getElementById('secretCodeText').innerText;
    const btn = document.getElementById('copySecretBtn');
    function onCopied() {
      btn.textContent = '✅ 已複製暗號！';
      playHybridQueue([{ type: 'zh', text: '已複製暗號！' }]);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    callback();
  }

  // ==========================================
  // 6. 煙花引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animRunning = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7'];
    for (let burst = 0; burst < 3; burst++) {
      const cx = canvas.width * (0.3 + Math.random() * 0.4);
      const cy = canvas.height * (0.2 + Math.random() * 0.3);
      for (let i = 0; i < 30; i++) {
        const a = (Math.PI * 2 * i) / 30;
        const s = 2 + Math.random() * 4;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 4 + Math.random() * 4
        });
      }
    }
    if (!animRunning) {
      animRunning = true;
      requestAnimationFrame(animateParticles);
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.alpha -= 0.02;
      if (p.alpha <= 0) particles.splice(i, 1);
      else {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) requestAnimationFrame(animateParticles);
    else animRunning = false;
  }

  renderStage(false);
</script>
