<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maths Day 12 — 城堡尋寶大冒險</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-top: #fef3c7;
      --bg-bottom: #e0e7ff;
      --card-bg: #ffffff;
      --primary: #6366f1;
      --primary-dark: #4338ca;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --success: #10b981;
      --success-dark: #059669;
      --soft-purple: #ede9fe;
      --text-main: #1e1b4b;
      --text-sub: #4c1d95;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .app-shell {
      max-width: 820px;
      margin: 0 auto;
      padding: 10px 14px 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 頂部導航列：防手機與 iPad 切字 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: var(--primary-dark);
      border: 3px solid #c7d2fe;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #a5b4fc;
      text-decoration: none;
      flex-shrink: 0;
    }
    .home-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #a5b4fc;
    }

    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #fde68a, #fbbf24);
      color: #78350f;
      border: 3px solid #f59e0b;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 4px 0 #d97706;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 可隨按即跳的 10 題圓點導航列 */
    .step-dots {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid #ddd6fe;
      border-radius: 20px;
      padding: 7px 10px;
    }

    .step-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #cbd5e1;
      background: #f8fafc;
      color: #64748b;
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      box-shadow: 0 3px 0 #cbd5e1;
      padding: 0;
    }
    .step-dot:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }
    .step-dot.done {
      background: #10b981;
      border-color: #059669;
      color: #ffffff;
      box-shadow: 0 3px 0 #047857;
    }
    .step-dot.done-hint {
      background: #f59e0b;
      border-color: #d97706;
      color: #ffffff;
      box-shadow: 0 3px 0 #b45309;
    }
    .step-dot.active {
      background: #7c3aed;
      border-color: #5b21b6;
      color: #ffffff;
      transform: scale(1.14);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.25), 0 3px 0 #4c1d95;
    }

    /* Anna 老師讀題列 */
    .teacher-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 3px solid #c4b5fd;
      border-radius: 24px;
      padding: 10px 14px;
      box-shadow: 0 5px 0 #c4b5fd;
    }

    .teacher-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .teacher-text {
      flex: 1;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      color: #1e1b4b;
    }

    .speak-btn {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: 3px solid #0369a1;
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #075985;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .speak-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #075985;
    }

    /* 主互動舞台（iPad 單屏不捲動） */
    .stage-card {
      flex: 1;
      background: #ffffff;
      border: 4px solid #a5b4fc;
      border-radius: 28px;
      padding: 14px 16px 16px;
      box-shadow: 0 7px 0 #818cf8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .stage-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .topic-badge {
      background: #ede9fe;
      color: #5b21b6;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 900;
    }

    .progress-label {
      font-size: 16px;
      font-weight: 900;
      color: #4338ca;
    }

    .visual-box {
      flex: 1;
      min-height: 205px;
      background: #f8fafc;
      border: 3px dashed #93c5fd;
      border-radius: 22px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
    }

    .gentle-hint-box {
      display: none;
      background: #fef3c7;
      border: 3px solid #f59e0b;
      color: #92400e;
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      animation: popIn 0.25s ease;
    }
    .gentle-hint-box.show {
      display: block;
    }

    /* 數序卡片 */
    .seq-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .num-tile {
      width: 72px;
      height: 86px;
      border-radius: 22px;
      background: #ffffff;
      border: 4px solid #38bdf8;
      box-shadow: 0 5px 0 #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #0f172a;
    }
    .num-tile.mystery {
      background: #fef3c7;
      border: 4px dashed #f59e0b;
      box-shadow: 0 5px 0 #d97706;
      color: #d97706;
    }
    .seq-arrow {
      font-size: 26px;
      font-weight: 900;
      color: #6366f1;
    }

    /* ABAB 規律分組框 */
    .pattern-groups {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pattern-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eef2ff;
      border: 3px solid #818cf8;
      border-radius: 20px;
      padding: 10px 12px;
    }
    .pattern-item {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #ffffff;
      border: 3px solid #c7d2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .pattern-item.mystery {
      background: #fef3c7;
      border: 3px dashed #f59e0b;
      color: #d97706;
      font-weight: 900;
    }

    /* 靜音實物點數區（嚴禁數字標籤、嚴禁語音報數） */
    .count-hint-sub {
      font-size: 15px;
      font-weight: 800;
      color: #64748b;
    }
    .groups-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .item-box {
      background: #ffffff;
      border: 3px solid #93c5fd;
      border-radius: 22px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 140px;
    }
    .item-box.empty-box {
      background: #fffbeb;
      border: 3px dashed #f59e0b;
    }
    .plus-sign {
      font-size: 34px;
      font-weight: 900;
      color: #4f46e5;
    }
    .countable-item {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #fefce8;
      border: 3px solid #fde047;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .countable-item.counted {
      background: #dcfce7;
      border-color: #22c55e;
      transform: scale(1.12);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.45);
    }
    .countable-item.counted::after {
      content: "✨";
      position: absolute;
      top: -10px;
      right: -8px;
      font-size: 18px;
      pointer-events: none;
    }
    .countable-item.taken {
      background: #f1f5f9;
      border: 3px dashed #94a3b8;
      opacity: 0.42;
      transform: scale(0.88) rotate(-8deg);
      pointer-events: none;
    }
    .slot-empty {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #fef3c7;
      border: 3px dashed #f59e0b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      color: #d97706;
    }

    /* 方位與序數展示 */
    .dir-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 16px;
      font-weight: 900;
    }
    .shelf-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .shelf-slot {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      background: #ffffff;
      border: 4px solid #a5b4fc;
      box-shadow: 0 5px 0 #818cf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
    }
    .shelf-slot.center-anchor {
      border-color: #f59e0b;
      background: #fffbeb;
      box-shadow: 0 5px 0 #d97706;
    }

    /* 選項按鈕區 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .options-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .opt-btn {
      min-height: 82px;
      border-radius: 22px;
      border: 4px solid #818cf8;
      background: linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
      color: #1e1b4b;
      font-size: 32px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #6366f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      transition: transform 0.12s ease;
    }
    .opt-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #6366f1;
    }
    .opt-btn.correct-flash {
      background: linear-gradient(180deg, #6ee7b7, #10b981);
      border-color: #047857;
      color: #ffffff;
      box-shadow: 0 6px 0 #047857;
      transform: scale(1.04);
    }
    .opt-btn.wrong-shake {
      animation: shake 0.36s ease;
      background: #fef3c7;
      border-color: #f59e0b;
      box-shadow: 0 6px 0 #d97706;
    }

    /* 結算畫面 */
    .victory-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 4px solid #fbbf24;
      border-radius: 28px;
      padding: 18px 16px;
      box-shadow: 0 8px 0 #d97706;
    }
    .victory-screen.show {
      display: flex;
    }
    .sync-banner {
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #166534;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }
    .report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .report-table th, .report-table td {
      border: 2px solid #e2e8f0;
      padding: 7px 8px;
      text-align: left;
    }
    .report-table th {
      background: #eef2ff;
      color: #3730a3;
      font-weight: 900;
    }
    .victory-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .action-btn {
      border: none;
      border-radius: 18px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .copy-btn {
      background: linear-gradient(180deg, #818cf8, #4f46e5);
      color: #ffffff;
      box-shadow: 0 5px 0 #3730a3;
    }
    .copy-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #3730a3;
    }
    .replay-btn {
      background: linear-gradient(180deg, #fde68a, #f59e0b);
      color: #78350f;
      box-shadow: 0 5px 0 #b45309;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 520px) {
      .teacher-text { font-size: 16px; }
      .opt-btn { min-height: 72px; font-size: 26px; }
      .num-tile { width: 56px; height: 70px; font-size: 28px; }
      .shelf-slot { width: 68px; height: 68px; font-size: 36px; }
      .step-dot { width: 30px; height: 30px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 頂部導航列 -->
    <div class="top-bar">
      <button type="button" class="home-btn" id="btnHome">⬅️ 返回主頁</button>
      <div class="day-pill">🏰 Maths Day 12</div>
      <div class="step-dots" id="stepDots" aria-label="題目快速導航"></div>
    </div>

    <!-- Anna 老師讀題列 -->
    <div class="teacher-bar" id="teacherBar">
      <div class="teacher-avatar">👩‍🏫</div>
      <div class="teacher-text" id="teacherPrompt">準備好入城堡尋寶未呀？</div>
      <button type="button" class="speak-btn" id="btnSpeak">🔊 聽題目</button>
    </div>

    <!-- 主互動區 -->
    <div class="stage-card" id="stageCard">
      <div class="stage-meta">
        <div class="topic-badge" id="topicBadge">🏰 城堡門牌</div>
        <div class="progress-label" id="progressLabel">第 1 / 10 題</div>
      </div>

      <div class="visual-box" id="visualBox"></div>
      <div class="gentle-hint-box" id="hintBox"></div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>

    <!-- 結算畫面 -->
    <div class="victory-screen" id="victoryScreen">
      <div style="font-size: 54px;">🏆🏰✨</div>
      <h2 style="margin: 0; font-size: 26px; color: #4338ca;">城堡尋寶大成功！</h2>
      <div class="sync-banner">☁️ 戰報已自動同步至家長戰報箱與成長儀表板</div>
      <table class="report-table">
        <thead>
          <tr>
            <th>題號與技能</th>
            <th>結果</th>
            <th>耗時</th>
          </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
      </table>
      <div class="victory-actions">
        <button type="button" class="action-btn copy-btn" id="btnCopyReport">📋 一鍵複製進度暗號俾 Anna 老師</button>
        <button type="button" class="action-btn replay-btn" id="btnReplay">🔄 再玩一次</button>
      </div>
    </div>

  <script src="report-hub.js?v=2"></script>
  <script>
    // ==========================================
    // iPad Safari 廣東話安全語音引擎 (Anti-GC)
    // ==========================================
    window.utterancePool = [];
    let speechTimer = null;

    function stopAllSpeech() {
      if (speechTimer) {
        clearTimeout(speechTimer);
        speechTimer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      window.utterancePool = [];
    }

    function speakCantonese(text) {
      stopAllSpeech();
      if (!('speechSynthesis' in window) || !text) return;
      speechTimer = setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-HK';
        u.rate = 0.72;
        u.pitch = 1.05;
        const voices = window.speechSynthesis.getVoices();
        const hkVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('zh-hk'))
          || voices.find(v => v.lang && v.lang.toLowerCase().includes('yue'));
        if (hkVoice) u.voice = hkVoice;
        window.utterancePool.push(u);
        u.onend = () => {
          window.utterancePool = window.utterancePool.filter(item => item !== u);
        };
        window.speechSynthesis.speak(u);
      }, 40);
    }

    // 輕快點擊音效（純音效，絕不報數）
    let audioCtx = null;
    function playTone(freq, duration = 0.09, type = 'sine') {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCorrectSound() {
      playTone(587, 0.09, 'triangle');
      setTimeout(() => playTone(880, 0.14, 'triangle'), 90);
    }

    function playTapSound() {
      playTone(660, 0.06, 'sine');
    }

    function playGentleSound() {
      playTone(300, 0.12, 'sine');
    }

    // ==========================================
    // 10 題數據驅動題庫（方案 B：六維全覆蓋＋動態加權）
    // ==========================================
    const quizData = [
      {
        id: 1,
        dim: 'NUM',
        skill_id: 'NUM-1',
        level: 'L1',
        reportLabel: '數字順序(13-15相鄰數)',
        badge: '🚪 城堡門牌 (12-15)',
        promptText: '幫城堡大門排好門牌！問號嗰格係邊個數字呀？',
        speechText: '幫城堡大門排好門牌！睇下十二、十三、問號、十五，問號嗰格係邊個數字呀？',
        hintText: '慢慢順住數一次：12、13、跟住係咩呀？',
        hintSpeech: '唔緊要呀，我哋慢慢順住數一次：十二、十三，跟住係邊個數字呀？',
        type: 'sequence',
        tiles: ['12', '13', '?', '15'],
        options: [
          { label: '11', value: '11' },
          { label: '14', value: '14' },
          { label: '16', value: '16' }
        ],
        answer: '14'
      },
      {
        id: 2,
        dim: 'APP',
        skill_id: 'APP-1',
        level: 'L1',
        reportLabel: '平面圖形辨識(三角形)',
        badge: '💎 魔法形狀寶石',
        promptText: '請幫小公主搵出「三角形」嘅魔法寶石！',

    // ==========================================
    // 狀態管理（支援隨時點擊頂部圓點跳題，防死鎖）
    // ==========================================
    let currentIdx = 0;
    let qStartTime = Date.now();
    let pendingNextTimer = null;
    let isLocked = false;
    let reportSaved = false;

    const results = quizData.map(() => ({
      answered: false,
      hadWrong: false,
      sec: 0
    }));

    const stepDotsEl = document.getElementById('stepDots');
    const teacherPromptEl = document.getElementById('teacherPrompt');

    const progressLabelEl = document.getElementById('progressLabel');

    const hintBoxEl = document.getElementById('hintBox');
    const optionsGridEl = document.getElementById('optionsGrid');
    const stageCardEl = document.getElementById('stageCard');
    const teacherBarEl = document.getElementById('teacherBar');
    const victoryScreenEl = document.getElementById('victoryScreen');

    function buildClockSVG(hour) {
      const hourAngle = (hour % 12) * 30;
      let nums = '';
      for (let h = 1; h <= 12; h++) {
        const rad = ((h * 30) - 90) * (Math.PI / 180);
        const x = 100 + 70 * Math.cos(rad);
        const y = 100 + 70 * Math.sin(rad) + 7;
        nums += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="18" font-weight="900" fill="#1e1b4b">${h}</text>`;
      }
      return `
        <svg width="176" height="176" viewBox="0 0 200 200" aria-label="時鐘">
          <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#f59e0b" stroke-width="10"/>
          <circle cx="100" cy="100" r="84" fill="#fffbeb" stroke="#fde68a" stroke-width="3"/>
          ${nums}
          <!-- 長藍針指住 12 -->
          <line x1="100" y1="100" x2="100" y2="34" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
          <!-- 短紅針指住整點 -->
          <line x1="100" y1="100" x2="100" y2="54" stroke="#e11d48" stroke-width="9" stroke-linecap="round" transform="rotate(${hourAngle} 100 100)"/>
          <circle cx="100" cy="100" r="8" fill="#1e1b4b"/>
        </svg>
      `;
    }

    function renderDots() {
      stepDotsEl.innerHTML = '';
      quizData.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'step-dot';
        btn.textContent = idx + 1;
        btn.setAttribute('aria-label', `跳到第 ${idx + 1} 題`);
        if (results[idx].answered) {
          btn.classList.add(results[idx].hadWrong ? 'done-hint' : 'done');
        }
        if (idx === currentIdx && !victoryScreenEl.classList.contains('show')) {
          btn.classList.add('active');
        }
        btn.addEventListener('click', () => jumpToQuestion(idx));
        stepDotsEl.appendChild(btn);
      });
    }

    function jumpToQuestion(idx) {
      if (pendingNextTimer) {
        clearTimeout(pendingNextTimer);
        pendingNextTimer = null;
      }
      stopAllSpeech();
      isLocked = false;
      victoryScreenEl.classList.remove('show');
      teacherBarEl.style.display = 'flex';
      stageCardEl.style.display = 'flex';
      currentIdx = idx;
      renderQuestion();
    }

    function attachSilentCountListeners(container) {
      container.querySelectorAll('.countable-item:not(.taken)').forEach(el => {
        el.addEventListener('click', () => {
          el.classList.toggle('counted');
          playTapSound();
        });
      });
    }

    function renderQuestion() {
      const q = quizData[currentIdx];
      isLocked = false;
      if (!results[currentIdx].answered) {
        qStartTime = Date.now();
      }

      topicBadgeEl.textContent = q.badge;
      progressLabelEl.textContent = `第 ${currentIdx + 1} / ${quizData.length} 題`;
      teacherPromptEl.textContent = q.promptText;
      hintBoxEl.className = 'gentle-hint-box';
      hintBoxEl.textContent = '';

      // 渲染視覺區
      let vHtml = '';
      if (q.type === 'sequence') {
        vHtml = `<div class="seq-row">` + q.tiles.map((t, i) => `
          <div class="num-tile ${t === '?' ? 'mystery' : ''}">${t}</div>
          ${i < q.tiles.length - 1 ? '<span class="seq-arrow">➔</span>' : ''}
        `).join('') + `</div>`;
      } else if (q.type === 'shape-intro' || q.type === 'classify-odd') {
        vHtml = `<div style="font-size: 24px; font-weight: 900; color: #4338ca; text-align: center;">${q.visualNote}</div>
                 <div class="count-hint-sub">請喺下面揀出正確答案</div>`;
      } else if (q.type === 'pattern-abab') {
        vHtml = `<div class="pattern-groups">` + q.groups.map(grp => `
          <div class="pattern-group">
            ${grp.map(item => `<div class="pattern-item ${item === '?' ? 'mystery' : ''}">${item}</div>`).join('')}
          </div>
        `).join('') + `</div>`;
      } else if (q.type === 'spatial-lr') {
        vHtml = `
          <div class="dir-banner">⬅️ 左邊 ｜ 中間 ｜ 右邊 ➡️</div>
          <div class="shelf-row">
            ${q.items.map((em, i) => `<div class="shelf-slot ${i === 1 ? 'center-anchor' : ''}">${em}</div>`).join('')}
          </div>
        `;
      } else if (q.type === 'add-count') {
        const leftItems = Array(q.leftCount).fill(`<div class="countable-item">${q.emoji}</div>`).join('');
        const rightItems = Array(q.rightCount).fill(`<div class="countable-item">${q.emoji}</div>`).join('');
        vHtml = `
          <div class="count-hint-sub">👆 可以用手指逐粒篤住自己數喔</div>
          <div class="groups-wrap">
            <div class="item-box">${leftItems}</div>
            <div class="plus-sign">＋</div>
            <div class="item-box">${rightItems}</div>
          </div>
        `;
      } else if (q.type === 'clock') {
        vHtml = buildClockSVG(q.hour);
      } else if (q.type === 'ordinal') {
        vHtml = `
          <div class="dir-banner">➡️ 由左邊開始數起</div>
          <div class="shelf-row">
            ${q.lineup.map(em => `<div class="shelf-slot">${em}</div>`).join('')}
          </div>
        `;
      } else if (q.type === 'make-five') {
        const stars = Array(q.filled).fill(`<div class="countable-item">⭐</div>`).join('');
        const empties = Array(q.missing).fill(`<div class="slot-empty">?</div>`).join('');
        vHtml = `
          <div class="count-hint-sub">目標：儲齊 5 粒星星（可以篤住數）</div>
          <div class="groups-wrap">
            <div class="item-box">${stars}</div>
            <div class="plus-sign">＋</div>
            <div class="item-box empty-box">${empties}</div>
          </div>
        `;
      } else if (q.type === 'sub-count') {
        const remain = q.total - q.taken;
        const remainHtml = Array(remain).fill(`<div class="countable-item">${q.emoji}</div>`).join('');
        const takenHtml = Array(q.taken).fill(`<div class="countable-item taken">${q.emoji}</div>`).join('');
        vHtml = `
          <div class="count-hint-sub">👆 灰色係被小龍食咗，篤住剩返嗰啲自己數喔</div>
          <div class="item-box" style="max-width: 96%;">${remainHtml}${takenHtml}</div>
        `;
      }

      visualBoxEl.innerHTML = vHtml;
      attachSilentCountListeners(visualBoxEl);

      // 渲染選項按鈕
      optionsGridEl.className = q.cols === 4 ? 'options-grid cols-4' : 'options-grid';
      optionsGridEl.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn';
        if (opt.html) {
          btn.innerHTML = opt.html;
        } else {
          btn.textContent = opt.label;
        }
        btn.addEventListener('click', () => handleAnswer(opt.value, btn));
        optionsGridEl.appendChild(btn);
      });

      renderDots();
      speakCantonese(q.speechText);
    }

    function handleAnswer(selectedVal, btnEl) {
      if (isLocked) return;
      const q = quizData[currentIdx];

      if (selectedVal === q.answer) {
        isLocked = true;
        btnEl.classList.add('correct-flash');
        playCorrectSound();

        if (!results[currentIdx].answered) {
          const elapsed = Math.max(1, Math.round((Date.now() - qStartTime) / 1000));
          results[currentIdx].answered = true;
          results[currentIdx].sec = elapsed;
        }

        renderDots();
        speakCantonese('答啱喇！玲玲好叻呀！');

        pendingNextTimer = setTimeout(() => {
          pendingNextTimer = null;
          // 優先跳去下一條未答題目；如全部 10 題都已完成則進入結算
          let nextIdx = -1;
          for (let i = currentIdx + 1; i < quizData.length; i++) {
            if (!results[i].answered) { nextIdx = i; break; }
          }
          if (nextIdx === -1) {
            for (let i = 0; i < currentIdx; i++) {
              if (!results[i].answered) { nextIdx = i; break; }
            }
          }
          if (nextIdx !== -1) {
            currentIdx = nextIdx;
            renderQuestion();
          } else {
            showVictory();
          }
        }, 1250);
      } else {
        if (!results[currentIdx].answered) {
          results[currentIdx].hadWrong = true;
        }
        btnEl.classList.remove('wrong-shake');
        void btnEl.offsetWidth;
        btnEl.classList.add('wrong-shake');
        playGentleSound();
        hintBoxEl.textContent = `💡 ${q.hintText}`;
        hintBoxEl.classList.add('show');
        speakCantonese(q.hintSpeech);
      }
    }

    function buildReportData() {
      const parts = quizData.map((q, idx) => {
        const r = results[idx];
        const statusTxt = r.hadWrong ? '需提示' : '1次答對';
        const sec = r.sec || 1;
        return `Q${idx + 1} ${q.reportLabel}: ${sec}s(${statusTxt})`;
      });
      const reportText = `【數學測驗回報】Day 12（城堡尋寶大冒險） | ` + parts.join(' | ');

      // 依 skill_id 彙總 skill_stats
      const skillMap = {};
      quizData.forEach((q, idx) => {
        const r = results[idx];
        if (!skillMap[q.skill_id]) {
          skillMap[q.skill_id] = {
            dim: q.dim,
            skill_id: q.skill_id,
            level: q.level,
            total: 0,
            correct: 0,
            sumSec: 0
          };
        }
        skillMap[q.skill_id].total += 1;
        if (!r.hadWrong) skillMap[q.skill_id].correct += 1;
        skillMap[q.skill_id].sumSec += (r.sec || 1);
      });

      const skillStats = Object.values(skillMap).map(s => ({
        dim: s.dim,
        skill_id: s.skill_id,
        level: s.level,
        total: s.total,
        correct: s.correct,
        avg_sec: Number((s.sumSec / s.total).toFixed(1))
      }));

      return { reportText, skillStats };
    }

    function showVictory() {
      stopAllSpeech();
      teacherBarEl.style.display = 'none';
      stageCardEl.style.display = 'none';
      victoryScreenEl.classList.add('show');
      renderDots();

      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = quizData.map((q, idx) => {
        const r = results[idx];
        return `
          <tr>
            <td>Q${idx + 1} ${q.reportLabel}</td>
            <td>${r.hadWrong ? '💡 需提示' : '✅ 1次答對'}</td>
            <td>${r.sec || 1}s</td>
          </tr>
        `;
      }).join('');

      const { reportText, skillStats } = buildReportData();
      window.__latestReportText = reportText;

      if (!reportSaved && window.LinglingReport) {
        reportSaved = true;
        window.LinglingReport.save('數學探索島', 'Maths Day 12（城堡尋寶大冒險）', reportText, {
          term: 'K2-T1',
          skill_stats: skillStats
        });
      }

      speakCantonese('太叻喇！玲玲成功完成城堡尋寶十道挑戰，攞到超級大獎盃！');
    }

    // 綁定頂部按鈕與結算按鈕
    document.getElementById('btnSpeak').addEventListener('click', () => {
      speakCantonese(quizData[currentIdx].speechText);
    });

    document.getElementById('btnHome').addEventListener('click', () => {
      if (pendingNextTimer) clearTimeout(pendingNextTimer);
      stopAllSpeech();
      window.location.href = 'index.html';
    });

    document.getElementById('btnCopyReport').addEventListener('click', () => {
      const text = window.__latestReportText || buildReportData().reportText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          document.getElementById('btnCopyReport').textContent = '✅ 已複製暗號！';
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      document.getElementById('btnCopyReport').textContent = '✅ 已複製暗號！';
    }

    document.getElementById('btnReplay').addEventListener('click', () => {
      reportSaved = false;
      results.forEach(r => { r.answered = false; r.hadWrong = false; r.sec = 0; });
      document.getElementById('btnCopyReport').textContent = '📋 一鍵複製進度暗號俾 Anna 老師';
      jumpToQuestion(0);
    });

    // 啟動第 1 題
    renderQuestion();
  </script>
</body>
</html>
