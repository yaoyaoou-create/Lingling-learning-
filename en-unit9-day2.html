<script>
  // =========================================================================
  // 1. 中英雙軌 (Hybrid Voice) 排隊防撞聲 + Web Audio 放大引擎
  // =========================================================================
  window.utterancePool = [];
  let audioQueueId = 0;
  let activeAudioElement = null;
  let audioCtx = null;

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  function stopAllAudio() {
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeAudioElement) {
      try {
        activeAudioElement.onended = null;
        activeAudioElement.onerror = null;
        activeAudioElement.pause();
        activeAudioElement.currentTime = 0;
      } catch (e) {}
      activeAudioElement = null;
    }
  }

  function playSingleMp3(file, boostGain = 2.2, onDone) {
    ensureAudioContext();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    activeAudioElement = audio;

    if (audioCtx) {
      try {
        const source = audioCtx.createMediaElementSource(audio);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = boostGain;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      } catch (e) {
        audio.volume = 1.0;
      }
    } else {
      audio.volume = 1.0;
    }

    let finished = false;
    const finish = () => {
      if (!finished) {
        finished = true;
        if (onDone) onDone();
      }
    };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
  }

  function playHybridQueue(steps) {
    stopAllAudio();
    if (!steps || !steps.length) return;
    const myQueueId = audioQueueId;
    let idx = 0;

    function nextStep() {
      if (myQueueId !== audioQueueId || idx >= steps.length) return;
      const step = steps[idx++];

      if (step.type === 'zh') {
        if (!('speechSynthesis' in window) || !step.text) {
          nextStep();
          return;
        }
        const u = new SpeechSynthesisUtterance(step.text);
        window.utterancePool.push(u);
        u.lang = 'zh-HK';
        u.pitch = 1.05;
        u.rate = 0.92;
        u.volume = 0.68;
        let advanced = false;
        const done = () => {
          if (!advanced && myQueueId === audioQueueId) {
            advanced = true;
            setTimeout(() => nextStep(), 150);
          }
        };
        u.onend = done;
        u.onerror = done;
        setTimeout(() => {
          if (myQueueId === audioQueueId) window.speechSynthesis.speak(u);
        }, 50);
      } else if (step.type === 'mp3') {
        playSingleMp3(step.file, step.boost || 2.2, () => {
          if (myQueueId === audioQueueId) setTimeout(() => nextStep(), 150);
        });
      }
    }
    nextStep();
  }

  function getAudioStep(id) {
    const map = {
      bread: 'en-bread.mp3',
      eggs: 'en-eggs.mp3',
      rice: 'en-rice.mp3',
      fish: 'en-fish.mp3',
      meat: 'en-meat.mp3',
      i_like_rice: 'en-i-like-rice.mp3'
    };
    if (map[id]) {
      const boost = id === 'meat' ? 2.5 : 2.2;
      return { type: 'mp3', file: map[id], boost };
    }
    // 26 個字母統一調用 audio/en-a.mp3 到 en-z.mp3
    return { type: 'mp3', file: 'en-' + id.toLowerCase() + '.mp3', boost: 2.2 };
  }

  let currentGuideCantonese = "";
  function setGuide(zhText, autoSpeak = true) {
    currentGuideCantonese = zhText;
    document.getElementById('teacherMsg').textContent = zhText;
    if (autoSpeak) replayGuide();
  }
  function replayGuide() {
    playHybridQueue([{ type: 'zh', text: currentGuideCantonese }]);
  }

          <rect x="96" y="78" width="52" height="24" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="5"/>
          <circle cx="148" cy="78" r="13" fill="#FFFBEB" stroke="#D97706" stroke-width="5"/>
          <circle cx="148" cy="102" r="13" fill="#FFFBEB" stroke="#D97706" stroke-width="5"/>
          <ellipse cx="76" cy="90" rx="52" ry="38" fill="#F97316" stroke="#C2410C" stroke-width="6"/>
          <ellipse cx="70" cy="82" rx="34" ry="20" fill="#FB923C"/>
        </g>
      </svg>
    `
  };

  // ==========================================
  // 3. 課程資料 (重溫 Day 1 ＋ 新學 rice, fish, meat, I like rice.)
  // ==========================================
  const ACT1_CARDS = [
    {
      id: 'bread',
      audioId: 'bread',
      badge: '🔁 極速重溫 Day 1',
      enHtml: `<span class="hl-orange">b</span>rea<span class="hl-orange">d</span>`,
      mnemonic: '👀 仲記唔記得？大肚腩 b 同 d 夾住中間嘅厚多士！',
      guideZh: '先極速重溫昨日學過嘅麵包 bread！點擊圖卡聽下仲記唔記得！'
    },
    {
      id: 'rice',
      audioId: 'rice',
      badge: '🍚 新食物認知 1',
      enHtml: `ri<span class="hl-purple">ce</span>`,
      mnemonic: '👀 小貼士：扮揸筷子扒飯，最尾拉長蛇仔聲 sss 讀 rice！',
      guideZh: '今日第一個新食物係白飯 rice！一齊扮揸筷子扒飯，最尾記住發出輕輕嘅蛇仔尾音 rice！點擊聽下啦！'
    },
    {
      id: 'fish',
      audioId: 'fish',
      badge: '🐟 新食物認知 2',
      enHtml: `<span class="hl-blue">f</span>ish`,
      mnemonic: '👀 字形口訣：最前面嘅 f 彎彎哋好似一支釣魚竿，釣起條魚！',
      guideZh: '睇下小魚 fish！最前面嘅 f 彎彎哋好似一支釣魚竿，釣起條魚！點擊圖卡聽下點讀啦！'
    },
    {
      id: 'meat',
      audioId: 'meat',
      badge: '🍗 新食物認知 3',
      enHtml: `<span class="hl-orange">m</span>eat`,
      mnemonic: '👀 字形口訣：開頭係你最熟嘅 m（摸肚仔閉嘴音），一見到 m 就諗起食肉肉！',
      guideZh: '最後係美味嘅肉肉 meat！開頭係你最熟嘅 m 摸肚仔閉嘴音，一見到 m 就即刻聯想到食肉肉！點擊聽下！'
    },
    {
      id: 'rice',
      audioId: 'i_like_rice',
      badge: '💬 P.40 核心句式',
      isSentence: true,
      enHtml: `I like <span class="hl-purple">rice</span>.`,
      mnemonic: '💡 企直身體笑住講：I like rice!',
      guideZh: '想話俾人聽「我鍾意食白飯」，點樣講呢？點擊圖卡聽下呢句英文！'
    }
  ];

  const ACT2_PHONICS = [
    {
      id: 'rice',
      word: 'rice',
      letters: ['r', 'i', 'c', 'e'],
      highlightIdx: [2, 3],
      mnemonic: '🍚 扒飯動作 ＋ 尾音輕輕蛇仔聲！',
      guideZh: '一齊玩字母積木！逐粒撳 r-i-c-e 聽下字母發音，再撳下面大掣讀出成個 rice！'
    },
    {
      id: 'fish',
      word: 'fish',
      letters: ['f', 'i', 's', 'h'],
      highlightIdx: [0],
      mnemonic: '🐟 最前面彎彎嘅 f 就係釣魚竿！',
      guideZh: '再嚟拼小魚 fish！睇住最前面支釣魚竿 f，逐粒聽完再讀出成個字！'
    },
    {
      id: 'meat',
      word: 'meat',
      letters: ['m', 'e', 'a', 't'],
      highlightIdx: [0],
      mnemonic: '🍗 開頭 m 閉埋嘴摸肚仔食肉肉！',
      guideZh: '最後拼肉肉 meat！撳下最前面嘅 m，逐粒聽完再讀出成個 meat！'
    }
  ];

  const ACT3_SPEAK = [
    { id: 'rice', audioId: 'rice', en: 'rice', guideZh: '請玲玲大聲讀出白飯 rice！讀完按綠色掣放煙花！' },
    { id: 'fish', audioId: 'fish', en: 'fish', guideZh: '好棒！跟住大聲讀小魚 fish！' },
    { id: 'meat', audioId: 'meat', en: 'meat', guideZh: '再嚟！閉埋嘴讀出美味嘅肉肉 meat！' },
    { id: 'rice', audioId: 'i_like_rice', en: 'I like rice.', isSentence: true, guideZh: '最後挑戰核心句！企直身體大聲講 I like rice! 講完放煙花！' }
  ];

  const ACT4_QUIZ = [
    { badge: '🎧 聽音尋寶 1', questionZh: '聽下聲音！邊一張係香噴噴嘅白飯？', audioId: 'rice', correctId: 'rice', wrongId: 'bread' },
    { badge: '🎧 聽音尋寶 2', questionZh: '再聽下！邊一張係海入面游水嘅魚仔？', audioId: 'fish', correctId: 'fish', wrongId: 'eggs' },
    { badge: '🎧 聽音尋寶 3', questionZh: '繼續挑戰！邊一張係美味嘅肉肉？', audioId: 'meat', correctId: 'meat', wrongId: 'fish' },
    { badge: '🎧 聽音尋寶 4', questionZh: '最後一題！聽下呢句話佢鍾意食邊樣食物？', audioId: 'i_like_rice', correctId: 'rice', wrongId: 'meat' }
  ];

  // ==========================================
  // 4. 渲染引擎
  // ==========================================
  let currentAct = 0;
  let subIndex = 0;
  let litBlocks = [];
  let quizSolved = false;
  let quizWrongPicked = null;

  function updateActNav() {
    document.querySelectorAll('.act-pill').forEach((p, idx) => {
      p.className = `act-pill ${currentAct === 4 || idx < currentAct ? 'done' : (idx === currentAct ? 'active' : '')}`;
    });
  }

  function jumpToAct(idx) {
    currentAct = idx;
    subIndex = 0;
    litBlocks = [];
    quizSolved = false;
    quizWrongPicked = null;
    updateActNav();
    renderStage(true);
  }

  function renderStage(shouldSpeak = true) {
    const container = document.getElementById('stageContainer');
    updateActNav();

    // --- Act 1: 食物認知＋字形口訣 ---
    if (currentAct === 0) {
      const c = ACT1_CARDS[subIndex];
      setGuide(c.guideZh, shouldSpeak);

      container.innerHTML = `
        <div class="dots-row">${ACT1_CARDS.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">${c.badge}</div>
        <div class="flashcard-3d" id="meaningCard" onclick="playCardAudio('${c.audioId}')">
          <div class="pulse-ring"></div>
          <div class="illustration-wrap">${ILLUSTRATIONS[c.id]}</div>
          <div class="word-en ${c.isSentence ? 'sentence' : ''}">${c.enHtml}</div>
          <div class="mnemonic-pill">${c.mnemonic}</div>
          <div class="hint-text">👆 點擊圖卡聽純正英文</div>
        </div>
        <div class="btn-row">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="subIndex--; renderStage(true);">⬅️ 上一個</button>` : ''}
          <button class="btn-3d btn-green" onclick="if(subIndex < ACT1_CARDS.length - 1){ subIndex++; renderStage(true); } else jumpToAct(1);">
            ${subIndex < ACT1_CARDS.length - 1 ? '下一個 ➡️' : '去玩字母積木 🧱'}
          </button>
        </div>
      `;
    }

    // --- Act 2: 字母積木拼讀 ---
    else if (currentAct === 1) {
      const p = ACT2_PHONICS[subIndex];
      setGuide(p.guideZh, shouldSpeak);

      container.innerHTML = `
        <div class="dots-row">${ACT2_PHONICS.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">🧱 字母積木 (${subIndex + 1} / ${ACT2_PHONICS.length})</div>
        <div style="width: 130px; height: 130px; margin: 0 auto 8px;">${ILLUSTRATIONS[p.id]}</div>
        <div class="mnemonic-pill" style="margin-top: 0;">${p.mnemonic}</div>

        <div class="blocks-arena">
          ${p.letters.map((ch, idx) => `
            <div class="letter-block ${p.highlightIdx.includes(idx) ? 'highlight-block' : ''} ${litBlocks.includes(idx) ? 'lit' : ''}" onclick="tapBlock(${idx}, '${ch}')">
              ${ch}
            </div>
          `).join('')}
        </div>

        <div class="btn-row">
          <button class="btn-3d btn-amber" onclick="playHybridQueue([getAudioStep('${p.id}')])">🔊 聽成個字：${p.word}</button>
        </div>
        <div class="btn-row">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="subIndex--; litBlocks=[]; renderStage(true);">⬅️ 上一個</button>` : ''}
          <button class="btn-3d btn-green" onclick="if(subIndex < ACT2_PHONICS.length - 1){ subIndex++; litBlocks=[]; renderStage(true); } else jumpToAct(2);">
            ${subIndex < ACT2_PHONICS.length - 1 ? '下一個積木 ➡️' : '去開口跟讀 🎤'}
          </button>
        </div>
      `;
    }

    // --- Act 3: 開口跟讀 ---
    else if (currentAct === 2) {
      const s = ACT3_SPEAK[subIndex];
      setGuide(s.guideZh, shouldSpeak);

      container.innerHTML = `
        <div class="dots-row">${ACT3_SPEAK.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">🎤 開口跟讀 (${subIndex + 1} / ${ACT3_SPEAK.length})</div>
        <div class="flashcard-3d" id="meaningCard" onclick="playCardAudio('${s.audioId}')">
          <div class="pulse-ring"></div>
          <div class="illustration-wrap">${ILLUSTRATIONS[s.id]}</div>
          <div class="word-en ${s.isSentence ? 'sentence' : ''}">${s.en}</div>
          <div class="hint-text">👆 點擊聽示範</div>
        </div>
        <div class="btn-row">
          <button class="btn-3d btn-green" onclick="launchFireworks(); playHybridQueue([{type:'zh', text:'玲玲讀得超好聽！'}]);">🎉 我讀完喇！放煙花</button>
        </div>
        <div class="btn-row">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="subIndex--; renderStage(true);">⬅️ 上一個</button>` : ''}
          <button class="btn-3d btn-purple" onclick="if(subIndex < ACT3_SPEAK.length - 1){ subIndex++; renderStage(true); } else jumpToAct(3);">
            ${subIndex < ACT3_SPEAK.length - 1 ? '下一個挑戰 ➡️' : '去聽音尋寶 🎧'}
          </button>
        </div>
      `;
    }

    // --- Act 4: 無字盲聽挑戰 ---
    else if (currentAct === 3) {
      const q = ACT4_QUIZ[subIndex];
      setGuide(q.questionZh, false);
      if (shouldSpeak) {
        playHybridQueue([
          { type: 'zh', text: q.questionZh },
          getAudioStep(q.audioId)
        ]);
      }

      const cards = subIndex % 2 === 0
        ? [q.correctId, q.wrongId]
        : [q.wrongId, q.correctId];

      container.innerHTML = `
        <div class="dots-row">${ACT4_QUIZ.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">${q.badge} (${subIndex + 1} / ${ACT4_QUIZ.length})</div>
        <div style="margin-bottom: 14px;">
          <button class="btn-3d btn-purple" onclick="playHybridQueue([getAudioStep('${q.audioId}')])">🔊 再聽一次英文</button>
        </div>

        <div class="quiz-grid">
          ${cards.map(cid => `
            <div class="quiz-card ${quizSolved && cid === q.correctId ? 'correct' : ''} ${!quizSolved && quizWrongPicked === cid ? 'wrong-try' : ''}" onclick="pickQuiz('${cid}')">
              <div style="width: 135px; height: 135px; margin: 0 auto;">${ILLUSTRATIONS[cid]}</div>
            </div>
          `).join('')}
        </div>

        ${quizSolved
          ? `<div class="gentle-hint-banner success">🎉 玲玲好叻呀！一聽就搵到！</div>
             <div class="btn-row"><button class="btn-3d btn-green" onclick="if(subIndex < ACT4_QUIZ.length - 1){ subIndex++; quizSolved=false; quizWrongPicked=null; renderStage(true); } else jumpToAct(4);">${subIndex < ACT4_QUIZ.length - 1 ? '下一題 ➡️' : '領取獎盃 🏆'}</button></div>`
          : (quizWrongPicked ? `<div class="gentle-hint-banner">💛 試吓隔離嗰張圖卡啦！</div>` : '')
        }
      `;
    }

    // --- Summary: 結算與一鍵複製進度暗號 ---
    else if (currentAct === 4) {
      setGuide("恭喜玲玲完成 Unit 9 Day 2！5 種美味食物全部認得晒喇！", shouldSpeak);
      if (shouldSpeak) {
        launchFireworks();
        setTimeout(launchFireworks, 800);
      }

      const secretCode = `【玲玲英文課堂進度暗號】單元：Unit 9 Day 2 (en-unit9-day2.html)｜學習內容：重溫 bread/eggs ＋ 新學 rice, fish, meat, I like rice. (視覺字形口訣＋字母積木＋盲聽)｜完成狀態：✅ 全課順利完成｜請 Anna 老師更新雲端英文總庫，並準備 Unit 9 Day 3 繪本故事上集！`;

      container.innerHTML = `
        <div style="font-size: 72px;">🏆</div>
        <h1 style="color: #0284C7; margin: 10px 0;">Unit 9 Day 2 大成功！</h1>
        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn-3d btn-green" id="copySecretBtn" onclick="copyProgressSecret()">📋 一鍵複製進度暗號</button>
        </div>
        <div class="secret-code-box" id="secretCodeText">${secretCode}</div>
        <div class="btn-row">
          <a href="en-unit9.html" class="btn-3d btn-amber" style="text-decoration:none;">🏠 返回單元目錄</a>
        </div>
      `;
    }
  }

  // ==========================================
  // 5. 互動邏輯
  // ==========================================
  function playCardAudio(audioId) {
    const el = document.getElementById('meaningCard');
    if (el) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
    playHybridQueue([getAudioStep(audioId)]);
  }

  function tapBlock(idx, ch) {
    if (!litBlocks.includes(idx)) litBlocks.push(idx);
    renderStage(false);
    playHybridQueue([getAudioStep(ch)]);
    const p = ACT2_PHONICS[subIndex];
    if (litBlocks.length === p.letters.length) {
      setTimeout(() => launchFireworks(), 300);
    }
  }

  function pickQuiz(picked) {
    if (quizSolved) return;
    const q = ACT4_QUIZ[subIndex];
    if (picked === q.correctId) {
      quizSolved = true;
      quizWrongPicked = null;
      renderStage(false);
      launchFireworks();
      playHybridQueue([getAudioStep(q.audioId), { type: 'zh', text: '答啱喇！' }]);
    } else {
      quizWrongPicked = picked;
      renderStage(false);
      playHybridQueue([{ type: 'zh', text: '試吓隔離嗰張圖卡啦！' }]);
    }
  }

  function copyProgressSecret() {
    const text = document.getElementById('secretCodeText').innerText;
    const btn = document.getElementById('copySecretBtn');
    function onCopied() {
      btn.textContent = '✅ 已複製暗號！快啲貼俾 Anna 老師！';
      playHybridQueue([{ type: 'zh', text: '已複製暗號！請媽媽貼返去對話框俾老師啦！' }]);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    callback();
  }

  // ==========================================
  // 6. 煙花引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animRunning = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7'];
    for (let burst = 0; burst < 3; burst++) {
      const cx = canvas.width * (0.3 + Math.random() * 0.4);
      const cy = canvas.height * (0.2 + Math.random() * 0.3);
      for (let i = 0; i < 30; i++) {
        const a = (Math.PI * 2 * i) / 30;
        const s = 2 + Math.random() * 4;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 4 + Math.random() * 4
        });
      }
    }
    if (!animRunning) {
      animRunning = true;
      requestAnimationFrame(animateParticles);
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.alpha -= 0.02;
      if (p.alpha <= 0) particles.splice(i, 1);
      else {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) requestAnimationFrame(animateParticles);
    else animRunning = false;
  }

  renderStage(false);
</script>
