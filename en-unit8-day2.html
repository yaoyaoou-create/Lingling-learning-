<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit 8 Day 2 — Tickles 口語對答大挑戰</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #bae6fd 0%, #e0f2fe 52%, #fef9c3 100%);
      color: #0f172a;
      overflow-x: hidden;
    }

    body {
      display: block !important;
    }

    /* iPad Safari 聲音解鎖啟動遮罩 */
    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .start-overlay.hidden {
      display: none;
    }
    .start-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
      border: 5px solid #38bdf8;
      border-radius: 32px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 10px 0 #0284c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .start-btn {
      background: linear-gradient(180deg, #34d399, #059669);
      color: #ffffff;
      border: 4px solid #047857;
      border-radius: 999px;
      padding: 16px 34px;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 0 #065f46;
    }
    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #065f46;
    }

    .app-shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px 14px 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 深藍頂部導航列 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      border: 3px solid #60a5fa;
      border-radius: 22px;
      padding: 8px 12px;
      box-shadow: 0 5px 0 #1e40af;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: #1e3a8a;
      border: 3px solid #93c5fd;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #60a5fa;
      flex-shrink: 0;
    }
    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #60a5fa;
    }

    .unit-pill {
      color: #fef08a;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 頂部 4 幕進度地圖（支援隨按即跳） */
    .step-dots {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    .step-dot {
      border: 3px solid #93c5fd;
      background: rgba(255, 255, 255, 0.18);
      color: #e0f2fe;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .step-dot:active {
      transform: scale(0.95);
    }
    .step-dot.done {
      background: #10b981;
      border-color: #6ee7b7;
      color: #ffffff;
    }
    .step-dot.active {
      background: #facc15;
      border-color: #fef08a;
      color: #713f12;
      transform: scale(1.06);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.35);
    }

    /* Anna 老師黃色常駐橫幅 */
    .teacher-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #fef08a, #fde047);
      border: 3px solid #f59e0b;
      border-radius: 22px;
      padding: 10px 14px;
      box-shadow: 0 5px 0 #d97706;
    }

    .teacher-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .teacher-text {
      flex: 1;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      color: #78350f;
    }

    .replay-btn {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: 3px solid #0369a1;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #075985;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .replay-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #075985;
    }

    /* 主舞台（iPad 單屏不捲動） */
    .stage-card {
      flex: 1;
      background: #ffffff;
      border: 4px solid #38bdf8;
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 7px 0 #0284c7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stage-tag {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 900;
    }

    .sub-progress {
      font-size: 16px;
      font-weight: 900;
      color: #1d4ed8;
    }

    .stage-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* 第一幕：3D 大圖卡網格 */
    .cards-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .flash-card-3d {
      background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
      border: 4px solid #38bdf8;
      border-radius: 24px;
      padding: 14px 10px;
      box-shadow: 0 6px 0 #0284c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.14s ease;
    }
    .flash-card-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0284c7;
    }
    .flash-card-3d.yes-card {
      background: linear-gradient(180deg, #ffffff 0%, #dcfce7 100%);
      border-color: #22c55e;
      box-shadow: 0 6px 0 #16a34a;
    }
    .flash-card-3d.no-card {
      background: linear-gradient(180deg, #ffffff 0%, #fee2e2 100%);
      border-color: #f87171;
      box-shadow: 0 6px 0 #dc2626;
    }
    .flash-card-3d.visited {
      outline: 4px solid #facc15;
    }

    .card-emoji {
      font-size: 54px;
      line-height: 1.1;
    }
    .card-en {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      text-align: center;
    }
    .card-tip {
      font-size: 14px;
      font-weight: 800;
      color: #475569;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px 10px;
      border-radius: 999px;
      text-align: center;
    }

    /* 第二幕 & 第三幕：Tickles 對話舞台 */
    .tickles-scene {
      width: 100%;
      background: #f0f9ff;
      border: 3px dashed #7dd3fc;
      border-radius: 24px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tickles-bubble {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 3px solid #60a5fa;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 22px;
      font-weight: 900;
      color: #1e3a8a;
      box-shadow: 0 4px 0 #93c5fd;
      cursor: pointer;
    }

    .pet-showcase {
      width: 132px;
      height: 132px;
      border-radius: 28px;
      background: #ffffff;
      border: 4px solid #fbbf24;
      box-shadow: 0 6px 0 #d97706;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 74px;
    }

    .yn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .yn-btn {
      min-height: 92px;
      border-radius: 24px;
      border: 4px solid #22c55e;
      background: linear-gradient(180deg, #ffffff 0%, #dcfce7 100%);
      color: #14532d;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #16a34a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px;
    }
    .yn-btn.no-style {
      border-color: #f87171;
      background: linear-gradient(180deg, #ffffff 0%, #fee2e2 100%);
      color: #7f1d1d;
      box-shadow: 0 6px 0 #dc2626;
    }
    .yn-btn:active {
      transform: translateY(4px);
    }
    .yn-btn.correct-flash {
      background: #10b981;
      border-color: #047857;
      color: #ffffff;
      transform: scale(1.04);
    }
    .yn-btn.wrong-shake {
      animation: shake 0.36s ease;
    }

    /* 第四幕：零劇透盲聽尋寶 */
    .blind-listen-btn {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: 4px solid #0369a1;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #075985;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .blind-listen-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #075985;
    }

    .blind-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .blind-card {
      min-height: 122px;
      border-radius: 24px;
      border: 4px solid #818cf8;
      background: linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
      box-shadow: 0 6px 0 #6366f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 10px;
    }
    .blind-card:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #6366f1;
    }
    .blind-card .b-emoji {
      font-size: 56px;
      line-height: 1;
    }
    .blind-card .b-reveal {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      display: none;
    }
    .blind-card.correct-flash {
      background: linear-gradient(180deg, #34d399, #10b981);
      border-color: #047857;
      box-shadow: 0 6px 0 #047857;
    }
    .blind-card.correct-flash .b-reveal {
      display: block;
    }
    .blind-card.wrong-shake {
      animation: shake 0.36s ease;
      background: #fef3c7;
      border-color: #f59e0b;
    }

    /* 底部操作按鈕 */
    .stage-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-btn {
      background: linear-gradient(180deg, #34d399, #059669);
      color: #ffffff;
      border: 3px solid #047857;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #065f46;
    }
    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #065f46;
    }

    .secondary-btn {
      background: linear-gradient(180deg, #fde68a, #f59e0b);
      color: #78350f;
      border: 3px solid #d97706;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #b45309;
    }
    .secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b45309;
    }

    .gentle-msg {
      min-height: 28px;
      font-size: 17px;
      font-weight: 900;
      color: #b45309;
      text-align: center;
    }

    /* 煙花層 */
    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      opacity: 0;
      z-index: 999;
      transition: opacity 0.25s ease;
    }
    .fx-layer.show {
      opacity: 1;
      animation: popFx 0.7s ease;
    }

    /* 結算畫面 */
    .victory-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #ffffff;
      border: 4px solid #f59e0b;
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 8px 0 #d97706;
      text-align: center;
    }
    .victory-screen.show {
      display: flex;
    }
    .sync-banner {
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #166534;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 800;
    }
    .summary-box {
      width: 100%;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 12px;
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.6;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }
    @keyframes popFx {
      0% { transform: scale(0.5); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    @media (max-width: 560px) {
      .teacher-text { font-size: 16px; }
      .card-en { font-size: 20px; }
      .tickles-bubble { font-size: 18px; }
      .yn-btn { font-size: 20px; min-height: 82px; }
      .blind-card .b-emoji { font-size: 46px; }
    }
  </style>
</head>
<body>
  <!-- iPad Safari 聲音解鎖啟動頁 -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-card">
      <div style="font-size: 68px;">🐶🐾</div>
      <h2 style="margin: 0; font-size: 26px; color: #1e3a8a;">Unit 8 Day 2</h2>
      <div style="font-size: 18px; font-weight: 800; color: #475569;">Tickles 口語對答大挑戰<br/>（點頭 Yes / 搖頭 No）</div>
      <button type="button" class="start-btn" id="btnUnlockStart">🔊 開始上堂！</button>
    </div>
  </div>

  <div class="fx-layer" id="fxLayer">🎆🎉⭐</div>

  <div class="app-shell">
    <!-- 深藍頂部導航 -->
    <div class="top-bar">
      <button type="button" class="home-btn" id="btnHome">🏠 返回</button>
      <div class="unit-pill">🐾 Unit 8 Day 2 · Tickles 對答</div>
      <div class="step-dots" id="stepDots" aria-label="關卡快速導航"></div>
    </div>

    <!-- Anna 老師黃色橫幅 -->
    <div class="teacher-bar" id="teacherBar">
      <div class="teacher-avatar">👩‍🏫</div>
      <div class="teacher-text" id="teacherText">今日同 Tickles 玩點頭 Yes、搖頭 No 口語大挑戰！</div>
      <button type="button" class="replay-btn" id="btnReplayAudio">🔊 重聽</button>
    </div>

    <!-- 主互動區 -->
    <div class="stage-card" id="stageCard">
      <div class="stage-header">
        <div class="stage-tag" id="stageTag">第一幕 · 口語示範</div>
        <div class="sub-progress" id="subProgress">1 / 4</div>
      </div>

      <div class="stage-body" id="stageBody"></div>
      <div class="gentle-msg" id="gentleMsg"></div>
      <div class="stage-footer" id="stageFooter"></div>
    </div>

    <!-- 結算畫面 -->
    <div class="victory-screen" id="victoryScreen">
      <div style="font-size: 62px;">🏆🐾🎉</div>
      <h2 style="margin: 0; font-size: 26px; color: #1e3a8a;">Unit 8 Day 2 大成功！</h2>
      <div class="sync-banner">☁️ 戰報已自動同步至家長戰報箱</div>
      <div class="summary-box" id="summaryBox"></div>
      <div class="stage-footer">
        <button type="button" class="primary-btn" id="btnCopyReport">📋 一鍵複製進度暗號</button>
        <button type="button" class="secondary-btn" id="btnRestart">🔄 再玩一次</button>
      </div>
    </div>
  </div>

  <script src="report-hub.js?v=2"></script>
  <script>
    // ==========================================
    // iPad Safari 終極防護：中英雙軌 (Hybrid Voice) 引擎
    // 1. 首次點擊即解鎖 AudioContext（無聲緩衝保活）+ 喚醒 speechSynthesis
    // 2. cancel() 後強制 60ms 延遲防 Safari 吞聲
    // 3. onend 防卡死保險計時器，確保英文 MP3 必播
    // 4. Web Audio GainNode 2.2x 放大英文 MP3，中文音量 0.68
    // ==========================================
    window.utterancePool = [];
    let audioCtx = null;
    let activeAudioEl = null;
    let activeBufferSource = null;
    let speechDelayTimer = null;
    let speechSafetyTimer = null;
    let audioToken = 0;
    let currentReplayAction = null;
    let audioUnlocked = false;
    const decodedCache = {};

    function unlockIOSAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        try {
          // 播放 1 sample 無聲緩衝，正式解鎖 iPad Safari Web Audio 輸出
          const silentBuf = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = silentBuf;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (e) {}
      }
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.getVoices();
        } catch (e) {}
      }
      audioUnlocked = true;
    }

    // 任意點擊皆確保 AudioContext 處於 running 狀態
    document.addEventListener('touchstart', () => {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }, { passive: true });

    function stopAllAudio() {
      audioToken += 1;
      if (speechDelayTimer) {
        clearTimeout(speechDelayTimer);
        speechDelayTimer = null;
      }
      if (speechSafetyTimer) {
        clearTimeout(speechSafetyTimer);
        speechSafetyTimer = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      window.utterancePool = [];
      if (activeAudioEl) {
        try {
          activeAudioEl.pause();
          activeAudioEl.currentTime = 0;
          activeAudioEl.onended = null;
          activeAudioEl.onerror = null;
        } catch (e) {}
        activeAudioEl = null;
      }
      if (activeBufferSource) {
        try {
          activeBufferSource.onended = null;
          activeBufferSource.stop();
        } catch (e) {}
        activeBufferSource = null;
      }
    }

    function playCantonese(text, onEnd) {
      const myToken = audioToken;
      if (!('speechSynthesis' in window) || !text) {
        if (onEnd && myToken === audioToken) onEnd();
        return;
      }

      // 強制延遲 60ms，防止 iPad Safari 在 cancel() 後吞聲
      speechDelayTimer = setTimeout(() => {
        if (myToken !== audioToken) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-HK';
        u.rate = 0.78;
        u.volume = 0.68;
        const voices = window.speechSynthesis.getVoices();
        const hkVoice =
          voices.find(v => v.lang && v.lang.toLowerCase().includes('zh-hk')) ||
          voices.find(v => v.lang && v.lang.toLowerCase().includes('yue'));
        if (hkVoice) u.voice = hkVoice;

        window.utterancePool.push(u);
        let finished = false;
        const done = () => {
          if (finished) return;
          finished = true;
          if (speechSafetyTimer) {
            clearTimeout(speechSafetyTimer);
            speechSafetyTimer = null;
          }
          window.utterancePool = window.utterancePool.filter(x => x !== u);
          if (onEnd && myToken === audioToken) onEnd();
        };

        u.onend = done;
        u.onerror = done;

        // 保險計時器：萬一 iPad Safari 漏觸發 onend，自動放行繼續播英文 MP3
        const estMs = Math.max(2200, text.length * 360 + 900);

    function preloadAllMP3() {
      if (!audioCtx) return;
      ALL_MP3_FILES.forEach(file => {
        const url = `audio/${file}`;
        if (decodedCache[url]) return;
        fetch(url)
          .then(r => (r.ok ? r.arrayBuffer() : null))
          .then(arr => (arr && audioCtx ? audioCtx.decodeAudioData(arr) : null))
          .then(buf => { if (buf) decodedCache[url] = buf; })
          .catch(() => {});
      });
    }

    async function playEnglishMP3(filename, onEnd) {
      const myToken = audioToken;
      const url = `audio/${filename}`;

      if (audioCtx) {
        try {
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }
          let buf = decodedCache[url];
          if (!buf) {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('fetch failed');
            const arr = await resp.arrayBuffer();
            buf = await audioCtx.decodeAudioData(arr);
            decodedCache[url] = buf;
          }
          if (myToken !== audioToken) return;
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const gain = audioCtx.createGain();
          gain.gain.value = 2.2;
          src.connect(gain);
          gain.connect(audioCtx.destination);
          activeBufferSource = src;
          src.onended = () => {
            if (activeBufferSource === src) activeBufferSource = null;
            if (onEnd && myToken === audioToken) onEnd();
          };
          src.start(0);
          return;
        } catch (err) {
          // fallback below
        }
      }

      if (myToken !== audioToken) return;
      const audio = new Audio(url);
      activeAudioEl = audio;
      audio.onended = () => {
        if (activeAudioEl === audio) activeAudioEl = null;
        if (onEnd && myToken === audioToken) onEnd();
      };
      audio.onerror = () => {
        if (activeAudioEl === audio) activeAudioEl = null;
        if (onEnd && myToken === audioToken) onEnd();
      };
      audio.play().catch(() => {
        if (onEnd && myToken === audioToken) onEnd();
      });
    }

      stopAllAudio();

          playEnglishMP3(enFile, onAllDone);

    });

    document.getElementById('btnReplayAudio').addEventListener('click', () => {
      if (!audioUnlocked) unlockIOSAudio();
      if (currentReplayAction) currentReplayAction();
    });

    document.getElementById('btnHome').addEventListener('click', () => {
      stopAllAudio();
      window.location.href = 'en-unit8.html?v=2';
    });

    document.getElementById('btnCopyReport').addEventListener('click', () => {
      const text = window.__latestReportText || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          document.getElementById('btnCopyReport').textContent = '✅ 已複製暗號！';
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      document.getElementById('btnCopyReport').textContent = '✅ 已複製暗號！';
    }

    document.getElementById('btnRestart').addEventListener('click', () => {
      reportSaved = false;
      visitedDemo.clear();
      for (let i = 0; i < 4; i++) stageCompleted[i] = false;
      for (let i = 0; i < trapFirstTry.length; i++) trapFirstTry[i] = true;
      for (let i = 0; i < blindFirstTry.length; i++) blindFirstTry[i] = true;
      document.getElementById('btnCopyReport').textContent = '📋 一鍵複製進度暗號';
      jumpToStage(0);
    });

    // 先渲染背景畫面（不自動播聲，等點擊「開始上堂」解鎖 iPad 聲音）
    renderStepDots();
    renderStage1(false);
  </script>
</body>
</html>
