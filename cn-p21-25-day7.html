<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>玲玲中文AI課堂｜《我要謝謝你》Day 7 《米飯哪裏來？》</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* iPad Safari 終極防護引擎：防雙擊放大鎖與版面鎖定 */
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: block !important;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: "PingFang HK", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #FFF7ED 0%, #FEF3C7 50%, #ECFCCB 100%);
      color: #1E293B;
      overflow-x: hidden;
    }

    /* 局部解鎖 textarea，確保媽媽可長按手動複製暗號 */
    textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    /* 3D 立體卡片與按鈕 */
    .card-3d {
      background: #FFFFFF;
      border: 4px solid #CBD5E1;
      box-shadow: 0 8px 0 #94A3B8, 0 12px 20px rgba(15, 23, 42, 0.08);
      border-radius: 28px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .card-3d:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #94A3B8, 0 6px 10px rgba(15, 23, 42, 0.08);
    }
    .card-correct {
      background: #F0FDF4 !important;
      border-color: #34D399 !important;
      box-shadow: 0 8px 0 #10B981, 0 12px 20px rgba(16, 185, 129, 0.18) !important;
      transform: scale(1.04);
    }

    .btn-primary {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      border: 4px solid #FEF3C7;
      box-shadow: 0 7px 0 #B45309, 0 10px 18px rgba(180, 83, 9, 0.25);
      color: #FFFFFF;
      border-radius: 9999px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-primary:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #B45309;
    }

    /* Anna 老師黃色常駐橫幅 */
    .tutor-banner {
      background: linear-gradient(90deg, #FEF08A 0%, #FDE047 100%);
      border: 4px solid #FACC15;
      box-shadow: 0 6px 0 #EAB308;
      border-radius: 24px;
      cursor: pointer;
    }
    .tutor-banner:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #EAB308;
    }

    /* 溫柔搖晃提示（零壓力，不設紅叉） */
    .wrong-shake {
      animation: shakeGentle 0.45s ease;
      background: #FEF2F2 !important;
      border-color: #FCA5A5 !important;
    }
    @keyframes shakeGentle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-2deg); }
      75% { transform: translateX(8px) rotate(2deg); }
    }

    /* 靜音方格字牆字粒與紅圈效果 */
    .grid-char-tile {
      position: relative;
      background: #FFFFFF;
      border: 4px solid #FDBA74;
      box-shadow: 0 6px 0 #FB923C;
      border-radius: 20px;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .grid-char-tile:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #FB923C;
    }
    .grid-char-tile.circled {
      background: #FEF2F2 !important;
      border-color: #EF4444 !important;
      box-shadow: 0 6px 0 #DC2626 !important;
      color: #B91C1C !important;
    }
    .red-ring-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      font-size: 1.35rem;
      line-height: 1;
      display: none;
    }
    .grid-char-tile.circled .red-ring-badge {
      display: block;
    }

    /* 煙花粒子 */
    .confetti-piece {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFall 1.3s ease-out forwards;
    }
    @keyframes confettiFall {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(0.4); opacity: 0; }
    }

    /* 成績報告表格 */
    .report-table { width: 100%; border-collapse: collapse; border-radius: 18px; overflow: hidden; font-size: 1.1rem; }
    .report-table th { background: #F59E0B; color: #FFFFFF; padding: 12px 10px; font-weight: 900; text-align: center; }
    .report-table td { padding: 12px 10px; border-bottom: 2px solid #FEF3C7; text-align: center; font-weight: 800; color: #1E293B; }
    .report-table tr:nth-child(even) td { background: #FFFBEB; }
  </style>
</head>

      <button
