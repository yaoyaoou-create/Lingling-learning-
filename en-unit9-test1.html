<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unit 9 Test 1：Time to eat 3D 魔法闖關 - 玲玲學習樂園</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=1">
  <script src="voice-engine.js?v=1"></script>
  <script src="report-hub.js?v=2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      display: block !important;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      font-family: 'Fredoka', 'Noto Sans TC', 'PingFang HK', sans-serif;
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      color: #1e293b;
      overflow-x: hidden;
    }
    .stage-card {
      background: linear-gradient(to bottom, #fffdf8, #ffe5b4);
      border: 6px solid #ffffff;
      border-bottom-width: 12px;
      border-bottom-color: #e2e8f0;
      border-radius: 32px;
      box-shadow: 0 18px 36px rgba(31, 38, 135, 0.25);
    }
    .toy-btn {
      border-width: 4px;
      border-bottom-width: 9px;
      border-radius: 24px;
      transition: transform 0.1s ease, border-bottom-width 0.1s ease;
      cursor: pointer;
    }
    .toy-btn:active {
      transform: translateY(4px);
      border-bottom-width: 5px;
    }
    .pulse-speaker {
      animation: speakerPulse 2.1s infinite;
    }
    @keyframes speakerPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.55); transform: scale(1); }
      50% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); transform: scale(1.04); }
    }
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .wrong-shake { animation: shakeWrong 0.35s ease; }
    .map-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      border: 2px solid rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.22);
      color: #ffffff;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .map-pill.active {
      background: #fbbf24;
      border-color: #ffffff;
      color: #78350f;
      transform: scale(1.06);
    }
    .map-pill.done {
      background: #34d399;
      border-color: #ffffff;
      color: #064e3b;
    }
    .confetti-piece {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      z-index: 9999;
      pointer-events: none;
      animation: fallConfetti 1.6s ease-out forwards;
    }
    @keyframes fallConfetti {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body class="p-3 sm:p-5">

  <!-- iPad 首次點擊啟動解鎖遮罩 -->
  <div id="unlockOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(30, 27, 75, 0.82); backdrop-filter: blur(6px);">
    <div class="stage-card max-w-md w-full p-7 text-center">
      <div class="text-6xl mb-3">🍞🥚🍚🐟🥩</div>
      <div class="inline-block bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full mb-2">Unit 9 · Time to eat</div>
      <h1 class="text-3xl font-extrabold text-indigo-900 mb-2">英文 3D 魔法闖關</h1>
      <p class="text-base font-bold text-slate-600 mb-6">Test 1：食物詞彙、句型與 /m/ 溫故知新</p>
      <button onclick="startQuizUnlocked()" class="toy-btn pulse-speaker w-full py-4 px-6 bg-amber-400 border-amber-500 border-b-amber-600 text-amber-950 text-2xl font-extrabold">
        🔊 開始闖關！
      </button>
    </div>
  </div>

  <div class="max-w-3xl mx-auto flex flex-col gap-3">
    <!-- 頂部導航與關卡地圖 -->
    <header class="flex flex-wrap items-center justify-between gap-2 bg-white/15 backdrop-blur-md rounded-2xl p-2.5 border-2 border-white/30">
      <button onclick="goBackHome()" class="toy-btn bg-white border-indigo-200 border-b-indigo-300 text-indigo-900 px-3.5 py-1.5 text-sm font-extrabold">
        🏠 返回
      </button>
      <div class="flex items-center gap-1.5 flex-wrap justify-center" id="levelMap">
        <button class="map-pill active" onclick="jumpLevel(0)">0. 預習</button>
        <button class="map-pill" onclick="jumpLevel(1)">L1</button>
        <button class="map-pill" onclick="jumpLevel(2)">L2</button>
        <button class="map-pill" onclick="jumpLevel(3)">L3</button>
        <button class="map-pill" onclick="jumpLevel(4)">L4</button>
        <button class="map-pill" onclick="jumpLevel(5)">L5</button>
      </div>
      <span class="text-xs font-extrabold text-white bg-indigo-900/40 px-3 py-1.5 rounded-xl">Unit 9 Test 1</span>
    </header>

    <!-- 主舞台卡片 -->
    <main class="stage-card p-4 sm:p-6 flex flex-col gap-4 min-h-[540px] justify-between">
      <!-- Anna 老師常駐黃色橫幅 -->
      <button id="annaBanner" onclick="replayCurrentPrompt()" class="toy-btn w-full bg-amber-100 border-amber-300 border-b-amber-400 p-3 sm:p-4 flex items-center gap-3 text-left">
        <div class="w-12 h-12 rounded-full bg-amber-300 flex items-center justify-center text-3xl shrink-0 shadow-inner">🧚‍♀️</div>
        <div class="flex-1">
          <div class="text-xs font-extrabold text-amber-700" id="annaSub">Anna 老師導航（撳我可以重聽題目 🔊）</div>
          <div class="text-base sm:text-lg font-extrabold text-slate-800 leading-snug" id="annaText">歡迎來到 Unit 9 美食魔法大闖關！</div>
        </div>
        <div class="text-2xl shrink-0">🔊</div>
      </button>

      <!-- 動態互動內容區 -->
      <div id="stageBody" class="flex-1 flex flex-col items-center justify-center w-full"></div>

      <!-- 底部操作區 -->
      <div id="stageFooter" class="flex items-center justify-center gap-3 pt-1"></div>
    </main>
  </div>

  <script>
    // ========= 1. 集中式 AUDIO_MAP（100% 核對英文總庫第四部分真實檔名） =========
    const AUDIO_MAP = {
      bread: 'en-bread.mp3',
      eggs: 'en-eggs.mp3',
      rice: 'en-rice.mp3',
      fish: 'en-fish.mp3',
      meat: 'en-meat.mp3',
      milk: 'en-milk.mp3',
      mouth: 'en-mouth.mp3',
      m_sound: 'en-m-sound.mp3',
      do_you_like_bread: 'en-do-you-like-bread.mp3',
      i_like_rice: 'en-i-like-rice.mp3',
      yes_it_is: 'en-yes-it-is.mp3',
      no_it_is_not: 'en-no-it-is-not.mp3',
      a: 'en-a.mp3', b: 'en-b.mp3', c: 'en-c.mp3', d: 'en-d.mp3', e: 'en-e.mp3',
      f: 'en-f.mp3', g: 'en-g.mp3', h: 'en-h.mp3', i: 'en-i.mp3', m: 'en-m.mp3',
      r: 'en-r.mp3', s: 'en-s.mp3', t: 'en-t.mp3'
    };

    // ========= 2. 題庫設定 =========
    const PREVIEW_WORDS = [
      { key: 'bread', word: 'bread', emoji: '🍞', tip: '兩塊厚多士 b / d' },
      { key: 'eggs', word: 'eggs', emoji: '🥚', tip: '兩隻圓雞蛋 g g' },
      { key: 'rice', word: 'rice', emoji: '🍚', tip: '香噴噴白飯' },
      { key: 'fish', word: 'fish', emoji: '🐟', tip: '釣魚竿 f 開頭' },
      { key: 'meat', word: 'meat', emoji: '🥩', tip: '摸肚仔 m 開頭' }
    ];

    const L1_QS = [
      { key: 'bread', word: 'bread', options: ['bread', 'eggs', 'rice', 'fish'], label: 'L1 Q1 聽音選字(bread)' },
      { key: 'meat', word: 'meat', options: ['meat', 'rice', 'fish', 'bread'], label: 'L1 Q2 聽音選字(meat)' }
    ];

    const L2_QS = [
      { key: 'eggs', word: 'eggs', emoji: '🥚🥚', options: ['eggs', 'bread', 'rice', 'meat'], label: 'L2 Q1 圖文配對(eggs)' },
      { key: 'fish', word: 'fish', emoji: '🐟', options: ['fish', 'meat', 'eggs', 'rice'], label: 'L2 Q2 圖文配對(fish)' }
    ];

    const L3_QS = [
      {
        emoji: '🍞',
        audioKey: 'do_you_like_bread',
        zhPrompt: '睇清楚 Tickles 貓咪手上拎住嘅係咪佢講緊嗰樣食物？啱就撳 Yes，唔啱就撳 No！',
        answer: 'yes',
        label: 'L3 Q1 Tickles問答(bread-Yes)'
      },
      {
        emoji: '🐟',
        audioKey: 'i_like_rice',
        zhPrompt: '小心陷阱呀！聽清楚 Tickles 講嘅同佢手上拎住嘅係咪同一樣食物？',
        answer: 'no',
        label: 'L3 Q2 Tickles陷阱(rice vs fish-No)'
      }
    ];

    const L4_CARDS = [
      { key: 'meat', word: 'meat', emoji: '🥩', isTarget: true },
      { key: 'milk', word: 'milk', emoji: '🥛', isTarget: true },
      { key: 'mouth', word: 'mouth', emoji: '👄', isTarget: true },
      { key: 'fish', word: 'fish', emoji: '🐟', isTarget: false }
    ];

    const L5_SPELL = [
      { key: 'rice', word: 'rice', emoji: '🍚', letters: ['c', 'r', 'e', 'i'], label: 'L5A Q1 拼寫(rice)' },
      { key: 'fish', word: 'fish', emoji: '🐟', letters: ['s', 'f', 'h', 'i'], label: 'L5A Q2 拼寫(fish)' }
    ];

    // ========= 3. 全局狀態與安全計時器 =========
    let currentLevel = 0; // 0..5, 6=Summary
    let subIdx = 0;
    let isLocked = false;
    let currentReplayFn = null;
    let stepTimer = null;
    let l4Found = new Set();
    let l5Typed = [];
    let mistakes = [];
    let reportSent = false;

    function clearTimersAndVoice() {
      if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
      if (window.LinglingVoice) window.LinglingVoice.stop();
    }

    function recordMistake(tag) {
      if (!mistakes.includes(tag)) mistakes.push(tag);
    }

    function burstConfetti() {
      const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
      for (let i = 0; i < 28; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-10px';
        el.style.background = colors[i % colors.length];
        el.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }
    }

    function startQuizUnlocked() {
      if (window.LinglingVoice) window.LinglingVoice.unlock();
      document.getElementById('unlockOverlay').style.display = 'none';
      jumpLevel(0);
    }

    function goBackHome() {
      clearTimersAndVoice();
      window.location.href = 'index.html';
    }

    function replayCurrentPrompt() {
      if (typeof currentReplayFn === 'function') currentReplayFn();
    }

    function updateLevelMap() {
      const pills = document.querySelectorAll('#levelMap .map-pill');
      pills.forEach((p, idx) => {
        p.classList.remove('active', 'done');
        if (idx === currentLevel) p.classList.add('active');
        else if (idx < currentLevel) p.classList.add('done');
      });
    }

    function jumpLevel(lv) {
      clearTimersAndVoice();
      isLocked = false;
      currentLevel = lv;
      subIdx = 0;
      l4Found.clear();
      l5Typed = [];
      updateLevelMap();

      if (lv === 0) renderStep0();
      else if (lv === 1) renderLevel1();
      else if (lv === 2) renderLevel2();
      else if (lv === 3) renderLevel3();
      else if (lv === 4) renderLevel4();
      else if (lv === 5) renderLevel5A();
      else renderSummary();
    }

    // ========= Step 0：預習大廳 =========
    function renderStep0() {
      document.getElementById('annaText').textContent = '歡迎嚟到美食預習大廳！點一下每張食物積木卡聽發音，準備好就出發闖關！';
      currentReplayFn = () => window.LinglingVoice.playZh('歡迎嚟到 Unit 9 美食預習大廳！點一下每張食物積木卡聽發音，準備好就撳下面開始第一關啦！');
      currentReplayFn();

      document.getElementById('stageBody').innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 w-full max-w-2xl">
          ${PREVIEW_WORDS.map(item => `
            <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP['${item.key}'])"
              class="toy-btn bg-white border-sky-300 border-b-sky-400 p-4 flex flex-col items-center gap-1">
              <span class="text-5xl">${item.emoji}</span>
              <span class="text-2xl font-extrabold text-indigo-900">${item.word}</span>
              <span class="text-xs font-bold text-slate-500">${item.tip}</span>
            </button>
          `).join('')}
        </div>
      `;
      document.getElementById('stageFooter').innerHTML = `
        <button onclick="jumpLevel(1)" class="toy-btn bg-emerald-400 border-emerald-500 border-b-emerald-600 text-emerald-950 px-8 py-3 text-xl font-extrabold">
          🚀 準備好喇！去 Level 1
        </button>
      `;
    }

    // ========= Level 1：無圖聽音選字（嚴格零劇透） =========
    function renderLevel1() {
      const q = L1_QS[subIdx];
      isLocked = false;
      document.getElementById('annaText').textContent = `Level 1 無圖聽音選字（${subIdx + 1}/${L1_QS.length}）：聽清楚英文讀音，撳出正確嘅單字積木！`;
      const zh = subIdx === 0 ? '第一關，無圖聽音選字！聽清楚呢個係邊個食物單字？' : '下一題，聽清楚呢個係邊個單字？';
      currentReplayFn = () => window.LinglingVoice.playHybrid(zh, AUDIO_MAP[q.key]);
      currentReplayFn();

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      const colors = [
        'bg-rose-100 border-rose-300 border-b-rose-400 text-rose-900',
        'bg-sky-100 border-sky-300 border-b-sky-400 text-sky-900',
        'bg-emerald-100 border-emerald-300 border-b-emerald-400 text-emerald-900',
        'bg-violet-100 border-violet-300 border-b-violet-400 text-violet-900'
      ];

      document.getElementById('stageBody').innerHTML = `
        <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP['${q.key}'])"
          class="toy-btn pulse-speaker bg-amber-300 border-amber-400 border-b-amber-500 w-32 h-32 rounded-full flex flex-col items-center justify-center mb-6">
          <span class="text-6xl">👂</span>
          <span class="text-xs font-extrabold text-amber-950">再聽一次</span>
        </button>
        <div class="grid grid-cols-2 gap-4 w-full max-w-lg">
          ${shuffled.map((opt, idx) => `
            <button onclick="checkL1(this, '${opt}')" class="toy-btn ${colors[idx % 4]} py-5 px-4 text-3xl font-extrabold">
              ${opt}
            </button>
          `).join('')}
        </div>
      `;
      document.getElementById('stageFooter').innerHTML = '';
    }

    function checkL1(btn, picked) {
      if (isLocked) return;
      const q = L1_QS[subIdx];
      if (picked === q.word) {
        isLocked = true;
        btn.classList.add('ring-4', 'ring-emerald-400', 'scale-105');
        document.getElementById('annaText').textContent = `🌟 好叻呀！答啱咗「${q.word}」！`;
        window.LinglingVoice.playHybrid('好叻呀！呢個就係', AUDIO_MAP[q.key]);
        stepTimer = setTimeout(() => {
          if (subIdx < L1_QS.length - 1) { subIdx++; renderLevel1(); }
          else jumpLevel(2);
        }, 1700);
      } else {
        recordMistake(q.label);
        btn.classList.add('wrong-shake');
        document.getElementById('annaText').textContent = '差少少咋！撳中間隻大耳仔再聽清楚啲啦！';
        window.LinglingVoice.playHybrid('差少少咋，再聽清楚啲再試過！', AUDIO_MAP[q.key]);
        setTimeout(() => btn.classList.remove('wrong-shake'), 400);
      }
    }

    // ========= Level 2：圖文配對 =========
    function renderLevel2() {
      const q = L2_QS[subIdx];
      isLocked = false;
      document.getElementById('annaText').textContent = `Level 2 圖文配對（${subIdx + 1}/${L2_QS.length}）：睇下中間幅圖同聽發音，搵出正確單字！`;
      const zh = subIdx === 0 ? '第二關，圖文配對！睇下呢個係咩食物呀？' : '再嚟一題圖文配對，呢個係咩呀？';
      currentReplayFn = () => window.LinglingVoice.playHybrid(zh, AUDIO_MAP[q.key]);
      currentReplayFn();

      const shuffled = [...q.options].sort(() => Math.random() - 0.5);
      const colors = [
        'bg-amber-100 border-amber-300 border-b-amber-400 text-amber-900',
        'bg-teal-100 border-teal-300 border-b-teal-400 text-teal-900',
        'bg-pink-100 border-pink-300 border-b-pink-400 text-pink-900',
        'bg-indigo-100 border-indigo-300 border-b-indigo-400 text-indigo-900'
      ];

      document.getElementById('stageBody').innerHTML = `
        <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP['${q.key}'])"
          class="toy-btn pulse-speaker bg-white border-amber-300 border-b-amber-400 px-10 py-5 mb-6 flex flex-col items-center">
          <span class="text-7xl leading-none">${q.emoji}</span>
          <span class="text-xs font-extrabold text-amber-700 mt-2">🔊 點圖案重聽</span>
        </button>
        <div class="grid grid-cols-2 gap-4 w-full max-w-lg">
          ${shuffled.map((opt, idx) => `
            <button onclick="checkL2(this, '${opt}')" class="toy-btn ${colors[idx % 4]} py-5 px-4 text-3xl font-extrabold">
              ${opt}
            </button>
          `).join('')}
        </div>
      `;
      document.getElementById('stageFooter').innerHTML = '';
    }

    function checkL2(btn, picked) {
      if (isLocked) return;
      const q = L2_QS[subIdx];
      if (picked === q.word) {
        isLocked = true;
        btn.classList.add('ring-4', 'ring-emerald-400', 'scale-105');
        document.getElementById('annaText').textContent = `🎉 答啱晒！「${q.word}」！`;
        window.LinglingVoice.playHybrid('答啱晒！好叻呀！', AUDIO_MAP[q.key]);
        stepTimer = setTimeout(() => {
          if (subIdx < L2_QS.length - 1) { subIdx++; renderLevel2(); }
          else jumpLevel(3);
        }, 1700);
      } else {
        recordMistake(q.label);
        btn.classList.add('wrong-shake');
        document.getElementById('annaText').textContent = '唔係呢個字呀，撳大圖案聽多一次先！';
        window.LinglingVoice.playHybrid('再聽多次英文發音，睇清楚字頭字母呀！', AUDIO_MAP[q.key]);
        setTimeout(() => btn.classList.remove('wrong-shake'), 400);
      }
    }

    // ========= Level 3：Tickles 餐廳陷阱問答 (Yes / No) =========
    function renderLevel3() {
      const q = L3_QS[subIdx];
      isLocked = false;
      document.getElementById('annaText').textContent = `Level 3 Tickles 餐廳陷阱（${subIdx + 1}/${L3_QS.length}）：${q.zhPrompt}`;
      currentReplayFn = () => window.LinglingVoice.playHybrid(q.zhPrompt, AUDIO_MAP[q.audioKey]);
      currentReplayFn();

      document.getElementById('stageBody').innerHTML = `
        <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP['${q.audioKey}'])"
          class="toy-btn pulse-speaker bg-white border-violet-300 border-b-violet-400 px-8 py-5 mb-6 flex items-center gap-6">
          <div class="flex flex-col items-center">
            <span class="text-6xl">🐱</span>
            <span class="text-xs font-extrabold text-violet-700 mt-1">Tickles</span>
          </div>
          <div class="text-6xl bg-amber-50 border-2 border-amber-200 rounded-2xl px-5 py-3">${q.emoji}</div>
          <div class="text-2xl">🔊</div>
        </button>
        <div class="grid grid-cols-2 gap-5 w-full max-w-md">
          <button onclick="checkL3(this, 'yes')" class="toy-btn bg-emerald-400 border-emerald-500 border-b-emerald-600 text-emerald-950 py-5 text-3xl font-extrabold">
            👍 YES
          </button>
          <button onclick="checkL3(this, 'no')" class="toy-btn bg-rose-400 border-rose-500 border-b-rose-600 text-white py-5 text-3xl font-extrabold">
            🙅‍♀️ NO
          </button>
        </div>
      `;
      document.getElementById('stageFooter').innerHTML = '';
    }

    function checkL3(btn, picked) {
      if (isLocked) return;
      const q = L3_QS[subIdx];
      if (picked === q.answer) {
        isLocked = true;
        const replyAudio = q.answer === 'yes' ? AUDIO_MAP.yes_it_is : AUDIO_MAP.no_it_is_not;
        document.getElementById('annaText').textContent = '🌟 好醒目呀！完全呃唔到玲玲！';
        window.LinglingVoice.playHybrid('好醒目呀玲玲！答啱喇！', replyAudio);
        stepTimer = setTimeout(() => {
          if (subIdx < L3_QS.length - 1) { subIdx++; renderLevel3(); }
          else jumpLevel(4);
        }, 1900);
      } else {
        recordMistake(q.label);
        btn.classList.add('wrong-shake');
        document.getElementById('annaText').textContent = '嘻嘻，差啲中計呀！撳 Tickles 聽多一次佢講緊咩食物！';
        window.LinglingVoice.playHybrid('差啲中計呀，聽多一次 Tickles 講咩食物再揀！', AUDIO_MAP[q.audioKey]);
        setTimeout(() => btn.classList.remove('wrong-shake'), 400);
      }
    }

    // ========= Level 4：Phonics /m/ 聲音捉迷藏（結合 Unit 9 meat 溫故知新） =========
    function renderLevel4() {
      l4Found.clear();
      isLocked = false;
      document.getElementById('annaText').textContent = 'Level 4 Phonics 捉迷藏：搵出 3 個用「mmm」音開頭嘅單字，小心避開唔同首音嘅魚仔呀！';
      currentReplayFn = () => window.LinglingVoice.playHybrid('第四關，聲音捉迷藏！搵出三個用 mmm 音開頭嘅單字呀！', AUDIO_MAP.m_sound);
      currentReplayFn();

      const shuffled = [...L4_CARDS].sort(() => Math.random() - 0.5);
      document.getElementById('stageBody').innerHTML = `
        <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP.m_sound)"
          class="toy-btn pulse-speaker bg-amber-300 border-amber-400 border-b-amber-500 text-amber-950 px-7 py-3 mb-5 text-xl font-extrabold">
          🔊 聽首音 /m/ (mmm)
        </button>
        <div class="grid grid-cols-2 gap-4 w-full max-w-lg">
          ${shuffled.map(c => `
            <button id="l4-${c.key}" onclick="pickL4('${c.key}', ${c.isTarget})"
              class="toy-btn bg-white border-sky-300 border-b-sky-400 p-4 flex flex-col items-center gap-1">
              <span class="text-5xl">${c.emoji}</span>
              <span class="text-2xl font-extrabold text-slate-800">${c.word}</span>
            </button>
          `).join('')}
        </div>
      `;
      document.getElementById('stageFooter').innerHTML = `<div id="l4Progress" class="text-base font-extrabold text-indigo-800">已搵到：0 / 3 個 /m/ 單字</div>`;
    }

    function pickL4(key, isTarget) {
      if (isLocked || l4Found.has(key)) return;
      const btn = document.getElementById(`l4-${key}`);
      if (isTarget) {
        l4Found.add(key);
        btn.classList.remove('bg-white', 'border-sky-300', 'border-b-sky-400');
        btn.classList.add('bg-emerald-200', 'border-emerald-400', 'border-b-emerald-500');
        document.getElementById('l4Progress').textContent = `已搵到：${l4Found.size} / 3 個 /m/ 單字`;
        window.LinglingVoice.playMp3(AUDIO_MAP[key]);

        if (l4Found.size === 3) {
          isLocked = true;
          burstConfetti();
          document.getElementById('annaText').textContent = '🎉 搵齊晒三個 /m/ 單字（meat, milk, mouth）！準備去最後一關！';
          stepTimer = setTimeout(() => {
            window.LinglingVoice.playZh('哇！三個 mmm 開頭嘅單字全部搵齊晒！去最後一關拼字積木啦！');
            stepTimer = setTimeout(() => jumpLevel(5), 2200);
          }, 900);
        }
      } else {
        recordMistake(`L4 Phonics(/m/ 誤選 ${key})`);
        btn.classList.add('wrong-shake');
        document.getElementById('annaText').textContent = `留意聽清楚，${key} 唔係 mmm 音開頭呀，再搵過啦！`;
        window.LinglingVoice.playQueue([
          { type: 'mp3', file: AUDIO_MAP[key] },
          { type: 'zh', text: '呢個唔係 mmm 音開頭呀，再搵過啦！' }
        ]);
        setTimeout(() => btn.classList.remove('wrong-shake'), 400);
      }
    }

    // ========= Level 5A：字母拼寫積木 =========
    function renderLevel5A() {
      const q = L5_SPELL[subIdx];
      l5Typed = [];
      isLocked = false;
      document.getElementById('annaText').textContent = `Level 5A 拼寫積木（${subIdx + 1}/${L5_SPELL.length}）：聽發音，順序撳字母積木拼出呢個單字！`;
      const zh = subIdx === 0 ? '最後一關拼寫積木！聽清楚，幫我順序拼出呢個字！' : '仲有最後一個字，聽清楚順序拼出嚟！';
      currentReplayFn = () => window.LinglingVoice.playHybrid(zh, AUDIO_MAP[q.key]);
      currentReplayFn();

      document.getElementById('stageBody').innerHTML = `
        <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP['${q.key}'])"
          class="toy-btn pulse-speaker bg-white border-amber-300 border-b-amber-400 px-8 py-4 mb-5 flex items-center gap-4">
          <span class="text-6xl">${q.emoji}</span>
          <span class="text-lg font-extrabold text-amber-800">🔊 聽單字</span>
        </button>

        <div class="flex items-center justify-center gap-3 mb-6" id="spellSlots">
          ${q.word.split('').map((_, idx) => `
            <div id="slot-${idx}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-4 border-dashed border-indigo-300 bg-white flex items-center justify-center text-4xl font-extrabold text-indigo-900"></div>
          `).join('')}
        </div>

        <div class="flex items-center justify-center gap-3 flex-wrap">
          ${q.letters.map((ch, idx) => `
            <button id="tile-${idx}" onclick="pickLetter(${idx}, '${ch}')"
              class="toy-btn bg-sky-200 border-sky-400 border-b-sky-500 text-sky-950 w-16 h-16 sm:w-20 sm:h-20 text-4xl font-extrabold">
              ${ch}
            </button>
          `).join('')}
        </div>
      `;
      document.getElementById('stageFooter').innerHTML = '';
    }

    function pickLetter(tileIdx, ch) {
      if (isLocked) return;
      const q = L5_SPELL[subIdx];
      const expected = q.word[l5Typed.length];
      const tileBtn = document.getElementById(`tile-${tileIdx}`);

      if (ch === expected) {
        const slotEl = document.getElementById(`slot-${l5Typed.length}`);
        slotEl.textContent = ch;
        slotEl.classList.remove('border-dashed', 'border-indigo-300');
        slotEl.classList.add('border-emerald-400', 'bg-emerald-50');
        tileBtn.style.visibility = 'hidden';
        l5Typed.push(ch);

        if (AUDIO_MAP[ch]) window.LinglingVoice.playMp3(AUDIO_MAP[ch]);

        if (l5Typed.length === q.word.length) {
          isLocked = true;
          burstConfetti();
          document.getElementById('annaText').textContent = `🌟 成功拼出「${q.word}」！你好叻呀！`;
          stepTimer = setTimeout(() => {
            window.LinglingVoice.playMp3(AUDIO_MAP[q.key]);
            stepTimer = setTimeout(() => {
              if (subIdx < L5_SPELL.length - 1) { subIdx++; renderLevel5A(); }
              else renderLevel5B();
            }, 1500);
          }, 700);
        }
      } else {
        recordMistake(`${q.label}(誤按 ${ch})`);
        tileBtn.classList.add('wrong-shake');
        window.LinglingVoice.playZh('順序差少少咋，再聽下字母音試多一次！');
        setTimeout(() => tileBtn.classList.remove('wrong-shake'), 400);
      }
    }

    // ========= Level 5B：親子口語打卡 =========
    function renderLevel5B() {
      isLocked = false;
      document.getElementById('annaText').textContent = 'Level 5B 親子口語打卡：請玲玲企直（Stand straight），跟住下面兩句大聲讀畀媽媽聽！';
      currentReplayFn = () => window.LinglingVoice.playQueue([
        { type: 'zh', text: '最後一步，親子口語打卡！請玲玲企直，點下面兩句英文跟住大聲讀畀媽媽聽！' },
        { type: 'mp3', file: AUDIO_MAP.do_you_like_bread }
      ]);
      currentReplayFn();

      document.getElementById('stageBody').innerHTML = `
        <div class="w-full max-w-lg flex flex-col gap-4">
          <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP.do_you_like_bread)"
            class="toy-btn pulse-speaker bg-white border-amber-300 border-b-amber-400 p-4 flex items-center justify-between text-left">
            <div>
              <div class="text-xs font-extrabold text-amber-700">句型 1（點擊聽示範）</div>
              <div class="text-xl sm:text-2xl font-extrabold text-indigo-900">🍞 Do you like bread? Yes, I do.</div>
            </div>
            <span class="text-3xl ml-2">🔊</span>
          </button>

          <button onclick="window.LinglingVoice.playMp3(AUDIO_MAP.i_like_rice)"
            class="toy-btn bg-white border-sky-300 border-b-sky-400 p-4 flex items-center justify-between text-left">
            <div>
              <div class="text-xs font-extrabold text-sky-700">句型 2（點擊聽示範）</div>
              <div class="text-xl sm:text-2xl font-extrabold text-indigo-900">🍚 I like rice.</div>
            </div>
            <span class="text-3xl ml-2">🔊</span>
          </button>
        </div>
      `;

      document.getElementById('stageFooter').innerHTML = `
        <button onclick="finishAllLevels()" class="toy-btn bg-emerald-400 border-emerald-500 border-b-emerald-600 text-emerald-950 px-8 py-3.5 text-xl font-extrabold">
          ✅ 媽媽確認讀得超棒！領取獎盃 🏆
        </button>
      `;
    }

    function finishAllLevels() {
      burstConfetti();
      currentLevel = 6;
      updateLevelMap();
      renderSummary();
    }

    // ========= 結算畫面與雲端戰報自動同步 =========
    function renderSummary() {
      clearTimersAndVoice();
      const mistakeSummary = mistakes.length === 0
        ? '零失誤一次過關！'
        : `期間曾試錯：${mistakes.join('、')}`;

      const reportText = `【英文闖關測驗回報】Unit 9 Test 1 (en-unit9-test1.html) | 食物詞彙 (bread, eggs, rice, fish, meat)、句型 (Do you like bread? / I like rice.)、Phonics /m/ 溫故知新與拼寫 (rice, fish) 全部通關！ | 診斷：${mistakeSummary}`;

      if (!reportSent && window.LinglingReport) {
        window.LinglingReport.save('英文闖關測驗', 'Unit 9 Test 1', reportText);
        reportSent = true;
      }

      document.getElementById('annaText').textContent = '🎉 恭喜玲玲完成 Unit 9 Test 1 全部五大魔法關卡！你係最叻嘅小美食家！';
      window.LinglingVoice.playZh('哇！恭喜玲玲完成 Unit 9 Test 1 全部五大關卡！你真係好棒呀！');

      document.getElementById('stageBody').innerHTML = `
        <div class="w-full max-w-lg bg-white rounded-3xl border-4 border-amber-300 p-5 text-center flex flex-col items-center gap-3">
          <div class="text-6xl leading-none">🏆🍞🍚🐟🎉</div>
          <h2 class="text-2xl font-extrabold text-indigo-900">Unit 9 Test 1 圓滿通關！</h2>
          <div class="inline-block bg-emerald-100 text-emerald-800 text-xs font-extrabold px-4 py-1.5 rounded-full">
            ☁️ 戰報已自動同步至家長戰報箱
          </div>
          <div class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 text-left text-sm font-bold text-slate-700">
            <div>📊 <strong>家長診斷</strong>：${mistakeSummary}</div>
          </div>
          <div id="reportBox" class="w-full bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-left text-xs text-slate-600 break-all">${reportText}</div>
        </div>
      `;

      document.getElementById('stageFooter').innerHTML = `
        <button onclick="copyEnglishReport()" class="toy-btn bg-amber-300 border-amber-400 border-b-amber-500 text-amber-950 px-5 py-2.5 text-base font-extrabold">
          📋 一鍵複製測驗暗號
        </button>
        <button onclick="goBackHome()" class="toy-btn bg-indigo-500 border-indigo-600 border-b-indigo-700 text-white px-6 py-2.5 text-base font-extrabold">
          🏠 返回學習樂園
        </button>
      `;
    }

    function copyEnglishReport() {
      const txt = document.getElementById('reportBox').textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(() => alert('已複製 Unit 9 Test 1 測驗暗號！'));
      }
    }
  </script>
</body>
</html>
