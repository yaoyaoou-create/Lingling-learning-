let unlockedDay = parseInt(localStorage.getItem('lingling_cn_p21_unlocked_day') || '1', 10);
let completedDays = JSON.parse(localStorage.getItem('lingling_cn_p21_done_days') || '[]');
let wrongCounts = JSON.parse(localStorage.getItem('lingling_cn_p21_errors') || '{}');

let currentDayIdx = 0;
let currentSlideIdx = 0;
let currentSpeech = '';
let circledCountInSlide = 0;

function speakText(text, rate = 0.72) {
  currentSpeech = text;
  document.getElementById('tutor-text').innerText = text;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK';
    u.rate = rate;
    window.speechSynthesis.speak(u);
  }
}

function saveState() {
  localStorage.setItem('lingling_cn_p21_unlocked_day', String(unlockedDay));
  localStorage.setItem('lingling_cn_p21_done_days', JSON.stringify(completedDays));
  localStorage.setItem('lingling_cn_p21_errors', JSON.stringify(wrongCounts));
}

// 顯示 10 日進度大門（預設直接凸顯今日應上課堂）
function renderDayMap() {
  document.getElementById('back-map-btn').style.display = 'none';
  const todayTarget = Math.min(unlockedDay, 10);
  const todayLesson = dailyLessons[todayTarget - 1];

  speakText(`哈囉小寶貝！今日係我哋嘅第 ${todayTarget} 日課堂：「${todayLesson.title}」，快啲撳中間大大個粉紅色掣開始上堂啦！`, 0.75);

  let gridHtml = dailyLessons.map(d => {
    const isDone = completedDays.includes(d.day);
    const isUnlocked = d.day <= unlockedDay;
    const isToday = d.day === todayTarget;
    let statusIcon = isDone ? '✅' : (isUnlocked ? '🌟' : '🔒');
    let cls = isDone ? 'completed' : (isToday ? 'today' : (!isUnlocked ? 'locked' : ''));
    return `
      <div class="day-card ${cls}" onclick="${isUnlocked ? `startDay(${d.day - 1})` : `speakText('呢一課係 Day ${d.day}，要完成咗今日嘅課堂先至會自動解鎖喔！', 0.75)`}">
        <div style="font-size:1.3rem;">${statusIcon}</div>
        <div style="font-weight:900; font-size:0.9rem; color:#831843;">Day ${d.day}</div>
        <div style="font-size:0.7rem; color:#64748b; font-weight:700;">P.21-25</div>
      </div>
    `;
  }).join('');

  document.getElementById('stage-content').innerHTML = `
    <div style="background:white; border:4px solid #ec4899; border-radius:22px; padding:14px 20px; width:95%; box-shadow:0 6px 16px rgba(236,72,153,0.15);">
      <div style="font-size:0.9rem; font-weight:900; color:#db2777;">📅 今日專屬自動解鎖課堂（約 8 分鐘‧做完即止）</div>
      <div style="font-size:1.45rem; font-weight:900; color:#831843; margin:6px 0;">${todayLesson.title}</div>
      <div style="font-size:0.9rem; color:#475569; font-weight:800; margin-bottom:10px;">${todayLesson.desc}（共 ${todayLesson.slides.length} 小步）</div>
      <button class="next-action-btn" style="font-size:1.25rem; padding:12px 32px; background:linear-gradient(135deg, #ec4899 0%, #be185d 100%);" onclick="startDay(${todayTarget - 1})">
        ▶ 開始今日課堂 (Day ${todayTarget})
      </button>
    </div>
    <div class="day-map-grid">${gridHtml}</div>
  `;
}

function startDay(dayIdx) {
  currentDayIdx = dayIdx;
  currentSlideIdx = 0;
  document.getElementById('back-map-btn').style.display = 'inline-block';
  renderCurrentSlide();
}

function renderCurrentSlide() {
  const lesson = dailyLessons[currentDayIdx];
  const slides = lesson.slides;

  // 若已完成當日所有步驟 -> 顯示今日畢業獎盃頁（做完即止）
  if (currentSlideIdx >= slides.length) {
    if (!completedDays.includes(lesson.day)) {
      completedDays.push(lesson.day);
    }
    if (unlockedDay <= lesson.day && unlockedDay < 10) {
      unlockedDay = lesson.day + 1;
    }
    saveState();

    speakText(`太棒啦！今日 Day ${lesson.day} 嘅課堂已經全部完成啦！妳攞到今日嘅超級大獎盃！而家可以收起 iPad，去搵媽媽睇報告同抱抱妳，聽日再玩 Day ${Math.min(lesson.day + 1, 10)} 啦！`, 0.75);

    document.getElementById('stage-content').innerHTML = `
      <div style="background:white; border:4px solid #f59e0b; border-radius:24px; padding:18px; width:92%; max-width:480px;">
        <div style="font-size:4rem;">🏆🎉</div>
        <div style="font-size:1.5rem; font-weight:900; color:#b45309; margin:6px 0;">Day ${lesson.day} 今日下課啦！</div>
        <div style="font-size:0.95rem; font-weight:800; color:#475569; margin-bottom:14px;">
          小寶貝今日好專心跟老師學晒所有內容！<br>聽日嘅 <b>Day ${Math.min(lesson.day + 1, 10)}</b> 已經為妳自動解鎖啦！
        </div>
        <button class="next-action-btn" onclick="showMomReport()">👩 叫媽媽睇今日 1 分鐘報告</button>
      </div>
    `;
    return;
  }

  const slide = slides[currentSlideIdx];
  const dotsHtml = slides.map((_, idx) => {
    let cls = idx < currentSlideIdx ? 'done' : (idx === currentSlideIdx ? 'active' : '');
    return `<div class="dot ${cls}"></div>`;
  }).join('');

  // 類型 1：單一詞語/句式焦點教學頁（一頁只顯示一個詞）
  if (slide.type === 'teach_single') {
    speakText(slide.speech, 0.72);
    document.getElementById('stage-content').innerHTML = `
      <div class="step-dots">${dotsHtml}</div>
      <div class="single-focus-card" onclick="speakText('${slide.readTarget}', 0.65)">
        <div class="big-emoji">${slide.emoji}</div>
        ${slide.adj ? `<div class="big-adj">${slide.adj}</div>` : ''}
        <div class="big-noun">${slide.noun.replace(/\n/g, '<br>')}</div>
        <div class="char-structure-note">${slide.note}（撳卡片可慢速重聽 🔊）</div>
      </div>
      <button class="next-action-btn" onclick="goNextSlide()">🌟 我讀好啦！下一個 ➔</button>
    `;
  }
  // 類型 2：單一問題由淺入深頁（答對自動進入下一頁，答錯出溫和提示）
  else if (slide.type === 'quiz_step') {
    speakText(slide.speech, 0.72);
    let choicesHtml = slide.options.map(opt => `
      <button class="choice-btn" onclick="checkSlideQuiz('${opt}')">${opt}</button>
    `).join('');

    document.getElementById('stage-content').innerHTML = `
      <div class="step-dots">${dotsHtml}</div>
      <div style="font-size:0.95rem; font-weight:900; color:#be185d;">${slide.levelTag}</div>
      <div style="font-size:2.4rem; font-weight:900; color:#831843; background:white; padding:8px 24px; border-radius:20px; border:3px solid #fbcfe8;">
        ${slide.visual}
      </div>
      <div class="quiz-choices">${choicesHtml}</div>
      <div class="gentle-hint-box" id="slide-hint" style="display:none;"></div>
    `;
  }
  // 類型 3：兒歌尋寶圈熟字單頁
  else if (slide.type === 'poem_circle') {
    circledCountInSlide = 0;
    speakText(slide.speech, 0.72);
    let linesHtml = slide.lines.map(line => {
      let chHtml = line.split('').map(ch => {
        if ('，。？、'.includes(ch)) return ch;
        return `<span class="circle-char" onclick="tapPoemChar(this, '${ch}', ${slide.targetCount})">${ch}</span>`;
      }).join('');
      return `<div class="poem-single-line">${chHtml}</div>`;
    }).join('');

    document.getElementById('stage-content').innerHTML = `
      <div class="step-dots">${dotsHtml}</div>
      <div style="font-size:0.95rem; font-weight:900; color:#6b21a8;" id="circle-progress">${slide.title}（已圈出 0 / ${slide.targetCount} 個）</div>
      <div class="poem-stage-card">${linesHtml}</div>
      <button class="next-action-btn" onclick="goNextSlide()">🌟 圈好熟字啦！下一步 ➔</button>
    `;
  }
}

function goNextSlide() {
  currentSlideIdx++;
  renderCurrentSlide();
}

function checkSlideQuiz(selected) {
  const slide = dailyLessons[currentDayIdx].slides[currentSlideIdx];
  const hintBox = document.getElementById('slide-hint');
  if (selected === slide.answer) {
    speakText(slide.praise, 0.78);
    setTimeout(() => {
      currentSlideIdx++;
      renderCurrentSlide();
    }, 1800);
  } else {
    wrongCounts[slide.answer] = (wrongCounts[slide.answer] || 0) + 1;
    saveState();
    hintBox.style.display = 'block';
    hintBox.innerText = '💡 溫柔提示：' + slide.hint;
    speakText(slide.hint, 0.72);
  }
}

function tapPoemChar(el, ch, targetCount) {
  const slide = dailyLessons[currentDayIdx].slides[currentSlideIdx];
  if (!el.classList.contains('circled')) {
    el.classList.add('circled');
    circledCountInSlide++;
    const prog = document.getElementById('circle-progress');
    if (prog) prog.innerText = `${slide.title}（已圈出 ${circledCountInSlide} / ${targetCount} 個）`;
  }
  if (slide.knownChars.includes(ch)) {
    speakText(`好叻呀！搵到熟字「${ch}」！`, 0.75);
  } else {
    speakText(`呢個係兒歌新字「${ch}」，跟老師讀一次：${ch}！`, 0.7);
  }
}

// 媽媽 1 分鐘進度報告與全解鎖測試開關
function showMomReport() {
  document.getElementById('back-map-btn').style.display = 'inline-block';
  const errKeys = Object.keys(wrongCounts);
  let errHtml = errKeys.length === 0
    ? '<span style="color:#16a34a; font-weight:800;">目前所有問題均一次答對，無卡關字詞！</span>'
    : errKeys.map(k => `• <b>${k}</b>（觸發溫和提示 ${wrongCounts[k]} 次）`).join('<br>');

  document.getElementById('stage-content').innerHTML = `
    <div style="text-align:left; width:100%; background:white; padding:12px 16px; border-radius:18px; border:3px solid #60a5fa;">
      <h3 style="margin:0 0 6px 0; color:#1d4ed8; font-size:1.05rem;">📊 媽媽 1 分鐘激勵報告（P.21–25 每日自動解鎖紀錄）</h3>
      <p style="margin:4px 0; font-size:0.9rem;">📅 <b>目前已解鎖進度：</b> Day ${unlockedDay} / 10 日（已完成：${completedDays.length > 0 ? completedDays.map(d=>'Day '+d).join(', ') : '準備開始 Day 1'}）</p>
      <p style="margin:4px 0; font-size:0.9rem;"><b>📌 AI 導師弱項提示紀錄：</b><br>${errHtml}</p>
      <hr style="border:none; border-top:1px dashed #cbd5e1; margin:8px 0;">
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
        <button class="nav-btn" style="background:#dcfce7; border-color:#22c55e; color:#15803d;" onclick="unlockAllForMom()">🔓 媽媽測試：一鍵解鎖全部 10 日</button>
        <button class="nav-btn" style="background:#fee2e2; border-color:#ef4444; color:#b91c1c;" onclick="resetToDay1()">🔄 重設回 Day 1 鎖定狀態</button>
      </div>
    </div>
  `;
  speakText('呢個係媽媽專屬進度報告，媽媽亦可以撳綠色掣一鍵解鎖全部十日課堂嚟預覽檢查喔！', 0.82);
}

function unlockAllForMom() {
  unlockedDay = 10;
  saveState();
  renderDayMap();
}

function resetToDay1() {
  unlockedDay = 1;
  completedDays = [];
  saveState();
  renderDayMap();
}

window.onload = () => renderDayMap();
</script>
