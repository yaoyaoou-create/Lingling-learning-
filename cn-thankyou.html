<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P.21-25 《我要謝謝你》每日課堂</title>
<link rel="stylesheet" href="theme.css">
<style>
    body {
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #FFF5F5 0%, #FFFBEB 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .hub-container {
        width: 100%;
        max-width: 780px;
        background: #FFFFFF;
        border: 5px solid #F472B6;
        border-bottom-width: 10px;
        border-color: #F472B6 #F472B6 #DB2777 #F472B6;
        border-radius: 36px;
        padding: 24px;
        box-shadow: 0 12px 28px rgba(244, 114, 182, 0.15);
    }
    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
    }
    .page-title {
        font-size: 1.35rem;
        font-weight: 900;
        color: #831843;
        margin: 0;
    }
    .anna-tip {
        background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
        border: 3px solid #FCD34D;
        border-bottom-width: 6px;
        border-bottom-color: #F59E0B;
        border-radius: 20px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        font-size: 0.95rem;
        font-weight: 800;
        color: #78350F;
    }
    .days-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
    }
    .day-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px 8px;
        border-radius: 22px;
        text-decoration: none;
        border: 3px solid;
        border-bottom-width: 7px;
        transition: all 0.1s ease;
        text-align: center;
    }
    .day-card:active {
        transform: translateY(4px);
        border-bottom-width: 3px;
    }
    .day-card.unlocked {
        background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
        border-color: #34D399;
        border-bottom-color: #059669;
        color: #065F46;
    }
    .day-card.locked {
        background: #F8FAFC;
        border: 3px dashed #CBD5E1;
        border-bottom-width: 5px;
        color: #94A3B8;
        pointer-events: none;
    }
    .day-icon { font-size: 1.8rem; margin-bottom: 4px; }
    .day-num { font-size: 1.15rem; font-weight: 900; }
    .day-sub { font-size: 0.78rem; font-weight: 800; margin-top: 2px; }
    @media (max-width: 600px) {
        .days-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div class="hub-container animate-bounce-in">
    <div class="top-nav">
        <button class="btn-3d nav-btn-pink" style="padding: 8px 16px; font-size: 0.95rem;" onclick="goHome()">🏠 返回學習大門</button>
        <h1 class="page-title">🏮 P.21-25 《我要謝謝你》每日課堂</h1>
        <button class="btn-3d nav-btn-blue" style="padding: 8px 14px; font-size: 0.9rem;" onclick="goHome()">✨ 樂園首頁</button>
    </div>

    <div class="anna-tip">
        <span style="font-size: 2rem;">🐥</span>
        <span>哈囉小寶貝！今日已經解鎖到 <b>Day 2</b> 啦，快啲撳下面翠綠色嘅卡片跟 Anna 老師上堂啦！</span>
    </div>

    <div class="days-grid">
        <a href="chinese-p21-25-d1.html" class="day-card unlocked">
            <span class="day-icon">🌟</span>
            <span class="day-num">Day 1</span>
            <span class="day-sub">P.21 新字跟讀</span>
        </a>
        <a href="chinese-p21-25-d2.html" class="day-card unlocked">
            <span class="day-icon">🚀</span>
            <span class="day-num">Day 2</span>
            <span class="day-sub">錯字溫習·新詞</span>
        </a>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 3</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 4</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 5</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 6</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 7</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 8</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 9</span><span class="day-sub">敬請期待</span></div>
        <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 10</span><span class="day-sub">畢業典禮</span></div>
    </div>
</div>

<script>
    function goHome() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.pause();
            window.speechSynthesis.cancel();
        }
        setTimeout(() => {
            window.location.href = 'index.html?v=6';
        }, 60);
    }
</script>
</body>
</html>
