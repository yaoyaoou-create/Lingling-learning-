<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P.21-25 《我要謝謝你》每日課堂導航</title>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --text-main: #2D3748;
            --text-sub: #718096;
            --accent-pink: #F472B6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fef9c3 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: #FFFFFF;
            border-radius: 26px;
            border: 4px solid var(--accent-pink);
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.15);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部導航列 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #fbcfe8;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .nav-btn {
            text-decoration: none;
            background: #fdf2f8;
            border: 2px solid #f472b6;
            color: #be185d;
            padding: 6px 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .title-badge {
            font-size: 1rem;
            font-weight: 900;
            color: #9d174d;
        }

        /* 提示橫幅 */
        .banner {
            width: 100%;
            background: #fffbeb;
            border: 2px solid #fcd34d;
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .banner-icon {
            font-size: 2rem;
        }

        .banner-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: #78350f;
            line-height: 1.4;
        }

        /* 十天任務網格 */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .day-card {
            background: #FFFFFF;
            border: 3px solid #cbd5e1;
            border-radius: 18px;
            padding: 12px 6px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.15s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            min-height: 90px;
            position: relative;
        }

        /* Day 1 解鎖可用狀態 */
        .day-card.unlocked {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .day-card.unlocked:active {
            transform: scale(0.95);
        }

        .day-card.unlocked .day-emoji {
            font-size: 1.8rem;
            margin-bottom: 2px;
        }

        .day-card.unlocked .day-title {
            font-size: 0.9rem;
            font-weight: 900;
        }

        .day-card.unlocked .day-sub {
            font-size: 0.72rem;
            color: #047857;
            font-weight: 700;
        }

        /* Day 2 - Day 10 待解鎖狀態 */
        .day-card.locked {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            color: #94a3b8;
            pointer-events: none;
        }

        .day-card.locked .day-emoji {
            font-size: 1.5rem;
            opacity: 0.5;
            filter: grayscale(40%);
            margin-bottom: 2px;
        }

        .day-card.locked .day-title {
            font-size: 0.85rem;
            font-weight: 800;
        }

        .day-card.locked .day-sub {
            font-size: 0.7rem;
            color: #64748b;
        }

        footer {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
        }

        @media (max-width: 600px) {
            .days-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部導航列 -->

        </a>
        <a href="#" class="day-card locked">

    </div>

    <footer>

</html>
