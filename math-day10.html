<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>數學探索島 · Maths Day 10 數學小博士總考</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <script src="report-hub.js?v=2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #fef9c3 55%, #e0f2fe 100%);
      color: #1e293b;
    }

    .app-shell {
      width: 100%;
      max-width: 1024px;
      height: 100dvh;
      margin: 0 auto;
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    /* 頂部導覽與進度圓點 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 16px;
      background: #ffffff;
      color: #0f766e;
      font-weight: 900;
      font-size: clamp(14px, 2vw, 17px);
      text-decoration: none;
      border: 2px solid #5eead4;
      box-shadow: 0 4px 0 #14b8a6;
      white-space: nowrap;
    }

    .back-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #14b8a6;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: nowrap;
    }

    .step-dot {
      width: clamp(16px, 2.6vw, 24px);
      height: clamp(16px, 2.6vw, 24px);
      border-radius: 50%;
      background: #e2e8f0;
      border: 2px solid #cbd5e1;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .step-dot.active {
      background: #f59e0b;
      border-color: #d97706;
      transform: scale(1.2);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25);
    }

    .step-dot.done {
      background: #10b981;
      border-color: #059669;
    }

    .day-badge {
      padding: 6px 12px;
      border-radius: 14px;
      background: #fef3c7;
      border: 2px solid #fbbf24;
      color: #92400e;
      font-weight: 900;
      font-size: clamp(13px, 1.8vw, 16px);
      white-space: nowrap;
    }

    /* Anna 老師常駐橫幅 */
    .teacher-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #ffffff;
      border-radius: 20px;
      border: 3px solid #6ee7b7;
      box-shadow: 0 5px 0 #a7f3d0;
      flex-shrink: 0;
    }

    .teacher-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .teacher-avatar {
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1;
      flex-shrink: 0;
    }

    .teacher-text {
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 900;
      color: #0f5132;
      line-height: 1.3;
    }

    .speak-btn {
      padding: 10px 16px;
      border-radius: 16px;
      border: none;
      background: #0ea5e9;
      color: #ffffff;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #0284c7;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .speak-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0284c7;
    }

    /* 主舞台：嚴格單屏無捲動 */
    .quiz-card {
      flex: 1;
      min-height: 0;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      border: 4px solid #fcd34d;
      box-shadow: 0 8px 0 #f59e0b;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .quiz-view {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 8px;
      min-height: 0;
    }

    .quiz-view.hidden,
    .summary-view.hidden {
      display: none;
    }

    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .q-tag {
      padding: 6px 14px;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-size: clamp(15px, 2vw, 19px);
      font-weight: 900;
    }

    .q-counter {
      font-size: clamp(15px, 2vw, 19px);
      font-weight: 900;
      color: #b45309;
    }

    /* 視覺展示區 */
    .visual-stage {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #fffbeb 0%, #f0fdf4 100%);
      border-radius: 22px;
      border: 3px dashed #93c5fd;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
    }

    .tap-guide {
      font-size: clamp(14px, 1.8vw, 17px);
      font-weight: 800;
      color: #0369a1;
      background: #e0f2fe;
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* 數字順序卡 */
    .seq-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: clamp(6px, 1.4vw, 14px);
    }

    .seq-box {
      width: clamp(58px, 11vw, 96px);
      height: clamp(72px, 13dvh, 108px);
      border-radius: 20px;
      background: #ffffff;
      border: 4px solid #38bdf8;
      box-shadow: 0 5px 0 #0284c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .seq-num {
      font-size: clamp(32px, 5vw, 50px);
      font-weight: 900;
      color: #0c4a6e;
      line-height: 1;
    }

    .seq-dots {
      font-size: clamp(10px, 1.3vw, 13px);
      color: #f59e0b;
      letter-spacing: 1px;
      line-height: 1;
    }

    .seq-box.missing {
      background: #fef3c7;
      border: 4px dashed #f59e0b;
      box-shadow: 0 5px 0 #d97706;
    }

    .seq-box.missing .seq-num {
      color: #d97706;
    }

    .seq-arrow {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 900;
      color: #10b981;
    }

    /* 前後方位排隊區 */
    .pos-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.6vw, 28px);
    }

    .podium-goal {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 16px;
      border-radius: 20px;
      background: #fef08a;
      border: 3px solid #eab308;
      box-shadow: 0 5px 0 #ca8a04;
    }

    .podium-icon {
      font-size: clamp(42px, 6.5dvh, 64px);
      line-height: 1;
    }

    .podium-label {
      font-size: clamp(14px, 1.8vw, 17px);
      font-weight: 900;
      color: #854d0e;
      margin-top: 4px;
    }

    .line-arrow {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 900;
      color: #ef4444;
    }

    .animal-card {
      width: clamp(76px, 13vw, 118px);
      height: clamp(84px, 14dvh, 118px);
      border-radius: 22px;
      background: #ffffff;
      border: 4px solid #a7f3d0;
      box-shadow: 0 5px 0 #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(46px, 7dvh, 68px);
    }

    /* ABC 三組循環框 */
    .pattern-groups {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(8px, 1.8vw, 16px);
    }

    .pattern-group {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.2vw, 10px);
      padding: 10px 12px;
      border-radius: 20px;
      background: #ffffff;
      border: 3px dashed #818cf8;
      box-shadow: 0 4px 0 #c7d2fe;
    }

    .pattern-item {
      width: clamp(44px, 7.2vw, 68px);
      height: clamp(48px, 8.5dvh, 68px);
      border-radius: 14px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(30px, 4.8dvh, 46px);
    }

    .pattern-item.blank {
      background: #fef3c7;
      border: 3px dashed #f59e0b;
      color: #d97706;
      font-weight: 900;
      font-size: clamp(28px, 4.4dvh, 40px);
    }

    /* 加法與減法實物點數盤（嚴格靜音、零數字角標） */
    .math-groups-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.2vw, 22px);
      flex-wrap: wrap;
    }

    .plate-box {
      padding: 12px 16px;
      border-radius: 22px;
      background: #ffffff;
      border: 4px solid #93c5fd;
      box-shadow: 0 5px 0 #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.8vw, 16px);
      min-height: clamp(92px, 16dvh, 130px);
    }

    .plate-box.right-plate {
      border-color: #f9a8d4;
      box-shadow: 0 5px 0 #f472b6;
    }

    .math-symbol {
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 900;
      color: #f97316;
    }

    .count-item {
      position: relative;
      width: clamp(58px, 9.5vw, 84px);
      height: clamp(58px, 9.5vw, 84px);
      border-radius: 20px;
      border: 3px solid transparent;
      background: #fffbeb;
      font-size: clamp(38px, 6dvh, 56px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .count-item.counted {
      background: #fef08a;
      border-color: #f59e0b;
      transform: scale(1.1);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.55);
    }

    .count-item.counted::after {
      content: "✨";
      position: absolute;
      top: -10px;
      right: -8px;
      font-size: clamp(18px, 2.4vw, 24px);
      pointer-events: none;
    }

    .count-item.taken {
      background: #f1f5f9;
      border: 3px dashed #cbd5e1;
      opacity: 0.35;
      pointer-events: none;
      transform: scale(0.88);
    }

    .count-item.taken::after {
      content: "🐻";
      position: absolute;
      top: -12px;
      right: -10px;
      font-size: clamp(20px, 2.6vw, 26px);
      opacity: 1;
    }

    /* 溫柔提示框（嚴禁 ❌ 與洩露答案） */
    .gentle-hint-box {
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 16px;
      background: #fef9c3;
      border: 2px dashed #eab308;
      color: #854d0e;
      font-size: clamp(15px, 2.1vw, 19px);
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .gentle-hint-box.hidden {
      visibility: hidden;
    }

    /* 選項按鈕區 */
    .options-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      flex-shrink: 0;
    }

    .opt-btn {
      min-height: clamp(72px, 12.5dvh, 102px);
      border-radius: 22px;
      border: 4px solid #34d399;
      background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%);
      color: #064e3b;
      font-size: clamp(34px, 5.2vw, 52px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 0 #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .opt-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #10b981;
    }

    .opt-btn.correct {
      background: #dcfce7;
      border-color: #22c55e;
      box-shadow: 0 7px 0 #16a34a;
      transform: scale(1.03);
    }

    .opt-btn.wrong-shake {
      animation: wrongShake 0.4s ease;
      background: #fff7ed;
      border-color: #fdba74;
    }

    /* 結算畫面 */
    .summary-view {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      gap: 8px;
      min-height: 0;
    }

    .trophy-title {
      font-size: clamp(22px, 3.2vw, 32px);
      font-weight: 900;
      color: #b45309;
      text-align: center;
    }

    .sync-badge {
      padding: 5px 14px;
      border-radius: 999px;
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #166534;
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 900;
    }

    .result-table-wrap {
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border-radius: 16px;
      border: 2px solid #fde68a;
      background: #fffbeb;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(13px, 1.8vw, 16px);
    }

    .result-table th, .result-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #fde68a;
      text-align: left;
      font-weight: 800;
    }

    .result-table th {
      background: #fef3c7;
      color: #92400e;
      position: sticky;
      top: 0;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .primary-btn {
      padding: 11px 22px;
      border-radius: 18px;
      border: none;
      background: #10b981;
      color: #ffffff;
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #047857;
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #047857;
    }

    .secondary-btn {
      padding: 11px 18px;
      border-radius: 18px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
    }

    .secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #94a3b8;
    }

    .copy-feedback {
      font-size: 14px;
      font-weight: 800;
      color: #047857;
      min-height: 20px;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 頂部導覽列 -->
    <div class="top-bar">
      <a href="index.html" class="back-btn" onclick="stopAllSpeech()">⬅️ 返回主頁</a>
      <div class="step-dots" id="stepDots"></div>
      <div class="day-badge">🏆 Maths Day 10</div>
    </div>

    <!-- Anna 老師常駐橫幅 -->
    <div class="teacher-bar">
      <div class="teacher-left">
        <div class="teacher-avatar">👩‍🏫</div>
        <div class="teacher-text" id="teacherText">歡迎來到數學小博士總考！準備好就開始第 1 題喇！</div>
      </div>
      <button class="speak-btn" onclick="replayCurrentQuestion()">🔊 聽題目</button>
    </div>

    <!-- 主互動舞台 -->
    <div class="quiz-card">
      <!-- 答題區 -->
      <div class="quiz-view" id="quizView">
        <div class="q-header">
          <span class="q-tag" id="qTag">數字順序</span>
          <span class="q-counter" id="qCounter">第 1 / 8 題</span>
        </div>

        <div class="visual-stage" id="visualStage"></div>

        <div class="gentle-hint-box hidden" id="hintBox"></div>

        <div class="options-row" id="optionsRow"></div>
      </div>

      <!-- 結算區 -->
      <div class="summary-view hidden" id="summaryView">
        <div class="trophy-title">🎓 恭喜玲玲成為 K2 數學小博士！🏆</div>
        <div class="sync-badge">☁️ 戰報已自動同步至家長戰報箱</div>

        <div class="result-table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th>題目</th>
                <th>狀態</th>
                <th>耗時</th>
              </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
          </table>
        </div>

        <div class="summary-actions">
          <button class="primary-btn" onclick="copyReport()">📋 一鍵複製進度暗號俾 Anna 老師</button>
          <button class="secondary-btn" onclick="restartQuiz()">🔁 再玩一次</button>
        </div>
        <div class="copy-feedback" id="copyFeedback"></div>
      </div>
    </div>
  </div>

  <script>
    // ========= iPad Safari 廣東話安全語音引擎 (Anti-GC, zh-HK, rate=0.72) =========
    window.utterancePool = [];
    let speakTimer = null;
    let currentQuestionSpeech = "";
    let audioCtx = null;

    function getCantoneseVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return (
        voices.find(v => v.lang === "zh-HK" && /sinji|tracy|ting|female/i.test(v.name)) ||
        voices.find(v => v.lang === "zh-HK") ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes("hk")) ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes("zh")) ||
        null
      );
    }

    function stopAllSpeech() {
      if (speakTimer) {
        clearTimeout(speakTimer);
        speakTimer = null;
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    function speak(text, onEnd = null) {
      stopAllSpeech();
      if (!window.speechSynthesis || !text) return;
      speakTimer = setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-HK";
        u.rate = 0.72;
        u.pitch = 1.05;
        const v = getCantoneseVoice();
        if (v) u.voice = v;

        u.onend = () => {
          const idx = window.utterancePool.indexOf(u);
          if (idx > -1) window.utterancePool.splice(idx, 1);
          if (typeof onEnd === "function") onEnd();
        };
        u.onerror = () => {
          const idx = window.utterancePool.indexOf(u);
          if (idx > -1) window.utterancePool.splice(idx, 1);
        };

        window.utterancePool.push(u);
        window.speechSynthesis.speak(u);
      }, 40);
    }

    function replayCurrentQuestion() {
      if (currentQuestionSpeech) {
        speak(currentQuestionSpeech);
      }
    }

    // 輕快短音效（僅用於實物自主點數的觸覺回饋，絕不報數）
    function playTapPop() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(660, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(920, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    window.addEventListener("pagehide", stopAllSpeech);
    window.addEventListener("beforeunload", stopAllSpeech);
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => getCantoneseVoice();
    }

    // ========= 數據驅動題庫（根據 Day 9 耗時數據動態調適，全廣東話零劇透） =========
    const quizData = [
      {
        id: "Q1",
        label: "數字順序(1-5)",
        tag: "🔢 數字順序 (1–5)",
        type: "sequence",
        items: [1, 2, 3, "?", 5],
        showDots: true,
        options: ["3", "4", "5"],
        answer: "4",
        screenText: "🏅 幫小博士獎章排隊！問號嗰格應該係邊個數字呀？",

      {

        answer: "3",

        spokenQuestion: "最後一題喇！慶功派對本來有五件蛋糕，小熊拎走咗兩件，玲玲數下仲剩低幾多件蛋糕呀？",
        hintText: "🌟 淨係用手指點亮仲未俾小熊拎走嘅蛋糕，數下有幾多件！",
        spokenHint: "唔緊要呀，淨係點住仲喺度、無被小熊拎走嘅蛋糕，自己數下有幾多件！",

    // ========= 狀態變數 =========
    let currentIdx = 0;
    let questionStartTs = Date.now();
    let currentNeedHint = false;
    let isLocked = false;
    let results = [];
    let generatedReportText = "";
    let hasSavedReport = false;

    function renderDots() {
      const wrap = document.getElementById("stepDots");
      wrap.innerHTML = "";
      quizData.forEach((_, idx) => {
        const d = document.createElement("div");
        d.className = "step-dot" + (idx < currentIdx ? " done" : idx === currentIdx ? " active" : "");
        wrap.appendChild(d);
      });
    }

    function renderQuestion() {
      stopAllSpeech();
      isLocked = false;
      currentNeedHint = false;
      questionStartTs = Date.now();

      const q = quizData[currentIdx];
      renderDots();

      document.getElementById("qTag").textContent = q.tag;
      document.getElementById("qCounter").textContent = `第 ${currentIdx + 1} / ${quizData.length} 題`;
      document.getElementById("teacherText").textContent = q.screenText;

      const hintEl = document.getElementById("hintBox");
      hintEl.classList.add("hidden");
      hintEl.textContent = "";

      const stage = document.getElementById("visualStage");
      stage.innerHTML = "";

      if (q.type === "sequence") {
        const row = document.createElement("div");
        row.className = "seq-row";
        q.items.forEach((val, idx) => {
          const box = document.createElement("div");
          box.className = "seq-box" + (val === "?" ? " missing" : "");
          const num = document.createElement("div");
          num.className = "seq-num";
          num.textContent = val;
          box.appendChild(num);

          if (q.showDots && typeof val === "number") {
            const dots = document.createElement("div");
            dots.className = "seq-dots";
            dots.textContent = "●".repeat(val);
            box.appendChild(dots);
          }
          row.appendChild(box);

          if (idx < q.items.length - 1) {
            const arrow = document.createElement("div");
            arrow.className = "seq-arrow";
            arrow.textContent = "➜";
            row.appendChild(arrow);
          }
        });
        stage.appendChild(row);
      } else if (q.type === "position") {
        const pos = document.createElement("div");
        pos.className = "pos-stage";

        const goal = document.createElement("div");
        goal.className = "podium-goal";
        goal.innerHTML = `<div class="podium-icon">${q.goalEmoji}</div><div class="podium-label">${q.goalLabel}</div>`;
        pos.appendChild(goal);

        const arrow = document.createElement("div");
        arrow.className = "line-arrow";
        arrow.textContent = "⬅️";
        pos.appendChild(arrow);

        q.lineup.forEach(emoji => {
          const card = document.createElement("div");
          card.className = "animal-card";
          card.textContent = emoji;
          pos.appendChild(card);
        });
        stage.appendChild(pos);
      } else if (q.type === "pattern") {
        const groupsWrap = document.createElement("div");
        groupsWrap.className = "pattern-groups";
        q.groups.forEach(group => {
          const gBox = document.createElement("div");
          gBox.className = "pattern-group";
          group.forEach(sym => {
            const item = document.createElement("div");
            item.className = "pattern-item" + (sym === "?" ? " blank" : "");
            item.textContent = sym;
            gBox.appendChild(item);
          });
          groupsWrap.appendChild(gBox);
        });
        stage.appendChild(groupsWrap);
      } else if (q.type === "addition") {
        const guide = document.createElement("div");
        guide.className = "tap-guide";
        guide.textContent = "👆 可以逐粒點亮實物幫自己數數（靜音自主數數）";
        stage.appendChild(guide);

        const row = document.createElement("div");
        row.className = "math-groups-row";

        const leftPlate = document.createElement("div");
        leftPlate.className = "plate-box";
        for (let i = 0; i < q.leftCount; i++) {
          leftPlate.appendChild(createSilentCountButton(q.emoji));
        }

        const plus = document.createElement("div");
        plus.className = "math-symbol";
        plus.textContent = "+";

        const rightPlate = document.createElement("div");
        rightPlate.className = "plate-box right-plate";
        for (let i = 0; i < q.rightCount; i++) {
          rightPlate.appendChild(createSilentCountButton(q.emoji));
        }

        row.appendChild(leftPlate);
        row.appendChild(plus);
        row.appendChild(rightPlate);
        stage.appendChild(row);
      } else if (q.type === "subtraction") {
        const guide = document.createElement("div");
        guide.className = "tap-guide";
        guide.textContent = "👆 點亮仲喺度嘅蛋糕自己數數（虛線係小熊拎走咗）";
        stage.appendChild(guide);

        const plate = document.createElement("div");
        plate.className = "plate-box";
        const remainCount = q.totalCount - q.takeCount;
        for (let i = 0; i < q.totalCount; i++) {
          const btn = createSilentCountButton(q.emoji);
          if (i >= remainCount) {
            btn.classList.add("taken");
            btn.onclick = null;
          }
          plate.appendChild(btn);
        }
        stage.appendChild(plate);
      }

      // 渲染 3 個大選項掣
      const optsRow = document.getElementById("optionsRow");
      optsRow.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(btn, opt);
        optsRow.appendChild(btn);
      });

      // 獨立保存題目原音，重聽鍵永不被提示語覆蓋
      currentQuestionSpeech = q.spokenQuestion;
      speak(q.spokenQuestion);
    }

    // 靜音實物點數按鈕：只播放輕快點擊音效與發光✨，嚴禁語音報數或顯示數字角標
    function createSilentCountButton(emoji) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "count-item";
      btn.textContent = emoji;
      btn.onclick = () => {
        if (isLocked) return;
        playTapPop();
        btn.classList.toggle("counted");
      };
      return btn;
    }

    function handleAnswer(btn, selected) {
      if (isLocked) return;
      const q = quizData[currentIdx];
      const hintEl = document.getElementById("hintBox");

      if (selected === q.answer) {
        isLocked = true;
        const elapsed = Math.max(1, Math.round((Date.now() - questionStartTs) / 1000));
        results.push({
          id: q.id,
          label: q.label,
          sec: elapsed,
          needHint: currentNeedHint
        });

        btn.classList.add("correct");
        hintEl.classList.add("hidden");
        document.getElementById("teacherText").textContent = "🎉 " + q.praise;

        speak(q.praise, () => {
          if (currentIdx < quizData.length - 1) {
            currentIdx++;
            renderQuestion();
          } else {
            showSummary();
          }
        });
      } else {
        currentNeedHint = true;
        btn.classList.remove("wrong-shake");
        void btn.offsetWidth;
        btn.classList.add("wrong-shake");
        hintEl.textContent = q.hintText;
        hintEl.classList.remove("hidden");
        speak(q.spokenHint);
      }
    }

    function showSummary() {
      stopAllSpeech();
      document.getElementById("quizView").classList.add("hidden");
      document.getElementById("summaryView").classList.remove("hidden");

      // 全部圓點亮綠燈
      document.querySelectorAll(".step-dot").forEach(d => {
        d.classList.remove("active");
        d.classList.add("done");
      });

      const tbody = document.getElementById("summaryBody");
      tbody.innerHTML = "";
      const reportParts = [];

      results.forEach(r => {
        const statusText = r.needHint ? "🌟 需提示" : "✅ 1次答對";
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.id} ${r.label}</td><td>${statusText}</td><td>${r.sec} 秒</td>`;
        tbody.appendChild(tr);

        const codeStatus = r.needHint ? "(需提示)" : "(1次答對)";
        reportParts.push(`${r.id} ${r.label}: ${r.sec}s${codeStatus}`);
      });

      generatedReportText = `【數學測驗回報】Day 10（數學小博士總考） | ${reportParts.join(" | ")}`;

      if (!hasSavedReport) {
        hasSavedReport = true;
        if (window.LinglingReport && typeof window.LinglingReport.save === "function") {
          window.LinglingReport.save("數學探索島", "Maths Day 10（數學小博士總考）", generatedReportText);
        }
      }

      const finalMsg = "恭喜玲玲順利完成 Maths Day 10 數學小博士總考！你已經係真正嘅 K2 數學小博士喇！";
      document.getElementById("teacherText").textContent = "🏆 " + finalMsg;
      currentQuestionSpeech = finalMsg;
      speak(finalMsg);
    }

    function copyReport() {
      const fb = document.getElementById("copyFeedback");
      if (!generatedReportText) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedReportText).then(() => {
          fb.textContent = "✅ 進度暗號已複製！貼給 Elsa 或數學老師即可記錄耗時。";
        }).catch(() => fallbackCopy(fb));
      } else {
        fallbackCopy(fb);
      }
    }

    function fallbackCopy(fb) {
      const ta = document.createElement("textarea");
      ta.value = generatedReportText;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        fb.textContent = "✅ 進度暗號已複製！貼給 Elsa 或數學老師即可記錄耗時。";
      } catch (e) {
        fb.textContent = "請手動複製戰報文字。";
      }
      document.body.removeChild(ta);
    }

    function restartQuiz() {
      stopAllSpeech();
      currentIdx = 0;
      results = [];
      hasSavedReport = false;
      document.getElementById("copyFeedback").textContent = "";
      document.getElementById("summaryView").classList.add("hidden");
      document.getElementById("quizView").classList.remove("hidden");
      renderQuestion();
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderQuestion();
    });
  </script>
