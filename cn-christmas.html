<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P.26-29《聖誕節》每日課堂</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #fee2e2 0%, #fef3c7 52%, #dcfce7 100%);
      color: #450a0a;
      overflow-x: hidden;
    }

    body {
      display: block !important;
      padding: 16px 14px 24px;
    }

    .board {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      border: 5px solid #ef4444;
      border-radius: 32px;
      padding: 18px 18px 22px;
      box-shadow: 0 10px 0 #b91c1c, 0 18px 34px rgba(185, 28, 28, 0.16);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 頂部導航列（手機與 iPad 不切字） */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 900;
      transition: transform 0.14s ease;
      flex-shrink: 0;
    }
    .nav-pill:active {
      transform: translateY(2px);
    }

    .nav-back {
      background: #fef2f2;
      color: #991b1b;
      border: 3px solid #fca5a5;
      box-shadow: 0 4px 0 #f87171;
    }

    .nav-home {
      background: #f0fdf4;
      color: #166534;
      border: 3px solid #86efac;
      box-shadow: 0 4px 0 #4ade80;
    }

    .unit-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: #991b1b;
      text-align: center;
      flex: 1;
      min-width: 200px;
    }

    /* Anna 老師歡迎橫幅 */
    .teacher-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 3px solid #f59e0b;
      border-radius: 22px;
      padding: 12px 16px;
      box-shadow: 0 5px 0 #d97706;
    }

    .teacher-icon {
      font-size: 34px;
      flex-shrink: 0;
    }

    .teacher-msg {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.45;
      color: #78350f;
    }

    /* 6 日課程卡片網格（iPad 3x2 單屏無須捲動） */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding-top: 4px;
    }

    .day-card {
      text-decoration: none;
      border-radius: 24px;
      padding: 18px 12px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      transition: transform 0.14s ease;
    }

    .day-card.unlocked {
      background: linear-gradient(180deg, #fff5f5 0%, #fee2e2 100%);
      border: 4px solid #ef4444;
      box-shadow: 0 6px 0 #b91c1c;
      color: #991b1b;
      cursor: pointer;
    }
    .day-card.unlocked:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b91c1c;
    }

    .day-card.locked {
      background: #f8fafc;
      border: 3px dashed #cbd5e1;
      color: #94a3b8;
      pointer-events: none;
      cursor: default;
    }

    .day-icon {
      font-size: 42px;
      line-height: 1.1;
    }

    .day-num {
      font-size: 20px;
      font-weight: 900;
    }

    .day-sub {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
    }

    @media (max-width: 600px) {
      .days-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .unit-title {
        font-size: 19px;
      }
      .day-card {
        min-height: 132px;
      }
    }
  </style>
</head>
<body>
  <main class="board">
    <div class="top-bar">
      <a href="index.html?v=1" class="nav-pill nav-back">🏠 返回學習大門</a>
      <h1 class="unit-title">🎄 P.26-29《聖誕節》每日課堂</h1>
      <a href="index.html?v=1" class="nav-pill nav-home">✨ 樂園首頁</a>
    </div>

    <div class="teacher-banner">
      <div class="teacher-icon">👩‍🏫</div>
      <div class="teacher-msg">Hello 玲玲！今日由 Anna 老師同你一齊玩《聖誕節》Day 1 生字拆字魔法課（主耶穌・聖誕節・禮物），快啲撳下面紅色卡片開始啦！</div>
    </div>

    <section class="days-grid" aria-label="聖誕節六日課堂列表">
      <a href="cn-p26-p29-d1.html?v=1" class="day-card unlocked"><span class="day-icon">🎄</span><span class="day-num">Day 1</span><span class="day-sub">聖誕生字拆字魔法</span></a>
      <a href="cn-p26-p29-d2.html?v=1" class="day-card unlocked"><span class="day-icon">🎁</span><span class="day-num">Day 2</span><span class="day-sub">生字重溫＋句式</span></a>
      <a href="cn-p26-p29-d3.html?v=1" class="day-card unlocked"><span class="day-icon">🎵</span><span class="day-num">Day 3</span><span class="day-sub">兒歌《聖誕節》</span></a>
      <a href="cn-p26-p29-d4.html?v=1" class="day-card unlocked"><span class="day-icon">🎄</span><span class="day-num">Day 4</span><span class="day-sub">聖誕節重溫與自己做</span></a>
      <a href="cn-p26-p29-d5.html?v=1" class="day-card unlocked"><span class="day-icon">🎶</span><span class="day-num">Day 5</span><span class="day-sub">雙兒歌綜合與接龍</span></a>
      <div class="day-card locked"><span class="day-icon">🔒</span><span class="day-num">Day 6</span><span class="day-sub">Graduation</span></div>
    </section>
  </main>
</body>
</html>
