<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unit 4 Day 2: I can do it (盲聽積木)</title>
    <!-- 強制套用全域 3D 樣式 -->
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ====================================================
           Unit 8 魔法闖關頂級風格 (背景與頂部導航)
           ==================================================== */
        body {
            background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 100%);
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        /* 深色頂部導航列 */
        .top-nav {
            background: linear-gradient(90deg, #1E3A8A 0%, #3B82F6 100%);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid #1D4ED8;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 6px 15px rgba(29, 78, 216, 0.25);
            margin-bottom: 24px;
        }

        .top-nav h1 {
            color: #FFFFFF;
            font-size: 20px;
            margin: 0;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .progress-dots {
            display: flex;
            gap: 6px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: #FCD34D; box-shadow: 0 0 8px #FCD34D; }

        /* 返回按鈕 (3D 積木風) */
        .btn-home {
            background: #F43F5E;
            color: white;
            border: 2px solid #E11D48;
            border-bottom: 5px solid #BE123C;
            border-radius: 14px;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s, border-bottom-width 0.1s;
        }
        .btn-home:active { transform: translateY(3px); border-bottom-width: 2px; }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        /* ====================================================
           Anna 老師專屬提示橫幅
           ==================================================== */
        .tutor-banner {
            background: #FFFBEB;
            border: 4px solid #FCD34D;
            border-bottom-width: 8px;
            border-bottom-color: #F59E0B;
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 24px;
            box-shadow: 0 6px 12px rgba(245, 158, 11, 0.15);
        }

        .tutor-avatar {
            font-size: 45px;
            background: #FEF3C7;
            border-radius: 50%;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #FDE68A;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .tutor-text {
            font-size: 17px;
            color: #92400E;
            font-weight: 800;
            line-height: 1.5;
        }
        .highlight { color: #D97706; background: #FEF3C7; padding: 2px 8px; border-radius: 8px; border: 1px solid #FCD34D; }

        /* ====================================================
           魔法互動舞台卡片
           ==================================================== */
        .stage-box {
            background: #FFFFFF;
            border: 4px solid #BAE6FD;
            border-bottom-width: 10px;
            border-bottom-color: #7DD3FC;
            border-radius: 36px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(14, 165, 233, 0.15);
        }

        /* 替換大腦/耳朵的超靚播放按鈕 */
        .listen-btn {
            background: linear-gradient(135deg, #A78BFA 0%, #8B5CF6 100%);
            border: 4px solid #7C3AED;
            border-bottom-width: 8px;
            border-radius: 50%;
            width: 95px;
            height: 95px;
            font-size: 45px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 35px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(139, 92, 246, 0.35);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            animation: pulse 2s infinite;
        }
        .listen-btn:active { transform: translateY(5px); border-bottom-width: 3px; animation: none; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        .listen-hint {
            position: absolute;
            bottom: -30px;
            font-size: 15px;
            color: #6D28D9;
            font-weight: 900;
            background: #EDE9FE;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #C4B5FD;
            white-space: nowrap;
        }

        /* 句子填充區 */
        .sentence-slots {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
            min-height: 65px;
        }
        
        .slot {
            border: 3px dashed #CBD5E1;
            border-radius: 14px;
            width: 85px;
            height: 55px;
            background: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #334155;
            transition: all 0.2s;
        }
        
        .slot.filled {
            border: 3px solid #34D399;
            border-bottom-width: 6px;
            background: #D1FAE5;
            color: #065F46;
            cursor: pointer;
            transform: scale(1.05);
        }
        .slot.filled:active { transform: scale(1) translateY(3px); border-bottom-width: 3px; }

        /* 字庫積木區 */
        .word-bank {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        
        .word-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-bottom-width: 7px;
            border-radius: 16px;
            padding: 12px 24px;
            font-size: 24px;
            font-weight: 900;
            color: #1E293B;
            cursor: pointer;
            transition: transform 0.1s, border-bottom-width 0.1s;
        }
        .word-btn:active { transform: translateY(4px); border-bottom-width: 3px; }
        .word-btn.hidden { visibility: hidden; opacity: 0; }
        
        #feedback {
            margin-top: 25px;
            font-size: 24px;
            font-weight: 900;
            min-height: 35px;
        }
    </style>
</head>
<body class="animate-bounce-in">

    <!-- 頂部魔法導航列 -->
    <div class="top-nav">
        <button class="btn-home" onclick="goBack()">🏠 返回</button>
        <h1>Unit 4 Day 2: I can do it (盲聽積木)</h1>
        <div class="progress-dots">
            <div class="dot active"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="main-container">
        <!-- Anna 老師提示橫幅 -->
        <div class="tutor-banner">
            <div class="tutor-avatar">👩‍🏫</div>
            <div class="tutor-text">
                Hello Lingling！今日嘅挑戰係<span class="highlight">「無圖片盲聽」</span>呀！<br>
                請撳紫色按鈕聽我讀句子，然後將下面嘅單字積木排返好啦！
            </div>
        </div>

        <!-- 魔法互動舞台 -->
        <div class="stage-box">
            
            <!-- 播放聲音按鈕 (取代核突耳朵) -->
            <div class="listen-btn" onclick="playSentence()">
                🎧
                <span class="listen-hint">點擊聽句子🎶</span>
            </div>

            <!-- 積木放置區 -->
            <div class="sentence-slots" id="slots">
                <div class="slot" data-index="0"></div>
                <div class="slot" data-index="1"></div>
                <div class="slot" data-index="2"></div>
                <div class="slot" data-index="3"></div>
                <div class="slot" data-index="4"></div>
            </div>

            <!-- 待選字庫積木 (已打亂順序) -->
            <div class="word-bank" id="wordBank">
                <button class="word-btn" onclick="selectWord(this, 'can')">can</button>
                <button class="word-btn" onclick="selectWord(this, 'cat')">cat</button>
                <button class="word-btn" onclick="selectWord(this, 'I')">I</button>
                <button class="word-btn" onclick="selectWord(this, 'a')">a</button>
                <button class="word-btn" onclick="selectWord(this, 'draw')">draw</button>
            </div>
            
            <!-- 對錯回饋顯示區 -->
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        // 修正發音：鎖定高音調(卡通聲)與慢速
        function playSentence() {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance("I can draw a cat.");
            utterance.lang = "en-GB"; 
            utterance.pitch = 1.3; // 提高音調變女聲/卡通聲
            utterance.rate = 0.75; // 慢速確保聽得清
            window.speechSynthesis.speak(utterance);
        }

        // 雙重斷音返回總覽頁
        function goBack() {
            window.speechSynthesis.cancel();
            window.location.href = 'en-unit4.html';
        }

        // 積木遊戲邏輯
        const targetSentence = ["I", "can", "draw", "a", "cat"];
        let currentAnswers = [];

        function selectWord(btn, word) {
            if (currentAnswers.length < targetSentence.length) {
                // 讀出點擊的單字 (同樣用慢速卡通聲)
                const u = new SpeechSynthesisUtterance(word);
                u.lang = "en-GB"; u.pitch = 1.3; u.rate = 0.85;
                window.speechSynthesis.speak(u);

                // 填入插槽
                currentAnswers.push(word);
                updateSlots();
                btn.classList.add('hidden'); // 隱藏已選按鈕
                btn.dataset.index = currentAnswers.length - 1; 
                
                checkWin();
            }
        }

        // 更新空格狀態
        function updateSlots() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach((slot, index) => {
                if (currentAnswers[index]) {
                    slot.textContent = currentAnswers[index];
                    slot.classList.add('filled');
                    slot.onclick = () => removeWord(index); // 允許點擊取消重選
                } else {
                    slot.textContent = '';
                    slot.classList.remove('filled');
                    slot.onclick = null;
                }
            });
        }

        // 點擊空格取消單字
        function removeWord(index) {
            const word = currentAnswers[index];
            currentAnswers.splice(index, 1);
            updateSlots();
            
            // 恢復字庫按鈕顯示
            const btns = document.querySelectorAll('.word-btn');
            btns.forEach(btn => {
                if (btn.textContent === word && btn.classList.contains('hidden')) {
                    btn.classList.remove('hidden');
                }
            });
            document.getElementById('feedback').textContent = "";
        }

        // 檢查答案對錯
        function checkWin() {
            if (currentAnswers.length === targetSentence.length) {
                const isCorrect = currentAnswers.join(" ") === targetSentence.join(" ");
                const fb = document.getElementById('feedback');
                
                if (isCorrect) {
                    fb.innerHTML = "<span style='color:#10B981;'>🎉 Very Good! I can draw a cat!</span>";
                    setTimeout(playSentence, 500); // 贏咗再讀一次全句
                } else {
                    fb.innerHTML = "<span style='color:#EF4444;'>❌ Oops! 順序錯咗，試下重新排過啦！</span>";
                    // 答錯後兩秒自動清空
                    setTimeout(() => {
                        currentAnswers = [];
                        updateSlots();
                        document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('hidden'));
                        fb.innerHTML = "";
                    }, 2000);
                }
            }
        }
    </script>
</body>
</html>
