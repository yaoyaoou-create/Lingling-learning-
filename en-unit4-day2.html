<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unit 4 Day 2: draw & sing</title>
    <!-- 強制套用全域 3D 樣式 -->
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ====================================================
           Unit 8 魔法闖關頂級風格 (背景與頂部導航)
           ==================================================== */
        body {
            background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 100%);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            font-family: "PingFang HK", "Microsoft JhengHei", "Chalkboard SE", sans-serif; 
        }

        .top-nav {
            background: linear-gradient(90deg, #1E3A8A 0%, #3B82F6 100%);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 6px solid #1D4ED8;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 6px 15px rgba(29, 78, 216, 0.25);
            margin-bottom: 24px;
        }

        .top-nav h1 { color: #FFFFFF; font-size: 18px; margin: 0; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        .btn-home {
            background: #F43F5E; color: white; border: 2px solid #E11D48; border-bottom: 5px solid #BE123C;
            border-radius: 14px; padding: 8px 16px; font-weight: 900; font-size: 15px; cursor: pointer;
            transition: transform 0.1s, border-bottom-width 0.1s;
        }
        .btn-home:active { transform: translateY(3px); border-bottom-width: 2px; }

        .main-container { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }

        /* ====================================================
           Anna 老師專屬提示橫幅
           ==================================================== */
        .tutor-banner {
            background: #FFFBEB; border: 4px solid #FCD34D; border-bottom-width: 8px; border-bottom-color: #F59E0B;
            border-radius: 20px; padding: 16px 20px; display: flex; align-items: center; gap: 18px;
            margin-bottom: 24px; box-shadow: 0 6px 12px rgba(245, 158, 11, 0.15);
        }
        .tutor-avatar {
            font-size: 45px; background: #FEF3C7; border-radius: 50%; min-width: 75px; height: 75px;
            display: flex; align-items: center; justify-content: center; border: 4px solid #FDE68A; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .tutor-text { font-size: 17px; color: #92400E; font-weight: 800; line-height: 1.5; }

        /* ====================================================
           魔法互動舞台卡片 (3D)
           ==================================================== */
        .stage-box-3d {
            background: #FFFFFF; border: 4px solid #BAE6FD; border-bottom-width: 10px; border-bottom-color: #7DD3FC;
            border-radius: 36px; padding: 40px 20px; text-align: center; box-shadow: 0 12px 25px rgba(14, 165, 233, 0.15);
            display: none; /* 預設隱藏，用 JS 控制幻燈片 */
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .stage-box-3d.active { display: block; }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 核心組件：大圖案、按鈕、積木 */
        .big-icon { font-size: 90px; margin-bottom: 15px; text-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .listen-btn {
            background: linear-gradient(135deg, #A78BFA 0%, #8B5CF6 100%); border: 4px solid #7C3AED; border-bottom-width: 8px;
            border-radius: 50%; width: 80px; height: 80px; font-size: 35px; color: white;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; cursor: pointer;
            box-shadow: 0 8px 15px rgba(139, 92, 246, 0.35); transition: all 0.15s;
        }
        .listen-btn:active { transform: translateY(5px); border-bottom-width: 3px; }

        .btn-next {
            background: #34D399; color: white; border: 3px solid #059669; border-bottom-width: 6px;
            border-radius: 20px; padding: 12px 30px; font-size: 20px; font-weight: 900; margin-top: 25px; cursor: pointer;
            transition: all 0.1s; display: inline-block;
        }
        .btn-next:active { transform: translateY(4px); border-bottom-width: 2px; }

        .btn-mom {
            background: #FCD34D; color: #B45309; border: 3px solid #F59E0B; border-bottom-width: 6px;
            border-radius: 20px; padding: 15px 30px; font-size: 22px; font-weight: 900; margin-top: 20px; cursor: pointer;
        }
        .btn-mom:active { transform: translateY(4px); border-bottom-width: 2px; }

        /* Phonics 字母積木 */
        .letter-blocks { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .letter {
            background: #FEF3C7; border: 3px solid #FCD34D; border-bottom-width: 6px;
            border-radius: 12px; width: 60px; height: 70px; display: flex; align-items: center; justify-content: center;
            font-size: 35px; font-weight: 900; color: #D97706; cursor: pointer; transition: all 0.1s;
        }
        .letter:active { transform: translateY(4px); border-bottom-width: 2px; }
        .letter.clicked { background: #D1FAE5; border-color: #34D399; color: #065F46; }

        /* 配對卡片 */
        .match-cards { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .match-card {
            background: #FFFFFF; border: 4px solid #E2E8F0; border-bottom-width: 8px; border-radius: 20px;
            padding: 20px; width: 130px; cursor: pointer; transition: all 0.1s;
        }
        .match-card:active { transform: translateY(4px); border-bottom-width: 3px; }
        .match-card.wrong { border-color: #FDA4AF; background: #FFF1F2; }
    </style>
</head>
<body>

    <!-- 頂部導航 -->
    <div class="top-nav">
        <button class="btn-home" onclick="goBack()">🏠 返回</button>
        <h1>Unit 4 Day 2: draw, sing</h1>
        <div>⭐</div>
    </div>

    <div class="main-container">

        <!-- 第 1 幕：情境理解 (Meaning) -->
        <div id="step1" class="stage-box-3d active">
            <div class="tutor-banner">
                <div class="tutor-avatar">👩‍🏫</div>
                <div class="tutor-text" id="tutorText1">Hello Lingling！睇吓幅圖，個女仔做緊咩呀？<br>撳紫色掣聽我講啦！</div>
            </div>
            
            <div class="big-icon">🖍️🎨</div>
            
            <div class="listen-btn" onclick="playStep1()">🎧</div>
            
            <button class="btn-next" onclick="nextStep(2)" style="display:none;" id="btnNext1">下一頁 ➡️</button>
        </div>

        <!-- 第 2 幕：拆字認讀與拼寫 (Phonics) -->
        <div id="step2" class="stage-box-3d">
            <div class="tutor-banner">
                <div class="tutor-avatar">👩‍🏫</div>
                <div class="tutor-text">draw 係點樣拼出嚟㗎？<br>順序撳吓啲字母積木，聽吓佢哋點讀啦！</div>
            </div>

            <div class="letter-blocks">
                <div class="letter" id="l_d" onclick="playLetter('d', this)">d</div>
                <div class="letter" id="l_r" onclick="playLetter('r', this)">r</div>
                <div class="letter" id="l_a" onclick="playLetter('a', this)">a</div>
                <div class="letter" id="l_w" onclick="playLetter('w', this)">w</div>
            </div>

            <div class="big-icon" style="font-size:50px; margin-top:10px;">draw</div>
            
            <button class="btn-next" onclick="nextStep(3)" style="display:none;" id="btnNext2">下一頁 ➡️</button>
        </div>

        <!-- 第 3 幕：開口會說 (Speaking & 媽媽見證) -->
        <div id="step3" class="stage-box-3d">
            <div class="tutor-banner">
                <div class="tutor-avatar">👩‍🏫</div>
                <div class="tutor-text">Lingling 真叻！而家到你啦！<br>請你好大聲咁對住媽媽講一次：draw！</div>
            </div>

            <div class="big-icon">🎤👧🏻</div>
            <div style="font-size:30px; font-weight:900; color:#3B82F6;">draw</div>
            
            <button class="btn-mom" onclick="momApprove()">✅ 玲玲讀得好叻！(媽媽撳)</button>
        </div>

        <!-- 第 4 幕：輕鬆配對 (Gentle Review) -->
        <div id="step4" class="stage-box-3d">
            <div class="tutor-banner">
                <div class="tutor-avatar">👩‍🏫</div>
                <div class="tutor-text" id="tutorText4">最後一個任務！<br>邊一幅圖係代表 <b>draw (畫畫)</b> 呢？</div>
            </div>

            <div class="match-cards">
                <div class="match-card" onclick="checkMatch(false, this)">
                    <div class="big-icon" style="font-size:60px;">🎶🎤</div>
                </div>
                <div class="match-card" onclick="checkMatch(true, this)">
                    <div class="big-icon" style="font-size:60px;">🎨🖍️</div>
                </div>
            </div>
            
            <button class="btn-next" onclick="goBack()" style="display:none;" id="btnNext4">🎉 完成課堂，返回目錄！</button>
        </div>

    </div>

    <!-- 歡呼聲效與煙花套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // --- 核心語音引擎 (雙語支援，高音調卡通聲) ---
        function speakDual(zhText, enText, callback) {
            window.speechSynthesis.cancel();
            
            // 讀中文
            let u1 = new SpeechSynthesisUtterance(zhText);
            u1.lang = 'zh-HK'; u1.pitch = 1.3; u1.rate = 0.85;
            
            // 讀英文
            let u2 = new SpeechSynthesisUtterance(enText);
            u2.lang = 'en-GB'; u2.pitch = 1.3; u2.rate = 0.75;
            
            window.speechSynthesis.speak(u1);
            u1.onend = () => {
                window.speechSynthesis.speak(u2);
                if(callback) u2.onend = callback;
            };
        }

        function speakEn(enText, callback) {
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(enText);
            u.lang = 'en-GB'; u.pitch = 1.3; u.rate = 0.75;
            window.speechSynthesis.speak(u);
            if(callback) u.onend = callback;
        }

        // --- 導航控制 ---
        function goBack() {
            window.speechSynthesis.cancel();
            window.location.href = 'en-unit4.html';
        }
    <!-- 歡呼聲效與煙花套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // 解決 iPad Safari 語音被「垃圾回收 (Garbage Collection)」導致冇聲嘅 Bug
        window.speechUtterances = [];

        // 預先喚醒語音庫
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }

        // 終極安全發音函數
        function safeSpeak(text, lang, pitch, rate, callback) {
            window.speechSynthesis.cancel();
            setTimeout(() => {
                if (!text) {
                    if (callback) callback();
                    return;
                }
                let u = new SpeechSynthesisUtterance(text);
                u.lang = lang;
                u.pitch = pitch;
                u.rate = rate;
                if (callback) {
                    u.onend = callback;
                }
                window.speechUtterances.push(u); 
                window.speechSynthesis.speak(u);
            }, 50);
        }

        function speakDual(zhText, enText, callback) {
            safeSpeak(zhText, 'zh-HK', 1.3, 0.85, () => {
                safeSpeak(enText, 'en-GB', 1.3, 0.75, callback);
            });
        }

        function speakEn(enText, callback) {
            safeSpeak(enText, 'en-GB', 1.3, 0.75, callback);
        }

        function goBack() {
            window.speechSynthesis.cancel();
            window.location.href = 'en-unit4.html';
        }

        function nextStep(stepNum) {
            window.speechSynthesis.cancel();
            document.querySelectorAll('.stage-box-3d').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + stepNum).classList.add('active');
        }

        function playStep1() {
            speakDual("佢喺度畫畫呀！畫畫嘅英文係 draw。", "I can draw.", () => {
                document.getElementById('btnNext1').style.display = 'inline-block';
            });
        }

        let lettersClicked = 0;
        function playLetter(letter, element) {
            if(!element.classList.contains('clicked')) {
                element.classList.add('clicked');
                lettersClicked++;
            }
            speakEn(letter, () => {
                if(lettersClicked === 4) {
                    setTimeout(() => speakEn("draw"), 400);
                    document.getElementById('btnNext2').style.display = 'inline-block';
                }
            });
        }

        function momApprove() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            speakDual("嘩！Lingling 讀得好好聽呀！", "Very good!", () => {
                setTimeout(() => nextStep(4), 1500);
            });
        }

        function checkMatch(isCorrect, element) {
            if(isCorrect) {
                element.style.borderColor = "#34D399";
                element.style.backgroundColor = "#D1FAE5";
                confetti({ particleCount: 100, spread: 60 });
                speakDual("叻女！答啱啦！", "I can draw!", () => {
                    document.getElementById('btnNext4').style.display = 'inline-block';
                });
            } else {
                element.classList.add('wrong');
                speakDual("唔係呢個呀，試吓旁邊嗰個啦～", "");
                setTimeout(() => { element.classList.remove('wrong'); }, 1000);
            }
        }
    </script>
</body>
</html>
