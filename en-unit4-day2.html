<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unit 4 Day 2: I can do it (Advanced)</title>
    <!-- 若有全域樣式可解除註解 <link rel="stylesheet" href="theme.css"> -->
    <style>
        :root {
            --bg-color: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
            --btn-blue: linear-gradient(135deg, #7DD3FC, #0EA5E9);
            --btn-blue-shadow: #0369A1;
            --btn-green: linear-gradient(135deg, #6EE7B7, #10B981);
            --btn-green-shadow: #047857;
            --btn-red: linear-gradient(135deg, #FDA4AF, #F43F5E);
            --btn-red-shadow: #BE123C;
            --btn-yellow: linear-gradient(135deg, #FDE047, #EAB308);
            --btn-yellow-shadow: #A16207;
            --text-dark: #1E293B;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang HK', sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 4px solid white;
        }

        .btn-3d {
            background: var(--btn-blue);
            border: none; border-radius: 18px;
            border-bottom: 8px solid var(--btn-blue-shadow);
            color: white; font-size: 18px; font-weight: 900;
            padding: 12px 24px; cursor: pointer;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-3d:active { transform: translateY(4px); border-bottom-width: 4px; }

        .progress-dots { display: flex; gap: 8px; }
        .dot { width: 16px; height: 16px; background: #CBD5E1; border-radius: 50%; }
        .dot.active { background: #F59E0B; box-shadow: 0 0 8px #FCD34D; }

        .game-container {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }

        /* 視覺展示區 */
        .visual-area {
            background: white; border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 6px solid #FFF; text-align: center;
            min-height: 200px; width: 90%; max-width: 800px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 80px; position: relative; margin-bottom: 30px;
        }
        .speaker-btn {
            position: absolute; top: -20px; left: -20px;
            background: var(--btn-red); border: none; border-bottom: 6px solid var(--btn-red-shadow);
            border-radius: 50%; width: 70px; height: 70px; font-size: 30px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
            display: flex; align-items: center; justify-content: center; transition: all 0.1s;
        }
        .speaker-btn:active { transform: translateY(3px); border-bottom-width: 3px; }

        /* 積木與選項區 */
        .interaction-area { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; max-width: 800px; }
        
        /* 句子插槽 (Slots) */
        .slots-container {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            margin-bottom: 30px; width: 100%; min-height: 60px;
        }
        .slot-box {
            background: #F1F5F9; border: 4px dashed #CBD5E1;
            border-radius: 16px; padding: 10px 20px;
            font-size: 28px; font-weight: bold; color: #334155;
            min-width: 60px; text-align: center;
        }
        .slot-box.filled { background: var(--btn-yellow); border: 4px solid var(--btn-yellow-shadow); color: #713F12; border-style: solid; }

        /* 文字積木按鈕 */
        .word-block {
            background: white; border: 4px solid #E2E8F0; border-bottom: 8px solid #CBD5E1;
            border-radius: 20px; padding: 15px 30px; font-size: 30px; font-weight: bold; color: #334155;
            cursor: pointer; transition: all 0.1s;
        }
        .word-block:active { transform: translateY(4px); border-bottom-width: 4px; }
        .word-block.used { opacity: 0; pointer-events: none; }
        .wrong-shake { animation: shake 0.4s ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-3deg); }
            75% { transform: translateX(8px) rotate(3deg); }
        }

        /* 啟動與結算畫面 */
        #start-screen, #end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200;
        }
        #end-screen { display: none; }
        .anna-avatar { font-size: 100px; margin-bottom: 20px; animation: float 2s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <!-- 啟動畫面 -->
    <div id="start-screen">
        <div class="anna-avatar">🧚‍♀️</div>
        <h1 style="color:#0369A1; text-shadow: 2px 2px white; text-align:center;">Unit 4 Day 2: I can do it!</h1>
        <p style="color:#334155; font-weight:bold;">進階挑戰：無圖盲聽與常識陷阱</p>
        <button class="btn-3d" style="font-size: 24px; padding: 15px 40px; margin-top: 20px;" onclick="startGame()">▶️ 點擊開始課堂</button>
    </div>

    <!-- 頂部列 -->
    <header>
        <button class="btn-3d" style="background:#64748B; border-bottom-color:#475569;" onclick="goHome()">🏠 返回</button>
        <div class="progress-dots" id="dots"></div>
    </header>

    <!-- 主遊戲區 -->
    <div class="game-container">
        <div class="visual-area" id="visual-board">
            <button class="speaker-btn" onclick="playVoicePrompt()">🧚‍♀️🔊</button>
            <div id="content-display"></div>
            <!-- 句式積木插槽 -->
            <div class="slots-container" id="slots-area" style="display:none; margin-top:20px;"></div>
        </div>
        <div class="interaction-area" id="interaction-board">
            <!-- 動態生成積木或按鈕 -->
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen">
        <div class="anna-avatar">🎉</div>
        <h1 style="color:#10B981; text-shadow: 2px 2px white; text-align:center;">Well Done Lingling!</h1>
        <div style="background:white; padding:20px; border-radius:20px; text-align:center; box-shadow:0 10px 20px rgba(0,0,0,0.1); width:80%;">
            <h3 style="color:#F59E0B; margin:0 0 10px 0;">👩‍👧 媽媽 1 分鐘激勵時間</h3>
            <p style="color:#475569; font-weight:bold; margin:0;">請俾一支顏色筆玲玲，請佢一邊畫畫，一邊親口講出：<br><span style="color:#E20074; font-size:24px;">"I can draw!"</span></p>
        </div>
        <button class="btn-3d" style="margin-top:30px;" onclick="goHome()">🏠 銷案並返回</button>
    </div>

<script>
    // 【新舊融合進階劇本】
    const lessonData = [
        {
            type: "teach",
            visual: "🖍️ 🐱",
            voice: "Look! I have a crayon. I can draw a cat.",
            actionText: "Next ➡️"
        },
        {
            type: "build",
            visual: "👂🧠", // 無圖盲聽
            voice: "Now listen carefully. I can draw a cat. Can you build the sentence?",
            target: ["I", "can", "draw", "a", "cat"],
            shuffled: ["can", "cat", "I", "a", "draw"]
        },
        {
            type: "teach",
            visual: "🎤 😄",
            voice: "I can sing. I am very happy.",
            actionText: "Next ➡️"
        },
        {
            type: "build",
            visual: "👂🧠", // 無圖盲聽
            voice: "Your turn to build. I can sing.",
            target: ["I", "can", "sing"],
            shuffled: ["sing", "can", "I"]
        },
        {
            type: "trap",
            visual: "Tickles 🐱❓",
            voice: "Listen to Tickles. Tickles is a cat. He can sing. Is that true?",
            options: ["✅ Yes", "❌ No"],
            correct: 1 // No
        },
        {
            type: "trap",
            visual: "✏️ ❓",
            voice: "Listen to this. I can draw a pencil. Is that true?",
            options: ["✅ Yes", "❌ No"],
            correct: 0 // Yes
        }
    ];

    let currentStage = 0;
    let selectedWords = [];

    // 初始化進度點點
    const dotsContainer = document.getElementById('dots');
    lessonData.forEach(() => {
        let dot = document.createElement('div');
        dot.className = 'dot';
        dotsContainer.appendChild(dot);
    });

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        let initUtter = new SpeechSynthesisUtterance("");
        initUtter.volume = 0; window.speechSynthesis.speak(initUtter);
        loadStage();
    }

    // 【核心要求：活潑英式女聲】
    function speakText(text) {
        window.speechSynthesis.cancel();
        let utter = new SpeechSynthesisUtterance(text);
        let voices = window.speechSynthesis.getVoices();
        let ukVoice = voices.find(v => v.lang.includes('en-GB') && (v.name.includes('Female') || v.name.includes('Siri'))) || 
                      voices.find(v => v.lang.includes('en-GB'));
        if(ukVoice) utter.voice = ukVoice;
        utter.pitch = 1.3; // 卡通調皮感
        utter.rate = 0.85; // 稍慢清晰
        window.speechSynthesis.speak(utter);
    }

    function playVoicePrompt() {
        speakText(lessonData[currentStage].voice);
    }

    function loadStage() {
        if(currentStage >= lessonData.length) {
            document.getElementById('end-screen').style.display = 'flex';
            speakText("Wow, brilliant! You did a great job today.");
            return;
        }

        const data = lessonData[currentStage];
        const display = document.getElementById('content-display');
        const slotsArea = document.getElementById('slots-area');
        const interaction = document.getElementById('interaction-board');
        
        // 更新進度條
        document.querySelectorAll('.dot').forEach((d, idx) => {
            if (idx === currentStage) d.classList.add('active');
            else d.classList.remove('active');
        });

        display.innerHTML = data.visual;
        slotsArea.style.display = 'none';
        slotsArea.innerHTML = '';
        interaction.innerHTML = '';
        selectedWords = [];

        if (data.type === "teach") {
            let btn = document.createElement('button');
            btn.className = 'btn-3d';
            btn.style.background = 'var(--btn-green)';
            btn.style.borderBottomColor = 'var(--btn-green-shadow)';
            btn.style.fontSize = '24px';
            btn.innerText = data.actionText;
            btn.onclick = () => { currentStage++; loadStage(); };
            interaction.appendChild(btn);

        } else if (data.type === "build") {
            slotsArea.style.display = 'flex';
            // 創建空格
            data.target.forEach(() => {
                let slot = document.createElement('div');
                slot.className = 'slot-box';
                slot.innerText = '_';
                slotsArea.appendChild(slot);
            });
            // 創建打亂的積木
            data.shuffled.forEach((word, idx) => {
                let block = document.createElement('div');
                block.className = 'word-block';
                block.innerText = word;
                block.onclick = () => handleBlockClick(word, block, data);
                interaction.appendChild(block);
            });

        } else if (data.type === "trap") {
            data.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'word-block';
                btn.style.fontSize = '40px';
                btn.style.padding = '20px 40px';
                btn.innerText = opt;
                btn.onclick = () => handleTrapClick(idx, data.correct, btn);
                interaction.appendChild(btn);
            });
        }

        setTimeout(playVoicePrompt, 300);
    }

    // 處理積木點擊
    function handleBlockClick(word, blockElement, data) {
        if(blockElement.classList.contains('used')) return;
        
        selectedWords.push(word);
        blockElement.classList.add('used');
        
        // 填入 Slot
        const slots = document.getElementById('slots-area').children;
        slots[selectedWords.length - 1].innerText = word;
        slots[selectedWords.length - 1].classList.add('filled');

        // 如果填滿了，檢查對錯
        if(selectedWords.length === data.target.length) {
            let isCorrect = selectedWords.join(" ") === data.target.join(" ");
            if(isCorrect) {
                speakText("Spot on!");
                document.getElementById('slots-area').classList.add('correct');
                setTimeout(() => { currentStage++; loadStage(); }, 1500);
            } else {
                speakText("Oops, that's not right. Try again!");
                document.getElementById('visual-board').classList.add('wrong-shake');
                setTimeout(() => {
                    document.getElementById('visual-board').classList.remove('wrong-shake');
                    // 重置積木
                    loadStage(); 
                }, 1000);
            }
        }
    }

    // 處理陷阱題點擊
    function handleTrapClick(selectedIndex, correctIndex, btnElement) {
        if(selectedIndex === correctIndex) {
            btnElement.style.background = 'var(--btn-green)';
            btnElement.style.color = 'white';
            speakText("You got it!");
            setTimeout(() => { currentStage++; loadStage(); }, 1200);
        } else {
            btnElement.classList.add('wrong-shake');
            speakText("Think again!");
            setTimeout(() => btnElement.classList.remove('wrong-shake'), 600);
        }
    }

    // 【雙重斷音保護】
    function goHome() {
        window.speechSynthesis.pause();
        window.speechSynthesis.cancel();
        setTimeout(() => { window.location.href = 'index.html'; }, 300);
    }

    window.addEventListener('beforeunload', goHome);
</script>
</body>
</html>
