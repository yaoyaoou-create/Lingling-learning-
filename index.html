<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>玲玲的成長學習樂園</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Comic Sans MS', 'Chalkboard SE', "PingFang HK", system-ui, sans-serif; }
    body { margin: 0; padding: 12px; background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #1e293b; }
    .container { width: 100%; max-width: 800px; background: #ffffff; border-radius: 24px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1); padding: 16px 14px; border: 4px solid #38bdf8; }
    .header { text-align: center; margin-bottom: 16px; border-bottom: 3px dashed #bae6fd; padding-bottom: 10px; }
    .title { font-size: 1.8rem; font-weight: 900; color: #0369a1; margin: 0 0 4px 0; }
    .subtitle { font-size: 0.95rem; color: #64748b; font-weight: 700; margin: 0; }
    
    .section { margin-bottom: 16px; }
    .section-title { font-size: 1.15rem; font-weight: 900; color: #0f172a; margin: 0 0 10px 4px; display: flex; align-items: center; gap: 6px; }
    
    /* 網格排版核心：自動適應螢幕寬度，每列最少 140px 寬 */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    
    .card-link { text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 8px; border-radius: 18px; border: 3px solid transparent; transition: transform 0.15s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card-link:active { transform: scale(0.96); }
    
    .icon-box { font-size: 2.2rem; width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.9); margin-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .card-info h3 { margin: 0 0 4px 0; font-size: 0.95rem; font-weight: 900; line-height: 1.2; }
    .card-info p { margin: 0; font-size: 0.75rem; font-weight: 700; opacity: 0.85; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 各區主題配色 */
    .theme-thomas { background: #eff6ff; border-color: #3b82f6; color: #1e3a8a; }
    .theme-cn { background: #fdf2f8; border-color: #f472b6; color: #831843; }
    .theme-en1 { background: #f0fdf4; border-color: #4ade80; color: #14532d; }
    .theme-en2 { background: #fffbeb; border-color: #fbbf24; color: #78350f; }
    .theme-en3 { background: #f5f3ff; border-color: #a78bfa; color: #4c1d95; }
    .theme-master { background: #fff1f2; border-color: #fb7185; color: #881337; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="title">🌟 玲玲的成長學習樂園 🌟</h1>
    <p class="subtitle">K2 互動繪本 ‧ 中文字寶寶 ‧ 英文闖關</p>
  </div>

  <div class="section">
    <div class="section-title">📖 有聲繪本</div>
    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <a href="thomas.html" class="card-link theme-thomas">
        <div class="icon-box">🚂</div>
        <div class="card-info">
          <h3>Thomas Goes Fishing</h3>
          <p>真人發音 + 釣魚遊戲</p>
        </div>
      </a>
      <!-- 未來加入新繪本可以放在這裡 -->
    </div>
  </div>

  <div class="section">
    <div class="section-title">🀄 中文</div>
    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <a href="chinese.html" class="card-link theme-cn">
        <div class="icon-box">🐣</div>
        <div class="card-info">
          <h3>K2 中文字寶寶</h3>
          <p>好朋友室‧課唱歌 (Test 1-5)</p>
        </div>
      </a>
      <!-- 未來加入新中文單元可以放在這裡 -->
    </div>
  </div>

  <div class="section">
    <div class="section-title">🔤 英文</div>
    <div class="grid">
      <a href="en-animals.html" class="card-link theme-en1">
        <div class="icon-box">🐾</div>
        <div class="card-info">
          <h3>動物家庭</h3>
          <p>Cat, Dog, Family</p>
        </div>
      </a>

      <a href="en-emotions.html" class="card-link theme-en3">
        <div class="icon-box">😊</div>
        <div class="card-info">
          <h3>情緒句子</h3>
          <p>Happy, Sad, Angry</p>
        </div>
      </a>

      <a href="en-stationery.html" class="card-link theme-en2">
        <div class="icon-box">✏️</div>
        <div class="card-info">
          <h3>校園文具</h3>
          <p>發音預習與連線</p>
        </div>
      </a>

      <a href="en-master.html" class="card-link theme-master">
        <div class="icon-box">🏆</div>
        <div class="card-info">
          <h3>全能總測</h3>
          <p>K2 總考與錯題本</p>
        </div>
      </a>
    </div>
  </div>
</div>

</body>
</html>
