<script>
  // =========================================================================
  // 1. 終極「雙軌排隊 + Web Audio」引擎
  // =========================================================================
  window.utterancePool = [];
  let audioQueueId = 0;
  let activeAudioElement = null;
  let audioCtx = null;

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  }

  function stopAllAudio() {
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeAudioElement) {
      try { activeAudioElement.onended = null; activeAudioElement.onerror = null; activeAudioElement.pause(); activeAudioElement.currentTime = 0; } catch (e) {}
      activeAudioElement = null;
    }
  }

  function playSingleMp3(file, boostGain = 2.2, onDone) {
    ensureAudioContext();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    activeAudioElement = audio;

    if (audioCtx) {
      try {
        const source = audioCtx.createMediaElementSource(audio);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = boostGain;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      } catch (e) { audio.volume = 1.0; }
    }

    let finished = false;
    const finish = () => { if(!finished){ finished = true; if(onDone) onDone(); }};
    audio.onended = finish; audio.onerror = finish;
    audio.play().catch(finish);
  }

  function playHybridQueue(steps) {
    stopAllAudio();
    if (!steps || !steps.length) return;
    const myQueueId = audioQueueId;
    let idx = 0;

    function nextStep() {
      if (myQueueId !== audioQueueId || idx >= steps.length) return;
      const step = steps[idx++];

      if (step.type === 'zh') {
        if (!('speechSynthesis' in window) || !step.text) { nextStep(); return; }
        const u = new SpeechSynthesisUtterance(step.text);
        window.utterancePool.push(u);
        u.lang = 'zh-HK'; u.pitch = 1.05; u.rate = 0.92; u.volume = 0.68;
        let advanced = false;
        const done = () => { if(!advanced && myQueueId === audioQueueId) { advanced = true; setTimeout(()=>nextStep(), 150); }};
        u.onend = done; u.onerror = done;
        setTimeout(() => { if (myQueueId === audioQueueId) window.speechSynthesis.speak(u); }, 50);
      }
      else if (step.type === 'mp3') {
        playSingleMp3(step.file, step.boost || 2.2, () => {
          if (myQueueId === audioQueueId) setTimeout(()=>nextStep(), 150);
        });
      }
    }
    nextStep();
  }

  function getWordAudioStep(wordId) {
    const map = {
      run: 'en-run.mp3', jump: 'en-jump.mp3', sing: 'en-sing.mp3', draw: 'en-draw.mp3',
      how_old: 'en-how-old.mp3', four: 'en-four.mp3',
      m_sound: 'en-m-sound.mp3', mouth: 'en-mouth.mp3', meat: 'en-meat.mp3', milk: 'en-milk.mp3'
    };
    const boost = (wordId === 'meat' || wordId === 'milk') ? 2.5 : 2.1;
    return { type: 'mp3', file: map[wordId], boost };
  }

  let currentGuideCantonese = "";
  function setGuide(zhText, autoSpeak = true) {
    currentGuideCantonese = zhText;
    document.getElementById('teacherMsg').textContent = zhText;
    if (autoSpeak) replayGuide();
  }
  function replayGuide() {
    playHybridQueue([{ type: 'zh', text: currentGuideCantonese }]);
  }

  // ==========================================

  // ==========================================

    meat: \`<svg viewBox="0 0 180 180" width="100%" height="100%"><g transform="rotate(-25 90 90)"><rect x="96" y="78" width="52" height="24" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="5"/><circle cx="148" cy="78" r="13" fill="#FFFBEB" stroke="#D97706" stroke-width="5"/><circle cx="148" cy="102" r="13" fill="#FFFBEB" stroke="#D97706" stroke-width="5"/><ellipse cx="76" cy="90" rx="52" ry="38" fill="#F97316" stroke="#C2410C" stroke-width="6"/><ellipse cx="70" cy="82" rx="34" ry="20" fill="#FB923C"/></g></svg>\`,
    milk: \`<svg viewBox="0 0 180 180" width="100%" height="100%"><polygon points="56,52 90,28 124,52" fill="#60A5FA" stroke="#1D4ED8" stroke-width="5" stroke-linejoin="round"/><rect x="56" y="52" width="68" height="98" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/><rect x="56" y="88" width="68" height="36" fill="#93C5FD"/><path d="M90 95 C90 95 100 107 100 113 A10 10 0 0 1 80 113 C80 107 90 95 90 95 Z" fill="#FFFFFF"/></svg>\`
  };

  // ==========================================
  // 3. 課程資料 (大重溫四部曲)
  // ==========================================
  // 第一幕：動作大重溫 (包含 draw 弱點)
  const ACT1_CARDS = [
    { id: 'run', badge: '🏃 動作重溫 1', guideZh: '第一幕動作大重溫！點擊圖卡聽下點樣講跑跑跑！' },
    { id: 'jump', badge: '🦘 動作重溫 2', guideZh: '跳起嚟點講？點擊聽下！' },
    { id: 'sing', badge: '🎵 動作重溫 3', guideZh: '唱歌又點講？聽下發音！' },
    { id: 'draw', badge: '🔥 重點弱點擊破', guideZh: '最後係畫畫！呢個要記清楚，點擊聽發音！' }
  ];

  // 第二幕：口語小劇場
  const ACT2_ORAL = {
    guideZh: '第二幕口語劇場！當 Anna 老師問你幾多歲，你要點樣答呢？點擊下面嘅圖卡！'
  };

  // 第三幕：Phonics 節奏鼓 (/m/)
  const ACT3_RHYTHM = [
    { wordId: 'mouth', en: 'mouth', guideZh: '第三幕首音節奏鼓！跟住拍手：mmm - mmm - mouth!' },
    { wordId: 'meat', en: 'meat', guideZh: '再嚟一次節奏：mmm - mmm - meat!' },
    { wordId: 'milk', en: 'milk', guideZh: '最後一個節奏：mmm - mmm - milk!' }
  ];

  // 第四幕：終極辨音王 (動作 + 怪獸混合雙打)
  const ACT4_QUIZ = [
    {
      badge: '🎧 動作聽力挑戰 1',
      questionZh: '老師話 I can sing！邊張圖卡係唱歌呢？',
      promptSteps: [{ type: 'mp3', file: 'en-sing.mp3' }],
      correctId: 'sing', wrongId: 'draw'
    },
    {
      badge: '🎧 動作聽力挑戰 2',
      questionZh: '老師話 I can run！邊張圖卡係跑跑跑？',
      promptSteps: [{ type: 'mp3', file: 'en-run.mp3' }],
      correctId: 'run', wrongId: 'jump'
    },
    {
      badge: '👾 餵怪獸挑戰 3',
      questionZh: '怪獸要食 m 開頭嘅食物！邊一張係 m 開頭？',
      promptSteps: [{ type: 'mp3', file: 'en-m-sound.mp3', boost: 2.3 }],
      correctId: 'meat', wrongId: 'jump' // jump 係動作做錯選項
    },
    {
      badge: '👾 餵怪獸挑戰 4',
      questionZh: '最後一題！搵出 m 開頭嘅健康飲品餵怪獸！',
      promptSteps: [{ type: 'mp3', file: 'en-m-sound.mp3', boost: 2.3 }],
      correctId: 'milk', wrongId: 'sing'
    }
  ];

  // ==========================================
  // 4. 渲染引擎
  // ==========================================
  let currentAct = 0, subIndex = 0, drumStep = 0;
  let oralTeacherDone = false;
  let quizSolved = false, quizWrongPicked = null;

  function updateActNav() {
    document.querySelectorAll('.act-pill').forEach((p, idx) => {
      p.className = \`act-pill \${currentAct === 4 || idx < currentAct ? 'done' : (idx === currentAct ? 'active' : '')}\`;
    });
  }

  function jumpToAct(idx) {
    currentAct = idx; subIndex = 0; drumStep = 0; oralTeacherDone = false; quizSolved = false; quizWrongPicked = null;
    updateActNav(); renderStage(true);
  }

  function renderStage(shouldSpeak = true) {
    const container = document.getElementById('stageContainer');
    updateActNav();

    // --- Act 1: 動作重溫 ---
    if (currentAct === 0) {
      const c = ACT1_CARDS[subIndex];
      setGuide(c.guideZh, shouldSpeak);
      container.innerHTML = \`
        <div class="dots-row">\${ACT1_CARDS.map((_, i) => \`<span class="dot \${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>\`).join('')}</div>
        <div class="stage-badge">\${c.badge}</div>
        <div class="flashcard-3d" id="meaningCard" onclick="playImmersiveEn('\${c.id}')">
          <div class="pulse-ring"></div>
          <div class="illustration-wrap">\${ILLUSTRATIONS[c.id]}</div>
          <div class="word-en">\${c.id}</div>
          <div class="hint-text">👆 點擊聽發音</div>
        </div>
        <div class="btn-row" style="margin-top: 30px;">
          \${subIndex > 0 ? \`<button class="btn-3d btn-purple" onclick="subIndex--; renderStage(true);">⬅️ 上一個</button>\` : ''}
          <button class="btn-3d btn-green" onclick="if(subIndex < ACT1_CARDS.length-1){ subIndex++; renderStage(true); } else jumpToAct(1);">
            \${subIndex < ACT1_CARDS.length - 1 ? '下一個 ➡️' : '去口語劇場 💬'}
          </button>
        </div>
      \`;
    }

    // --- Act 2: 口語對答 ---
    else if (currentAct === 1) {
      if (shouldSpeak) {
        setGuide(ACT2_ORAL.guideZh, false);
        playHybridQueue([
          { type: 'zh', text: ACT2_ORAL.guideZh },
          { type: 'mp3', file: 'en-how-old.mp3' }
        ]);
      } else {
        setGuide(ACT2_ORAL.guideZh, false);
      }
      
      container.innerHTML = \`
        <div class="dots-row"><span class="dot active"></span></div>
        <div class="stage-badge">💬 聽問題，答句子</div>
        
        <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin: 20px 0;">
           <div style="background:#F1F5F9; padding:15px; border-radius:20px; border:3px solid #CBD5E1;">
             <div style="font-size:40px; margin-bottom:10px;">👩‍🏫</div>
             <button class="btn-3d btn-purple" style="font-size:16px; padding:10px 15px;" onclick="playHybridQueue([getWordAudioStep('how_old')])">🔊 再聽問題</button>
           </div>
           <div style="font-size:40px; color:#3B82F6;">➔</div>
           <div class="flashcard-3d" style="margin:0; max-width:280px;" onclick="playOralAnswer()">
             <div class="pulse-ring"></div>
             <div class="illustration-wrap" style="width:120px; height:120px;">\${ILLUSTRATIONS['four']}</div>
             <div class="hint-text">👆 點擊聽答案</div>
           </div>
        </div>

        <div class="btn-row" style="margin-top: 30px;">
          <button class="btn-3d btn-green" onclick="launchFireworks(); playHybridQueue([{type:'zh', text:'玲玲答得好清楚！放煙花'}]);">🎉 我答啱喇！</button>
          <button class="btn-3d btn-green" onclick="jumpToAct(2);">去節奏鼓 🥁 ➡️</button>
        </div>
      \`;
    }

    // --- Act 3: 節奏律動 (Rhythm) ---
    else if (currentAct === 2) {
      const c = ACT3_RHYTHM[subIndex];
      setGuide(c.guideZh, shouldSpeak);
      container.innerHTML = \`
        <div class="dots-row">\${ACT3_RHYTHM.map((_, i) => \`<span class="dot \${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>\`).join('')}</div>
        <div class="stage-badge">🥁 節奏律動 (\${subIndex + 1} / 3)</div>
        
        <div class="rhythm-arena">
          <div class="drum-pad \${drumStep >= 1 ? 'active-drum' : ''}" onclick="tapDrum(1)">
            <div style="font-size: 40px;">👏</div>
            <div style="font-size: 22px; font-weight: 900; margin-top: 8px;">m</div>
          </div>
          <div class="drum-pad \${drumStep >= 2 ? 'active-drum' : ''}" onclick="tapDrum(2)">
            <div style="font-size: 40px;">👏</div>
            <div style="font-size: 22px; font-weight: 900; margin-top: 8px;">m</div>
          </div>
          <div style="font-size: 28px; color: #3B82F6; font-weight: 900;">➔</div>
          <div class="drum-pad target-card \${drumStep >= 3 ? 'active-drum' : ''}" onclick="tapDrum(3)">
            <div style="width: 80px; height: 80px;">\${ILLUSTRATIONS[c.wordId]}</div>
            <div style="font-size: 24px; font-weight: 900; margin-top: 4px; color: inherit;">\${c.en}</div>
          </div>
        </div>

        <div class="btn-row" style="margin-top: 30px;">
          \${subIndex > 0 ? \`<button class="btn-3d btn-purple" onclick="subIndex--; drumStep=0; renderStage(true);">⬅️</button>\` : ''}
          <button class="btn-3d btn-green" onclick="if(subIndex < ACT3_RHYTHM.length-1){ subIndex++; drumStep=0; renderStage(true); } else jumpToAct(3);">
            \${subIndex < ACT3_RHYTHM.length - 1 ? '下一個 ➡️' : '去終極挑戰 👾'}
          </button>
        </div>
      \`;
    }

    // --- Act 4: 混合 Quiz ---
    else if (currentAct === 3) {
      const q = ACT4_QUIZ[subIndex];
      setGuide(q.questionZh, false);
      if (shouldSpeak) {
        playHybridQueue([ { type: 'zh', text: q.questionZh }, ...q.promptSteps ]);
      }

      const isMonster = q.badge.includes('怪獸');

      container.innerHTML = \`
        <div class="dots-row">\${ACT4_QUIZ.map((_, i) => \`<span class="dot \${i === subIndex ? 'active' : ''}"></span>\`).join('')}</div>
        
        \${isMonster ? \`
        <div class="monster-stage">
          <div class="monster-avatar">👾</div>
          <div style="font-size: 20px; font-weight: 900; color: #9A3412;">我要食 m 開頭嘅嘢！</div>
        </div>
        \` : \`
        <div class="stage-badge" style="margin-bottom:20px;">\${q.badge}</div>
        <button class="btn-3d btn-purple" style="margin-bottom:20px;" onclick="replayQuizSound()">🔊 再聽一次題目</button>
        \`}

        <div class="feed-grid">
          <div class="feed-card \${quizSolved ? (isMonster?'fed-success':'correct') : ''}" onclick="pickQuiz('\${q.correctId}', \${isMonster})">
            <div style="width: 130px; height: 130px; margin: 0 auto;">\${ILLUSTRATIONS[q.correctId]}</div>
          </div>
          <div class="feed-card \${!quizSolved && quizWrongPicked === q.wrongId ? 'wrong-try' : ''}" onclick="pickQuiz('\${q.wrongId}', \${isMonster})">
            <div style="width: 130px; height: 130px; margin: 0 auto;">\${ILLUSTRATIONS[q.wrongId]}</div>
          </div>
        </div>
        
        \${quizSolved ? \`
           <div class="gentle-hint-banner success">🎉 好叻呀！答啱咗喇！</div>
           <div class="btn-row"><button class="btn-3d btn-green" onclick="if(subIndex < 3){ subIndex++; quizSolved=false; quizWrongPicked=null; renderStage(true); } else jumpToAct(4);">下一題 ➡️</button></div>
        \` : (quizWrongPicked ? \`<div class="gentle-hint-banner">💛 試下揀隔離嗰張圖卡啦！</div>\` : '')}
      \`;
    }

    // --- Summary ---
    else if (currentAct === 4) {
      setGuide("恭喜玲玲！Unit 4 全部內容已經完美掌握！", shouldSpeak);
      if (shouldSpeak) { launchFireworks(); setTimeout(launchFireworks, 800); }
      
      const secretCode = \`【玲玲英文課堂進度暗號】單元：Unit 4 Day 5 大結局 (en-unit4-day5.html)｜完成狀態：✅ 全課順利完成 (完美動作重溫 + 口語劇場 + Phonics 節奏)｜請 Anna 老師更新雲端英文總庫，並準備 Unit 4 Test 1 闖關測驗！\`;

      container.innerHTML = \`
        <div style="font-size: 70px;">🏆</div>
        <h1 style="color: #0284C7; margin: 10px 0;">Unit 4 完美過關！</h1>
        
        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn-3d btn-green" id="copySecretBtn" onclick="copyProgressSecret()">📋 複製暗號準備大闖關</button>
        </div>
        <div class="secret-code-box" id="secretCodeText" style="margin-bottom:20px;">\${secretCode}</div>

        <div class="btn-row"><a href="en-unit4.html" class="btn-3d btn-amber" style="text-decoration:none;">🏠 返去主目錄</a></div>
      \`;
    }
  }

  // ==========================================
  // 5. 互動邏輯 (純英文發音)
  // ==========================================
  function playImmersiveEn(wordId) {
    const el = document.getElementById('meaningCard');
    if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    playHybridQueue([getWordAudioStep(wordId)]);
  }

  function playOralAnswer() {
    playHybridQueue([getWordAudioStep('four')]);
  }

  function tapDrum(step) {
    const c = ACT3_RHYTHM[subIndex];
    drumStep = step; renderStage(false);
    if (step === 1 || step === 2) {
      playHybridQueue([{ type: 'mp3', file: 'en-m-sound.mp3', boost: 2.3 }]);
    } else {
      launchFireworks();
      playHybridQueue([getWordAudioStep(c.wordId)]);
    }
  }

  function replayQuizSound() {
    const q = ACT4_QUIZ[subIndex];
    playHybridQueue(q.promptSteps);
  }

  function pickQuiz(picked, isMonster) {
    if (quizSolved) return;
    const q = ACT4_QUIZ[subIndex];
    if (picked === q.correctId) {
      quizSolved = true; quizWrongPicked = null; renderStage(false); launchFireworks();
      playHybridQueue([
        getWordAudioStep(q.correctId), 
        {type:'zh', text: isMonster ? '好味呀！' : '答啱喇！'}
      ]);
    } else {
      quizWrongPicked = picked; renderStage(false);
      playHybridQueue([
        { type: 'zh', text: '試下隔離嗰張啦！' }
      ]);
    }
  }

  function copyProgressSecret() {
    const text = document.getElementById('secretCodeText').innerText;
    const btn = document.getElementById('copySecretBtn');
    function onCopied() {
      btn.textContent = '✅ 已複製暗號！快啲貼俾 Anna 老師！';
      playHybridQueue([{ type: 'zh', text: '已複製暗號！請媽媽貼返去對話框俾老師啦！' }]);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); callback();
  }

  // ==========================================
  // 6. 煙花引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas'), ctx = canvas.getContext('2d');
  let particles = [], animRunning = false;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();
  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7'];
    for (let burst=0; burst<3; burst++) {
      const cx = canvas.width*(0.3+Math.random()*0.4), cy = canvas.height*(0.2+Math.random()*0.3);
      for (let i=0; i<30; i++) {
        const a = (Math.PI*2*i)/30, s = 2+Math.random()*4;
        particles.push({x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, alpha:1, color:colors[Math.floor(Math.random()*colors.length)], size:4+Math.random()*4});
      }
    }
    if (!animRunning) { animRunning = true; requestAnimationFrame(animateParticles); }
  }
  function animateParticles() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i=particles.length-1; i>=0; i--) {
      let p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.alpha-=0.02;
      if (p.alpha<=0) particles.splice(i,1);
      else { ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha=1;
    if (particles.length>0) requestAnimationFrame(animateParticles); else animRunning = false;
  }

  renderStage(false);
</script>
</body>
</html>
