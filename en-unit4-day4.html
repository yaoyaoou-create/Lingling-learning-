<head>

  <style>
    /* iPad Safari 終極防護引擎：防雙擊放大鎖 & 強制區塊排版 */
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      display: block !important;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Rounded Mplus 1c", sans-serif;
      background: linear-gradient(180deg, #60A5FA 0%, #93C5FD 55%, #DBEAFE 100%);
      color: #1E293B;
      overflow-x: hidden;
    }

    /* 煙花畫布 */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* 頂部深藍導航列 */
    .top-nav {
      background: linear-gradient(180deg, #1E3A8A 0%, #1D4ED8 100%);
      color: #FFFFFF;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 5px 0 #172554;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-home {
      background: #F59E0B;
      color: #1E293B;
      text-decoration: none;
      font-weight: 900;
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 0 #B45309;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.1s;
    }

    .btn-home:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #B45309;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    /* 四幕進度地圖 */
    .act-map {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .act-pill {
      padding: 6px 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.18);
      color: #DBEAFE;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .act-pill.active {
      background: #FACC15;
      color: #1E3A8A;
      border-color: #FEF08A;
      box-shadow: 0 3px 0 #CA8A04;
      transform: scale(1.05);
    }

    .act-pill.done {
      background: #34D399;
      color: #064E3B;
    }

    /* 主容器 */

      max-width: 820px;
      margin: 0 auto;
      padding: 16px 16px 48px;
    }

    /* Anna 老師常駐黃色橫幅 */

      background: linear-gradient(135deg, #FEF08A 0%, #FDE047 100%);
      border: 3px solid #EAB308;
      border-radius: 24px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 0 #CA8A04;
      cursor: pointer;
      transition: transform 0.1s;

    .teacher-banner:active {

    }

    .teacher-avatar {

      height: 58px;

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #D97706;
    }

    .teacher-text-box {
      flex: 1;
    }

    .teacher-name {
      font-size: 13px;
      font-weight: 900;
      color: #92400E;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-msg {
      font-size: 17px;
      font-weight: 800;
      color: #451A03;
      line-height: 1.4;
    }

    .replay-chip {
      background: #F59E0B;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 900;
      padding: 7px 12px;
      border-radius: 14px;
      box-shadow: 0 3px 0 #B45309;
      white-space: nowrap;
    }

    /* 3D 白色主舞台卡片 */
    .stage-card {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 10px 0 #93C5FD, 0 14px 28px rgba(30, 58, 138, 0.18);
      border: 4px solid #EFF6FF;
      text-align: center;
    }

    .stage-badge {
      display: inline-block;
      background: #DBEAFE;
      color: #1D4ED8;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .stage-badge.warmup {
      background: #FEF3C7;
      color: #B45309;
      border: 2px solid #F59E0B;
    }

    /* 超大 3D 單字圖卡 */
    .flashcard-3d {
      background: linear-gradient(180deg, #F8FAFC 0%, #EFF6FF 100%);
      border: 4px solid #60A5FA;
      border-radius: 28px;
      padding: 22px 18px;
      margin: 8px auto 18px;
      max-width: 460px;
      box-shadow: 0 8px 0 #3B82F6;
      cursor: pointer;

    .flashcard-3d:active, .flashcard-3d.pop {
      transform: scale(1.03);
    }

    .illustration-wrap {
      width: 170px;
      height: 170px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-en {
      font-size: 48px;
      font-weight: 900;
      color: #1E3A8A;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .word-en .highlight-m {

      background: #FFEDD5;
      padding: 0 8px;
      border-radius: 12px;
      border-bottom: 4px solid #F97316;

      font-weight: 800;
      color: #475569;

      font-weight: 900;

      margin-top: 6px;

      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-3d {

      border-radius: 20px;
      padding: 14px 22px;
      font-size: 19px;
      font-weight: 900;

      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s;

    .btn-3d:active {

    }

      color: #FFFFFF;

    .btn-amber {

      color: #FFFFFF;
      box-shadow: 0 5px 0 #B45309;
    }

    .btn-green {

      color: #FFFFFF;

    .blocks-arena {

      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 22px 0;
    }

    .letter-block {

      height: 78px;

      box-shadow: 0 7px 0 #0369A1;
    }

      position: absolute;
      top: -10px;
      right: -8px;

      color: #065F46;

      font-weight: 900;

    .choice-grid {

      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 540px;
      margin: 18px auto;
    }

    .choice-card {
      background: #F8FAFC;
      border: 4px solid #93C5FD;
      border-radius: 26px;
      padding: 18px 12px;
      box-shadow: 0 7px 0 #60A5FA;
      cursor: pointer;
      transition: transform 0.12s, background-color 0.15s, border-color 0.15s;
    }

    .choice-card:active {
      transform: translateY(4px);
    }

    .choice-card.correct {
      background: #DCFCE7;
      border-color: #22C55E;
      box-shadow: 0 7px 0 #15803D;
      transform: scale(1.04);
    }

    .choice-card.gentle-try {
      background: #FEF3C7;
      border-color: #F59E0B;
      box-shadow: 0 7px 0 #D97706;
      animation: gentleWiggle 0.4s ease;
    }

    @keyframes gentleWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }

    .gentle-hint-banner {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #B45309;
      background: #FEF3C7;
      border-radius: 16px;
      padding: 8px 16px;
      margin: 10px auto 0;
      max-width: 460px;
    }

    .gentle-hint-banner.success {
      color: #065F46;
      background: #D1FAE5;
    }

    /* 分頁圓點 */
    .dots-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #CBD5E1;
      transition: all 0.2s;
    }

    .dot.active {
      width: 30px;
      border-radius: 8px;
      background: #2563EB;
    }

    .dot.completed {
      background: #10B981;
    }

    /* 結算畫面暗號區 */
    .secret-code-box {
      background: #F1F5F9;
      border: 3px dashed #64748B;
      border-radius: 20px;
      padding: 16px;
      margin: 18px auto;
      max-width: 560px;
      font-size: 15px;
      font-weight: 700;
      color: #334155;
      line-height: 1.5;
      text-align: left;
      user-select: text;
      -webkit-user-select: text;
    }

    .summary-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 16px 0;
    }

    .summary-chip {
      background: #EFF6FF;
      border: 2px solid #60A5FA;
      color: #1E3A8A;
      font-size: 17px;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 16px;
    }

    @media (max-width: 600px) {
      .nav-title { font-size: 14px; }
      .act-pill { padding: 5px 8px; font-size: 12px; }
      .word-en { font-size: 40px; }
      .letter-block { width: 56px; height: 66px; font-size: 34px; }
      .illustration-wrap { width: 140px; height: 140px; }
    }
  </style>
</head>

  // ==========================================
  // 1. 全新「中英雙軌 (Hybrid Voice) 引擎」
  // ==========================================
  
  // A. 中文 TTS 播放 (專門負責 Anna 老師廣東話導航)
  let currentSpeechId = 0; 
  function playChineseTTS(text) {
    if (!('speechSynthesis' in window) || !text) return;
    const mySpeechId = ++currentSpeechId;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK';
    u.pitch = 1.05;
    u.rate = 0.9;
    
    // 預防 iOS TTS 引擎卡死
    u.onend = () => { if(mySpeechId === currentSpeechId) currentSpeechId = 0; };
    u.onerror = () => { if(mySpeechId === currentSpeechId) currentSpeechId = 0; };
    
    setTimeout(() => { if (mySpeechId === currentSpeechId) window.speechSynthesis.speak(u); }, 60);
  }

  // B. 英文 MP3 播放 (專門負責 ElevenLabs 高質音檔，絕對零報錯、不變男聲)
  let currentAudio = null;
  function playEnglishAudio(mp3FileName) {
    if(currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    // 指向 GitHub 上你建立的 audio 資料夾
    currentAudio = new Audio('audio/' + mp3FileName);
    currentAudio.play().catch(e => console.log('Audio play hindered by browser policy until interaction.'));
  }

  // 老師導航狀態
  let currentGuideCantonese = "歡迎返到英文大本營！今日我哋先熱身重溫畫畫，再認識新嘅英文字母發音！";
  let currentGuideEnglishAudio = "";

  function setGuide(zhText, enAudioFile = "", autoSpeak = true) {
    currentGuideCantonese = zhText;
    currentGuideEnglishAudio = enAudioFile;
    document.getElementById('teacherMsg').textContent = zhText;
    if (autoSpeak) {
      replayGuide();
    }
  }

  function replayGuide() {
    playChineseTTS(currentGuideCantonese);
    // 雙軌並行：如果需要中英夾雜，可以透過 setTimeout 延遲播放英文 (這裡預設先播中文)
    if (currentGuideEnglishAudio) {
      // 假設中文導航平均需要 3.5 秒，這裡延遲 3.5 秒後自動播放英文 MP3
      setTimeout(() => { playEnglishAudio(currentGuideEnglishAudio); }, 3500);
    }
  }

  function tapLetterBlock(letterIdx) {

    litBlocks[letterIdx] = true; 
    renderStage(false);

    const ch = item.letters[letterIdx].toLowerCase(); // 轉換為小寫，確保檔名正確
    const allLit = item.letters.every((_, idx) => Boolean(litBlocks[idx]));

    if (allLit) {
      launchFireworks();
      playEnglishAudio(`en-${ch}.mp3`); // 先播最後一粒字母
      setTimeout(() => {
        playChineseTTS('好叻呀！你已經拍晒全部字母積木喇！一齊聽下成個字點讀！');
      }, 1000);
      setTimeout(() => {
        playEnglishAudio(item.fullAudio); // 播完成個字的 MP3
      }, 4500);
    } else {
      // 完美調用你剛剛生成的 A-Z 單字母 MP3
      playEnglishAudio(`en-${ch}.mp3`);
    }
  }

    }
  }

  function nextAct2() {
    if (subIndex < ACT2_WORDS.length - 1) {
      subIndex++;
      litBlocks = [];
      renderStage(true);
    } else {
      jumpToAct(2);
    }
  }

  // --- 第三幕互動 ---
  function celebrateSpeaking() {
    speakingDone[subIndex] = true;
    renderStage(false);
    launchFireworks();
    const item = ACT3_SPEAK[subIndex];
    playChineseTTS('嘩！玲玲讀得又大聲又標準，超叻女呀！');
    setTimeout(() => { playEnglishAudio(item.audioFile); }, 3000);
  }

  function prevAct3() {
    if (subIndex > 0) {
      subIndex--;
      renderStage(true);
    }
  }

  function nextAct3() {
    if (subIndex < ACT3_SPEAK.length - 1) {
      subIndex++;
      renderStage(true);
    } else {
      jumpToAct(3);
    }
  }

  // --- 第四幕互動 ---
  function pickQuizOption(pickedId) {
    if (quizSolved) return;
    const q = ACT4_QUIZ[subIndex];

    if (pickedId === q.correctId) {
      quizSolved = true; 
      quizWrongPicked = null;
      renderStage(false);
      launchFireworks();
      playChineseTTS('好叻呀玲玲！答啱咗喇！');
      setTimeout(() => { playEnglishAudio(q.promptAudio); }, 2500);
    } else {
      quizWrongPicked = pickedId; 
      renderStage(false);
      playChineseTTS('試吓隔離嗰張圖卡啦！');
    }
  }

  function nextAct4() {
    if (subIndex < ACT4_QUIZ.length - 1) {
      subIndex++;
      quizSolved = false;
      quizWrongPicked = null;
      renderStage(true);
    } else {
      jumpToAct(4);
    }
  }

  // --- 一鍵複製暗號 (相容 iPad Safari) ---
  function copyProgressSecret() {
    const text = document.getElementById('secretCodeText').innerText;
    const btn = document.getElementById('copySecretBtn');

    function onCopied() {
      btn.textContent = '✅ 已複製暗號！快啲貼俾 Anna 老師啦！';
      playChineseTTS('已複製暗號！請媽媽貼返去對話框俾老師更新進度啦！');
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
    } catch (e) {}
    document.body.removeChild(ta);
    callback();
  }

  // ==========================================
  // 6. 輕量級煙花慶祝特效引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animRunning = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7', '#FB923C'];
    for (let burst = 0; burst < 3; burst++) {
      const cx = canvas.width * (0.25 + Math.random() * 0.5);
      const cy = canvas.height * (0.2 + Math.random() * 0.35);
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 * i) / 36;
        const speed = 2.5 + Math.random() * 5;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 5 + Math.random() * 5
        });
      }
    }
    if (!animRunning) {
      animRunning = true;
      requestAnimationFrame(animateParticles);
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.alpha -= 0.018;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
      } else {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) {
      requestAnimationFrame(animateParticles);
    } else {
      animRunning = false;
    }
  }

  // 初始化第一幕（已預載雙語指引文字，點擊橫幅或任意按鈕即發聲）
  renderStage(false);
</script>
