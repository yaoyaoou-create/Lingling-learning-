<script>
  // =========================================================================
  // 1. 終極「中英雙軌排隊 + Web Audio MP3 音量放大器」引擎
  //    - 徹底解決中文未講完英文插嘴撞聲 Bug (100% 排隊等候 onend)
  //    - 壓低中文 TTS 音量 (0.68)，並將 ElevenLabs MP3 音量放大 2.2 倍，音量完全一致！
  //    - 自動修正 en-hand.mp3 開頭誤錄的 "M" 音 (自動由 0.78 秒切入 "hand" 或先播 en-h.mp3)
  // =========================================================================
  window.utterancePool = [];
  let audioQueueId = 0;
  let activeAudioElement = null;
  let audioCtx = null;

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function stopAllAudio() {
    audioQueueId++;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    if (activeAudioElement) {
      try {
        activeAudioElement.onended = null;
        activeAudioElement.onerror = null;
        activeAudioElement.pause();
        activeAudioElement.currentTime = 0;
      } catch (e) {}
      activeAudioElement = null;
    }
  }

  // 播放單個 MP3 並透過 Web Audio GainNode 放大音量 (解決 MP3 細聲問題)
  function playSingleMp3(file, startTime = 0, boostGain = 2.2, onDone) {
    ensureAudioContext();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    activeAudioElement = audio;

    // 使用 Web Audio API 放大 MP3 音量，與廣東話 TTS 音量完全平衡
    if (audioCtx) {
      try {
        const source = audioCtx.createMediaElementSource(audio);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = boostGain; // 放大 2.2 倍
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      } catch (e) {
        audio.volume = 1.0;
      }
    } else {
      audio.volume = 1.0;
    }

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      if (onDone) onDone();
    };

    audio.onended = finish;
    audio.onerror = finish;

    const startPlayback = () => {
      if (startTime > 0) {
        try { audio.currentTime = startTime; } catch (e) {}
      }
      audio.play().catch(finish);
    };

    if (startTime > 0) {
      audio.addEventListener('loadedmetadata', startPlayback, { once: true });
      audio.load();
    } else {
      startPlayback();
    }
  }

  // 核心排隊播放器：支援 [{type:'zh', text:'...'}, {type:'mp3', file:'...'}, {type:'hand_fixed'}]
  // 保證上一句 100% 講完，先會播下一句，絕不撞聲！
  function playHybridQueue(steps) {
    stopAllAudio();
    if (!steps || !steps.length) return;
    const myQueueId = audioQueueId;
    let idx = 0;

    function nextStep() {
      if (myQueueId !== audioQueueId || idx >= steps.length) return;
      const step = steps[idx++];

      // A. 廣東話 TTS (調低音量至 0.68 配合 MP3)
      if (step.type === 'zh') {
        if (!('speechSynthesis' in window) || !step.text) {
          nextStep();
          return;
        }
        const u = new SpeechSynthesisUtterance(step.text);
        window.utterancePool.push(u);
        u.lang = 'zh-HK';
        u.pitch = 1.05;
        u.rate = 0.92;
        u.volume = 0.68; // 壓低廣東話音量，防止爆音嚇親小朋友

        let advanced = false;
        const done = () => {
          if (advanced || myQueueId !== audioQueueId) return;
          advanced = true;
          setTimeout(() => {
            if (myQueueId === audioQueueId) nextStep();
          }, 180);
        };
        u.onend = done;
        u.onerror = done;

        setTimeout(() => {
          if (myQueueId === audioQueueId) window.speechSynthesis.speak(u);
        }, 50);
      }

      // B. 標準英文 MP3
      else if (step.type === 'mp3') {
        playSingleMp3(step.file, step.startTime || 0, step.boost || 2.2, () => {
          if (myQueueId !== audioQueueId) return;
          setTimeout(() => {
            if (myQueueId === audioQueueId) nextStep();
          }, 160);
        });
      }

      // C. 針對 en-hand.mp3 開頭誤錄咗 "M" 嘅自動修復播放：先播 en-h.mp3 ("H")，再跳去 en-hand.mp3 嘅 0.78 秒讀 "hand"！
      else if (step.type === 'hand_fixed') {
        playSingleMp3('en-h.mp3', 0, 2.2, () => {
          if (myQueueId !== audioQueueId) return;
          setTimeout(() => {
            if (myQueueId !== audioQueueId) return;
            playSingleMp3('en-hand.mp3', 0.78, 2.4, () => {
              if (myQueueId !== audioQueueId) return;
              setTimeout(() => {
                if (myQueueId === audioQueueId) nextStep();
              }, 160);
            });
          }, 120);
        });
      }
    }

    nextStep();
  }

  // 統一產生單字標準英文音軌步驟
  function getWordAudioStep(wordId) {
    if (wordId === 'hand') {
      return { type: 'hand_fixed' };
    }
    const map = {
      draw: 'en-draw.mp3',
      mouth: 'en-mouth.mp3',
      meat: 'en-meat.mp3',
      milk: 'en-milk.mp3'
    };
    // meat, milk 錄音偏細聲，給予 2.5 倍增益

          <button class="btn-3d btn-green" onclick="celebrateSpeaking()">
            ${isDone ? '🎉 再放一次煙花慶祝！' : '🌟 玲玲讀得超棒！按呢度過關放煙花'}
          </button>
        </div>
        ${isDone ? `<div class="speaking-status">✅ 太叻喇！呢一關已經順利過關！</div>` : ''}
        <div class="btn-row" style="margin-top: 18px;">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="prevAct3()">⬅️ 上一個</button>` : ''}
          <button class="btn-3d btn-amber" onclick="nextAct3()">
            ${subIndex < ACT3_SPEAK.length - 1 ? '下一個挑戰 ➡️' : '進入第 4 幕：辨音王 🎮'}
          </button>
        </div>
      `;
    }

    // ---------- 第四幕：辨音王小遊戲 (答對前絕不劇透中文答案) ----------
    else if (currentAct === 3) {
      const q = ACT4_QUIZ[subIndex];
      currentGuideCantonese = q.guideZh;
      currentGuideWordId = "";
      document.getElementById('teacherMsg').textContent = q.guideZh;

      if (shouldSpeak) {
        playHybridQueue([
          { type: 'zh', text: q.guideZh },
          ...q.promptSteps
        ]);
      }

      container.innerHTML = `
        <div class="dots-row">
          ${ACT4_QUIZ.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}
        </div>
        <div class="stage-badge">${q.badge}</div>
        <h2 style="font-size: 23px; color: #1E3A8A; margin: 6px 0 12px;">${q.questionZh}</h2>
        <button class="btn-3d btn-blue" onclick="replayQuizSound()">🔊 再聽一次題目發音</button>

        <div class="choice-grid">
          ${q.options.map(opt => {
            let cls = 'choice-card';
            if (quizSolved && opt.id === q.correctId) cls += ' correct';
            if (!quizSolved && quizWrongPicked === opt.id) cls += ' gentle-try';
            return `
              <div class="${cls}" onclick="pickQuizOption('${opt.id}')">
                <div style="width: 135px; height: 135px; margin: 0 auto 8px;">${ILLUSTRATIONS[opt.id]}</div>
                <div style="font-size: 21px; font-weight: 900; color: #1E3A8A;">
                  ${quizSolved ? opt.reveal : opt.hint}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${quizSolved
          ? `<div class="gentle-hint-banner success">🎉 好叻呀玲玲！耳朵好靈敏，答啱咗喇！</div>`
          : (quizWrongPicked ? `<div class="gentle-hint-banner">💛 聽清楚開頭係 m 音定係 h 音，試吓隔離嗰張圖卡啦！</div>` : '')
        }

        ${quizSolved ? `
          <div class="btn-row" style="margin-top: 18px;">
            <button class="btn-3d btn-green" onclick="nextAct4()">
              ${subIndex < ACT4_QUIZ.length - 1 ? '下一題 ➡️' : '完成今日全部課堂！領取獎盃 🏆'}
            </button>
          </div>
        ` : ''}
      `;
    }

    // ---------- 結算畫面 ----------
    else if (currentAct === 4) {
      const completionMsg = "恭喜玲玲完成今日全部四個任務！你認得晒字母 m 開頭嘅字喇！快啲撳下面個掣複製進度暗號俾老師啦！";
      setGuide(completionMsg, "", shouldSpeak);
      if (shouldSpeak) {
        launchFireworks();
        setTimeout(launchFireworks, 700);
      }

      const secretCode = `【玲玲英文課堂進度暗號】單元：Unit 4 Day 4 (en-unit4-day4.html)｜完成狀態：✅ 全課四部曲順利完成 (100% 雙軌排隊平衡音量版)｜重溫弱點：draw (I can draw.)｜新學內容：P.20 Phonics 字母 m 首音辨別 (mouth, meat, milk vs hand)｜請 Anna 老師更新雲端英文總庫並解鎖 Day 5！`;

      container.innerHTML = `
        <div style="font-size: 74px; margin-bottom: 6px;">🏆🎉</div>
        <h1 style="font-size: 32px; color: #1E3A8A; margin: 4px 0 8px;">Unit 4 Day 4 大成功！</h1>
        <p style="font-size: 19px; font-weight: 800; color: #475569; margin: 0 0 14px;">玲玲今日好專心，全部 Phonics 首音關卡都順利完成喇！</p>

        <div class="summary-badges">
          <span class="summary-chip">🔥 熱身重溫：draw (I can draw.)</span>
          <span class="summary-chip">🔤 首音辨別：m vs h</span>
          <span class="summary-chip">👄 m · mouth</span>
          <span class="summary-chip">🍗 m · meat</span>
          <span class="summary-chip">🥛 m · milk</span>
        </div>

        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn-3d btn-green" id="copySecretBtn" onclick="copyProgressSecret()">
            📋 一鍵複製進度暗號俾 Anna 老師
          </button>
        </div>

        <div class="secret-code-box" id="secretCodeText">${secretCode}</div>

        <div class="btn-row" style="margin-top: 16px;">
          <button class="btn-3d btn-blue" onclick="jumpToAct(0)">🔄 再玩多一次</button>
          <a href="en-unit4.html" class="btn-3d btn-amber" style="text-decoration:none;">🏠 返回 Unit 4 單元目錄</a>
        </div>
      `;
    }
  }

  // ==========================================
  // 5. 各幕互動邏輯 (100% 排隊發聲，絕不撞聲)
  // ==========================================
  
  // --- 第一幕互動 ---
  function playMeaningCard() {
    const el = document.getElementById('meaningCard');
    if (el) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
    const card = ACT1_CARDS[subIndex];
    playHybridQueue([
      { type: 'zh', text: card.zh },
      getWordAudioStep(card.id)
    ]);
  }

  function playMeaningZh() {
    const card = ACT1_CARDS[subIndex];
    playHybridQueue([{ type: 'zh', text: card.zh }]);
  }

  function playMeaningEn() {
    const card = ACT1_CARDS[subIndex];
    playHybridQueue([getWordAudioStep(card.id)]);
  }

  function prevAct1() {
    if (subIndex > 0) {
      subIndex--;
      renderStage(true);
    }
  }

  function nextAct1() {
    if (subIndex < ACT1_CARDS.length - 1) {
      subIndex++;
      renderStage(true);
    } else {
      jumpToAct(1);
    }
  }

  // --- 第二幕互動 (K2 首音火車頭配對) ---
  function tapOnsetCard() {
    const item = ACT2_PHONICS[subIndex];
    onsetTapped = true;
    renderStage(false);
    playHybridQueue([
      { type: 'mp3', file: `en-${item.onset}.mp3`, boost: 2.3 }
    ]);
  }

  function tapWordTargetCard() {
    const item = ACT2_PHONICS[subIndex];
    onsetTapped = true;
    wordTapped = true;
    renderStage(false);
    launchFireworks();
    playHybridQueue([
      getWordAudioStep(item.id),
      { type: 'zh', text: `好叻呀！開頭係字母 ${item.onset}，加埋就係 ${item.zh}！` }
    ]);
  }

  function blendOnsetAndWord() {
    const item = ACT2_PHONICS[subIndex];
    onsetTapped = true;
    wordTapped = true;
    renderStage(false);
    launchFireworks();
    playHybridQueue([
      { type: 'mp3', file: `en-${item.onset}.mp3`, boost: 2.3 },
      getWordAudioStep(item.id)
    ]);
  }

  function prevAct2() {
    if (subIndex > 0) {
      subIndex--;
      onsetTapped = false;
      wordTapped = false;
      renderStage(true);
    }
  }

  function nextAct2() {
    if (subIndex < ACT2_PHONICS.length - 1) {
      subIndex++;
      onsetTapped = false;
      wordTapped = false;
      renderStage(true);
    } else {
      jumpToAct(2);
    }
  }

  // --- 第三幕互動 ---
  function celebrateSpeaking() {
    speakingDone[subIndex] = true;
    renderStage(false);
    launchFireworks();
    const item = ACT3_SPEAK[subIndex];
    playHybridQueue([
      { type: 'zh', text: '嘩！玲玲讀得又大聲又標準，超叻女呀！' },
      getWordAudioStep(item.id)
    ]);
  }

  function prevAct3() {
    if (subIndex > 0) {
      subIndex--;
      renderStage(true);
    }
  }

  function nextAct3() {
    if (subIndex < ACT3_SPEAK.length - 1) {
      subIndex++;
      renderStage(true);
    } else {
      jumpToAct(3);
    }
  }

  // --- 第四幕互動 ---
  function replayQuizSound() {
    const q = ACT4_QUIZ[subIndex];
    playHybridQueue(q.promptSteps);
  }

  function pickQuizOption(pickedId) {
    if (quizSolved) return;
    const q = ACT4_QUIZ[subIndex];

    if (pickedId === q.correctId) {
      quizSolved = true; 
      quizWrongPicked = null;
      renderStage(false);
      launchFireworks();
      playHybridQueue([
        getWordAudioStep(pickedId),
        { type: 'zh', text: '好叻呀玲玲！答啱咗喇！' }
      ]);
    } else {
      quizWrongPicked = pickedId; 
      renderStage(false);
      playHybridQueue([
        getWordAudioStep(pickedId),
        { type: 'zh', text: '呢個係 h 開頭嘅小手手嚟㗎，試吓隔離嗰張圖卡啦！' }
      ]);
    }
  }

  function nextAct4() {
    if (subIndex < ACT4_QUIZ.length - 1) {
      subIndex++;
      quizSolved = false;
      quizWrongPicked = null;
      renderStage(true);
    } else {
      jumpToAct(4);
    }
  }

  // --- 一鍵複製暗號 ---
  function copyProgressSecret() {
    const text = document.getElementById('secretCodeText').innerText;
    const btn = document.getElementById('copySecretBtn');

    function onCopied() {
      btn.textContent = '✅ 已複製暗號！快啲貼俾 Anna 老師啦！';
      playHybridQueue([
        { type: 'zh', text: '已複製暗號！請媽媽貼返去對話框俾老師更新進度啦！' }
      ]);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  }

  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
    } catch (e) {}
    document.body.removeChild(ta);
    callback();
  }

  // ==========================================
  // 6. 輕量級煙花慶祝特效引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animRunning = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7', '#FB923C'];
    for (let burst = 0; burst < 3; burst++) {
      const cx = canvas.width * (0.25 + Math.random() * 0.5);
      const cy = canvas.height * (0.2 + Math.random() * 0.35);
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 * i) / 36;
        const speed = 2.5 + Math.random() * 5;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 5 + Math.random() * 5
        });
      }
    }
    if (!animRunning) {
      animRunning = true;
      requestAnimationFrame(animateParticles);
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.alpha -= 0.018;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
      } else {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) {
      requestAnimationFrame(animateParticles);
    } else {
      animRunning = false;
    }
  }

  // 初始化第一幕
  renderStage(false);
</script>
</body>
</html>
