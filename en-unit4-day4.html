    <script>
        // 1. 防吞聲引擎 (Anti-Swallow Voice Engine)
        function playVoice(text, callback) {
            // 清除之前的語音排隊，防止卡死
            window.speechSynthesis.cancel(); 
            
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // 減慢語速適合 K2
            utterance.pitch = 1.1;

            // iOS 靜音喚醒機制 (播放一段無聲音訊強制喚醒引擎)
            let dummy = new SpeechSynthesisUtterance('');
            dummy.volume = 0;
            window.speechSynthesis.speak(dummy);

            // 如果有完成後的回調函數 (例如答對後的彈窗)
            if (callback) {
                utterance.onend = callback;
            }

            // 稍微延遲播放，確保引擎已準備好
            setTimeout(() => {
                window.speechSynthesis.speak(utterance);
            }, 50);
        }

        // 2. 小測驗遊戲邏輯
        const words = [
            { word: 'mouth', emoji: '👄' },
            { word: 'meat', emoji: '🥩' },
            { word: 'milk', emoji: '🥛' }
        ];
        let currentTarget = null;

        function initGame() {
            // 隨機抽選一個目標單字
            currentTarget = words[Math.floor(Math.random() * words.length)];
            const container = document.getElementById('game-options');
            container.innerHTML = '';
            
            // 洗牌選項順序
            let options = [...words].sort(() => Math.random() - 0.5);
            
            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'card-3d p-6 text-center cursor-pointer bg-gray-50 hover:bg-blue-50';
                div.innerHTML = `<div class="text-7xl">${opt.emoji}</div>`;
                div.onclick = () => checkAnswer(opt.word);
                container.appendChild(div);
            });
        }

        function playTargetWord() {
            if(!currentTarget) initGame();
            playVoice(`Where is the ${currentTarget.word}?`);
        }

        function checkAnswer(selected) {
            if(!currentTarget) return;
            
            if (selected === currentTarget.word) {
                // 答對邏輯
                playVoice('Excellent! You got it!', () => {
                    Swal.fire({
                        title: '太叻啦！',
                        text: '你搵啱咗 ' + currentTarget.word + '！',
                        icon: 'success',
                        confirmButtonText: '🌟 完成 Day 4 🌟',
                        confirmButtonColor: '#3b82f6',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // 跳轉回 Unit 4 導覽頁，並加上 ?v=4 防緩存
                            window.location.href = 'en-unit4.html?v=4';
                        }
                    });
                });
            } else {
                // 答錯邏輯
                playVoice('Oops, try again! Listen carefully.');
                Swal.fire({
                    title: '唔啱喎',
                    text: '再試下聽清楚！',
                    icon: 'error',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        }

        // 頁面載入時初始化遊戲
        window.onload = () => {
            initGame();
        };
    <script>
  // ==========================================
  // 1. iPad Safari 終極語音修復引擎 (中英徹底分流 + 觸控喚醒 + 防卡死)
  // ==========================================
  window.utterancePool = [];
  let cachedVoices = [];
  let ttsInitialized = false;
  let currentGuideCantonese = "歡迎返到英文大本營！今日我哋先熱身重溫畫畫，再認識新嘅英文字母發音！";
  let currentGuideEnglish = "";

  // 【修復 1】觸控喚醒機制：解決 iPad Safari 第一次發音變成奇怪中文聲的問題
  function initTTS() {
    if (ttsInitialized || !('speechSynthesis' in window)) return;
    let u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
    ttsInitialized = true;
    setTimeout(() => { cachedVoices = window.speechSynthesis.getVoices(); }, 100);
  }
  document.addEventListener('touchstart', initTTS, { once: true });
  document.addEventListener('click', initTTS, { once: true });

  function loadVoices() {
    if ('speechSynthesis' in window) {
      cachedVoices = window.speechSynthesis.getVoices();
    }
  }
  loadVoices();
  if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(langType) {
    if (!cachedVoices.length) loadVoices();
    if (langType === 'zh-HK') {
      return cachedVoices.find(v => v.lang === 'zh-HK' && (v.name.includes('Sin') || v.name.includes('Female')))
          || cachedVoices.find(v => v.lang === 'zh-HK')
          || cachedVoices.find(v => v.lang.includes('zh'));
    } else {
      // 擴大女聲搜索範圍，保證抓到純正英文聲
      const femaleHints = ['Kate', 'Serena', 'Martha', 'Stephanie', 'Samantha', 'Karen', 'Tessa', 'Female'];
      return cachedVoices.find(v => (v.lang === 'en-GB' || v.lang === 'en-US' || v.lang === 'en-AU') && femaleHints.some(h => v.name.includes(h)))
          || cachedVoices.find(v => v.lang.startsWith('en') && !v.name.includes('Daniel') && !v.name.includes('Oliver') && !v.name.includes('Arthur'))
          || cachedVoices.find(v => v.lang.startsWith('en'));
    }
  }

  function speakQueue(segments) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    window.utterancePool = [];

    if (!segments || segments.length === 0) return;
    if (!ttsInitialized) initTTS(); // 確保已喚醒

    let idx = 0;
    function playNext() {
      if (idx >= segments.length) return;
      const seg = segments[idx];
      idx++;

      // 【修復 2】Phonics 發音修正：把單獨的 m 替換成 mmm，強迫發出自然拼讀的鼻音，而非讀字母 "em"
      let textToSpeak = seg.text;
      if (seg.lang === 'en-GB') {
        textToSpeak = textToSpeak.replace(/\bm\b/g, "mmm");
      }

      const u = new SpeechSynthesisUtterance(textToSpeak);
      window.utterancePool.push(u); // 防回收

      const voice = pickVoice(seg.lang);
      if (voice) {
        u.voice = voice;
      } else {
        u.lang = seg.lang === 'zh-HK' ? 'zh-HK' : 'en-US'; // 終極防中文聲亂入 fallback
      }

      if (seg.lang === 'zh-HK') {
        u.lang = 'zh-HK';
        u.pitch = 1.05;
        u.rate = 0.9;
      } else {
        u.lang = u.voice ? u.voice.lang : 'en-US';
        u.pitch = 1.08;
        u.rate = 0.85; // 稍微調快至 0.85，解決 0.78 可能導致的拖音變形
      }

      let advanced = false;
      const done = () => {
        if (advanced) return;
        advanced = true;
        setTimeout(playNext, 140);
      };

      u.onend = done;
      u.onerror = done;

      // 【修復 3】4秒強制解鎖防呆：防止 iOS 隨機吃掉 onend 信號導致全網頁卡死
      setTimeout(() => { if (!advanced) done(); }, 4000);

      window.speechSynthesis.speak(u);
    }
    playNext();
  }

  function setGuide(zhText, enText = "", autoSpeak = true) {
    currentGuideCantonese = zhText;
    currentGuideEnglish = enText;
    document.getElementById('teacherMsg').textContent = zhText;
    if (autoSpeak) replayGuide();
  }

  function replayGuide() {
    const seq = [{ lang: 'zh-HK', text: currentGuideCantonese }];
    if (currentGuideEnglish) seq.push({ lang: 'en-GB', text: currentGuideEnglish });
    speakQueue(seq);
  }

    hand: `<svg viewBox="0 0 180 180" width="165" height="165"><g transform="rotate(-10 90 95)"><rect x="54" y="64" width="72" height="74" rx="34" fill="#FBBF24" stroke="#B45309" stroke-width="6"/><rect x="34" y="84" width="32" height="24" rx="12" transform="rotate(-25 50 96)" fill="#FBBF24" stroke="#B45309" stroke-width="6"/><ellipse cx="90" cy="106" rx="20" ry="16" fill="#FEF3C7"/><circle cx="74" cy="82" r="7" fill="#FEF3C7"/><circle cx="90" cy="78" r="7" fill="#FEF3C7"/><circle cx="106" cy="82" r="7" fill="#FEF3C7"/><circle cx="83" cy="104" r="3" fill="#78350F"/><circle cx="97" cy="104" r="3" fill="#78350F"/><path d="M86 110 Q90 115 94 110" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/></g><path d="M132 48 Q144 58 140 72" stroke="#3B82F6" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M144 42 Q158 55 152 72" stroke="#60A5FA" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`

  // 3. 課程資料定義
  // ==========================================
  const ACT1_CARDS = [

    { id: 'milk', badge: '🎤 大聲讀挑戰 4', en: 'milk', sentence: 'm · milk', zh: '牛奶', guideZh: '最後一個大聲讀挑戰！請玲玲大聲讀出，牛奶！', guideEn: 'm, milk.' }

  const ACT4_QUIZ = [
    { badge: '🎮 輕鬆小遊戲 1 · 熱身重溫', questionZh: '聽下邊一張圖卡係「畫畫」呢？', promptSeq: [{ lang: 'zh-HK', text: '細心聽下，請找出，畫畫，我可以畫畫！' }, { lang: 'en-GB', text: 'draw. I can draw.' }], guideZh: '嚟到最後一幕輕鬆小遊戲！細心聽下聲音，揀出啱嘅圖卡啦！', guideEn: 'draw. I can draw.', correctId: 'draw', correctEn: 'draw. I can draw.', options: [{ id: 'draw', label: 'draw (畫畫)' }, { id: 'milk', label: 'milk (牛奶)' }] },
    { badge: '🎮 輕鬆小遊戲 2 · 聽音選圖', questionZh: '聽下邊一張圖卡係「嘴巴」呢？', promptSeq: [{ lang: 'zh-HK', text: '請找出，嘴巴！' }, { lang: 'en-GB', text: 'm, mouth.' }], guideZh: '第二題！聽下邊一張圖卡係嘴巴呢？', guideEn: 'm, mouth.', correctId: 'mouth', correctEn: 'mouth.', options: [{ id: 'mouth', label: 'mouth (嘴巴)' }, { id: 'hand', label: 'hand (手)' }] },
    { badge: '🎮 輕鬆小遊戲 3 · 聽音選圖', questionZh: '聽下邊一張圖卡係「肉」呢？', promptSeq: [{ lang: 'zh-HK', text: '請找出，肉！' }, { lang: 'en-GB', text: 'm, meat.' }], guideZh: '第三題！聽下邊一張圖卡係美味嘅肉呢？', guideEn: 'm, meat.', correctId: 'meat', correctEn: 'meat.', options: [{ id: 'draw', label: 'draw (畫畫)' }, { id: 'meat', label: 'meat (肉)' }] },
    { badge: '⭐ 課本貼紙辨音小挑戰', questionZh: '邊一張圖卡嘅開頭發音同「嘴巴、肉」一樣呢？', promptSeq: [{ lang: 'zh-HK', text: '課本貼紙大挑戰！邊一張圖卡嘅開頭發音係' }, { lang: 'en-GB', text: 'm' }, { lang: 'zh-HK', text: '呢？' }], guideZh: '最後一題課本貼紙大挑戰！邊一張圖卡嘅開頭發音同嘴巴、肉一樣呢？', guideEn: 'm, m, milk.', correctId: 'milk', correctEn: 'm, milk!', options: [{ id: 'milk', label: 'milk (牛奶)' }, { id: 'hand', label: 'hand (手)' }] }
  ];

  // ==========================================
  // 4. 狀態管理與渲染
  // ==========================================
  let currentAct = 0;
  let subIndex = 0;
  let litBlocks = [];
  let speakingDone = [false, false, false, false];
  let quizSolved = false;
  let quizWrongPicked = null;

  function updateActNav() {
    const pills = document.querySelectorAll('.act-pill');
    pills.forEach((p, idx) => {
      p.classList.remove('active', 'done');
      if (currentAct === 4 || idx < currentAct) p.classList.add('done');
      else if (idx === currentAct) p.classList.add('active');
    });
  }

  function jumpToAct(actIdx) {
    currentAct = actIdx; subIndex = 0; litBlocks = []; quizSolved = false; quizWrongPicked = null;
    updateActNav(); renderStage(true);
  }

  function renderStage(shouldSpeak = true) {
    const container = document.getElementById('stageContainer');
    updateActNav();

    if (currentAct === 0) {
      const card = ACT1_CARDS[subIndex];
      if (shouldSpeak) setGuide(card.guideZh, card.guideEn, true);
      const wordHtml = card.highlightFirst ? `<span class="highlight-m">${card.en[0]}</span>${card.en.slice(1)}` : card.en;

      container.innerHTML = `
        <div class="dots-row">${ACT1_CARDS.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge ${card.isWarmup ? 'warmup' : ''}">${card.badge}</div>
        <div class="flashcard-3d" id="meaningCard" onclick="playMeaningCard()">
          <div class="illustration-wrap">${ILLUSTRATIONS[card.id]}</div>
          <div class="word-en">${wordHtml}</div>
          <div class="word-zh">${card.zh}</div>
          ${card.sentence ? `<div class="sentence-box">💬 ${card.sentence}</div>` : ''}
        </div>
        <div class="btn-row">
          <button class="btn-3d btn-amber" onclick="playMeaningZh()">🇭🇰 聽中文意思</button>
          <button class="btn-3d btn-blue" onclick="playMeaningEn()">🇬🇧 聽英文發音</button>
        </div>
        <div class="btn-row" style="margin-top: 20px;">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="prevAct1()">⬅️ 上一張</button>` : ''}
          <button class="btn-3d btn-green" onclick="nextAct1()">${subIndex < ACT1_CARDS.length - 1 ? '下一張圖卡 ➡️' : '進入第 2 幕：字母積木 🧩'}</button>
        </div>
      `;
    }
    else if (currentAct === 1) {
      const item = ACT2_WORDS[subIndex];
      if (shouldSpeak) setGuide(item.guideZh, item.guideEn, true);

      container.innerHTML = `
        <div class="dots-row">${ACT2_WORDS.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">🧩 第二幕：字母積木拼讀 (${subIndex + 1} / ${ACT2_WORDS.length})</div>
        <div style="width: 130px; height: 130px; margin: 4px auto;">${ILLUSTRATIONS[item.id]}</div>
        <div class="word-zh" style="margin-bottom: 4px;">${item.zh}</div>
        <p style="font-size: 16px; font-weight: 800; color: #64748B; margin: 4px 0 8px;">👆 逐粒點擊彩色積木，聽下每個字母發音！</p>
        <div class="blocks-arena">
          ${item.letters.map((ch, idx) => `
            <div class="letter-block ${idx === 0 ? 'key-letter' : ''} ${litBlocks[idx] ? 'lit ' + (!item.isMWord ? 'alt-color' : '') : ''}" onclick="tapLetterBlock(${idx})">
              ${idx === 0 && item.isMWord ? '<span class="star-tag">⭐</span>' : ''}${ch}
            </div>
          `).join('')}
        </div>
        <div class="btn-row"><button class="btn-3d btn-blue" onclick="blendCurrentWord()">🔊 串連讀出成個字 (${item.letters.join('')})</button></div>
        <div class="btn-row" style="margin-top: 20px;">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="prevAct2()">⬅️ 上一個字</button>` : ''}
          <button class="btn-3d btn-green" onclick="nextAct2()">${subIndex < ACT2_WORDS.length - 1 ? '下一個字母積木 ➡️' : '進入第 3 幕：大聲讀 🎤'}</button>
        </div>
      `;
    }
    else if (currentAct === 2) {
      const item = ACT3_SPEAK[subIndex];
      const isDone = speakingDone[subIndex];
      if (shouldSpeak) setGuide(item.guideZh, item.guideEn, true);

      container.innerHTML = `
        <div class="dots-row">${ACT3_SPEAK.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (speakingDone[i] ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge ${subIndex === 0 ? 'warmup' : ''}">${item.badge}</div>
        <div class="flashcard-3d" onclick="speakQueue([{lang:'en-GB', text:'${item.en}. ${item.sentence}'}])">
          <div class="illustration-wrap">${ILLUSTRATIONS[item.id]}</div>
          <div class="word-en">${item.en}</div>
          <div class="sentence-box">${item.sentence}</div>
          <div class="word-zh" style="margin-top: 8px; font-size: 20px;">${item.zh}</div>
        </div>
        <div class="btn-row"><button class="btn-3d btn-blue" onclick="speakQueue([{lang:'en-GB', text:'${item.en}. ${item.sentence}'}])">🔊 聽老師示範發音</button></div>
        <div class="btn-row" style="margin-top: 14px;">
          <button class="btn-3d btn-green" onclick="celebrateSpeaking()">${isDone ? '🎉 再放一次煙花慶祝！' : '🌟 玲玲讀得超棒！按呢度過關放煙花'}</button>
        </div>
        ${isDone ? `<div class="speaking-status">✅ 太叻喇！呢一關已經順利過關！</div>` : ''}
        <div class="btn-row" style="margin-top: 18px;">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="prevAct3()">⬅️ 上一個</button>` : ''}
          <button class="btn-3d btn-amber" onclick="nextAct3()">${subIndex < ACT3_SPEAK.length - 1 ? '下一個挑戰 ➡️' : '進入第 4 幕：輕鬆小遊戲 🎮'}</button>
        </div>
      `;
    }
    else if (currentAct === 3) {
      const q = ACT4_QUIZ[subIndex];
      if (shouldSpeak) {
        currentGuideCantonese = q.guideZh; currentGuideEnglish = q.guideEn;
        document.getElementById('teacherMsg').textContent = q.questionZh;
        speakQueue(q.promptSeq);
      }

      container.innerHTML = `
        <div class="dots-row">${ACT4_QUIZ.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">${q.badge}</div>
        <h2 style="font-size: 24px; color: #1E3A8A; margin: 8px 0 12px;">${q.questionZh}</h2>
        <button class="btn-3d btn-blue" onclick="playQuizPrompt()">🔊 再聽一次題目聲音</button>
        <div class="choice-grid">
          ${q.options.map(opt => {
            let cls = 'choice-card' + (quizSolved && opt.id === q.correctId ? ' correct' : (!quizSolved && quizWrongPicked === opt.id ? ' gentle-try' : ''));
            return `
              <div class="${cls}" onclick="pickQuizOption('${opt.id}')">
                <div style="width: 135px; height: 135px; margin: 0 auto 8px;">${ILLUSTRATIONS[opt.id]}</div>
                <div style="font-size: 22px; font-weight: 900; color: #1E3A8A;">${opt.label}</div>
              </div>
            `;
          }).join('')}
        </div>
        ${quizSolved ? `<div class="gentle-hint-banner success">🎉 好叻呀玲玲！答啱咗喇！</div>` : (quizWrongPicked ? `<div class="gentle-hint-banner">💛 試吓隔離嗰張圖卡啦！</div>` : '')}
        ${quizSolved ? `
          <div class="btn-row" style="margin-top: 18px;">
            <button class="btn-3d btn-green" onclick="nextAct4()">${subIndex < ACT4_QUIZ.length - 1 ? '下一題 ➡️' : '完成今日全部課堂！領取獎盃 🏆'}</button>
          </div>
        ` : ''}
      `;
    }
    else if (currentAct === 4) {
      if (shouldSpeak) {
        setGuide("恭喜玲玲完成今日全部四個任務！你真係好棒呀！快啲撳下面個掣複製進度暗號俾老師啦！", "Great job! I can do it!", true);
        launchFireworks(); setTimeout(launchFireworks, 700);
      }
      container.innerHTML = `
        <div style="font-size: 74px; margin-bottom: 6px;">🏆🎉</div>
        <h1 style="font-size: 32px; color: #1E3A8A; margin: 4px 0 8px;">Unit 4 Day 4 大成功！</h1>
        <p style="font-size: 19px; font-weight: 800; color: #475569; margin: 0 0 14px;">玲玲今日好專心，全部關卡都順利完成喇！</p>
        <div class="summary-badges">
          <span class="summary-chip">🔥 熱身重溫：draw (I can draw.)</span>
          <span class="summary-chip">🔤 字母發音：m</span><span class="summary-chip">👄 mouth</span>
          <span class="summary-chip">🍗 meat</span><span class="summary-chip">🥛 milk</span>
        </div>
        <div class="btn-row" style="margin-top: 18px;">
          <button class="btn-3d btn-green" id="copySecretBtn" onclick="copyProgressSecret()">📋 一鍵複製進度暗號俾 Anna 老師</button>
        </div>
        <div class="secret-code-box" id="secretCodeText">【玲玲英文課堂進度暗號】單元：Unit 4 Day 4 (en-unit4-day4.html)｜完成狀態：✅ 全課四部曲順利完成｜重溫弱點：draw (I can draw.)｜新學內容：P.20 Phonics 字母 m (mouth, meat, milk vs hand)｜請 Anna 老師更新雲端英文總庫並解鎖 Day 5！</div>
        <div class="btn-row" style="margin-top: 16px;">
          <button class="btn-3d btn-blue" onclick="jumpToAct(0)">🔄 再玩多一次</button>
          <a href="index.html" class="btn-3d btn-amber" style="text-decoration:none;">🏠 返回學習樂園大門</a>
        </div>
      `;
    }
  }

  // ==========================================
  // 5. 各幕互動邏輯
  // ==========================================
  function playMeaningCard() {
    const el = document.getElementById('meaningCard');
    if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    speakQueue([{ lang: 'zh-HK', text: ACT1_CARDS[subIndex].zhSpeak }, { lang: 'en-GB', text: ACT1_CARDS[subIndex].enSpeak }]);
  }
  function playMeaningZh() { speakQueue([{ lang: 'zh-HK', text: ACT1_CARDS[subIndex].zhSpeak }]); }
  function playMeaningEn() { speakQueue([{ lang: 'en-GB', text: ACT1_CARDS[subIndex].enSpeak }]); }
  function prevAct1() { if (subIndex > 0) { subIndex--; renderStage(true); } }
  function nextAct1() { if (subIndex < ACT1_CARDS.length - 1) { subIndex++; renderStage(true); } else jumpToAct(1); }

  function tapLetterBlock(letterIdx) {
    const item = ACT2_WORDS[subIndex]; litBlocks[letterIdx] = true; renderStage(false);
    const ch = item.letters[letterIdx];
    if (litBlocks.length === item.letters.length && litBlocks.every(Boolean)) {
      launchFireworks();
      speakQueue([{ lang: 'en-GB', text: ch }, { lang: 'zh-HK', text: '好叻呀！你已經拍晒全部字母積木喇！一齊聽下成個字點讀！' }, { lang: 'en-GB', text: item.letters.join('') }]);
    } else {
      speakQueue([{ lang: 'en-GB', text: ch }]);
    }
  }
  function blendCurrentWord() {
    const item = ACT2_WORDS[subIndex]; litBlocks = item.letters.map(() => true); renderStage(false);
    speakQueue([{ lang: 'en-GB', text: item.letters.join(', ') + '. ' + item.letters.join('') }]);
  }
  function prevAct2() { if (subIndex > 0) { subIndex--; litBlocks = []; renderStage(true); } }
  function nextAct2() { if (subIndex < ACT2_WORDS.length - 1) { subIndex++; litBlocks = []; renderStage(true); } else jumpToAct(2); }

  function celebrateSpeaking() {
    speakingDone[subIndex] = true; renderStage(false); launchFireworks();
    speakQueue([{ lang: 'zh-HK', text: '嘩！玲玲讀得又大聲又標準，超叻女呀！' }, { lang: 'en-GB', text: ACT3_SPEAK[subIndex].en + '. ' + ACT3_SPEAK[subIndex].sentence }]);
  }
  function prevAct3() { if (subIndex > 0) { subIndex--; renderStage(true); } }
  function nextAct3() { if (subIndex < ACT3_SPEAK.length - 1) { subIndex++; renderStage(true); } else jumpToAct(3); }

  function playQuizPrompt() { speakQueue(ACT4_QUIZ[subIndex].promptSeq); }
  function pickQuizOption(pickedId) {
    if (quizSolved) return;
    const q = ACT4_QUIZ[subIndex];
    if (pickedId === q.correctId) {
      quizSolved = true; quizWrongPicked = null; renderStage(false); launchFireworks();
      speakQueue([{ lang: 'zh-HK', text: '好叻呀玲玲！答啱咗喇！' }, { lang: 'en-GB', text: q.correctEn }]);
    } else {
      quizWrongPicked = pickedId; renderStage(false);
      speakQueue([{ lang: 'zh-HK', text: '試吓隔離嗰張圖卡啦！' }]);
    }
  }
  function nextAct4() { if (subIndex < ACT4_QUIZ.length - 1) { subIndex++; quizSolved = false; quizWrongPicked = null; renderStage(true); } else jumpToAct(4); }

  function copyProgressSecret() {
    const text = document.getElementById('secretCodeText').innerText;
    const btn = document.getElementById('copySecretBtn');
    function onCopied() {
      btn.textContent = '✅ 已複製暗號！快啲貼俾 Anna 老師啦！';
      speakQueue([{ lang: 'zh-HK', text: '已複製暗號！請媽媽貼返去對話框俾老師更新進度啦！' }]);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else { fallbackCopy(text, onCopied); }
  }
  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); callback();
  }

  // ==========================================
  // 6. 煙花特效引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = []; let animRunning = false;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();

  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7', '#FB923C'];
    for (let burst = 0; burst < 3; burst++) {
      const cx = canvas.width * (0.25 + Math.random() * 0.5); const cy = canvas.height * (0.2 + Math.random() * 0.35);
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 * i) / 36; const speed = 2.5 + Math.random() * 5;
        particles.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, alpha: 1, color: colors[Math.floor(Math.random() * colors.length)], size: 5 + Math.random() * 5 });
      }
    }
    if (!animRunning) { animRunning = true; requestAnimationFrame(animateParticles); }
  }
  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= 0.018;
      if (p.alpha <= 0) particles.splice(i, 1);
      else { ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    if (particles.length > 0) requestAnimationFrame(animateParticles);
    else animRunning = false;
  }

  renderStage(false);
</script>
