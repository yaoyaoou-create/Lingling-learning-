<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 4 Day 4 - Phonics m</title>
    <!-- Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 彈窗特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome 圖示 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* 玲玲學習樂園專屬 3D 積木樣式 */
        body { 
            background-color: #f0f9ff; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            user-select: none;
        }
        .btn-3d {
            transition: all 0.1s;
            border-bottom: 5px solid rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(5px);
            border-bottom: 0px solid rgba(0,0,0,0.2);
            margin-top: 5px;
        }
        .card-3d {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 0 #cbd5e1;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        .card-3d:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #cbd5e1;
        }
    </style>
</head>
<body class="pb-20">

    <!-- 頂部導航列 -->
    <nav class="bg-blue-500 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <a href="en-unit4.html?v=4" class="bg-yellow-400 text-yellow-900 px-5 py-2 rounded-full font-bold btn-3d flex items-center">
            <i class="fas fa-arrow-left mr-2"></i> 返回 Unit 4
        </a>
        <h1 class="text-xl font-bold">Day 4: Phonics m</h1>
        <div class="w-24"></div>
    </nav>

    <!-- Anna 老師語音引導區 -->
    <div class="max-w-4xl mx-auto mt-6 px-4">
        <div class="bg-yellow-100 border-4 border-yellow-400 rounded-2xl p-4 flex items-center shadow-lg cursor-pointer btn-3d" 
             onclick="playVoice('Hello Lingling! Today we learn the sound of letter m. m, m, m. Let\'s learn mouth, meat, and milk!')">
            <div class="text-6xl mr-4">👩🏼‍🏫</div>
            <div>
                <h2 class="font-bold text-yellow-800 text-xl mb-1">Anna 老師語音導讀：</h2>
                <p class="text-yellow-700 text-lg">「Hello Lingling! 今日我哋學字母 m 嘅發音。<br>撳我聽下點讀啦！」</p>
            </div>
            <div class="ml-auto text-4xl text-yellow-500">
                <i class="fas fa-volume-up pulse-animation"></i>
            </div>
        </div>
    </div>

    <!-- 核心單字學習區 -->
    <div class="max-w-4xl mx-auto mt-10 px-4">
        <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">
            <i class="fas fa-hand-pointer mr-2"></i> 撳圖案聽發音
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- 單字 1: mouth -->
            <div class="card-3d p-8 text-center cursor-pointer" onclick="playVoice('m, m, mouth')">
                <div class="text-8xl mb-4">👄</div>
                <div class="text-4xl font-bold text-blue-600 mb-2">mouth</div>
                <div class="text-2xl text-gray-500">嘴巴</div>
            </div>
            
            <!-- 單字 2: meat -->
            <div class="card-3d p-8 text-center cursor-pointer" onclick="playVoice('m, m, meat')">
                <div class="text-8xl mb-4">🥩</div>
                <div class="text-4xl font-bold text-blue-600 mb-2">meat</div>
                <div class="text-2xl text-gray-500">肉</div>
            </div>
            
            <!-- 單字 3: milk -->
            <div class="card-3d p-8 text-center cursor-pointer" onclick="playVoice('m, m, milk')">
                <div class="text-8xl mb-4">🥛</div>
                <div class="text-4xl font-bold text-blue-600 mb-2">milk</div>
                <div class="text-2xl text-gray-500">牛奶</div>
            </div>

        </div>
    </div>

    <!-- 課後小測驗區 -->
    <div class="max-w-4xl mx-auto mt-12 px-4 mb-12">
        <div class="bg-white rounded-3xl p-8 shadow-xl border-4 border-blue-200">
            <h2 class="text-3xl font-bold text-center text-blue-800 mb-8">🎯 小測驗：聽英文，揀啱嘅圖案</h2>
            <div class="flex justify-center mb-8">
                <button onclick="playTargetWord()" class="bg-blue-500 text-white px-8 py-4 rounded-full text-2xl font-bold btn-3d flex items-center shadow-lg">
                    <i class="fas fa-play-circle mr-3"></i> 撳我聽題目
                </button>
            </div>
            <div class="grid grid-cols-3 gap-6" id="game-options">
                <!-- 選項會由 JavaScript 自動生成 -->
            </div>
        </div>
    </div>

    <!-- ⚙️ JavaScript 邏輯與語音引擎 (絕不斷尾) -->
    <script>
        // 1. 防吞聲引擎 (Anti-Swallow Voice Engine)
        function playVoice(text, callback) {
            // 清除之前的語音排隊，防止卡死
            window.speechSynthesis.cancel(); 
            
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // 減慢語速適合 K2
            utterance.pitch = 1.1;

            // iOS 靜音喚醒機制 (播放一段無聲音訊強制喚醒引擎)
            let dummy = new SpeechSynthesisUtterance('');
            dummy.volume = 0;
            window.speechSynthesis.speak(dummy);

            // 如果有完成後的回調函數 (例如答對後的彈窗)
            if (callback) {
                utterance.onend = callback;
            }

            // 稍微延遲播放，確保引擎已準備好
            setTimeout(() => {
                window.speechSynthesis.speak(utterance);
            }, 50);
        }

        // 2. 小測驗遊戲邏輯
        const words = [
            { word: 'mouth', emoji: '👄' },
            { word: 'meat', emoji: '🥩' },
            { word: 'milk', emoji: '🥛' }
        ];
        let currentTarget = null;

        function initGame() {
            // 隨機抽選一個目標單字
            currentTarget = words[Math.floor(Math.random() * words.length)];
            const container = document.getElementById('game-options');
            container.innerHTML = '';
            
            // 洗牌選項順序
            let options = [...words].sort(() => Math.random() - 0.5);
            
            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'card-3d p-6 text-center cursor-pointer bg-gray-50 hover:bg-blue-50';
                div.innerHTML = `<div class="text-7xl">${opt.emoji}</div>`;
                div.onclick = () => checkAnswer(opt.word);
                container.appendChild(div);
            });
        }

        function playTargetWord() {
            if(!currentTarget) initGame();
            playVoice(`Where is the ${currentTarget.word}?`);
        }

        function checkAnswer(selected) {
            if(!currentTarget) return;
            
            if (selected === currentTarget.word) {
                // 答對邏輯
                playVoice('Excellent! You got it!', () => {
                    Swal.fire({
                        title: '太叻啦！',
                        text: '你搵啱咗 ' + currentTarget.word + '！',
                        icon: 'success',
                        confirmButtonText: '🌟 完成 Day 4 🌟',
                        confirmButtonColor: '#3b82f6',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // 跳轉回 Unit 4 導覽頁，並加上 ?v=4 防緩存
                            window.location.href = 'en-unit4.html?v=4';
                        }
                    });
                });
            } else {
                // 答錯邏輯
                playVoice('Oops, try again! Listen carefully.');
                Swal.fire({
                    title: '唔啱喎',
                    text: '再試下聽清楚！',
                    icon: 'error',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        }

        // 頁面載入時初始化遊戲
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
