<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unit 4 Day 4 - I can do it! | 玲玲學習樂園</title>
  <style>
    /* iPad Safari 終極防護引擎：防雙擊放大鎖 & 強制區塊排版 */
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      display: block !important;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Rounded Mplus 1c", sans-serif;
      background: linear-gradient(180deg, #60A5FA 0%, #93C5FD 55%, #DBEAFE 100%);
      color: #1E293B;
      overflow-x: hidden;
    }

    /* 煙花畫布 */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* 頂部深藍導航列 */
    .top-nav {
      background: linear-gradient(180deg, #1E3A8A 0%, #1D4ED8 100%);
      color: #FFFFFF;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 5px 0 #172554;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn-home {
      background: #F59E0B;
      color: #1E293B;
      text-decoration: none;
      font-weight: 900;
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 0 #B45309;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.1s;
    }

    .btn-home:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #B45309;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    /* 四幕進度地圖 */
    .act-map {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .act-pill {
      padding: 6px 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.18);
      color: #DBEAFE;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .act-pill.active {
      background: #FACC15;
      color: #1E3A8A;
      border-color: #FEF08A;
      box-shadow: 0 3px 0 #CA8A04;
      transform: scale(1.05);
    }

    .act-pill.done {
      background: #34D399;
      color: #064E3B;
    }

    /* 主容器 */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 16px 48px;
    }

    /* Anna 老師常駐黃色橫幅 */
    .teacher-banner {
      background: linear-gradient(135deg, #FEF08A 0%, #FDE047 100%);
      border: 3px solid #EAB308;
      border-radius: 24px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 0 #CA8A04;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .teacher-banner:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #CA8A04;
    }

    .teacher-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #FFFBEB;
      border: 3px solid #F59E0B;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #D97706;
    }

    .teacher-text-box {
      flex: 1;
    }

    .teacher-name {
      font-size: 13px;
      font-weight: 900;
      color: #92400E;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-msg {
      font-size: 17px;
      font-weight: 800;
      color: #451A03;
      line-height: 1.4;
    }

    .replay-chip {
      background: #F59E0B;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 900;
      padding: 7px 12px;
      border-radius: 14px;
      box-shadow: 0 3px 0 #B45309;
      white-space: nowrap;
    }

    /* 3D 白色主舞台卡片 */
    .stage-card {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 10px 0 #93C5FD, 0 14px 28px rgba(30, 58, 138, 0.18);
      border: 4px solid #EFF6FF;
      text-align: center;
    }

    .stage-badge {
      display: inline-block;
      background: #DBEAFE;
      color: #1D4ED8;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .stage-badge.warmup {
      background: #FEF3C7;
      color: #B45309;
      border: 2px solid #F59E0B;
    }

    /* 超大 3D 單字圖卡 */
    .flashcard-3d {
      background: linear-gradient(180deg, #F8FAFC 0%, #EFF6FF 100%);
      border: 4px solid #60A5FA;
      border-radius: 28px;
      padding: 22px 18px;
      margin: 8px auto 18px;
      max-width: 460px;
      box-shadow: 0 8px 0 #3B82F6;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .flashcard-3d:active, .flashcard-3d.pop {
      transform: scale(1.03);
    }

    .illustration-wrap {
      width: 170px;
      height: 170px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-en {
      font-size: 48px;
      font-weight: 900;
      color: #1E3A8A;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .word-en .highlight-m {
      color: #EA580C;
      background: #FFEDD5;
      padding: 0 8px;
      border-radius: 12px;
      border-bottom: 4px solid #F97316;
    }

    .word-zh {
      font-size: 26px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
    }

    .sentence-box {
      background: #DBEAFE;
      color: #1E40AF;
      font-size: 24px;
      font-weight: 900;
      padding: 10px 18px;
      border-radius: 18px;
      display: inline-block;
      margin-top: 6px;
    }

    /* 3D 通用按鈕 */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-3d {
      border: none;
      border-radius: 20px;
      padding: 14px 22px;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s;
    }

    .btn-3d:active {
      transform: translateY(4px);
    }

    .btn-blue {
      background: #3B82F6;
      color: #FFFFFF;
      box-shadow: 0 5px 0 #1D4ED8;
    }
    .btn-blue:active { box-shadow: 0 1px 0 #1D4ED8; }

    .btn-amber {
      background: #F59E0B;
      color: #FFFFFF;
      box-shadow: 0 5px 0 #B45309;
    }
    .btn-amber:active { box-shadow: 0 1px 0 #B45309; }

    .btn-green {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 6px 0 #047857;
      font-size: 21px;
      padding: 16px 26px;
    }
    .btn-green:active { box-shadow: 0 2px 0 #047857; }

    .btn-purple {
      background: #8B5CF6;
      color: #FFFFFF;
      box-shadow: 0 5px 0 #6D28D9;
    }
    .btn-purple:active { box-shadow: 0 1px 0 #6D28D9; }

    /* 第二幕：字母積木 */
    .blocks-arena {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 22px 0;
    }

    .letter-block {
      width: 68px;
      height: 78px;
      border-radius: 20px;
      background: #F1F5F9;
      border: 3px solid #CBD5E1;
      box-shadow: 0 7px 0 #94A3B8;
      font-size: 40px;
      font-weight: 900;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.12s, background-color 0.12s;
    }

    .letter-block.key-letter {
      border-color: #F59E0B;
      background: #FFFBEB;
      color: #B45309;
      box-shadow: 0 7px 0 #D97706;
    }

    .letter-block.lit {
      background: linear-gradient(180deg, #F97316 0%, #EA580C 100%);
      color: #FFFFFF;
      border-color: #FDBA74;
      box-shadow: 0 7px 0 #9A3412;
      transform: translateY(-4px) scale(1.08);
    }

    .letter-block.lit.alt-color {
      background: linear-gradient(180deg, #06B6D4 0%, #0284C7 100%);
      border-color: #67E8F9;
      box-shadow: 0 7px 0 #0369A1;
    }

    .star-tag {
      position: absolute;
      top: -10px;
      right: -8px;
      font-size: 18px;
    }

    /* 第三幕：開口讀狀態列 */
    .speaking-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ECFDF5;
      color: #065F46;
      border: 2px solid #34D399;
      padding: 8px 18px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
      margin-top: 12px;
    }

    /* 第四幕：輕鬆選圖卡二選一 */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 540px;
      margin: 18px auto;
    }

    .choice-card {
      background: #F8FAFC;
      border: 4px solid #93C5FD;
      border-radius: 26px;
      padding: 18px 12px;
      box-shadow: 0 7px 0 #60A5FA;
      cursor: pointer;
      transition: transform 0.12s, background-color 0.15s, border-color 0.15s;
    }

    .choice-card:active {
      transform: translateY(4px);
    }

    .choice-card.correct {
      background: #DCFCE7;
      border-color: #22C55E;
      box-shadow: 0 7px 0 #15803D;
      transform: scale(1.04);
    }

    .choice-card.gentle-try {
      background: #FEF3C7;
      border-color: #F59E0B;
      box-shadow: 0 7px 0 #D97706;
      animation: gentleWiggle 0.4s ease;
    }

    @keyframes gentleWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }

    .gentle-hint-banner {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #B45309;
      background: #FEF3C7;
      border-radius: 16px;
      padding: 8px 16px;
      margin: 10px auto 0;
      max-width: 460px;
    }

    .gentle-hint-banner.success {
      color: #065F46;
      background: #D1FAE5;
    }

    /* 分頁圓點 */
    .dots-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #CBD5E1;
      transition: all 0.2s;
    }

    .dot.active {
      width: 30px;
      border-radius: 8px;
      background: #2563EB;
    }

    .dot.completed {
      background: #10B981;
    }

    /* 結算畫面暗號區 */
    .secret-code-box {
      background: #F1F5F9;
      border: 3px dashed #64748B;
      border-radius: 20px;
      padding: 16px;
      margin: 18px auto;
      max-width: 560px;
      font-size: 15px;
      font-weight: 700;
      color: #334155;
      line-height: 1.5;
      text-align: left;
      user-select: text;
      -webkit-user-select: text;
    }

    .summary-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 16px 0;
    }

    .summary-chip {
      background: #EFF6FF;
      border: 2px solid #60A5FA;
      color: #1E3A8A;
      font-size: 17px;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 16px;
    }

    @media (max-width: 600px) {
      .nav-title { font-size: 14px; }
      .act-pill { padding: 5px 8px; font-size: 12px; }
      .word-en { font-size: 40px; }
      .letter-block { width: 56px; height: 66px; font-size: 34px; }
      .illustration-wrap { width: 140px; height: 140px; }
    }
  </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<!-- 頂部深藍導航列 -->
<nav class="top-nav">
  <a href="index.html" class="btn-home">🏠 返回</a>
  <div class="nav-title">Unit 4 · Day 4</div>
  <div class="act-map" id="actMap">
    <button class="act-pill active" onclick="jumpToAct(0)">1. 學新詞</button>

    <button class="act-pill" onclick="jumpToAct(3)">4. 小遊戲</button>
  </div>
</nav>

<div class="container">
  <!-- Anna 老師常駐黃色橫幅 -->
  <div class="teacher-banner" onclick="replayGuide()">
    <div class="teacher-avatar" aria-hidden="true">
      <!-- 可愛卡通 Anna 老師頭像 SVG -->
      <svg viewBox="0 0 80 80" width="48" height="48">
        <circle cx="40" cy="40" r="36" fill="#FDE68A"/>
        <path d="M18 38 C18 18, 62 18, 62 38 L64 56 C64 60, 56 60, 56 54 L56 42 L24 42 L24 54 C24 60, 16 60, 16 56 Z" fill="#78350F"/>
        <circle cx="40" cy="42" r="18" fill="#FED7AA"/>
        <path d="M22 36 Q40 22 58 36" fill="#78350F"/>
        <circle cx="34" cy="41" r="2.5" fill="#1E293B"/>
        <circle cx="46" cy="41" r="2.5" fill="#1E293B"/>

        <circle cx="51" cy="46" r="3" fill="#FCA5A5" opacity="0.7"/>
        <path d="M35 48 Q40 53 45 48" stroke="#DC2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="teacher-text-box">
      <div class="teacher-name">🌟 Anna 老師語音指引</div>
      <div class="teacher-msg" id="teacherMsg">歡迎返到英文大本營！今日我哋先熱身重溫畫畫，再認識新嘅英文字母發音！</div>
    </div>

  </div>

  <!-- 主互動舞台 -->
  <main class="stage-card" id="stageContainer"></main>
</div>

<script>
  // ==========================================
  // 1. iPad Safari 終極語音防吞聲 & 中英徹底分流引擎
  // ==========================================
  window.utterancePool = [];
  let cachedVoices = [];
  let currentGuideCantonese = "歡迎返到英文大本營！今日我哋先熱身重溫畫畫，再認識新嘅英文字母發音！";
  let currentGuideEnglish = "";

  function loadVoices() {
    if ('speechSynthesis' in window) {
      cachedVoices = window.speechSynthesis.getVoices();
    }
  }
  loadVoices();
  if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(langType) {
    if (!cachedVoices.length) loadVoices();
    if (langType === 'zh-HK') {
      return cachedVoices.find(v => v.lang === 'zh-HK' && (v.name.includes('Sin') || v.name.includes('Female')))
          || cachedVoices.find(v => v.lang === 'zh-HK')
          || cachedVoices.find(v => v.lang.toLowerCase().includes('hk'))
          || cachedVoices.find(v => v.lang.toLowerCase().includes('zh-tw'));
    } else {
      // 鎖定英國女聲
      const femaleHints = ['Kate', 'Serena', 'Martha', 'Stephanie', 'Libby', 'Sonia', 'Fiona', 'Female'];
      return cachedVoices.find(v => v.lang === 'en-GB' && femaleHints.some(h => v.name.includes(h)))
          || cachedVoices.find(v => v.lang === 'en-GB' && !v.name.includes('Daniel') && !v.name.includes('Oliver') && !v.name.includes('Arthur'))
          || cachedVoices.find(v => v.lang === 'en-GB')
          || cachedVoices.find(v => v.lang.startsWith('en'));
    }
  }

  // 排隊播放：嚴格中英分流，絕不混雜
  function speakQueue(segments) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    window.utterancePool = [];

    if (!segments || segments.length === 0) return;

    let idx = 0;
    function playNext() {
      if (idx >= segments.length) return;
      const seg = segments[idx];
      idx++;

      const u = new SpeechSynthesisUtterance(seg.text);
      window.utterancePool.push(u); // Anti-GC 防回收

      const voice = pickVoice(seg.lang);
      if (voice) u.voice = voice;

      if (seg.lang === 'zh-HK') {
        u.lang = 'zh-HK';
        u.pitch = 1.05;
        u.rate = 0.9;
      } else {
        u.lang = 'en-GB';
        u.pitch = 1.08;
        u.rate = 0.78;
      }

      let advanced = false;
      const done = () => {
        if (advanced) return;
        advanced = true;
        setTimeout(playNext, 140);
      };

      u.onend = done;
      u.onerror = done;

      window.speechSynthesis.speak(u);
    }

    playNext();
  }

  function setGuide(zhText, enText = "", autoSpeak = true) {
    currentGuideCantonese = zhText;
    currentGuideEnglish = enText;
    document.getElementById('teacherMsg').textContent = zhText;
    if (autoSpeak) {
      replayGuide();
    }
  }

  function replayGuide() {
    const seq = [{ lang: 'zh-HK', text: currentGuideCantonese }];
    if (currentGuideEnglish) {
      seq.push({ lang: 'en-GB', text: currentGuideEnglish });
    }
    speakQueue(seq);
  }

  // ==========================================
  // 2. 可愛童趣 3D 卡通 SVG 圖庫 (絕無寫實器官)
  // ==========================================
  const ILLUSTRATIONS = {
    draw: `
      <svg viewBox="0 0 180 180" width="165" height="165">
        <!-- 畫板 -->
        <rect x="24" y="26" width="118" height="106" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="6"/>
        <rect x="34" y="36" width="98" height="86" rx="12" fill="#FFFFFF"/>
        <!-- 畫板上可愛彩虹與太陽 -->
        <path d="M46 104 A36 36 0 0 1 118 104" fill="none" stroke="#F43F5E" stroke-width="7" stroke-linecap="round"/>
        <path d="M54 104 A28 28 0 0 1 110 104" fill="none" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
        <path d="M62 104 A20 20 0 0 1 102 104" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
        <circle cx="62" cy="58" r="11" fill="#FBBF24"/>
        <!-- 魔法彩色畫筆 -->
        <g transform="rotate(-32 132 122)">
          <rect x="122" y="76" width="18" height="72" rx="9" fill="#3B82F6" stroke="#1D4ED8" stroke-width="4"/>
          <rect x="122" y="66" width="18" height="14" rx="3" fill="#CBD5E1"/>
          <path d="M121 66 Q131 38 141 66 Z" fill="#EC4899"/>
        </g>
      </svg>
    `,
    mouth: `
      <svg viewBox="0 0 180 180" width="165" height="165">
        <!-- 可愛小熊笑臉聚焦微笑嘴巴 (童趣卡通風) -->
        <circle cx="44" cy="46" r="22" fill="#FBBF24" stroke="#D97706" stroke-width="5"/>
        <circle cx="136" cy="46" r="22" fill="#FBBF24" stroke="#D97706" stroke-width="5"/>
        <circle cx="90" cy="94" r="64" fill="#FDE68A" stroke="#F59E0B" stroke-width="6"/>
        <!-- 瞇瞇笑眼 -->
        <path d="M60 72 Q68 62 76 72" stroke="#78350F" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M104 72 Q112 62 120 72" stroke="#78350F" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- 粉紅腮紅 -->
        <ellipse cx="52" cy="92" rx="11" ry="7" fill="#FDA4AF" opacity="0.8"/>
        <ellipse cx="128" cy="92" rx="11" ry="7" fill="#FDA4AF" opacity="0.8"/>
        <!-- 可愛張開笑嘴巴 -->
        <ellipse cx="90" cy="84" rx="8" ry="6" fill="#78350F"/>
        <path d="M64 102 Q90 144 116 102 Z" fill="#FB7185" stroke="#E11D48" stroke-width="5" stroke-linejoin="round"/>
        <path d="M74 118 Q90 132 106 118" fill="#FDA4AF"/>
        <!-- 閃亮星星提示 -->
        <text x="134" y="132" font-size="26">✨</text>
      </svg>
    `,
    meat: `
      <svg viewBox="0 0 180 180" width="165" height="165">
        <!-- 可愛卡通美味雞腿/肉排 -->
        <g transform="rotate(-25 90 90)">
          <!-- 骨頭兩端 -->
