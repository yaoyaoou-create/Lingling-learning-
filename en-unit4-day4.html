<script>
  // =========================================================================
  // 1. 終極「雙軌排隊 + Web Audio」引擎 (保證零撞聲)
  // =========================================================================
  window.utterancePool = [];
  let audioQueueId = 0;
  let activeAudioElement = null;
  let audioCtx = null;

  function ensureAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  }

  function stopAllAudio() {
    audioQueueId++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (activeAudioElement) {
      try {
        activeAudioElement.onended = null;
        activeAudioElement.onerror = null;
        activeAudioElement.pause();
        activeAudioElement.currentTime = 0;
      } catch (e) {}
      activeAudioElement = null;
    }
  }

  function playSingleMp3(file, startTime = 0, boostGain = 2.2, onDone) {
    ensureAudioContext();
    const audio = new Audio('audio/' + file);
    audio.crossOrigin = 'anonymous';
    activeAudioElement = audio;

    if (audioCtx) {
      try {
        const source = audioCtx.createMediaElementSource(audio);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = boostGain;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      } catch (e) { audio.volume = 1.0; }
    }

    let finished = false;
    const finish = () => { if(!finished){ finished = true; if(onDone) onDone(); }};
    audio.onended = finish; audio.onerror = finish;

    const startPlayback = () => {
      if (startTime > 0) try { audio.currentTime = startTime; } catch(e){}
      audio.play().catch(finish);
    };

    if (startTime > 0) {
      audio.addEventListener('loadedmetadata', startPlayback, {once:true});
      audio.load();
    } else {
      startPlayback();
    }
  }

  function playHybridQueue(steps) {
    stopAllAudio();
    if (!steps || !steps.length) return;
    const myQueueId = audioQueueId;
    let idx = 0;

    function nextStep() {
      if (myQueueId !== audioQueueId || idx >= steps.length) return;
      const step = steps[idx++];

      if (step.type === 'zh') {
        if (!('speechSynthesis' in window) || !step.text) { nextStep(); return; }
        const u = new SpeechSynthesisUtterance(step.text);
        window.utterancePool.push(u);
        u.lang = 'zh-HK'; u.pitch = 1.05; u.rate = 0.92; u.volume = 0.68;
        let advanced = false;
        const done = () => { if(!advanced && myQueueId === audioQueueId) { advanced = true; setTimeout(()=>nextStep(), 150); }};
        u.onend = done; u.onerror = done;
        setTimeout(() => { if (myQueueId === audioQueueId) window.speechSynthesis.speak(u); }, 50);
      }
      else if (step.type === 'mp3') {
        playSingleMp3(step.file, step.startTime || 0, step.boost || 2.2, () => {
          if (myQueueId === audioQueueId) setTimeout(()=>nextStep(), 150);
        });
      }
      else if (step.type === 'hand_fixed') {
        playSingleMp3('en-h-sound.mp3', 0, 2.3, () => {
          if (myQueueId !== audioQueueId) return;
          setTimeout(() => {
            if (myQueueId === audioQueueId) {
              playSingleMp3('en-hand.mp3', 0.78, 2.4, () => {
                if (myQueueId === audioQueueId) setTimeout(()=>nextStep(), 150);
              });
            }
          }, 120);
        });
      }
    }
    nextStep();
  }

  function getWordAudioStep(wordId) {
    if (wordId === 'hand') return { type: 'hand_fixed' };
    const map = {
      draw: 'en-draw.mp3', mouth: 'en-mouth.mp3', meat: 'en-meat.mp3',
      milk: 'en-milk.mp3', m_sound: 'en-m-sound.mp3', h_sound: 'en-h-sound.mp3'
    };
    const boost = (wordId === 'meat' || wordId === 'milk') ? 2.5 : 2.1;
    return { type: 'mp3', file: map[wordId], boost };
  }

  ];

  const ACT2_RHYTHM = [
    { wordId: 'mouth', en: 'mouth', guideZh: '跟住節奏拍手：mmm - mmm - mouth!' },
    { wordId: 'meat', en: 'meat', guideZh: '再嚟一次節奏：mmm - mmm - meat!' },
    { wordId: 'milk', en: 'milk', guideZh: '最後一個節奏：mmm - mmm - milk!' }
  ];

  const ACT3_SPEAK = [
    { id: 'mouth', en: 'mouth', guideZh: '請玲玲閉埋嘴，大聲跟讀 mouth！讀完按綠色掣放煙花！' },
    { id: 'meat', en: 'meat', guideZh: '好棒！跟住大聲讀肉肉 meat！' },
    { id: 'milk', en: 'milk', guideZh: '最後一次！大聲讀牛奶 milk！' }
  ];

  const ACT4_FEED = [
    {
      questionZh: '怪獸肚餓！邊一張係 m 開頭嘅食物？',
      correctId: 'mouth', wrongId: 'hand'
    },
    {
      questionZh: '再嚟！邊一張係 m 開頭嘅肉肉？',
      correctId: 'meat', wrongId: 'hand'
    },
    {
      questionZh: '最後！搵出 m 開頭嘅健康飲品！',
      correctId: 'milk', wrongId: 'hand'
    }
  ];

  // ==========================================
  // 4. 渲染引擎
  // ==========================================
  let currentAct = 0, subIndex = 0, drumStep = 0;
  let feedSolved = false, feedWrongPicked = null;

  function updateActNav() {
    document.querySelectorAll('.act-pill').forEach((p, idx) => {
      p.className = `act-pill ${currentAct === 4 || idx < currentAct ? 'done' : (idx === currentAct ? 'active' : '')}`;
    });
  }

  function jumpToAct(idx) {
    currentAct = idx; subIndex = 0; drumStep = 0; feedSolved = false; feedWrongPicked = null;
    updateActNav(); renderStage(true);
  }

  function renderStage(shouldSpeak = true) {
    const container = document.getElementById('stageContainer');
    updateActNav();

    // --- Act 1: Immersive Meaning ---
    if (currentAct === 0) {
      const c = ACT1_CARDS[subIndex];
      setGuide(c.guideZh, shouldSpeak);

      let wordHtml = c.en;
      if (c.highlight === 'm') wordHtml = `<span class="highlight-m">${c.en[0]}</span>${c.en.slice(1)}`;
      else if (c.highlight === 'h') wordHtml = `<span class="highlight-h">${c.en[0]}</span>${c.en.slice(1)}`;

      container.innerHTML = `
        <div class="dots-row">${ACT1_CARDS.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">${c.badge}</div>
        <div class="flashcard-3d" id="meaningCard" onclick="playImmersiveEn()">
          <div class="pulse-ring"></div>
          <div class="illustration-wrap">${ILLUSTRATIONS[c.id === 'm_sound' ? 'mouth' : c.id]}</div>
          <div class="word-en">${wordHtml}</div>
          <div class="hint-text">👆 點擊聽發音</div>
        </div>
        <div class="btn-row" style="margin-top: 30px;">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="subIndex--; renderStage(true);">⬅️ 上一個</button>` : ''}
          <button class="btn-3d btn-green" onclick="if(subIndex < ACT1_CARDS.length-1){ subIndex++; renderStage(true); } else jumpToAct(1);">
            ${subIndex < ACT1_CARDS.length - 1 ? '下一個 ➡️' : '去打拍子 🥁'}
          </button>
        </div>
      `;
    }

    // --- Act 2: Rhythm ---
    else if (currentAct === 1) {
      const c = ACT2_RHYTHM[subIndex];
      setGuide(c.guideZh, shouldSpeak);
      container.innerHTML = `
        <div class="dots-row">${ACT2_RHYTHM.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : (i < subIndex ? 'completed' : '')}"></span>`).join('')}</div>
        <div class="stage-badge">🥁 節奏律動 (${subIndex + 1} / 3)</div>
        
        <div class="rhythm-arena">
          <div class="drum-pad ${drumStep >= 1 ? 'active-drum' : ''}" onclick="tapDrum(1)">
            <div style="font-size: 40px;">👏</div>
            <div style="font-size: 22px; font-weight: 900; margin-top: 8px;">m</div>
          </div>
          <div class="drum-pad ${drumStep >= 2 ? 'active-drum' : ''}" onclick="tapDrum(2)">
            <div style="font-size: 40px;">👏</div>
            <div style="font-size: 22px; font-weight: 900; margin-top: 8px;">m</div>
          </div>
          <div style="font-size: 28px; color: #3B82F6; font-weight: 900;">➔</div>
          <div class="drum-pad target-card ${drumStep >= 3 ? 'active-drum' : ''}" onclick="tapDrum(3)">
            <div style="width: 80px; height: 80px;">${ILLUSTRATIONS[c.wordId]}</div>
            <div style="font-size: 24px; font-weight: 900; margin-top: 4px; color: inherit;">${c.en}</div>
          </div>
        </div>

        <div class="btn-row" style="margin-top: 30px;">
          ${subIndex > 0 ? `<button class="btn-3d btn-purple" onclick="subIndex--; drumStep=0; renderStage(true);">⬅️</button>` : ''}
          <button class="btn-3d btn-green" onclick="if(subIndex < ACT2_RHYTHM.length-1){ subIndex++; drumStep=0; renderStage(true); } else jumpToAct(2);">
            ${subIndex < ACT2_RHYTHM.length - 1 ? '下一個 ➡️' : '去大聲讀 🎤'}
          </button>
        </div>
      `;
    }

    // --- Act 3: Speak ---
    else if (currentAct === 2) {
      const c = ACT3_SPEAK[subIndex];
      setGuide(c.guideZh, shouldSpeak);
      container.innerHTML = `
        <div class="dots-row">${ACT3_SPEAK.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : ''}"></span>`).join('')}</div>
        <div class="stage-badge">🎤 開口跟讀</div>
        <div class="flashcard-3d" onclick="playHybridQueue([getWordAudioStep('${c.id}')])">
          <div class="illustration-wrap">${ILLUSTRATIONS[c.id]}</div>
          <div class="word-en">${c.en}</div>
          <div class="hint-text">👆 聽示範</div>
        </div>
        <div class="btn-row">
          <button class="btn-3d btn-green" onclick="launchFireworks(); playHybridQueue([{type:'zh', text:'玲玲讀得超好聽！'}]);">🎉 我讀完喇！放煙花</button>
        </div>
        <div class="btn-row">
          <button class="btn-3d btn-purple" onclick="if(subIndex < ACT3_SPEAK.length-1){ subIndex++; renderStage(true); } else jumpToAct(3);">
            ${subIndex < ACT3_SPEAK.length - 1 ? '下一個挑戰 ➡️' : '去餵怪獸 👾'}
          </button>
        </div>
      `;
    }

    // --- Act 4: Monster ---
    else if (currentAct === 3) {
      const f = ACT4_FEED[subIndex];
      setGuide(f.questionZh, shouldSpeak);
      container.innerHTML = `
        <div class="dots-row">${ACT4_FEED.map((_, i) => `<span class="dot ${i === subIndex ? 'active' : ''}"></span>`).join('')}</div>
        <div class="monster-stage">
          <div class="monster-avatar">👾</div>
          <div style="font-size: 20px; font-weight: 900; color: #9A3412;">我要食 m 開頭嘅嘢！</div>
        </div>
        <div class="feed-grid">
          <div class="feed-card ${feedSolved ? 'fed-success' : ''}" onclick="pickFeed('${f.correctId}')">
            <div style="width: 130px; height: 130px; margin: 0 auto;">${ILLUSTRATIONS[f.correctId]}</div>
          </div>
          <div class="feed-card ${!feedSolved && feedWrongPicked === f.wrongId ? 'wrong-try' : ''}" onclick="pickFeed('${f.wrongId}')">
            <div style="width: 130px; height: 130px; margin: 0 auto;">${ILLUSTRATIONS[f.wrongId]}</div>
          </div>
        </div>
        ${feedSolved ? `<div class="btn-row"><button class="btn-3d btn-green" onclick="if(subIndex < 2){ subIndex++; feedSolved=false; feedWrongPicked=null; renderStage(true); } else jumpToAct(4);">下一題 ➡️</button></div>` : ''}
      `;
    }

    // --- Summary ---
    else if (currentAct === 4) {
      setGuide("恭喜玲玲完成！你認得晒 m 開頭嘅字喇！", shouldSpeak);
      if (shouldSpeak) { launchFireworks(); setTimeout(launchFireworks, 800); }
      container.innerHTML = `
        <div style="font-size: 70px;">🏆</div>
        <h1 style="color: #0284C7; margin: 10px 0;">Phonics Day 4 大成功！</h1>
        <div class="btn-row"><a href="en-unit4.html" class="btn-3d btn-green" style="text-decoration:none;">🏠 返去主目錄</a></div>
      `;
    }
  }

  // ==========================================
  // 5. 互動邏輯 (純英文發音)
  // ==========================================
  function playImmersiveEn() {
    const el = document.getElementById('meaningCard');
    if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    playHybridQueue([getWordAudioStep(ACT1_CARDS[subIndex].id)]);
  }

  function tapDrum(step) {
    const c = ACT2_RHYTHM[subIndex];
    drumStep = step; renderStage(false);
    if (step === 1 || step === 2) {
      playHybridQueue([{ type: 'mp3', file: 'en-m-sound.mp3', boost: 2.3 }]);
    } else {
      launchFireworks();
      playHybridQueue([getWordAudioStep(c.wordId)]);
    }
  }

  function pickFeed(picked) {
    if (feedSolved) return;
    const f = ACT4_FEED[subIndex];
    if (picked === f.correctId) {
      feedSolved = true; feedWrongPicked = null; renderStage(false); launchFireworks();
      playHybridQueue([getWordAudioStep(f.correctId), {type:'zh', text:'好味！'}]);
    } else {
      feedWrongPicked = picked; renderStage(false);
      playHybridQueue([{ type: 'mp3', file: 'en-h-sound.mp3', boost: 2.3 }]);
    }
  }

  // ==========================================
  // 6. 煙花引擎
  // ==========================================
  const canvas = document.getElementById('fireworksCanvas'), ctx = canvas.getContext('2d');
  let particles = [], animRunning = false;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();
  function launchFireworks() {
    const colors = ['#F43F5E', '#FACC15', '#34D399', '#38BDF8', '#A855F7'];
    for (let burst=0; burst<3; burst++) {
      const cx = canvas.width*(0.3+Math.random()*0.4), cy = canvas.height*(0.2+Math.random()*0.3);
      for (let i=0; i<30; i++) {
        const a = (Math.PI*2*i)/30, s = 2+Math.random()*4;
        particles.push({x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, alpha:1, color:colors[Math.floor(Math.random()*colors.length)], size:4+Math.random()*4});
      }
    }
    if (!animRunning) { animRunning = true; requestAnimationFrame(animateParticles); }
  }
  function animateParticles() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i=particles.length-1; i>=0; i--) {
      let p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.alpha-=0.02;
      if (p.alpha<=0) particles.splice(i,1);
      else { ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha=1;
    if (particles.length>0) requestAnimationFrame(animateParticles); else animRunning = false;
  }

  renderStage(false);
</script>
</body>
</html>
