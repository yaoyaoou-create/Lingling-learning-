<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>中文闖關測驗 — P.1–4 適應週 Test 2</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: "M PLUS Rounded 1c", "Noto Sans TC", "PingFang HK", sans-serif;
      background: linear-gradient(155deg, #fde68a 0%, #fbcfe8 48%, #c7d2fe 100%);
      color: #1e1b4b;
      overflow-x: hidden;
    }

    /* 浮動裝飾 */
    .bg-deco {
      position: fixed;
      pointer-events: none;
      opacity: 0.28;
      z-index: 0;
      animation: floatY 5s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .app-wrap {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 12px 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 3D 實體積木按鈕 */
    .btn-3d {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }
    .btn-3d:active {
      transform: translateY(4px) !important;
      box-shadow: 0 1px 0 rgba(0,0,0,0.22) !important;
    }

    /* 主舞台暖奶油卡片 */
    .stage-card {
      background: linear-gradient(180deg, #fffdf5 0%, #fef9e7 100%);
      border: 4px solid #f59e0b;
      border-radius: 28px;
      box-shadow: 0 8px 0 #d97706, 0 14px 24px rgba(120, 53, 15, 0.12);
    }

    /* 橫向進度導航項目 */
    .nav-crumb {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      color: #4338ca;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nav-crumb:hover {
      background: #ffffff;
    }
    .nav-crumb.active {
      background: linear-gradient(180deg, #fb923c, #ea580c);
      color: #ffffff;
      border-color: #c2410c;
      transform: scale(1.08);
      box-shadow: 0 3px 0 #9a3412;
    }
    .nav-crumb.done {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }

    /* 魔法蛋動畫 */
    .magic-egg {
      font-size: 92px;
      line-height: 1;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.18s ease;
      animation: wobble 2.2s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-7deg); }
      75% { transform: rotate(7deg); }
    }

    /* 答對綠光彈跳 & 答錯搖晃紅光 */
    .correct-bounce {
      background: linear-gradient(180deg, #34d399, #10b981) !important;
      border-color: #047857 !important;
      color: #ffffff !important;
      box-shadow: 0 5px 0 #065f46 !important;
      animation: popCorrect 0.35s ease;
    }
    @keyframes popCorrect {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .wrong-shake {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
      box-shadow: 0 5px 0 #dc2626 !important;
      animation: shakeX 0.36s ease;
    }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }

    /* 全螢幕星星粒子特效 */
    .star-burst {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .star-particle {
      position: absolute;
      font-size: 32px;
      animation: flyStar 0.85s ease-out forwards;
    }
    @keyframes flyStar {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.25) rotate(220deg); opacity: 0; }
    }

    @media (max-width: 560px) {
      .nav-crumb { font-size: 12px; padding: 3px 6px; }
    }
  </style>
</head>
<body>
  <!-- 背景浮動 SVG 裝飾 -->
  <svg class="bg-deco" style="top: 18px; left: 16px; width: 64px;" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="#fbbf24" />
  </svg>
  <svg class="bg-deco" style="bottom: 24px; right: 18px; width: 72px; animation-delay: 1.2s;" viewBox="0 0 64 64">
    <polygon points="32,4 40,24 62,24 44,38 50,60 32,46 14,60 20,38 2,24 24,24" fill="#818cf8" />
  </svg>

  <div class="star-burst" id="starBurst"></div>

  <div class="app-wrap">
    <!-- 頂部橫向導航列 (Breadcrumb) -->
    <header class="bg-white/90 border-4 border-indigo-300 rounded-3xl px-3 py-2 shadow-[0_5px_0_#a5b4fc] flex flex-wrap items-center justify-between gap-2">
      <!-- 左側：返回大廳主頁 -->
      <button type="button" id="btnHome" class="btn-3d bg-indigo-500 text-white border-2 border-indigo-700 rounded-full px-3.5 py-1.5 text-sm font-black shadow-[0_4px_0_#3730a3] shrink-0">
        🏠 返回
      </button>

      <!-- 中間：精簡橫向進度列（隨按即跳） -->
      <nav id="breadcrumbNav" class="flex flex-wrap items-center justify-center gap-1" aria-label="關卡進度導航"></nav>

      <!-- 右側：預習首頁 ＋ 洗牌按鈕 -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" id="btnLobby" class="btn-3d bg-amber-300 text-amber-950 border-2 border-amber-500 rounded-full px-3 py-1.5 text-sm font-black shadow-[0_3px_0_#d97706]">
          首頁
        </button>
        <button type="button" id="btnShuffle" class="btn-3d bg-pink-400 text-white border-2 border-pink-600 rounded-full px-3 py-1.5 text-sm font-black shadow-[0_3px_0_#be185d]">
          🎲 洗牌
        </button>
      </div>
    </header>

    <!-- Anna 老師常駐橫幅（嚴格零劇透，獨立重聽鍵） -->
    <section id="teacherBar" class="bg-gradient-to-r from-amber-200 to-yellow-200 border-4 border-amber-400 rounded-3xl px-4 py-2.5 shadow-[0_5px_0_#d97706] flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-white border-3 border-amber-500 flex items-center justify-center text-3xl shrink-0">👩‍🏫</div>
      <div id="teacherPrompt" class="flex-1 text-base sm:text-lg font-black text-amber-950 leading-snug">
        歡迎嚟到 P.1–4 適應週 Test 2！今次特別幫「快樂」同「老師」升級變勁！
      </div>
      <button type="button" id="btnReplay" class="btn-3d bg-sky-500 text-white border-2 border-sky-700 rounded-2xl px-3.5 py-2 text-sm sm:text-base font-black shadow-[0_4px_0_#0369a1] shrink-0">
        🔊 重聽
      </button>
    </section>

    <!-- 主舞台卡片（iPad 單屏） -->
    <main id="stageCard" class="stage-card flex-1 p-4 sm:p-5 flex flex-col justify-between gap-3">
      <!-- 動態渲染各關內容 -->
    </main>
  </div>

  <script src="report-hub.js?v=2"></script>
  <script>
    // ==========================================
    // iPad Safari 廣東話女聲安全引擎 (Anti-GC + 防疊聲)
    // ==========================================
    window.utterancePool = [];
    let speechTimer = null;
    let levelTimers = [];
    let currentQuestionAudioText = '';

    function clearLevelTimers() {
      levelTimers.forEach(t => clearTimeout(t));
      levelTimers.forEach(t => clearInterval(t));
      levelTimers = [];
    }

    function stopAllSpeech() {
      if (speechTimer) {
        clearTimeout(speechTimer);
        speechTimer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      window.utterancePool = [];
    }

    function speakHK(text, onEnd) {
      stopAllSpeech();
      if (!('speechSynthesis' in window) || !text) {
        if (onEnd) onEnd();
        return;
      }
      speechTimer = setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-HK';
        u.rate = 0.72;
        u.pitch = 1.08;
        const voices = window.speechSynthesis.getVoices();
        // 優先挑選標準廣東話女聲 (Sinji / Mei-Jia / zh-HK)
        const hkVoice =
          voices.find(v => v.lang && v.lang.toLowerCase().includes('zh-hk') && /sin|female|女/i.test(v.name)) ||
          voices.find(v => v.lang && v.lang.toLowerCase().includes('zh-hk')) ||
          voices.find(v => v.lang && v.lang.toLowerCase().includes('yue'));
        if (hkVoice) u.voice = hkVoice;

        window.utterancePool.push(u);
        u.onend = () => {
          window.utterancePool = window.utterancePool.filter(item => item !== u);
          if (onEnd) onEnd();
        };
        u.onerror = () => {
          window.utterancePool = window.utterancePool.filter(item => item !== u);
          if (onEnd) onEnd();
        };
        window.speechSynthesis.speak(u);
      }, 40);
    }

    // 輕快音效
    let audioCtx = null;
    function playBeep(freq, dur = 0.1, type = 'triangle') {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function playWinSfx() {
      playBeep(587, 0.09);
      setTimeout(() => playBeep(880, 0.15), 90);
    }

    function triggerStars() {
      const box = document.getElementById('starBurst');
      const icons = ['⭐', '🌟', '✨', '🎉', '💫'];
      for (let i = 0; i < 14; i++) {
        const span = document.createElement('span');
        span.className = 'star-particle';
        span.textContent = icons[i % icons.length];
        span.style.left = '50%';
        span.style.top = '48%';
        const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.3;
        const dist = 110 + Math.random() * 140;
        span.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        span.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
        box.appendChild(span);
        setTimeout(() => span.remove(), 900);
      }
    }

    function shuffleArr(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // ==========================================
    // 玲玲已掌握之中文熟字總庫 (ALL_LEARNED_WORDS)
    // 供 Level 3 雙字火車與 Level 4 4×4 尋寶抽取干擾字
    // ==========================================
    const ALL_LEARNED_WORDS = [
      '我','你','爸','媽','哥','姐','朋','友','人','家','庭','子',
      '眼','耳','口','鼻','手','唱','歌','玩','出','遊',
      '米','飯','牛','奶','肉','蛋','菜','豆','水','果','香','甜','蜜','糖','紅','白','蔬','食','物','蝸','翠','綠','新','鮮',
      '一','二','三','四','大','小','多','少','上','下','中','不','的','和',
      '學','校','室','課','書','圖','畫','愛','好','樂','電'
    ];

    // ==========================================
    // P.1–4 適應週 Test 2 題庫（重點鞏固「快樂、老師」）
    // ==========================================
    const PREVIEW_WORDS = [
      { word: '快樂', emoji: '😄', tip: '重點特訓：天天快樂笑呵呵' },
      { word: '老師', emoji: '👩‍🏫', tip: '重點特訓：學校入面教書嘅老師' },
      { word: '同學', emoji: '👫', tip: '一齊上堂玩耍嘅好同學' },
      { word: '學校', emoji: '🏫', tip: '我哋返學嘅地方' },
      { word: '開心', emoji: '🥳', tip: '第一日返學好開心' },
      { word: '天天', emoji: '☀️', tip: '每日都係好天氣' }
    ];

    let L1_FLASHCARDS = ['快樂', '老師', '同學', '學校', '開心', '天天'];

    let L2_LISTEN_BANK = [
      { target: '老師', options: ['老師', '同學', '學校', '開心'] },
      { target: '快樂', options: ['快樂', '開心', '天天', '老師'] },
      { target: '學校', options: ['學校', '同學', '快樂', '男孩子'] },
      { target: '同學', options: ['同學', '老師', '女孩子', '開心'] },
      { target: '開心', options: ['開心', '快樂', '平靜', '學校'] }
    ];

    let L3_TRAIN_BANK = [
      { word: '老師', c1: '老', c2: '師', speech: '請幫小火車拼出詞語：老師。老師。' },
      { word: '快樂', c1: '快', c2: '樂', speech: '請幫小火車拼出詞語：快樂。快樂。' },
      { word: '學校', c1: '學', c2: '校', speech: '請幫小火車拼出詞語：學校。學校。' },
      { word: '同學', c1: '同', c2: '學', speech: '請幫小火車拼出詞語：同學。同學。' },
      { word: '開心', c1: '開', c2: '心', speech: '請幫小火車拼出詞語：開心。開心。' }
    ];

    let L4_TREASURE_BANK = [
      { char: '師', word: '老師', speech: '請喺字寶寶方陣入面，搵出「老師」嘅「師」字！' },
      { char: '快', word: '快樂', speech: '請喺字寶寶方陣入面，搵出「快樂」嘅「快」字！' },
      { char: '樂', word: '快樂', speech: '請喺字寶寶方陣入面，搵出「快樂」嘅「樂」字！' },
      { char: '老', word: '老師', speech: '請喺字寶寶方陣入面，搵出「老師」嘅「老」字！' },
      { char: '校', word: '學校', speech: '請喺字寶寶方陣入面，搵出「學校」嘅「校」字！' }
    ];

    let L5_SENTENCE_BANK = [
      {
        full: '老師同學在一起。',
        blocks: ['老師', '同學', '在一起。'],
        speech: '留心聽句子，再按次序排好積木：老師同學在一起。'
      },
      {
        full: '天天快樂笑呵呵。',
        blocks: ['天天', '快樂', '笑呵呵。'],
        speech: '留心聽句子，再按次序排好積木：天天快樂笑呵呵。'
      },
      {
        full: '學校生活樂趣多。',
        blocks: ['學校', '生活', '樂趣多。'],
        speech: '留心聽句子，再按次序排好積木：學校生活樂趣多。'
      }
    ];

    // ==========================================
    // 全局狀態與錯題記錄
    // ==========================================
    const NAV_ITEMS = [
      { idx: 1, label: '1.閃卡' },
      { idx: 2, label: '2.聽音' },
      { idx: 3, label: '3.火車' },
      { idx: 4, label: '4.尋寶' },
      { idx: 5, label: '5.句式' },
      { idx: 6, label: '結算' }
    ];

    const startTime = Date.now();
    let currentLevel = 0; // 0=預習大廳, 1~5=關卡, 6=結算
    let subIdx = 0;
    let isLocked = false;
    let reportSaved = false;
    const completedLevels = new Set();
    const errorSet = new Set();

    const stageCardEl = document.getElementById('stageCard');
    const teacherPromptEl = document.getElementById('teacherPrompt');
    const breadcrumbNavEl = document.getElementById('breadcrumbNav');

    function recordError(tag) {
      errorSet.add(tag);
    }

    function renderBreadcrumb() {
      breadcrumbNavEl.innerHTML = NAV_ITEMS.map((item, i) => {
        const cls =
          currentLevel === item.idx
            ? 'nav-crumb active'
            : completedLevels.has(item.idx)
            ? 'nav-crumb done'
            : 'nav-crumb';
        const arrow = i < NAV_ITEMS.length - 1 ? '<span class="text-indigo-300 font-black text-xs">➔</span>' : '';
        return `<button type="button" class="${cls}" data-lvl="${item.idx}">${item.label}</button>${arrow}`;
      }).join('');

      breadcrumbNavEl.querySelectorAll('.nav-crumb').forEach(btn => {
        btn.addEventListener('click', () => {
          renderLevel(Number(btn.dataset.lvl));
        });
      });
    }

    function renderLevel(lvl) {
      clearLevelTimers();
      stopAllSpeech();
      isLocked = false;
      currentLevel = lvl;
      subIdx = 0;
      renderBreadcrumb();

      if (lvl === 0) renderLobby();
      else if (lvl === 1) renderLevel1();
      else if (lvl === 2) renderLevel2();
      else if (lvl === 3) renderLevel3();
      else if (lvl === 4) renderLevel4();
      else if (lvl === 5) renderLevel5();
      else if (lvl === 6) renderVictory();
    }

    // ==========================================
    // 預習大廳 (Level 0)
    // ==========================================
    function renderLobby() {
      teacherPromptEl.textContent = '歡迎嚟到 P.1–4 適應週 Test 2！可以先點聽預習，準備好就開始 5 關魔法盲測！';
      currentQuestionAudioText = '歡迎嚟到適應週第二關盲測！點擊下面字卡預習，準備好就撳開始闖關啦！';

      stageCardEl.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="bg-amber-200 text-amber-900 font-black px-3 py-1 rounded-full text-sm">🏫 預習大廳 · 重點強化「快樂、老師」</span>
          <span class="text-indigo-700 font-black text-sm">共 5 大盲測關卡</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 my-auto">
          ${PREVIEW_WORDS.map(item => `
            <button type="button" class="preview-card btn-3d bg-white border-4 border-sky-300 rounded-2xl p-3 shadow-[0_5px_0_#38bdf8] flex flex-col items-center gap-1" data-word="${item.word}">
              <span class="text-4xl">${item.emoji}</span>
              <span class="text-3xl font-black text-indigo-950">${item.word}</span>
              <span class="text-xs font-bold text-slate-500 text-center">${item.tip}</span>
            </button>
          `).join('')}
        </div>
        <div class="flex justify-center pt-1">
          <button type="button" id="btnStartQuiz" class="btn-3d bg-gradient-to-b from-emerald-400 to-emerald-600 text-white border-4 border-emerald-700 rounded-2xl px-8 py-3 text-xl font-black shadow-[0_6px_0_#065f46]">
            🚀 開始第 1 關：孵魔法蛋閃卡
          </button>
        </div>
      `;

      stageCardEl.querySelectorAll('.preview-card').forEach(btn => {
        btn.addEventListener('click', () => {
          playBeep(620, 0.07);
          speakHK(btn.dataset.word);
        });
      });

      document.getElementById('btnStartQuiz').addEventListener('click', () => renderLevel(1));
      speakHK(currentQuestionAudioText);
    }

    // ==========================================
    // Level 1：孵魔法蛋 ＋ 10 秒限時純中文字閃卡大聲讀
    // ==========================================
    function renderLevel1() {
      clearLevelTimers();
      const word = L1_FLASHCARDS[subIdx];
      let hatched = false;
      let secLeft = 10;

      teacherPromptEl.textContent = '輕輕點一下魔法蛋孵出中文字，10 秒內大聲讀出嚟俾媽媽聽！';
      currentQuestionAudioText = '輕輕點一下魔法蛋，大聲讀出孵出嚟嘅中文字俾媽媽聽啦！';

      stageCardEl.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="bg-orange-200 text-orange-900 font-black px-3 py-1 rounded-full text-sm">🥚 第 1 關 · 孵蛋閃卡大聲讀</span>
          <span class="text-indigo-800 font-black text-base">第 ${subIdx + 1} / ${L1_FLASHCARDS.length} 張</span>
        </div>

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const btn = document.getElementById('btnCopyReport');
      if (btn) btn.textContent = '✅ 已複製暗號！';
    }

    // ==========================================
    // 頂部導航按鈕事件
    // ==========================================
    document.getElementById('btnHome').addEventListener('click', () => {
      clearLevelTimers();
      stopAllSpeech();
      window.location.href = 'index.html';
    });

    document.getElementById('btnLobby').addEventListener('click', () => {
      renderLevel(0);
    });

    document.getElementById('btnShuffle').addEventListener('click', () => {
      L1_FLASHCARDS = shuffleArr(L1_FLASHCARDS);
      L2_LISTEN_BANK = shuffleArr(L2_LISTEN_BANK);
      L3_TRAIN_BANK = shuffleArr(L3_TRAIN_BANK);
      L4_TREASURE_BANK = shuffleArr(L4_TREASURE_BANK);
      L5_SENTENCE_BANK = shuffleArr(L5_SENTENCE_BANK);
      playBeep(760, 0.08);
      renderLevel(currentLevel === 0 || currentLevel === 6 ? 1 : currentLevel);
    });

    document.getElementById('btnReplay').addEventListener('click', () => {
      if (currentQuestionAudioText) speakHK(currentQuestionAudioText);
    });

    // 啟動預習大廳
    renderLevel(0);
  </script>
</body>
</html>
