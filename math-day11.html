<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>數學探索島 · Maths Day 11 太空站奇遇記</title>
  <link rel="stylesheet" href="theme.css?v=1" />
  <script src="report-hub.js?v=2"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 48%, #dbeafe 100%);
      color: #1e293b;
    }

    .app-shell {
      width: 100%;
      max-width: 1024px;
      height: 100dvh;
      margin: 0 auto;
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    /* 頂部導覽與進度圓點 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 16px;
      background: #ffffff;
      color: #4338ca;
      font-weight: 900;
      font-size: clamp(14px, 2vw, 17px);
      text-decoration: none;
      border: 2px solid #a5b4fc;
      box-shadow: 0 4px 0 #6366f1;
      white-space: nowrap;
    }

    .back-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #6366f1;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: nowrap;
    }

    .step-dot {
      width: clamp(16px, 2.5vw, 24px);
      height: clamp(16px, 2.5vw, 24px);
      border-radius: 50%;
      background: #e2e8f0;
      border: 2px solid #cbd5e1;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .step-dot.active {
      background: #8b5cf6;
      border-color: #6d28d9;
      transform: scale(1.22);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.25);
    }

    .step-dot.done {
      background: #10b981;
      border-color: #059669;
    }

    .day-badge {
      padding: 6px 12px;
      border-radius: 14px;
      background: #ede9fe;
      border: 2px solid #c4b5fd;
      color: #5b21b6;
      font-weight: 900;
      font-size: clamp(13px, 1.8vw, 16px);
      white-space: nowrap;
    }

    /* Anna 老師常駐橫幅 */
    .teacher-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #ffffff;
      border-radius: 20px;
      border: 3px solid #a5b4fc;
      box-shadow: 0 5px 0 #c7d2fe;
      flex-shrink: 0;
    }

    .teacher-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .teacher-avatar {
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1;
      flex-shrink: 0;
    }

    .teacher-text {
      font-size: clamp(16px, 2.15vw, 21px);
      font-weight: 900;
      color: #312e81;
      line-height: 1.3;
    }

    .speak-btn {
      padding: 10px 16px;
      border-radius: 16px;
      border: none;
      background: #0ea5e9;
      color: #ffffff;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #0284c7;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .speak-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0284c7;
    }

    /* 主舞台：嚴格單屏無捲動 */
    .quiz-card {
      flex: 1;
      min-height: 0;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      border: 4px solid #818cf8;
      box-shadow: 0 8px 0 #6366f1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .quiz-view {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 8px;
      min-height: 0;
    }

    .quiz-view.hidden,
    .summary-view.hidden {
      display: none;
    }

    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .q-tag {
      padding: 6px 14px;
      border-radius: 999px;
      background: #ede9fe;
      color: #5b21b6;
      font-size: clamp(15px, 2vw, 19px);
      font-weight: 900;
    }

    .q-counter {
      font-size: clamp(15px, 2vw, 19px);
      font-weight: 900;
      color: #4338ca;
    }

    /* 視覺展示區 */
    .visual-stage {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      border-radius: 22px;
      border: 3px dashed #93c5fd;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    .tap-guide {
      font-size: clamp(13px, 1.75vw, 16px);
      font-weight: 800;
      color: #0369a1;
      background: #e0f2fe;
      padding: 4px 12px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Q1 & Q2: 倒數與 11-20 數序 */
    .seq-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: clamp(5px, 1.3vw, 12px);
    }

    .seq-box {
      width: clamp(56px, 10.5vw, 96px);
      height: clamp(72px, 13.5dvh, 108px);
      border-radius: 20px;
      background: #ffffff;
      border: 4px solid #38bdf8;
      box-shadow: 0 5px 0 #0284c7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .seq-box.countdown {
      border-color: #a855f7;
      box-shadow: 0 5px 0 #7e22ce;
    }

    .seq-num {
      font-size: clamp(28px, 4.6vw, 48px);
      font-weight: 900;
      color: #1e293b;
      line-height: 1;
    }

    .seq-box.missing {
      background: #fef3c7;
      border: 4px dashed #f59e0b;
      box-shadow: 0 5px 0 #d97706;
    }

    .seq-box.missing .seq-num {
      color: #d97706;
    }

    .seq-arrow {
      font-size: clamp(18px, 2.8vw, 28px);
      font-weight: 900;
      color: #6366f1;
    }

    /* Q3: 序數排隊（左起第 3 個，靜音點亮輔助數次序） */
    .ordinal-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.5vw, 14px);
      flex-wrap: nowrap;
    }

    .rocket-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      border-radius: 18px;
      background: #fef08a;
      border: 3px solid #eab308;
      box-shadow: 0 4px 0 #ca8a04;
      flex-shrink: 0;
    }

    .rocket-icon {
      font-size: clamp(32px, 5.5dvh, 52px);
      line-height: 1;
    }

    .rocket-label {
      font-size: clamp(12px, 1.6vw, 15px);
      font-weight: 900;
      color: #854d0e;
      margin-top: 2px;
      white-space: nowrap;
    }

    .animal-slot {
      position: relative;
      width: clamp(58px, 10.5vw, 94px);
      height: clamp(68px, 12.5dvh, 98px);
      border-radius: 20px;
      background: #ffffff;
      border: 4px solid #a5b4fc;
      box-shadow: 0 5px 0 #6366f1;
      font-size: clamp(34px, 5.8dvh, 54px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .animal-slot.counted {
      background: #fef08a;
      border-color: #f59e0b;
      transform: translateY(-4px) scale(1.06);
    }

    .animal-slot.counted::after {
      content: "✨";
      position: absolute;
      top: -10px;
      right: -8px;
      font-size: clamp(16px, 2.2vw, 22px);
    }

    /* Q4: 3x3 太空櫃（上下左右 2D 空間） */
    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(3, clamp(72px, 12.5dvh, 104px));
      grid-template-rows: repeat(3, clamp(54px, 8.8dvh, 76px));
      gap: 8px;
      padding: 10px;
      border-radius: 22px;
      background: #e0e7ff;
      border: 4px solid #818cf8;
      box-shadow: 0 5px 0 #6366f1;
    }

    .shelf-cell {
      border-radius: 14px;
      background: #ffffff;
      border: 3px solid #c7d2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(30px, 5dvh, 44px);
    }

    .shelf-cell.anchor-cell {
      background: #fef9c3;
      border: 3px dashed #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    /* Q5: 天平輕重推理 */
    .scales-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vw, 34px);
      width: 100%;
      flex-wrap: nowrap;
    }

    .scale-card {
      flex: 1;
      max-width: 340px;
      background: #ffffff;
      border-radius: 22px;
      border: 3px solid #c7d2fe;
      box-shadow: 0 5px 0 #a5b4fc;
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .scale-caption {
      font-size: clamp(13px, 1.75vw, 16px);
      font-weight: 900;
      color: #4338ca;
      background: #eef2ff;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .scale-scene {
      position: relative;
      width: 100%;
      height: clamp(104px, 17dvh, 138px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .scale-beam {
      position: relative;
      width: 84%;
      height: 10px;
      background: #64748b;
      border-radius: 999px;
      transform: rotate(-11deg);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scale-pan {
      position: relative;
      width: clamp(54px, 8.5vw, 76px);
      height: clamp(54px, 8.5vw, 76px);
      border-radius: 18px;
      background: #fef9c3;
      border: 3px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(32px, 5dvh, 46px);
      transform: rotate(11deg) translateY(-34px);
      box-shadow: 0 4px 0 #d97706;
    }

    .scale-pan.heavy-pan {
      background: #fee2e2;
      border-color: #ef4444;
      box-shadow: 0 4px 0 #dc2626;
    }

    .scale-fulcrum {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 28px solid #475569;
      margin-top: -26px;
    }

    .scale-note {
      font-size: clamp(12px, 1.6vw, 15px);
      font-weight: 800;
      color: #64748b;
    }

    /* Q6: 接著數加法（數字卡 + 實物） */
    .math-groups-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.2vw, 22px);
      flex-wrap: wrap;
    }

    .bag-card {
      padding: 12px 22px;
      border-radius: 22px;
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
      border: 4px solid #0284c7;
      box-shadow: 0 6px 0 #0369a1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: clamp(110px, 16vw, 150px);
      min-height: clamp(92px, 16dvh, 130px);
    }

    .bag-num {
      font-size: clamp(44px, 7dvh, 66px);
      font-weight: 900;
      color: #0c4a6e;
      line-height: 1;
    }

    .bag-sub {
      font-size: clamp(13px, 1.7vw, 16px);
      font-weight: 900;
      color: #0369a1;
      margin-top: 4px;
    }

    .plate-box {
      padding: 12px 16px;
      border-radius: 22px;
      background: #ffffff;
      border: 4px solid #f472b6;
      box-shadow: 0 5px 0 #db2777;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.6vw, 14px);
      flex-wrap: wrap;
      min-height: clamp(92px, 16dvh, 130px);
    }

    .plate-box.space-plate {
      border-color: #818cf8;
      box-shadow: 0 5px 0 #6366f1;
    }

    .math-symbol {
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 900;
      color: #f97316;
    }

    /* Q7: 能量盒湊數（6 格電池盒） */
    .battery-box-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .battery-title {
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 900;
      color: #0f766e;
      background: #ccfbf1;
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid #5eead4;
    }

    .battery-grid {
      display: grid;
      grid-template-columns: repeat(3, clamp(68px, 12vw, 96px));
      grid-template-rows: repeat(2, clamp(62px, 10.5dvh, 84px));
      gap: 10px;
      padding: 12px;
      border-radius: 22px;
      background: #ffffff;
      border: 4px solid #14b8a6;
      box-shadow: 0 6px 0 #0d9488;
    }

    .battery-slot {
      position: relative;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(34px, 5.5dvh, 48px);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .battery-slot.filled {
      background: #dcfce7;
      border: 3px solid #22c55e;
    }

    .battery-slot.empty {
      background: #fef9c3;
      border: 3px dashed #f59e0b;
      color: #d97706;
      font-size: clamp(28px, 4.4dvh, 38px);
      font-weight: 900;
    }

    .battery-slot.counted {
      background: #fde047;
      border-color: #ca8a04;
      transform: scale(1.07);
    }

    .battery-slot.counted::after {
      content: "✨";
      position: absolute;
      top: -10px;
      right: -8px;
      font-size: 20px;
    }

    /* 靜音自主點數按鈕（嚴禁報數與數字角標） */
    .count-item {
      position: relative;
      width: clamp(54px, 8.8vw, 78px);
      height: clamp(54px, 8.8vw, 78px);
      border-radius: 18px;
      border: 3px solid transparent;
      background: #fffbeb;
      font-size: clamp(34px, 5.5dvh, 52px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .count-item.counted {
      background: #fef08a;
      border-color: #f59e0b;
      transform: scale(1.1);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.55);
    }

    .count-item.counted::after {
      content: "✨";
      position: absolute;
      top: -10px;
      right: -8px;
      font-size: clamp(16px, 2.2vw, 22px);
      pointer-events: none;
    }

    .count-item.taken {
      background: #f1f5f9;
      border: 3px dashed #cbd5e1;
      opacity: 0.35;
      pointer-events: none;
      transform: scale(0.88);
    }

    .count-item.taken::after {
      content: "🚀";
      position: absolute;
      top: -12px;
      right: -10px;
      font-size: clamp(18px, 2.4vw, 24px);
      opacity: 1;
    }

    /* 溫柔提示框（嚴禁 ❌ 與洩露答案） */
    .gentle-hint-box {
      min-height: 38px;
      padding: 6px 14px;
      border-radius: 16px;
      background: #fef9c3;
      border: 2px dashed #eab308;
      color: #854d0e;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .gentle-hint-box.hidden {
      visibility: hidden;
    }

    /* 選項按鈕區 */
    .options-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      flex-shrink: 0;
    }

    .opt-btn {
      min-height: clamp(68px, 12dvh, 98px);
      border-radius: 22px;
      border: 4px solid #6366f1;
      background: linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
      color: #312e81;
      font-size: clamp(32px, 5vw, 50px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 0 #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .opt-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #4f46e5;
    }

    .opt-btn.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #14532d;
      box-shadow: 0 7px 0 #16a34a;
      transform: scale(1.03);
    }

    .opt-btn.wrong-shake {
      animation: wrongShake 0.4s ease;
      background: #fff7ed;
      border-color: #fdba74;
    }

    /* 結算畫面 */
    .summary-view {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      gap: 8px;
      min-height: 0;
    }

    .trophy-title {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 900;
      color: #4338ca;
      text-align: center;
    }

    .sync-badge {
      padding: 5px 14px;
      border-radius: 999px;
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #166534;
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 900;
    }

    .result-table-wrap {
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border-radius: 16px;
      border: 2px solid #c7d2fe;
      background: #f8fafc;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(13px, 1.8vw, 16px);
    }

    .result-table th, .result-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      font-weight: 800;
    }

    .result-table th {
      background: #e0e7ff;
      color: #3730a3;
      position: sticky;
      top: 0;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .primary-btn {
      padding: 11px 22px;
      border-radius: 18px;
      border: none;
      background: #10b981;
      color: #ffffff;
      font-size: clamp(15px, 2.1vw, 19px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #047857;
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #047857;
    }

    .secondary-btn {
      padding: 11px 18px;
      border-radius: 18px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
    }

    .secondary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #94a3b8;
    }

    .copy-feedback {
      font-size: 14px;
      font-weight: 800;
      color: #047857;
      min-height: 20px;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 頂部導覽列 -->
    <div class="top-bar">
      <a href="index.html" class="back-btn" onclick="stopAllSpeech()">⬅️ 返回主頁</a>
      <div class="step-dots" id="stepDots"></div>
      <div class="day-badge">🌌 Maths Day 11</div>
    </div>

    <!-- Anna 老師常駐橫幅 -->
    <div class="teacher-bar">
      <div class="teacher-left">
        <div class="teacher-avatar">👩‍🚀</div>

    // ========= iPad Safari 廣東話安全語音引擎 (Anti-GC, zh-HK, rate=0.72) =========
    window.utterancePool = [];
    let speakTimer = null;
    let currentQuestionSpeech = "";
    let audioCtx = null;

    function getCantoneseVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return (
        voices.find(v => v.lang === "zh-HK" && /sinji|tracy|ting|female/i.test(v.name)) ||
        voices.find(v => v.lang === "zh-HK") ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes("hk")) ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes("zh")) ||
        null
      );
    }

    function stopAllSpeech() {
      if (speakTimer) {
        clearTimeout(speakTimer);
        speakTimer = null;
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    function speak(text, onEnd = null) {
      stopAllSpeech();
      if (!window.speechSynthesis || !text) return;
      speakTimer = setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-HK";
        u.rate = 0.72;
        u.pitch = 1.05;
        const v = getCantoneseVoice();
        if (v) u.voice = v;

        u.onend = () => {
          const idx = window.utterancePool.indexOf(u);
          if (idx > -1) window.utterancePool.splice(idx, 1);
          if (typeof onEnd === "function") onEnd();
        };
        u.onerror = () => {
          const idx = window.utterancePool.indexOf(u);
          if (idx > -1) window.utterancePool.splice(idx, 1);
        };

        window.utterancePool.push(u);
        window.speechSynthesis.speak(u);
      }, 40);
    }

    function replayCurrentQuestion() {
      if (currentQuestionSpeech) {
        speak(currentQuestionSpeech);
      }
    }

    // 輕快短音效（僅用於實物自主點數的觸覺回饋，嚴禁報數）
    function playTapPop() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(660, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(920, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    window.addEventListener("pagehide", stopAllSpeech);
    window.addEventListener("beforeunload", stopAllSpeech);
    if (window.speechSynthesis) {

    // ========= 狀態變數 =========

    function renderDots() {
      const wrap = document.getElementById("stepDots");

      });
    }

    function renderQuestion() {

      currentNeedHint = false;
      questionStartTs = Date.now();

      const q = quizData[currentIdx];

      document.getElementById("qTag").textContent = q.tag;

      if (q.type === "sequence") {

          row.appendChild(box);

          if (idx < q.items.length - 1) {

        stage.appendChild(row);
      } else if (q.type === "ordinal") {

        stage.appendChild(row);
      } else if (q.type === "grid3x3") {
        const grid = document.createElement("div");

        const row = document.createElement("div");

        const bag = document.createElement("div");

        plus.textContent = "+";

      // 獨立保存題目原音，重聽鍵永不被提示語覆蓋

    // 靜音實物點數按鈕：只播放輕快點擊音效與發光✨，嚴禁語音報數或顯示數字角標

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "count-item";
      btn.textContent = emoji;
      btn.onclick = () => {
        if (isLocked) return;
        playTapPop();
        btn.classList.toggle("counted");
      };
      return btn;
    }

    function handleAnswer(btn, selected) {
      if (isLocked) return;
      const q = quizData[currentIdx];
      const hintEl = document.getElementById("hintBox");

      if (selected === q.answer) {
        isLocked = true;
        const elapsed = Math.max(1, Math.round((Date.now() - questionStartTs) / 1000));
        results.push({
          id: q.id,
          label: q.label,
          sec: elapsed,
          needHint: currentNeedHint
        });

        btn.classList.add("correct");
        hintEl.classList.add("hidden");
        document.getElementById("teacherText").textContent = "🎉 " + q.praise;

        speak(q.praise, () => {
          if (currentIdx < quizData.length - 1) {
            currentIdx++;
            renderQuestion();
          } else {
            showSummary();
          }
        });
      } else {
        currentNeedHint = true;
        btn.classList.remove("wrong-shake");
        void btn.offsetWidth;
        btn.classList.add("wrong-shake");
        hintEl.textContent = q.hintText;
        hintEl.classList.remove("hidden");
        speak(q.spokenHint);
      }
    }

    function showSummary() {
      stopAllSpeech();
      document.getElementById("quizView").classList.add("hidden");
      document.getElementById("summaryView").classList.remove("hidden");

      document.querySelectorAll(".step-dot").forEach(d => {
        d.classList.remove("active");
        d.classList.add("done");
      });

      const tbody = document.getElementById("summaryBody");
      tbody.innerHTML = "";
      const reportParts = [];

      results.forEach(r => {
        const statusText = r.needHint ? "🌟 需提示" : "✅ 1次答對";
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.id} ${r.label}</td><td>${statusText}</td><td>${r.sec} 秒</td>`;
        tbody.appendChild(tr);

        const codeStatus = r.needHint ? "(需提示)" : "(1次答對)";
        reportParts.push(`${r.id} ${r.label}: ${r.sec}s${codeStatus}`);
      });

      generatedReportText = `【數學測驗回報】Day 11（太空站奇遇記） | ${reportParts.join(" | ")}`;

      if (!hasSavedReport) {
        hasSavedReport = true;
        if (window.LinglingReport && typeof window.LinglingReport.save === "function") {
          window.LinglingReport.save("數學探索島", "Maths Day 11（太空站奇遇記）", generatedReportText);
        }
      }

      const finalMsg = "恭喜玲玲完成第二期首發太空站奇遇記！你真係好勇敢挑戰升級題目呀！";
      document.getElementById("teacherText").textContent = "🌌 " + finalMsg;
      currentQuestionSpeech = finalMsg;
      speak(finalMsg);
    }

    function copyReport() {
      const fb = document.getElementById("copyFeedback");
      if (!generatedReportText) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedReportText).then(() => {
          fb.textContent = "✅ 進度暗號已複製！貼給 Elsa 即可根據耗時微調 Day 12。";
        }).catch(() => fallbackCopy(fb));
      } else {
        fallbackCopy(fb);
      }
    }

    function fallbackCopy(fb) {
      const ta = document.createElement("textarea");
      ta.value = generatedReportText;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        fb.textContent = "✅ 進度暗號已複製！貼給 Elsa 即可根據耗時微調 Day 12。";
      } catch (e) {
        fb.textContent = "請手動複製戰報文字。";
      }
      document.body.removeChild(ta);
    }

    function restartQuiz() {
      stopAllSpeech();
      currentIdx = 0;
      results = [];
      hasSavedReport = false;
      document.getElementById("copyFeedback").textContent = "";
      document.getElementById("summaryView").classList.add("hidden");
      document.getElementById("quizView").classList.remove("hidden");
      renderQuestion();
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderQuestion();
    });
  </script>
</body>
</html>
